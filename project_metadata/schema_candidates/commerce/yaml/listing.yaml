schema_version: '2'
nodes:
- node_id: sf:commerce.listing.fact_listing
  descriptor:
    qualified_name: commerce.listing.fact_listing
    display_name: Listing
    description: Offer a storefront publishes for one variant.
    synonyms: []
    tags:
    - fact
    - listing
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: LISTING
      object: FACT_LISTING
      format: table
  grain:
    description: One row is one listing.
    components:
    - identity_id: listing_identity
      dataset_columns:
      - listing_id
      description: Identifies one listing.
  columns:
  - name: listing_id
    description: Identifies one listing.
  - name: seller_storefront_id
    description: Storefront that publishes the listing.
  - name: variant_id
    description: Variant offered by the listing.
  - name: catalog_id
    description: Catalog that contains the listing.
  - name: listing_status
    description: Merchandising standing of the listing.
    value_description: draft, active, suppressed
  entity_definitions:
  - identity_id: listing_identity
    dataset_columns:
    - listing_id
    is_entity_universe: true
    entity_expression:
    - '[listing_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_storefront_identity
    dataset_columns:
    - seller_storefront_id
    is_entity_universe: false
    entity_expression:
    - '[seller_storefront_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each storefront includes one or more listings, and each listing belongs to exactly
        one storefront.
  - identity_id: variant_identity
    dataset_columns:
    - variant_id
    is_entity_universe: false
    entity_expression:
    - '[variant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each listing offers exactly one variant, and a variant may have no listings.
  - identity_id: catalog_identity
    dataset_columns:
    - catalog_id
    is_entity_universe: false
    entity_expression:
    - '[catalog_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A listing may have no catalog, and a catalog may have no listings.
- node_id: sf:commerce.listing.fact_listing_suppression
  descriptor:
    qualified_name: commerce.listing.fact_listing_suppression
    display_name: Listing suppression
    description: Suppression applied to a listing for a stated reason.
    synonyms: []
    tags:
    - fact
    - listing
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: LISTING
      object: FACT_LISTING_SUPPRESSION
      format: table
  grain:
    description: One row is one listing suppression.
    components:
    - identity_id: suppression_identity
      dataset_columns:
      - suppression_id
      description: Identifies one listing suppression.
  columns:
  - name: suppression_id
    description: Identifies one listing suppression.
  - name: listing_id
    description: Listing that was suppressed.
  - name: reason_code_id
    description: Reason the listing was suppressed.
  - name: calendar_day_id
    description: Calendar day of the suppression.
  entity_definitions:
  - identity_id: suppression_identity
    dataset_columns:
    - suppression_id
    is_entity_universe: true
    entity_expression:
    - '[suppression_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: listing_identity
    dataset_columns:
    - listing_id
    is_entity_universe: false
    entity_expression:
    - '[listing_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each suppression belongs to exactly one listing, and a listing may have no suppressions.
  - identity_id: reason_code_identity
    dataset_columns:
    - reason_code_id
    is_entity_universe: false
    entity_expression:
    - '[reason_code_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each suppression cites exactly one reason code, and a reason code may have no suppressions.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each suppression belongs to exactly one calendar day, and a calendar day may have
        no suppressions.
