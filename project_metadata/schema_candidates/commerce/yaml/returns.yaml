schema_version: '2'
nodes:
- node_id: sf:commerce.returns.fact_return_request
  descriptor:
    qualified_name: commerce.returns.fact_return_request
    display_name: Return request
    description: Request to return goods from an order.
    synonyms: []
    tags:
    - fact
    - returns
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: RETURNS
      object: FACT_RETURN_REQUEST
      format: table
  grain:
    description: One row is one return request.
    components:
    - identity_id: return_request_identity
      dataset_columns:
      - return_request_id
      description: Identifies one return request.
  columns:
  - name: return_request_id
    description: Identifies one return request.
  - name: order_id
    description: Order the return is opened against.
  - name: buyer_account_id
    description: Buyer account that requested the return.
  - name: reason_code_id
    description: Reason the buyer requested the return.
  - name: return_policy_id
    description: Return policy applied to the request.
  - name: return_status
    description: Processing standing of the return request.
    value_description: requested, approved, received, closed
  entity_definitions:
  - identity_id: return_request_identity
    dataset_columns:
    - return_request_id
    is_entity_universe: true
    entity_expression:
    - '[return_request_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: order_identity
    dataset_columns:
    - order_id
    is_entity_universe: false
    entity_expression:
    - '[order_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each return request belongs to exactly one order, and an order may have no return
        requests.
  - identity_id: buyer_account_identity
    dataset_columns:
    - buyer_account_id
    is_entity_universe: false
    entity_expression:
    - '[buyer_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each return request belongs to exactly one buyer account, and a buyer account may
        have no return requests.
  - identity_id: reason_code_identity
    dataset_columns:
    - reason_code_id
    is_entity_universe: false
    entity_expression:
    - '[reason_code_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each return request cites exactly one reason code, and a reason code may have no
        return requests.
  - identity_id: return_policy_identity
    dataset_columns:
    - return_policy_id
    is_entity_universe: false
    entity_expression:
    - '[return_policy_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A return request may have no return policy, and a return policy may have no return
        requests.
- node_id: sf:commerce.returns.fact_return_line
  descriptor:
    qualified_name: commerce.returns.fact_return_line
    display_name: Return line
    description: Order-line quantity included on a return request.
    synonyms: []
    tags:
    - fact
    - returns
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: RETURNS
      object: FACT_RETURN_LINE
      format: table
  grain:
    description: One row is one return line.
    components:
    - identity_id: return_line_identity
      dataset_columns:
      - return_line_id
      description: Identifies one return line.
  columns:
  - name: return_line_id
    description: Identifies one return line.
  - name: return_request_id
    description: Return request that contains the line.
  - name: order_line_id
    description: Order line being returned.
  - name: return_quantity
    description: Units returned on the return line.
  entity_definitions:
  - identity_id: return_line_identity
    dataset_columns:
    - return_line_id
    is_entity_universe: true
    entity_expression:
    - '[return_line_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: return_request_identity
    dataset_columns:
    - return_request_id
    is_entity_universe: false
    entity_expression:
    - '[return_request_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every return request includes one or more return lines, and each return line belongs
        to exactly one return request.
  - identity_id: order_line_identity
    dataset_columns:
    - order_line_id
    is_entity_universe: false
    entity_expression:
    - '[order_line_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each return line belongs to exactly one order line, and an order line may have no
        return lines.
- node_id: sf:commerce.returns.fact_return_inspection
  descriptor:
    qualified_name: commerce.returns.fact_return_inspection
    display_name: Return inspection
    description: Inspection result recorded for a return line.
    synonyms: []
    tags:
    - fact
    - returns
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: RETURNS
      object: FACT_RETURN_INSPECTION
      format: table
  grain:
    description: One row is one return inspection.
    components:
    - identity_id: return_inspection_identity
      dataset_columns:
      - return_inspection_id
      description: Identifies one return inspection.
  columns:
  - name: return_inspection_id
    description: Identifies one return inspection.
  - name: return_line_id
    description: Return line that was inspected.
  - name: fulfillment_center_id
    description: Fulfillment center that inspected the return.
  - name: inspection_result
    description: Disposition chosen after inspecting the return.
    value_description: resell, refurbish, dispose
  entity_definitions:
  - identity_id: return_inspection_identity
    dataset_columns:
    - return_inspection_id
    is_entity_universe: true
    entity_expression:
    - '[return_inspection_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: return_line_identity
    dataset_columns:
    - return_line_id
    is_entity_universe: false
    entity_expression:
    - '[return_line_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every return line includes one or more inspections, and each inspection belongs to
        exactly one return line.
  - identity_id: fulfillment_center_identity
    dataset_columns:
    - fulfillment_center_id
    is_entity_universe: false
    entity_expression:
    - '[fulfillment_center_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An inspection may have no fulfillment center, and a fulfillment center may have no
        inspections.
