  - identity_id: invoice_identity
    dataset_columns:
    - invoice_id
    is_entity_universe: false
    entity_expression:
    - '[invoice_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A buyer payment may have no invoice, and an invoice may have no buyer payments.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
