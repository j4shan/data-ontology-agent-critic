schema_version: '2'
nodes:
- node_id: sf:commerce.advertising.dim_campaign
  descriptor:
    qualified_name: commerce.advertising.dim_campaign
    display_name: Campaign
    description: Advertising campaign owned by a seller.
    synonyms: []
    tags:
    - dimension
    - advertising
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: ADVERTISING
      object: DIM_CAMPAIGN
      format: table
  grain:
    description: One row is one campaign.
    components:
    - identity_id: campaign_identity
      dataset_columns:
      - campaign_id
      description: Identifies one campaign.
  columns:
  - name: campaign_id
    description: Identifies one campaign.
  - name: seller_id
    description: Seller that owns the campaign.
  entity_definitions:
  - identity_id: campaign_identity
    dataset_columns:
    - campaign_id
    is_entity_universe: true
    entity_expression:
    - '[campaign_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: false
    entity_expression:
    - '[seller_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each campaign belongs to exactly one seller, and a seller may have no campaigns.
