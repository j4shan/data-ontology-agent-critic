schema_version: '2'
nodes:
- node_id: sf:commerce.catalog.dim_catalog
  descriptor:
    qualified_name: commerce.catalog.dim_catalog
    display_name: Catalog
    description: Assortment of products published by a seller.
    synonyms: []
    tags:
    - dimension
    - catalog
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: CATALOG
      object: DIM_CATALOG
      format: table
  grain:
    description: One row is one catalog.
    components:
    - identity_id: catalog_identity
      dataset_columns:
      - catalog_id
      description: Identifies one catalog.
  columns:
  - name: catalog_id
    description: Identifies one catalog.
  - name: seller_id
    description: Seller that owns the catalog.
  entity_definitions:
  - identity_id: catalog_identity
    dataset_columns:
    - catalog_id
    is_entity_universe: true
    entity_expression:
    - '[catalog_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: false
    entity_expression:
    - '[seller_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every seller includes one or more catalogs, and each catalog belongs to exactly one
        seller.
