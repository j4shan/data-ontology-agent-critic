schema_version: '2'
nodes:
- node_id: sf:commerce.payment.fact_payment_authorization
  descriptor:
    qualified_name: commerce.payment.fact_payment_authorization
    display_name: Payment authorization
    description: Authorization of a payment method, optionally before an order exists.
    synonyms: []
    tags:
    - fact
    - payment
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE
      schema: PAYMENT
      object: FACT_PAYMENT_AUTHORIZATION
      format: table
  grain:
    description: One row is one payment authorization.
    components:
    - identity_id: authorization_identity
      dataset_columns:
      - authorization_id
      description: Identifies one payment authorization.
  columns:
  - name: authorization_id
    description: Identifies one payment authorization.
  - name: order_id
    description: Order the authorization covers.
  - name: payment_method_id
    description: Payment method that was authorized.
  - name: currency_id
    description: Currency of the authorization.
  - name: calendar_day_id
    description: Calendar day of the authorization.
  - name: auth_status
    description: Decision on the payment authorization.
    value_description: approved, declined
  entity_definitions:
  - identity_id: authorization_identity
    dataset_columns:
    - authorization_id
    is_entity_universe: true
    entity_expression:
    - '[authorization_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: order_identity
    dataset_columns:
    - order_id
    is_entity_universe: false
    entity_expression:
    - '[order_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An authorization may have no order, and an order may have no authorizations.
  - identity_id: payment_method_identity
    dataset_columns:
    - payment_method_id
    is_entity_universe: false
    entity_expression:
    - '[payment_method_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each authorization belongs to exactly one payment method, and a payment method may
        have no authorizations.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    is_entity_universe: false
    entity_expression:
    - '[currency_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each authorization uses exactly one currency, and a currency may have no authorizations.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each authorization belongs to exactly one calendar day, and a calendar day may have
        no authorizations.
