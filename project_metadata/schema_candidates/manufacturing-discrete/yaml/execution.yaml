      account: alderford.us-east-1
      database: MANUFACTURING_DISCRETE
      schema: EXECUTION
      object: FACT_DEMAND_FORECAST
      format: table
  grain:
    description: One row is one demand forecast.
    components:
    - identity_id: forecast_identity
      dataset_columns:
      - forecast_id
      description: Identifier of one demand forecast.
  columns:
  - name: forecast_id
    description: Identifier of one demand forecast.
  - name: item_id
    description: Item being forecast.
  - name: plant_id
    description: Plant the forecast covers.
  - name: calendar_day_id
    description: Day the forecast quantity applies to.
  - name: forecast_quantity
    description: Quantity forecast for the item, plant, and day.
  entity_definitions:
  - identity_id: forecast_identity
    dataset_columns:
    - forecast_id
    is_entity_universe: true
    entity_expression:
    - '[forecast_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of demand forecast.
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: false
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many forecasts belong to one item, every forecast matches an item, and an item may
        include no forecast.
  - identity_id: plant_identity
    dataset_columns:
    - plant_id
    is_entity_universe: false
    entity_expression:
    - '[plant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many forecasts belong to one plant, every forecast matches a plant, and a plant may
        include no forecast.
  - identity_id: calendar_day_identity
