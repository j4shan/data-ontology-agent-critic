schema_version: '2'
nodes:
- node_id: sf:manufacturing-discrete.finance.dim_gl_account
  descriptor:
    qualified_name: manufacturing-discrete.finance.dim_gl_account
    display_name: General Ledger Account
    description: Ledger account owned by a legal entity.
    synonyms: []
    tags:
    - dimension
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: alderford.us-east-1
      database: MANUFACTURING_DISCRETE
      schema: FINANCE
      object: DIM_GL_ACCOUNT
      format: table
  grain:
    description: One row is one general ledger account.
    components:
    - identity_id: gl_account_identity
      dataset_columns:
      - gl_account_id
      description: Identifier of one general-ledger account.
  columns:
  - name: gl_account_id
    description: Identifier of one general-ledger account.
  - name: legal_entity_id
    description: Legal entity that owns the account.
  - name: account_name
    description: Name of the general-ledger account.
  entity_definitions:
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    is_entity_universe: true
    entity_expression:
    - '[gl_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of general ledger account.
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    is_entity_universe: false
    entity_expression:
    - '[legal_entity_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many general-ledger accounts belong to one legal entity, every account matches a
        legal entity, and a legal entity may include no account.
