- node_id: sf:manufacturing-discrete.finance.fact_standard_cost
  descriptor:
    qualified_name: manufacturing-discrete.finance.fact_standard_cost
    display_name: Standard Cost
    description: Standard cost amount of an item revision at a plant.
    synonyms: []
    tags:
    - fact
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: alderford.us-east-1
      database: MANUFACTURING_DISCRETE
      schema: FINANCE
      object: FACT_STANDARD_COST
      format: table
  grain:
    description: One row is one standard cost.
    components:
    - identity_id: standard_cost_identity
      dataset_columns:
      - standard_cost_id
      description: Identifier of one standard cost.
  columns:
  - name: standard_cost_id
    description: Identifier of one standard cost.
  - name: item_revision_id
    description: Item revision the standard cost prices.
  - name: plant_id
    description: Plant the standard cost applies to.
  - name: cost_center_id
    description: Cost center the standard cost element belongs to, when the cost is center-specific.
  - name: gl_account_id
    description: General-ledger account for the cost element, when an account is named.
  - name: standard_cost_amount
    description: Standard cost amount for the item revision at the plant.
  entity_definitions:
  - identity_id: standard_cost_identity
    dataset_columns:
    - standard_cost_id
    is_entity_universe: true
    entity_expression:
    - '[standard_cost_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of standard cost.
  - identity_id: item_revision_identity
    dataset_columns:
    - item_revision_id
    is_entity_universe: false
    entity_expression:
    - '[item_revision_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many standard costs belong to one item revision, every standard cost matches an item
        revision, and an item revision may include no standard cost.
  - identity_id: plant_identity
    dataset_columns:
    - plant_id
    is_entity_universe: false
    entity_expression:
    - '[plant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many standard costs belong to one plant, every standard cost matches a plant, and
        a plant may include no standard cost.
  - identity_id: cost_center_identity
    dataset_columns:
    - cost_center_id
    is_entity_universe: false
    entity_expression:
    - '[cost_center_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A standard cost may match one cost center, and a cost center may include no standard
        cost.
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    is_entity_universe: false
    entity_expression:
    - '[gl_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A standard cost may match one general-ledger account, and an account may include
        no standard cost.
  - identity_id: revision_plant_identity
    dataset_columns:
    - item_revision_id
    - plant_id
    is_entity_universe: false
    entity_expression:
    - '[item_revision_id, plant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: composite
      business_rule: Identifies one item revision at one plant, the key that bills of materials, routings,
        production orders, and standard costs are each stated for.
