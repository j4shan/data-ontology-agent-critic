- node_id: sf:manufacturing-discrete.product.dim_item
  descriptor:
    qualified_name: manufacturing-discrete.product.dim_item
    display_name: Item
    description: Material or part that Alderford makes, buys, or uses as a phantom.
    synonyms:
    - material
    - part
    tags:
    - dimension
    - product
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: alderford.us-east-1
      database: MANUFACTURING_DISCRETE
      schema: PRODUCT
      object: DIM_ITEM
      format: table
  grain:
    description: One row is one item.
    components:
    - identity_id: item_identity
      dataset_columns:
      - item_id
      description: Identifier of one item.
  columns:
  - name: item_id
    description: Identifier of one item.
  - name: product_family_id
    description: Product family that classifies the item.
  - name: commodity_id
    description: Commodity that classifies the item.
  - name: base_uom_id
    description: Base unit of measure for the item.
  - name: item_name
    description: Name of the item.
  - name: item_type
    description: Planning source of the item.
    value_description: make, buy, phantom
  entity_definitions:
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: true
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of item.
  - identity_id: product_family_identity
    dataset_columns:
    - product_family_id
    is_entity_universe: false
    entity_expression:
    - '[product_family_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many items belong to one product family, every item matches a product family, and
        a product family may include no item.
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    is_entity_universe: false
    entity_expression:
    - '[commodity_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many items belong to one commodity, every item matches a commodity, and a commodity
        may include no item.
  - identity_id: uom_identity
    dataset_columns:
    - base_uom_id
    is_entity_universe: false
    entity_expression:
    - '[base_uom_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many items share one base unit of measure, every item matches a unit of measure,
        and a unit of measure may include no item.
