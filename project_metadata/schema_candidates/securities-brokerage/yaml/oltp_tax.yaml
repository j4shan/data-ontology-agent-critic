schema_version: '4'
nodes:
- node_id: sql-database:securities-brokerage.tax.realized_gain
  descriptor:
    qualified_name: securities-brokerage.tax.realized_gain
    display_name: Realized gain
    description: Lot-level realized gains for cost-basis reporting.
    synonyms:
    - cost basis
    - 1099-B detail
    tags:
    - operational
    - tax
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: tax
      object: realized_gain
  grain:
    description: One row per closing trade and relieved lot.
    components:
    - dataset_columns:
      - closing_t_id
      - lot_t_id
  columns:
  - name: closing_t_id
    description: Trade that closed the shares.
  - name: lot_t_id
    description: Trade that opened the lot.
  - name: ca_id
    description: Account.
  - name: s_symb
  - name: qty
    description: Shares closed.
  - name: proceeds
    description: Sale proceeds.
    value_description: USD
  - name: cost_basis
    description: Adjusted cost basis.
    value_description: USD
  - name: term
    description: Holding period.
    value_description: SHORT up to one year, LONG over one year
  - name: wash_sale_disallowed
    description: Loss disallowed by the wash-sale rule.
    value_description: USD; 0 when none
  - name: is_covered
    description: Whether the lot is a covered security reported to the IRS with basis.
  entity_definitions:
  - identity_id: trade_identity
    dataset_columns:
    - closing_t_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[closing_t_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
    description: The trade that closed the shares.
  - identity_id: trade_identity
    dataset_columns:
    - lot_t_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[lot_t_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
    description: The trade that opened the lot.
  - identity_id: account_identity
    dataset_columns:
    - ca_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ca_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: security_identity
    dataset_columns:
    - s_symb
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[s_symb]'
    entity_metadata:
      expression_context: PostgreSQL column reference
- node_id: sql-database:securities-brokerage.tax.tax_form
  descriptor:
    qualified_name: securities-brokerage.tax.tax_form
    display_name: Tax form
    description: Annual tax forms issued per account.
    synonyms:
    - '1099'
    tags:
    - operational
    - tax
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: tax
      object: tax_form
  grain:
    description: One row per account, tax year, form type, and correction.
    components:
    - dataset_columns:
      - ca_id
      - form_type
      - is_corrected
      - tax_year
  columns:
  - name: form_id
    description: Form identifier.
  - name: ca_id
    description: Account.
  - name: tax_year
    description: Tax year.
  - name: form_type
    description: Form type.
  - name: is_corrected
    description: Whether this is a corrected form.
  - name: issued_date
    description: Issue date.
  - name: total_reported
    description: Total reportable amount.
  entity_definitions:
  - identity_id: account_identity
    dataset_columns:
    - ca_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ca_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
