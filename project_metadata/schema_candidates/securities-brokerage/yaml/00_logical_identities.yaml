schema_version: '4'
logical_identities:
  acats_transfer_identity:
    name: ACATS transfer
    description: A transfer of account assets between brokerage firms through ACATS.
  account_day_identity:
    name: Account day
    description: One account version on one business day.
    synonyms:
    - account snapshot
  account_identity:
    name: Brokerage account
    description: A customer brokerage account that holds cash and positions.
    synonyms:
    - account
  account_version_identity:
    name: Account version
    description: A warehouse surrogate key for one historical version of an account.
    synonyms:
    - SK_AccountID
  address_identity:
    name: Postal address
    description: A street address shared by customers, companies, exchanges, and branches.
  aml_alert_identity:
    name: AML alert
    description: An anti-money-laundering monitoring alert.
  aml_case_identity:
    name: AML case
    description: An investigation case that groups AML alerts.
  bank_link_identity:
    name: Bank link
    description: A verified external bank account linked to a customer.
  branch_identity:
    name: Branch
    description: A branch office of the firm.
    synonyms:
    - office
  broker_identity:
    name: Broker
    description: A registered representative who services accounts and handles trades.
    synonyms:
    - registered representative
    - RR
  broker_version_identity:
    name: Broker version
    description: A warehouse surrogate key for one version of a broker.
    synonyms:
    - SK_BrokerID
  calendar_month_identity:
    name: Calendar month
    description: A calendar month in YYYYMM form.
  cat_event_identity:
    name: CAT reportable event
    description: An order event reported to the Consolidated Audit Trail.
  company_identity:
    name: Company
    description: A public company that issues securities.
    synonyms:
    - issuer
  company_version_identity:
    name: Company version
    description: A warehouse surrogate key for one historical version of a company.
    synonyms:
    - SK_CompanyID
  complaint_identity:
    name: Customer complaint
    description: A written customer complaint.
  corporate_action_identity:
    name: Corporate action
    description: A split, dividend, merger, or spin-off that affects a security.
  customer_identity:
    name: Customer
    description: A person who holds one or more brokerage accounts.
    synonyms:
    - client
    - account holder
  customer_segment_identity:
    name: Customer segment
    description: A marketing and service segment for customers.
  customer_tier_identity:
    name: Customer tier
    description: A pricing tier that sets charges and commission rates.
    synonyms:
    - pricing tier
  customer_version_identity:
    name: Customer version
    synonyms:
    - SK_CustomerID
  date_key_identity:
    name: Calendar date key
    description: A warehouse surrogate key for one calendar day.
    synonyms:
    - SK_DateID
  employee_identity:
    name: Employee
    description: A firm employee, including brokers and their managers.
    synonyms:
    - associated person
  entitlement_identity:
    name: Corporate action entitlement
    description: One account's entitlement from one corporate action.
  exchange_identity:
    name: Exchange
    description: A listing exchange for securities.
    synonyms:
    - listing venue
  execution_identity:
    name: Execution
    description: A fill of an order at a venue.
    synonyms:
    - fill
  industry_identity:
    name: Industry
    description: An industry within a sector.
  interaction_identity:
    name: Service interaction
    description: A customer service contact.
  kyc_review_identity:
    name: KYC review
    description: A know-your-customer review of one customer.
  margin_call_identity:
    name: Margin call
    description: A demand for funds or securities to meet a margin requirement.
  news_item_identity:
    name: News item
    description: A news article that may mention one or more companies.
  order_identity:
    name: Order
    description: A customer order in the order management system.
  position_identity:
    name: Position
    description: The current position of one account in one security.
    synonyms:
    - holding summary
  prospect_identity:
    name: Marketing prospect
    description: A person in a purchased marketing list, keyed by the agency identifier.
    synonyms:
    - lead
  route_identity:
    name: Order route
    description: One routing of an order to an execution venue.
  sector_identity:
    name: Sector
    description: An industry sector.
  security_identity:
    name: Security
    description: A listed security, keyed by its trading symbol.
    synonyms:
    - instrument
    - symbol
    - ticker
  security_version_identity:
    name: Security version
    description: A warehouse surrogate key for one historical version of a security.
    synonyms:
    - SK_SecurityID
  session_identity:
    name: Digital session
    description: A customer login session on web or mobile.
  statement_identity:
    name: Account statement
    description: A periodic account statement.
  status_type_identity:
    name: Status type
    description: A lifecycle status code shared by trades, accounts, customers, brokers, companies, and
      securities.
  surveillance_alert_identity:
    name: Trade surveillance alert
    description: A market-abuse surveillance alert on trading activity.
  tax_rate_identity:
    name: Tax rate
    description: A national or local tax rate that applies to customer trading gains.
  time_key_identity:
    name: Time-of-day key
    description: A warehouse surrogate key for one second of the day.
    synonyms:
    - SK_TimeID
  trade_identity:
    name: Trade
    description: A customer trade, from submission through settlement.
    synonyms:
    - order ticket
  trade_type_identity:
    name: Trade type
    description: 'A trade type: market or limit, buy or sell, or stop-loss.'
    synonyms:
    - order type
  transfer_identity:
    name: Funding transfer
    description: A cash deposit or withdrawal between a brokerage account and a bank.
    synonyms:
    - money movement
  venue_identity:
    name: Execution venue
    description: A market center that executes routed orders, keyed by its MIC.
    synonyms:
    - market center
    - MIC
  watch_list_identity:
    name: Watch list
    description: A customer's list of securities to follow.
  zip_code_identity:
    name: Postal code
    description: A US postal code with its town and division.
    synonyms:
    - ZIP
    - zip code
