schema_version: '4'
nodes:
- node_id: sql-database:securities-brokerage.compliance.aml_alert
  descriptor:
    qualified_name: securities-brokerage.compliance.aml_alert
    display_name: AML alert
    description: Transaction monitoring alerts.
    synonyms: []
    tags:
    - operational
    - compliance
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: compliance
      object: aml_alert
  grain:
    description: One row per aml alert.
    components:
    - identity_id: aml_alert_identity
      dataset_columns:
      - alert_id
  columns:
  - name: alert_id
    description: Alert identifier.
  - name: c_id
    description: Customer alerted.
  - name: ca_id
    description: Account alerted.
    value_description: null for customer-level rules
  - name: rule_code
    description: Monitoring rule.
    value_description: STRUCTURING, RAPID_MOVEMENT, HIGH_RISK_GEO, LOW_PRICED_SECURITIES
  - name: alert_date
    description: Alert date.
  - name: score
    description: Risk score.
    value_description: 0 to 100
  - name: status
    description: Status.
    value_description: OPEN, CLOSED_NO_ACTION, ESCALATED
  - name: case_id
    description: Case the alert was escalated to.
    value_description: null unless escalated
  entity_definitions:
  - identity_id: aml_alert_identity
    dataset_columns:
    - alert_id
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[alert_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: customer_identity
    dataset_columns:
    - c_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[c_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: account_identity
    dataset_columns:
    - ca_id
    entity_universe: partial
    unique: false
    total: false
    conforms: true
    entity_expression:
    - '[ca_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: aml_case_identity
    dataset_columns:
    - case_id
    entity_universe: partial
    unique: false
    total: false
    conforms: true
    entity_expression:
    - '[case_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
