schema_version: '4'
nodes:
- node_id: sql-database:securities-brokerage.trading.cash_transaction
  descriptor:
    qualified_name: securities-brokerage.trading.cash_transaction
    display_name: Cash transaction
    description: Cash ledger entries for completed cash trades.
    synonyms:
    - cash ledger
    tags:
    - operational
    - trading
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: trading
      object: cash_transaction
  grain:
    description: One row per cash transaction.
    components:
    - identity_id: trade_identity
      dataset_columns:
      - ct_t_id
  columns:
  - name: ct_t_id
    description: Trade that created the entry.
  - name: ct_dts
    description: Entry timestamp.
  - name: ct_amt
    description: Amount.
    value_description: USD
  - name: ct_name
    description: Entry description.
  entity_definitions:
  - identity_id: trade_identity
    dataset_columns:
    - ct_t_id
    entity_universe: partial
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[ct_t_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
