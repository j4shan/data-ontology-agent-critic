  - name: period_end_date
    description: Statement period end.
  - name: delivery_channel
    description: Delivery channel.
    value_description: EDELIVERY or PAPER
  - name: delivered_ts
    description: Delivery timestamp.
  entity_definitions:
  - identity_id: statement_identity
    dataset_columns:
    - statement_id
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[statement_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: account_identity
    dataset_columns:
    - ca_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ca_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
