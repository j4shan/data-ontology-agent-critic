      schema: oms
      object: execution_venue
  grain:
    description: One row per execution venue.
    components:
    - identity_id: venue_identity
      dataset_columns:
      - venue_mic
  columns:
  - name: venue_mic
    description: ISO 10383 market identifier code.
    synonyms:
    - MIC
  - name: venue_name
    description: Venue name.
  - name: venue_type
    description: Venue type.
    value_description: EXCHANGE, ATS, WHOLESALER, INTERNAL
  - name: listing_ex_id
    description: Listing exchange operated by the venue.
    value_description: null for venues that do not list securities
  entity_definitions:
  - identity_id: venue_identity
    dataset_columns:
    - venue_mic
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[venue_mic]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: exchange_identity
    dataset_columns:
    - listing_ex_id
    entity_universe: partial
    unique: true
    total: false
    conforms: true
    entity_expression:
    - '[listing_ex_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
- node_id: sql-database:securities-brokerage.oms.market_calendar
  descriptor:
    qualified_name: securities-brokerage.oms.market_calendar
