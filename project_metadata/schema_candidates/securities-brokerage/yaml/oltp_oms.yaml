- node_id: sql-database:securities-brokerage.oms.order_event
  descriptor:
    qualified_name: securities-brokerage.oms.order_event
    display_name: Order event
    description: Lifecycle audit events of each order.
    synonyms: []
    tags:
    - operational
    - oms
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
