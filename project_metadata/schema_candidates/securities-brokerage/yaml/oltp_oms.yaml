schema_version: '4'
nodes:
- node_id: sql-database:securities-brokerage.oms.customer_order
  descriptor:
    qualified_name: securities-brokerage.oms.customer_order
    display_name: Customer order
    description: Customer orders as received by the order management system.
    synonyms:
    - parent order
    tags:
    - operational
    - oms
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: oms
      object: customer_order
  grain:
    description: One row per customer order.
    components:
    - identity_id: order_identity
      dataset_columns:
      - ord_id
  columns:
  - name: ord_id
    description: Order identifier.
  - name: ord_ca_id
    description: Account that placed the order.
  - name: ord_s_symb
    description: Security.
  - name: ord_side
    description: Order side.
    value_description: B buy, S sell, SS sell short, BC buy to cover
  - name: ord_type
    description: Order type.
    value_description: MKT market, LMT limit, STP stop, STL stop limit
  - name: ord_tif
    description: Time in force.
    value_description: DAY, GTC good till canceled, IOC immediate or cancel, FOK fill or kill
  - name: ord_qty
    description: Shares ordered.
  - name: ord_limit_price
    description: Limit price.
    value_description: USD; null for market and stop orders
  - name: ord_stop_price
    description: Stop trigger price.
    value_description: USD; null unless a stop type
  - name: ord_status
    description: Order status.
    value_description: NEW, PARTIAL, FILLED, CANCELED, REJECTED, EXPIRED
  - name: ord_channel
    description: Entry channel.
  - name: ord_created_ts
    description: Order receipt timestamp.
  - name: ord_entered_by_b_id
    description: Broker who entered the order.
    value_description: null for self-directed orders
  - name: ord_t_id
    description: Trade booked from the order.
    value_description: null until the first fill is booked
  entity_definitions:
  - identity_id: order_identity
    dataset_columns:
    - ord_id
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[ord_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: account_identity
    dataset_columns:
    - ord_ca_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ord_ca_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: security_identity
    dataset_columns:
    - ord_s_symb
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ord_s_symb]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: broker_identity
    dataset_columns:
    - ord_entered_by_b_id
    entity_universe: partial
    unique: false
    total: false
    conforms: true
    entity_expression:
    - '[ord_entered_by_b_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
    description: The broker who entered the order for the customer.
  - identity_id: trade_identity
    dataset_columns:
    - ord_t_id
    entity_universe: complete
    unique: true
    total: false
    conforms: true
    entity_expression:
    - '[ord_t_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
    description: The trade booked from the order.
- node_id: sql-database:securities-brokerage.oms.execution_venue
  descriptor:
    qualified_name: securities-brokerage.oms.execution_venue
    display_name: Execution venue
    description: Market centers that execute routed orders.
    synonyms:
    - market center
    tags:
    - operational
    - oms
    - reference
  accessor:
    schema_id: accessor.sql-database.v1
