schema_version: '4'
nodes:
- node_id: sql-database:securities-brokerage.firm.branch
  descriptor:
    qualified_name: securities-brokerage.firm.branch
    display_name: Branch
    synonyms:
    - office
    tags:
    - operational
    - firm
    - master
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: firm
      object: branch
  grain:
    description: One row per branch.
    components:
    - identity_id: branch_identity
      dataset_columns:
      - branch_id
  columns:
  - name: branch_id
  - name: branch_name
    description: Branch name.
  - name: region
    description: Sales region.
    value_description: EAST, CENTRAL, WEST
  - name: ad_id
    description: Branch address.
  - name: opened_date
    description: Open date.
  entity_definitions:
  - identity_id: branch_identity
    dataset_columns:
    - branch_id
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[branch_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: address_identity
    dataset_columns:
    - ad_id
    entity_universe: partial
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[ad_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
- node_id: sql-database:securities-brokerage.firm.employee
  descriptor:
    qualified_name: securities-brokerage.firm.employee
    display_name: Employee
    description: Firm employees with their manager and registration number.
    synonyms:
    - staff
    tags:
    - operational
    - firm
    - master
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: firm
      object: employee
  grain:
    description: One row per employee.
    components:
    - identity_id: employee_identity
      dataset_columns:
      - employee_id
  columns:
  - name: employee_id
    description: Employee identifier.
  - name: branch_id
    description: Home branch.
  - name: manager_employee_id
    description: Direct manager.
    value_description: null for the top of the hierarchy
  - name: job_role
    description: Role.
    value_description: BROKER, BRANCH_MANAGER, COMPLIANCE, OPERATIONS, SERVICE
  - name: hire_date
    description: Hire date.
  - name: term_date
    description: Termination date.
    value_description: null while employed
  - name: crd_number
    description: FINRA CRD number.
    value_description: null when unregistered
  entity_definitions:
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: branch_identity
    dataset_columns:
    - branch_id
    entity_universe: complete
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[branch_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: employee_identity
    dataset_columns:
    - manager_employee_id
    entity_universe: partial
    unique: false
    total: false
    conforms: true
    entity_expression:
    - '[manager_employee_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
    description: The employee's direct manager.
- node_id: sql-database:securities-brokerage.firm.registration
  descriptor:
    qualified_name: securities-brokerage.firm.registration
    display_name: Registration
    description: Securities licenses and state registrations of employees.
    synonyms: []
    tags:
    - operational
    - firm
    - reference
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: firm
      object: registration
  grain:
    description: One row per employee, license, and state.
    components:
    - dataset_columns:
      - employee_id
      - license
      - state
  columns:
  - name: employee_id
    description: Registered employee.
  - name: license
    value_description: S7, S63, S65, S66, S24
  - name: state
    description: State of registration.
  - name: granted_date
    description: Grant date.
  - name: lapsed_date
    description: Lapse date.
    value_description: null while active
  entity_definitions:
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
