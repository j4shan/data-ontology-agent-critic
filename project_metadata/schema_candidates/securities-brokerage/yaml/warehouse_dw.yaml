    - identity_id: account_version_identity
      dataset_columns:
      - sk_account_id
  columns:
  - name: sk_account_id
    description: Account version surrogate key.
  - name: account_id
    description: Operational account identifier.
  - name: sk_broker_id
    description: Broker version servicing the account.
  - name: sk_customer_id
    description: Customer version owning the account.
  - name: status
    description: Account status name.
    value_description: Active or Inactive
