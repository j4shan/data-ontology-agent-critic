    description: Expected record counts and dates delivered with each batch.
    synonyms: []
    tags:
    - analytical
    - dw
    - audit
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: halyard.us-east-1
      database: SECURITIES_BROKERAGE
      schema: DW
      object: AUDIT
  grain:
    description: One row per dataset, batch, and attribute.
    components:
    - dataset_columns:
      - attribute
      - batch_id
      - dataset
  columns:
  - name: dataset
    description: Source dataset.
  - name: batch_id
    description: Batch.
  - name: audit_date
    description: Date the value applies to.
  - name: attribute
    description: Audited attribute.
  - name: value
    description: Expected integer value.
  - name: dvalue
    description: Expected decimal value.
  entity_definitions: []
- node_id: snowflake:securities-brokerage.dw.di_messages
  descriptor:
    qualified_name: securities-brokerage.dw.di_messages
    display_name: Data integration messages
    description: Load status and data-quality alerts written by each batch (TPC-DI DImessages).
    synonyms:
    - DImessages
    - load log
    tags:
    - analytical
    - dw
    - audit
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: halyard.us-east-1
      database: SECURITIES_BROKERAGE
      schema: DW
      object: DI_MESSAGES
  grain:
    description: One row per message.
    components:
    - dataset_columns:
      - batch_id
      - message_date_and_time
      - message_source
  columns:
  - name: message_date_and_time
    description: Message timestamp.
  - name: batch_id
    description: Batch.
  - name: message_source
    description: Step that wrote the message.
    value_description: for example DimCustomer, FactWatches, Validation
  - name: message_text
    description: Message.
    value_description: for example Invalid customer tier, Inserted rows, Phase complete
  - name: message_type
    description: Message type.
    value_description: Status or Alert
  - name: message_data
    description: Offending values for an alert.
  entity_definitions: []
- node_id: snowflake:securities-brokerage.dw.dim_account
