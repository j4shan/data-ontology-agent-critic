- node_id: sql-database:securities-brokerage.market.ca_entitlement
  descriptor:
    qualified_name: securities-brokerage.market.ca_entitlement
    display_name: Corporate action entitlement
    description: Per-account entitlements computed on the record date.
    synonyms:
    - dividend payment
    tags:
    - operational
    - market
    - fact
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: oltp.halyard.internal
      database: brokerage
      dialect: postgresql
      schema: market
      object: ca_entitlement
  grain:
    description: One row per corporate action entitlement.
    components:
    - identity_id: entitlement_identity
      dataset_columns:
      - entitlement_id
  columns:
  - name: entitlement_id
    description: Entitlement identifier.
  - name: action_id
    description: Corporate action.
  - name: ca_id
    description: Entitled account.
  - name: s_symb
    description: Security held on the record date.
  - name: eligible_qty
    description: Shares held on the record date.
  - name: gross_cash
    description: Gross cash entitled.
    value_description: USD
  - name: withholding
    description: Tax withheld.
    value_description: USD
  - name: new_shares
    description: Shares delivered.
  - name: paid_ts
    description: Timestamp the entitlement was paid.
    value_description: null until paid
  entity_definitions:
  - identity_id: entitlement_identity
    dataset_columns:
    - entitlement_id
    entity_universe: complete
    unique: true
    total: true
    conforms: true
    entity_expression:
    - '[entitlement_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: corporate_action_identity
    dataset_columns:
    - action_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[action_id]'
    entity_metadata:
      expression_context: PostgreSQL column reference
  - identity_id: account_identity
    dataset_columns:
    - ca_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ca_id]'
    entity_metadata:
