nodes:
- node_id: s3:securities-brokerage.landing.cash_transaction_feed
  descriptor:
    qualified_name: securities-brokerage.landing.cash_transaction_feed
    display_name: CashTransaction feed
    description: Account cash movements (TPC-DI CashTransaction.txt).
    synonyms:
    - CashTransaction.txt
    tags:
    - landing
    - landing
    - staging
  accessor:
    schema_id: accessor.s3.v1
    properties:
      bucket: halyard-di-landing
      prefix: tpcdi/cash_transaction/
      format: pipe-delimited
  grain:
    description: One row per account cash movement.
    components:
    - dataset_columns:
      - ct_ca_id
      - ct_dts
  columns:
  - name: ct_ca_id
    description: Account.
  - name: ct_dts
    description: Timestamp.
  - name: ct_amt
  - name: ct_name
    description: Description.
  - name: cdc_flag
    description: Change type of an incremental record.
    value_description: I insert, U update; null in the historical load
  - name: cdc_dsn
    description: Change sequence number within the incremental batch.
  - name: batch_id
    description: Load batch that delivered the record.
    value_description: 1 historical, 2 and 3 incremental
  entity_definitions:
  - identity_id: account_identity
    dataset_columns:
    - ct_ca_id
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[ct_ca_id]'
    entity_metadata:
      expression_context: Source file field reference
