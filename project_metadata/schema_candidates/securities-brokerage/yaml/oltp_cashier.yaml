    value_description: IN deposit, OUT withdrawal
  - name: method
    description: Method.
    value_description: ACH, WIRE, CHECK, JOURNAL
  - name: amount
    description: Amount.
    value_description: USD
  - name: initiated_ts
    description: Initiation timestamp.
  - name: settled_ts
    description: Settlement timestamp.
    value_description: null while pending
  - name: status
    description: Transfer status.
    value_description: PENDING, SETTLED, RETURNED, CANCELED
