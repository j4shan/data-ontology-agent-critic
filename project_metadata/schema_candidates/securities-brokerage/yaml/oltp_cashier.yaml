- node_id: sql-database:securities-brokerage.cashier.funding_transfer
  descriptor:
    qualified_name: securities-brokerage.cashier.funding_transfer
    display_name: Funding transfer
    description: Deposits and withdrawals between accounts and banks.
    synonyms:
