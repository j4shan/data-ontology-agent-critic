    description: Cust Request Category Id (identifier).
    value_description: OFBiz field type id.
  - name: statusId
    description: Status Id (identifier).
  - name: fromPartyId
    description: From Party Id (identifier).
    value_description: OFBiz field type id.
  - name: priority
    description: Priority (number).
    value_description: OFBiz field type numeric.
  - name: custRequestDate
    description: 'When the customer (or whoever) submitted the request, maybe out of OFBiz : comming by mail, email, etc.'
    value_description: OFBiz field type date-time.
  - name: responseRequiredDate
    value_description: OFBiz field type date-time.
  - name: custRequestName
    description: Cust Request Name (name).
    value_description: OFBiz field type name.
  - name: description
    description: Description (description text).
    value_description: OFBiz field type description.
  - name: maximumAmountUomId
    description: Maximum Amount Uom Id (identifier).
    value_description: OFBiz field type id.
  - name: productStoreId
    description: Product Store Id (identifier).
    value_description: OFBiz field type id.
  - name: salesChannelEnumId
    description: Sales Channel Enum Id (identifier).
    value_description: OFBiz field type id.
  - name: fulfillContactMechId
    description: Field to support a location of a cust request--ie, product literature sent to an address, service call at
      a localtion, etc.
    value_description: OFBiz field type id.
  - name: currencyUomId
    description: Currency Uom Id (identifier).
    value_description: OFBiz field type id.
  - name: openDateTime
    description: Used when the customer service person, or anyone assigned to handle the incoming request, opens it for action.
      You cantake the customer requestdate and openDateTime to see the efficiency of the customer service people.
  - name: closedDateTime
    description: Used when the customer service person, or anyone assigned to handle the incoming request, closes it as resolution.
      In some customer response systems, the openDateTime and closedDateTime can happen more than once as the customer is
      not satified with the resolution.
  - name: internalComment
    description: Internal Comment (comment text).
    value_description: OFBiz field type comment.
  - name: reason
    description: Reason (description text).
    value_description: OFBiz field type description.
  - name: createdDate
    description: When it is actually stored in the system.
    value_description: OFBiz field type date-time.
  - name: createdByUserLogin
    description: Created By User Login (very long identifier).
    value_description: OFBiz field type id-vlong.
  - name: lastModifiedDate
    description: Last modified date can be till the closedDateTime which is when the customer service people, or anyone assigned
      to handle the incoming request, says it is resolved. This gives when the last action was done to see if the steps to
      resolve the request are happening in a timely manner.
  - name: lastModifiedByUserLogin
    description: Last Modified By User Login (very long identifier).
    value_description: OFBiz field type id-vlong.
  - name: lastUpdatedStamp
    value_description: OFBiz field type date-time.
  - name: lastUpdatedTxStamp
