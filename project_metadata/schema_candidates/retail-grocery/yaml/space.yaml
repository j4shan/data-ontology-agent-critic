schema_version: '2'
nodes:
- node_id: sf:retail-grocery.space.dim_aisle
  descriptor:
    qualified_name: retail-grocery.space.dim_aisle
    display_name: Aisle
    description: Selling aisle inside a storefront.
    synonyms: []
    tags:
    - dimension
    - space
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL_GROCERY
      schema: SPACE
      object: DIM_AISLE
      format: table
  grain:
    description: One row is one aisle.
    components:
    - identity_id: aisle_identity
      dataset_columns:
      - aisle_id
      description: Identifies one aisle.
  columns:
  - name: aisle_id
    description: Identifies one aisle.
  - name: store_id
    description: Storefront that contains the aisle.
  entity_definitions:
  - identity_id: aisle_identity
    dataset_columns:
    - aisle_id
    is_entity_universe: true
    entity_expression:
    - '[aisle_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of aisle.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each storefront contains one or more aisles, and each aisle belongs to exactly one
        storefront.
