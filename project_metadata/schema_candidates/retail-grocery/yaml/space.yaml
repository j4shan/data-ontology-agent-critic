- node_id: sf:retail-grocery.space.fact_planogram_compliance
  descriptor:
    qualified_name: retail-grocery.space.fact_planogram_compliance
    display_name: Planogram compliance
    description: Check of whether a storefront matched a planogram.
    synonyms: []
    tags:
    - fact
    - space
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL_GROCERY
      schema: SPACE
      object: FACT_PLANOGRAM_COMPLIANCE
      format: table
  grain:
    description: One row is one planogram compliance.
    components:
    - identity_id: compliance_identity
      dataset_columns:
      - compliance_id
      description: Identifies one planogram compliance check.
  columns:
  - name: compliance_id
    description: Identifies one planogram compliance check.
  - name: planogram_id
    description: Planogram that was checked.
  - name: store_id
    description: Storefront that was checked.
  - name: fixture_id
    description: Fixture that was checked when the audit names one.
  - name: calendar_day_id
    description: Day the check was performed.
  - name: compliance_status
    description: Result of the planogram check.
    value_description: compliant, exception, skipped
  entity_definitions:
  - identity_id: compliance_identity
    dataset_columns:
    - compliance_id
    is_entity_universe: true
    entity_expression:
    - '[compliance_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of planogram compliance.
  - identity_id: planogram_identity
    dataset_columns:
    - planogram_id
    is_entity_universe: false
    entity_expression:
    - '[planogram_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each check evaluates exactly one planogram, and a planogram may have no compliance
        check.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each check covers exactly one storefront, and a storefront may have no compliance
        check.
  - identity_id: fixture_identity
    dataset_columns:
    - fixture_id
    is_entity_universe: false
    entity_expression:
    - '[fixture_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A check may omit a fixture, and a fixture may have no compliance check.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each check occurs on exactly one day, and a day may have no compliance check.
