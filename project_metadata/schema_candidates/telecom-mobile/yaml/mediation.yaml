schema_version: '2'
nodes:
- node_id: sf:telecom-mobile.mediation.fact_mediation_file
  descriptor:
    qualified_name: telecom-mobile.mediation.fact_mediation_file
    display_name: Mediation File
    description: One CDR file emitted by a network element on one day.
    synonyms: []
    tags:
    - fact
    - mediation
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: northline.us-east-1
      database: TELECOM_MOBILE
      schema: MEDIATION
      object: FACT_MEDIATION_FILE
      format: table
  grain:
    description: One row is one mediation file.
    components:
    - identity_id: mediation_file_identity
      dataset_columns:
      - mediation_file_id
      description: Identifier of one mediation File.
  columns:
  - name: mediation_file_id
    description: Identifier of one mediation File.
  - name: network_element_id
    description: Every network element emits one file each day of the window.
  - name: calendar_day_id
    description: Every day has mediation files.
  - name: file_format_id
    description: Reference to the file Format.
  - name: recording_entity_id
    description: Reference to the recording Entity.
  - name: file_name
    description: Transfer file name.
  - name: record_count
    description: CDR records declared in the file header.
  entity_definitions:
  - identity_id: mediation_file_identity
    dataset_columns:
    - mediation_file_id
    is_entity_universe: true
    entity_expression:
    - '[mediation_file_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of mediation file.
  - identity_id: network_element_identity
    dataset_columns:
    - network_element_id
    is_entity_universe: false
    entity_expression:
    - '[network_element_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many mediation Files belong to one network Element, every mediation File matches
        a network Element, and every network Element includes at least one mediation File. Every network
        element emits one file each day of the window.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many mediation Files belong to one calendar Day, every mediation File matches a calendar
        Day, and every calendar Day includes at least one mediation File. Every day has mediation files.
  - identity_id: file_format_identity
    dataset_columns:
    - file_format_id
    is_entity_universe: false
    entity_expression:
    - '[file_format_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many mediation Files belong to one file Format, every mediation File matches a file
        Format, and every file Format includes at least one mediation File.
  - identity_id: recording_entity_identity
    dataset_columns:
    - recording_entity_id
    is_entity_universe: false
    entity_expression:
    - '[recording_entity_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many mediation Files belong to one recording Entity, every mediation File matches
        a recording Entity, and every recording Entity includes at least one mediation File.
