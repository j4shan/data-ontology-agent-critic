schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.commercial.dim_price_list
  descriptor:
    qualified_name: commerce-marketplace.commercial.dim_price_list
    display_name: Price list
    description: Seller schedule of variant prices in one currency.
    synonyms: []
    tags:
    - dimension
    - commercial
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: COMMERCIAL
      object: DIM_PRICE_LIST
      format: table
  grain:
    description: One row is one price list.
    components:
    - identity_id: price_list_identity
      dataset_columns:
      - price_list_id
      description: Identifies one price list.
  columns:
  - name: price_list_id
    description: Identifies one price list.
  - name: seller_id
    description: Seller that owns the price list.
  - name: currency_id
    description: Currency of the prices on the list.
  entity_definitions:
  - identity_id: price_list_identity
    dataset_columns:
    - price_list_id
    is_entity_universe: true
    entity_expression:
    - '[price_list_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: false
    entity_expression:
    - '[seller_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each price list belongs to exactly one seller, and a seller may have no price lists.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    is_entity_universe: false
    entity_expression:
    - '[currency_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each price list uses exactly one currency, and a currency may have no price lists.
