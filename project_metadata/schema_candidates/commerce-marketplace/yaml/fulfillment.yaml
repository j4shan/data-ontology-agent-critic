  - name: shipping_method_id
    description: Identifies one shipping method.
  - name: carrier_id
    description: Carrier that performs the shipping method.
  entity_definitions:
  - identity_id: shipping_method_identity
    dataset_columns:
    - shipping_method_id
    is_entity_universe: true
    entity_expression:
    - '[shipping_method_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: carrier_identity
    dataset_columns:
    - carrier_id
