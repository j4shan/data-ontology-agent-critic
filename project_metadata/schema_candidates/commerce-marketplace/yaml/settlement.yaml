      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_settlement_identity
    dataset_columns:
    - seller_settlement_id
    is_entity_universe: false
    entity_expression:
    - '[seller_settlement_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every seller settlement includes one or more settlement lines, and each settlement
        line belongs to exactly one seller settlement.
  - identity_id: order_line_identity
    dataset_columns:
    - order_line_id
    is_entity_universe: false
    entity_expression:
