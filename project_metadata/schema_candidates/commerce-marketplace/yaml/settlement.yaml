schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.settlement.fact_seller_settlement
  descriptor:
    qualified_name: commerce-marketplace.settlement.fact_seller_settlement
    display_name: Seller settlement
    description: Settlement of proceeds owed to a seller.
    synonyms: []
    tags:
    - fact
    - settlement
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: SETTLEMENT
      object: FACT_SELLER_SETTLEMENT
      format: table
  grain:
    description: One row is one seller settlement.
    components:
    - identity_id: seller_settlement_identity
      dataset_columns:
      - seller_settlement_id
      description: Identifies one seller settlement.
  columns:
  - name: seller_settlement_id
    description: Identifies one seller settlement.
  - name: seller_id
    description: Seller paid by the settlement.
  - name: currency_id
    description: Currency of the settlement.
  - name: calendar_day_id
    description: Calendar day of the settlement.
  - name: settlement_status
    description: Processing standing of the seller settlement.
    value_description: open, settled, paid
  entity_definitions:
  - identity_id: seller_settlement_identity
    dataset_columns:
    - seller_settlement_id
    is_entity_universe: true
    entity_expression:
    - '[seller_settlement_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: false
    entity_expression:
    - '[seller_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each seller settlement belongs to exactly one seller, and a seller may have no settlements.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    is_entity_universe: false
    entity_expression:
    - '[currency_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each seller settlement uses exactly one currency, and a currency may have no settlements.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each seller settlement belongs to exactly one calendar day, and a calendar day may
        have no settlements.
