schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.content.fact_review
  descriptor:
    qualified_name: commerce-marketplace.content.fact_review
    display_name: Review
    description: Review a buyer wrote for a variant.
    synonyms: []
    tags:
    - fact
    - content
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: CONTENT
      object: FACT_REVIEW
      format: table
  grain:
    description: One row is one review.
    components:
    - identity_id: review_identity
      dataset_columns:
      - review_id
      description: Identifies one review.
  columns:
  - name: review_id
    description: Identifies one review.
  - name: variant_id
    description: Variant the review covers.
  - name: buyer_user_id
    description: Buyer user who wrote the review.
  - name: review_topic_id
    description: Topic the review addresses.
  - name: calendar_day_id
    description: Calendar day of the review.
  - name: rating_value
    description: Rating selected by the reviewer on the published scale.
  entity_definitions:
  - identity_id: review_identity
    dataset_columns:
    - review_id
    is_entity_universe: true
    entity_expression:
    - '[review_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: variant_identity
    dataset_columns:
    - variant_id
    is_entity_universe: false
    entity_expression:
    - '[variant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each review belongs to exactly one variant, and a variant may have no reviews.
  - identity_id: buyer_user_identity
    dataset_columns:
    - buyer_user_id
    is_entity_universe: false
    entity_expression:
    - '[buyer_user_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A review may have no buyer user, and a buyer user may have no reviews.
  - identity_id: review_topic_identity
    dataset_columns:
    - review_topic_id
    is_entity_universe: false
    entity_expression:
    - '[review_topic_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A review may have no review topic, and a review topic may have no reviews.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each review belongs to exactly one calendar day, and a calendar day may have no reviews.
