- node_id: sf:commerce-marketplace.content.fact_answer
  descriptor:
    qualified_name: commerce-marketplace.content.fact_answer
    display_name: Answer
    description: Answer posted to a product question.
    synonyms: []
    tags:
    - fact
    - content
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: CONTENT
      object: FACT_ANSWER
      format: table
  grain:
    description: One row is one answer.
    components:
    - identity_id: answer_identity
      dataset_columns:
      - answer_id
      description: Identifies one answer.
  columns:
  - name: answer_id
    description: Identifies one answer.
  - name: question_id
    description: Question the answer responds to.
  - name: seller_id
    description: Seller that provided the answer.
  - name: employee_id
    description: Employee who wrote the answer.
  - name: calendar_day_id
    description: Calendar day of the answer.
  entity_definitions:
  - identity_id: answer_identity
    dataset_columns:
    - answer_id
    is_entity_universe: true
    entity_expression:
    - '[answer_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: question_identity
    dataset_columns:
    - question_id
    is_entity_universe: false
    entity_expression:
    - '[question_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every question includes one or more answers, and each answer belongs to exactly one
        question.
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: false
    entity_expression:
    - '[seller_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An answer may have no seller, and a seller may have no answers.
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    is_entity_universe: false
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An answer may have no employee, and an employee may have no answers.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each answer belongs to exactly one calendar day, and a calendar day may have no answers.
