schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.cart.fact_cart
  descriptor:
    qualified_name: commerce-marketplace.cart.fact_cart
    display_name: Cart
    description: Shopping cart owned by a buyer account.
    synonyms: []
    tags:
    - fact
    - cart
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: CART
      object: FACT_CART
      format: table
  grain:
    description: One row is one cart.
    components:
    - identity_id: cart_identity
      dataset_columns:
      - cart_id
      description: Identifies one cart.
  columns:
  - name: cart_id
    description: Identifies one cart.
  - name: buyer_account_id
    description: Buyer account that owns the cart.
  - name: buyer_user_id
    description: Buyer user who is shopping with the cart.
  - name: channel_id
    description: Channel where the cart was opened.
  - name: device_id
    description: Device used to open the cart.
  - name: cart_status
    description: Lifecycle standing of the cart.
    value_description: open, converted, abandoned
  entity_definitions:
  - identity_id: cart_identity
    dataset_columns:
    - cart_id
    is_entity_universe: true
    entity_expression:
    - '[cart_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: buyer_account_identity
    dataset_columns:
    - buyer_account_id
    is_entity_universe: false
    entity_expression:
    - '[buyer_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each cart belongs to exactly one buyer account, and a buyer account may have no carts.
  - identity_id: buyer_user_identity
    dataset_columns:
    - buyer_user_id
    is_entity_universe: false
    entity_expression:
    - '[buyer_user_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A cart may have no buyer user, and a buyer user may have no carts.
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    is_entity_universe: false
    entity_expression:
    - '[channel_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each cart belongs to exactly one channel, and a channel may have no carts.
  - identity_id: device_identity
    dataset_columns:
    - device_id
    is_entity_universe: false
    entity_expression:
    - '[device_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A cart may have no device, and a device may have no carts.
- node_id: sf:commerce-marketplace.cart.fact_cart_line
  descriptor:
    qualified_name: commerce-marketplace.cart.fact_cart_line
    display_name: Cart line
    description: Line on a cart for a variant the buyer intends to purchase.
    synonyms: []
    tags:
    - fact
    - cart
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: CART
      object: FACT_CART_LINE
      format: table
  grain:
    description: One row is one cart line.
    components:
    - identity_id: cart_line_identity
      dataset_columns:
      - cart_line_id
      description: Identifies one cart line.
  columns:
  - name: cart_line_id
    description: Identifies one cart line.
  - name: cart_id
    description: Cart that holds the line.
  - name: variant_id
    description: Variant placed on the cart line.
  - name: listing_id
    description: Listing the cart line was taken from.
  - name: quantity
    description: Units of the variant placed on the cart line.
  entity_definitions:
  - identity_id: cart_line_identity
    dataset_columns:
    - cart_line_id
    is_entity_universe: true
    entity_expression:
    - '[cart_line_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: cart_identity
    dataset_columns:
    - cart_id
    is_entity_universe: false
    entity_expression:
    - '[cart_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each cart line belongs to exactly one cart, and a cart may have no cart lines.
  - identity_id: variant_identity
    dataset_columns:
    - variant_id
    is_entity_universe: false
    entity_expression:
    - '[variant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each cart line belongs to exactly one variant, and a variant may have no cart lines.
  - identity_id: listing_identity
    dataset_columns:
    - listing_id
    is_entity_universe: false
    entity_expression:
    - '[listing_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A cart line may have no listing, and a listing may have no cart lines.
