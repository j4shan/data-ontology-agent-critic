      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: marketplace_identity
    dataset_columns:
    - marketplace_id
    is_entity_universe: false
    entity_expression:
    - '[marketplace_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every marketplace includes one or more sellers, and each seller belongs to exactly
        one marketplace.
  - identity_id: seller_tier_identity
    dataset_columns:
    - seller_tier_id
    is_entity_universe: false
    entity_expression:
    - '[seller_tier_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each seller is assigned exactly one seller tier, and a seller tier may have no sellers.
