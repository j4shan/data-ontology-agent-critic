- node_id: sf:commerce-marketplace.party.dim_employee
  descriptor:
    qualified_name: commerce-marketplace.party.dim_employee
    display_name: Employee
    description: Marketplace employee who can manage a seller account.
    synonyms: []
    tags:
    - dimension
    - party
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: PARTY
      object: DIM_EMPLOYEE
      format: table
  grain:
    description: One row is one employee.
    components:
    - identity_id: employee_identity
      dataset_columns:
      - employee_id
      description: Identifies one employee.
  columns:
  - name: employee_id
    description: Identifies one employee.
  - name: employee_name
    description: Name of the marketplace employee.
  - name: employment_status
    description: Current employment standing of the employee.
    value_description: active, leave, terminated
  entity_definitions:
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    is_entity_universe: true
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
