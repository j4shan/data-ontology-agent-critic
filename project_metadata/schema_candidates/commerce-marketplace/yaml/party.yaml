      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: PARTY
      object: DIM_SELLER
      format: table
  grain:
    description: One row is one seller.
    components:
    - identity_id: seller_identity
      dataset_columns:
      - seller_id
      description: Identifies one seller.
  columns:
  - name: seller_id
    description: Identifies one seller.
  - name: marketplace_id
    description: Marketplace that hosts the seller.
  - name: seller_tier_id
    description: Seller tier assigned to the seller.
  - name: account_manager_employee_id
    description: Employee who manages the seller account.
  - name: country_id
    description: Country where the seller is established.
  - name: seller_status
    description: Lifecycle standing of the seller on the marketplace.
    value_description: onboarding, active, suspended, closed
  entity_definitions:
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: true
    entity_expression:
