schema_version: '2'
nodes:
- node_id: sf:payer.premium.fact_premium_bill
  descriptor:
    qualified_name: payer.premium.fact_premium_bill
    display_name: Premium Bill
    description: One monthly premium bill for a member.
    synonyms: []
    tags:
    - fact
    - premium
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: harbor.us-east-1
      database: PAYER
      schema: PREMIUM
      object: FACT_PREMIUM_BILL
      format: table
  grain:
    description: One row is one premium bill.
    components:
    - identity_id: premium_bill_identity
      dataset_columns:
      - premium_bill_id
      description: Identifier of one premium Bill.
  columns:
  - name: premium_bill_id
    description: Identifier of one premium Bill.
  - name: member_id
    description: Each member has one premium bill in the window.
  - name: plan_id
    description: Reference to the plan.
  - name: premium_schedule_id
    description: Reference to the premium Schedule.
  - name: calendar_day_id
    description: Reference to the calendar Day.
  - name: billed_amount
    description: Premium billed.
  entity_definitions:
  - identity_id: premium_bill_identity
    dataset_columns:
    - premium_bill_id
    is_entity_universe: true
    entity_expression:
    - '[premium_bill_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of premium bill.
  - identity_id: member_identity
    dataset_columns:
    - member_id
    is_entity_universe: false
    entity_expression:
    - '[member_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: '1:1'
      business_rule: Each premium Bill matches exactly one member, and each member matches exactly one
        premium Bill. Each member has one premium bill in the window.
  - identity_id: plan_identity
    dataset_columns:
    - plan_id
    is_entity_universe: false
    entity_expression:
    - '[plan_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many premium Bills belong to one plan, every premium Bill matches a plan, and a plan
        may include no premium Bill.
  - identity_id: premium_schedule_identity
    dataset_columns:
    - premium_schedule_id
    is_entity_universe: false
    entity_expression:
    - '[premium_schedule_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many premium Bills belong to one premium Schedule, every premium Bill matches a premium
        Schedule, and a premium Schedule may include no premium Bill.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many premium Bills belong to one calendar Day, every premium Bill matches a calendar
        Day, and a calendar Day may include no premium Bill.
