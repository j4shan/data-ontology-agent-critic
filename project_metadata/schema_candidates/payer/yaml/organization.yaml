    description: US state or district.
    synonyms: []
    tags:
    - dimension
    - organization
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: harbor.us-east-1
      database: PAYER
      schema: ORGANIZATION
      object: DIM_STATE
      format: table
  grain:
    description: One row is one state.
    components:
    - identity_id: state_identity
      dataset_columns:
      - state_id
