schema_version: '2'
nodes:
- node_id: sf:healthcare-payer.provider.dim_taxonomy
  descriptor:
    qualified_name: healthcare-payer.provider.dim_taxonomy
    display_name: Provider Taxonomy
    description: NUCC taxonomy code.
    synonyms: []
    tags:
    - dimension
    - provider
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: harbor.us-east-1
      database: HEALTHCARE_PAYER
      schema: PROVIDER
      object: DIM_TAXONOMY
      format: table
  grain:
    description: One row is one provider taxonomy.
    components:
    - identity_id: taxonomy_identity
      dataset_columns:
      - taxonomy_id
      description: Identifier of one provider Taxonomy.
  columns:
  - name: taxonomy_id
    description: Identifier of one provider Taxonomy.
  - name: code
    description: Code for the provider taxonomy.
    value_description: 207Q00000X, 207R00000X, 363L00000X, 261QE0002X
  entity_definitions:
  - identity_id: taxonomy_identity
    dataset_columns:
    - taxonomy_id
    is_entity_universe: true
    entity_expression:
    - '[taxonomy_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of provider taxonomy.
