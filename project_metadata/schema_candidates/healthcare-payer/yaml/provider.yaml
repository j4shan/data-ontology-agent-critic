- node_id: sf:healthcare-payer.provider.dim_provider
  descriptor:
    qualified_name: healthcare-payer.provider.dim_provider
    display_name: Provider
    description: Billing or rendering provider identified by NPI.
    synonyms:
    - provider
    - billing provider
    tags:
    - dimension
    - provider
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: harbor.us-east-1
      database: HEALTHCARE_PAYER
      schema: PROVIDER
      object: DIM_PROVIDER
      format: table
  grain:
    description: One row is one provider.
    components:
    - identity_id: provider_identity
      dataset_columns:
      - provider_id
      description: Identifier of one provider.
  columns:
  - name: provider_id
    description: Identifier of one provider.
  - name: taxonomy_id
    description: Reference to the provider Taxonomy.
  - name: state_id
    description: Reference to the state.
  - name: specialty_id
    description: Reference to the specialty.
  - name: npi
    description: National provider identifier.
  - name: provider_name
    description: Name of the provider.
  entity_definitions:
  - identity_id: provider_identity
    dataset_columns:
    - provider_id
    is_entity_universe: true
    entity_expression:
    - '[provider_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of provider.
  - identity_id: taxonomy_identity
    dataset_columns:
    - taxonomy_id
    is_entity_universe: false
    entity_expression:
    - '[taxonomy_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many providers belong to one provider Taxonomy, every provider matches a provider
        Taxonomy, and a provider Taxonomy may include no provider.
  - identity_id: state_identity
    dataset_columns:
    - state_id
    is_entity_universe: false
    entity_expression:
    - '[state_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many providers belong to one state, every provider matches a state, and every state
        includes at least one provider.
  - identity_id: specialty_identity
    dataset_columns:
    - specialty_id
    is_entity_universe: false
    entity_expression:
    - '[specialty_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many providers belong to one specialty, every provider matches a specialty, and a
        specialty may include no provider.
