schema_version: '2'
nodes:
- node_id: sf:healthcare-payer.pharmacy.dim_pharmacy
  descriptor:
    qualified_name: healthcare-payer.pharmacy.dim_pharmacy
    display_name: Pharmacy
    description: Dispensing pharmacy.
    synonyms: []
    tags:
    - dimension
    - pharmacy
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: harbor.us-east-1
      database: HEALTHCARE_PAYER
      schema: PHARMACY
      object: DIM_PHARMACY
      format: table
  grain:
    description: One row is one pharmacy.
    components:
    - identity_id: pharmacy_identity
      dataset_columns:
      - pharmacy_id
      description: Identifier of one pharmacy.
  columns:
  - name: pharmacy_id
    description: Identifier of one pharmacy.
  - name: state_id
    description: Reference to the state.
  - name: network_id
    description: Reference to the provider Network.
  - name: ncpdp_id
    description: NCPDP pharmacy identifier.
  - name: pharmacy_name
    description: Name of the pharmacy.
  entity_definitions:
  - identity_id: pharmacy_identity
    dataset_columns:
    - pharmacy_id
    is_entity_universe: true
    entity_expression:
    - '[pharmacy_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of pharmacy.
  - identity_id: state_identity
    dataset_columns:
    - state_id
    is_entity_universe: false
    entity_expression:
    - '[state_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many pharmacies belong to one state, every pharmacy matches a state, and every state
        includes at least one pharmacy.
  - identity_id: network_identity
    dataset_columns:
    - network_id
    is_entity_universe: false
    entity_expression:
    - '[network_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many pharmacies belong to one provider Network, every pharmacy matches a provider
        Network, and a provider Network may include no pharmacy.
