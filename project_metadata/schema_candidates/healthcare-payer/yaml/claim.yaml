    components:
    - identity_id: claim_header_identity
      dataset_columns:
      - claim_header_id
      description: Identifier of one claim Header.
  columns:
  - name: claim_header_id
    description: Identifier of one claim Header.
  - name: member_id
    description: Not every member has a claim in the window.
  - name: coverage_id
    description: Reference to the coverage.
  - name: billing_provider_id
    description: Billing provider of the claim.
  - name: facility_id
    description: Professional claims may omit a facility.
  - name: plan_id
    description: Reference to the plan.
  - name: jurisdiction_id
    description: Reference to the jurisdiction.
  - name: insurance_line_id
    description: Reference to the insurance Line.
  - name: bill_type_id
    description: Professional claims have no institutional bill type.
  - name: place_of_service_id
    description: Reference to the place of Service.
  - name: calendar_day_id
    description: Receipt day. Every day receives claims.
  - name: drg_id
    description: A DRG is present on a subset of inpatient claims.
  - name: submitter_id
    description: Reference to the submitter.
  - name: trading_partner_id
    description: Reference to the trading Partner.
  - name: claim_frequency_id
    description: Reference to the claim Frequency.
  - name: legal_entity_id
    description: Reference to the legal Entity.
  - name: principal_diagnosis_id
    description: Reference to the diagnosis.
  - name: edi_batch_id
    description: Every batch contains claims.
  - name: filing_indicator_id
    description: Reference to the filing Indicator.
  - name: billed_amount
    description: Total billed amount on the header.
  - name: claim_status
    description: Processing status.
    value_description: received, pended, adjudicated, denied, void
  entity_definitions:
  - identity_id: claim_header_identity
    dataset_columns:
    - claim_header_id
    is_entity_universe: true
    entity_expression:
    - '[claim_header_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of claim header.
  - identity_id: member_identity
    dataset_columns:
    - member_id
    is_entity_universe: false
    entity_expression:
    - '[member_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many claim Headers belong to one member, every claim Header matches a member, and
        a member may include no claim Header. Not every member has a claim in the window.
  - identity_id: coverage_identity
    dataset_columns:
