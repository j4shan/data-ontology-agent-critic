    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many claim Headers belong to one provider, every claim Header matches a provider,
        and a provider may include no claim Header. Billing provider of the claim.
  - identity_id: facility_identity
    dataset_columns:
    - facility_id
    is_entity_universe: false
    entity_expression:
    - '[facility_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
