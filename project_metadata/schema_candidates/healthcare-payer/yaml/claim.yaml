    qualified_name: healthcare-payer.claim.fact_claim_header
    display_name: Claim Header
    description: One 837 claim header.
    synonyms:
    - 837 header
    - claim
    tags:
    - fact
    - claim
  accessor:
    schema_id: accessor.snowflake.v1
