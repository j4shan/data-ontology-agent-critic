    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many claim Headers belong to one plan, every claim Header matches a plan, and every
        plan includes at least one claim Header.
  - identity_id: jurisdiction_identity
