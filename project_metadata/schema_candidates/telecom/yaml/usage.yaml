  - name: data_cdr_id
    description: Identifier of one data CDR.
  - name: subscription_id
    description: Usage is rated on the subscription.
  - name: subscriber_id
    description: Reference to the subscriber.
  - name: cell_id
    description: Reference to the cell.
  - name: cell_site_id
    description: Reference to the cell Site.
  - name: technology_id
    description: Reference to the technology.
  - name: apn_id
    description: Reference to the aPN DNN.
  - name: qos_id
    description: Reference to the qoS Profile.
  - name: rating_group_id
    description: Reference to the rating Group.
  - name: record_type_id
    description: Reference to the record Type.
  - name: plmn_id
    description: Reference to the pLMN.
  - name: roaming_partner_id
    description: Home data has no roaming partner.
  - name: network_element_id
    description: Reference to the network Element.
  - name: recording_entity_id
    description: Reference to the recording Entity.
  - name: calendar_day_id
    description: Every day in the window has data CDRs.
  - name: release_cause_id
    description: Reference to the release Cause.
  - name: rate_plan_id
    description: Reference to the rate Plan.
  - name: imsi_id
    description: Reference to the iMSI.
  - name: msisdn_id
    description: Reference to the public Number.
  - name: slice_id
    description: 4G sessions have no slice.
  - name: mediation_file_id
    description: Every mediation file in the window contains data CDRs.
  - name: uplink_bytes
    description: Uplink volume on the CDR.
  - name: downlink_bytes
    description: Downlink volume on the CDR.
  - name: duration_seconds
    description: Recorded duration of the CDR.
  entity_definitions:
  - identity_id: data_cdr_identity
    dataset_columns:
    - data_cdr_id
    is_entity_universe: true
    entity_expression:
    - '[data_cdr_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of data cdr.
  - identity_id: subscription_identity
    dataset_columns:
    - subscription_id
    is_entity_universe: false
    entity_expression:
    - '[subscription_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many data CDRs belong to one subscription, every data CDR matches a subscription,
        and a subscription may include no data CDR. Usage is rated on the subscription.
  - identity_id: subscriber_identity
    dataset_columns:
    - subscriber_id
    is_entity_universe: false
    entity_expression:
    - '[subscriber_id]'
