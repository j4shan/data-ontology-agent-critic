nodes:
- node_id: sf:telecom.usage.fact_data_cdr
  descriptor:
    qualified_name: telecom.usage.fact_data_cdr
    display_name: Data CDR
    description: One closed or partial packet-data CDR transferred to billing.
    synonyms:
    - PGW CDR
    - SMF CDR
    - data record
    tags:
    - fact
    - usage
  accessor:
    schema_id: accessor.snowflake.v1
