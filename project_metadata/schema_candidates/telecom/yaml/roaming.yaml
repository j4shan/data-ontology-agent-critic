schema_version: '2'
nodes:
- node_id: sf:telecom.roaming.fact_tap_out
  descriptor:
    qualified_name: telecom.roaming.fact_tap_out
    display_name: TAP Out Record
    description: One outcollect roaming record sent to a partner.
    synonyms: []
    tags:
    - fact
    - roaming
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: northline.us-east-1
      database: TELECOM
      schema: ROAMING
      object: FACT_TAP_OUT
      format: table
  grain:
    description: One row is one tap out record.
    components:
    - identity_id: tap_out_identity
      dataset_columns:
      - tap_out_id
      description: Identifier of one tAP Out Record.
  columns:
  - name: tap_out_id
    description: Identifier of one tAP Out Record.
  - name: roaming_partner_id
    description: Every roaming partner receives outcollect records.
  - name: plmn_id
    description: Reference to the pLMN.
  - name: subscription_id
    description: Reference to the subscription.
  - name: record_type_id
    description: Reference to the record Type.
  - name: calendar_day_id
    description: Reference to the calendar Day.
  - name: currency_id
    description: Reference to the currency.
  - name: voice_cdr_id
    description: Voice outcollect is one slice of TAP-out.
  - name: data_cdr_id
    description: Data outcollect is one slice of TAP-out.
  - name: charge_amount
    description: Outcollect charge in the tap currency.
  entity_definitions:
  - identity_id: tap_out_identity
    dataset_columns:
    - tap_out_id
    is_entity_universe: true
    entity_expression:
    - '[tap_out_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of tap out record.
  - identity_id: roaming_partner_identity
    dataset_columns:
    - roaming_partner_id
    is_entity_universe: false
    entity_expression:
    - '[roaming_partner_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many tAP Out Records belong to one roaming Partner, every tAP Out Record matches
        a roaming Partner, and every roaming Partner includes at least one tAP Out Record. Every roaming
        partner receives outcollect records.
  - identity_id: plmn_identity
    dataset_columns:
    - plmn_id
    is_entity_universe: false
    entity_expression:
    - '[plmn_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many tAP Out Records belong to one pLMN, every tAP Out Record matches a pLMN, and
        a pLMN may include no tAP Out Record.
  - identity_id: subscription_identity
    dataset_columns:
    - subscription_id
    is_entity_universe: false
    entity_expression:
    - '[subscription_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many tAP Out Records belong to one subscription, every tAP Out Record matches a subscription,
        and a subscription may include no tAP Out Record.
  - identity_id: record_type_identity
    dataset_columns:
    - record_type_id
    is_entity_universe: false
    entity_expression:
    - '[record_type_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many tAP Out Records belong to one record Type, every tAP Out Record matches a record
        Type, and a record Type may include no tAP Out Record.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many tAP Out Records belong to one calendar Day, every tAP Out Record matches a calendar
        Day, and every calendar Day includes at least one tAP Out Record.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    is_entity_universe: false
    entity_expression:
    - '[currency_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many tAP Out Records belong to one currency, every tAP Out Record matches a currency,
        and a currency may include no tAP Out Record.
  - identity_id: voice_cdr_identity
    dataset_columns:
    - voice_cdr_id
    is_entity_universe: false
    entity_expression:
    - '[voice_cdr_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: '1:1'
      business_rule: A tAP Out Record may match one voice CDR, and a voice CDR may match one tAP Out Record.
        Voice outcollect is one slice of TAP-out.
  - identity_id: data_cdr_identity
    dataset_columns:
    - data_cdr_id
    is_entity_universe: false
    entity_expression:
    - '[data_cdr_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: '1:1'
      business_rule: A tAP Out Record may match one data CDR, and a data CDR may match one tAP Out Record.
        Data outcollect is one slice of TAP-out.
