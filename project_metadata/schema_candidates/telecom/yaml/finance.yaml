nodes:
- node_id: sf:telecom.finance.dim_gl_account
  descriptor:
    qualified_name: telecom.finance.dim_gl_account
    display_name: GL Account
    description: General-ledger account.
    synonyms: []
    tags:
    - dimension
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: northline.us-east-1
      database: TELECOM
      schema: FINANCE
      object: DIM_GL_ACCOUNT
      format: table
  grain:
    description: One row is one gl account.
    components:
    - identity_id: gl_account_identity
      dataset_columns:
      - gl_account_id
      description: Identifier of one gL Account.
  columns:
  - name: gl_account_id
    description: Identifier of one gL Account.
  - name: legal_entity_id
    description: Reference to the legal Entity.
  - name: account_name
    description: Name of the ledger account.
  entity_definitions:
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    is_entity_universe: true
    entity_expression:
    - '[gl_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of gl account.
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    is_entity_universe: false
    entity_expression:
    - '[legal_entity_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many gL Accounts belong to one legal Entity, every gL Account matches a legal Entity,
        and a legal Entity may include no gL Account.
