- node_id: sf:telecom.billing.fact_invoice
  descriptor:
    qualified_name: telecom.billing.fact_invoice
    display_name: Invoice
    description: One invoice for one billing account in the window.
    synonyms: []
    tags:
    - fact
    - billing
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: northline.us-east-1
      database: TELECOM
      schema: BILLING
      object: FACT_INVOICE
      format: table
  grain:
    description: One row is one invoice.
    components:
    - identity_id: invoice_identity
      dataset_columns:
      - invoice_id
      description: Identifier of one invoice.
  columns:
  - name: invoice_id
    description: Identifier of one invoice.
  - name: billing_account_id
    description: The window closes exactly one invoice per billing account.
  - name: currency_id
    description: Reference to the currency.
  - name: bill_cycle_id
    description: Reference to the bill Cycle.
  - name: calendar_day_id
    description: Reference to the calendar Day.
  - name: market_id
    description: Reference to the market.
  - name: legal_entity_id
    description: Reference to the legal Entity.
  - name: invoice_amount
    description: Total invoice amount.
  - name: invoice_status
    description: Status of the invoice.
    value_description: issued, settled, adjusted, void
  entity_definitions:
  - identity_id: invoice_identity
    dataset_columns:
    - invoice_id
    is_entity_universe: true
    entity_expression:
    - '[invoice_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of invoice.
  - identity_id: billing_account_identity
    dataset_columns:
    - billing_account_id
    is_entity_universe: false
    entity_expression:
    - '[billing_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: '1:1'
      business_rule: Each invoice matches exactly one billing Account, and each billing Account matches
        exactly one invoice. The window closes exactly one invoice per billing account.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    is_entity_universe: false
    entity_expression:
    - '[currency_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many invoices belong to one currency, every invoice matches a currency, and a currency
        may include no invoice.
  - identity_id: bill_cycle_identity
    dataset_columns:
    - bill_cycle_id
    is_entity_universe: false
    entity_expression:
    - '[bill_cycle_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many invoices belong to one bill Cycle, every invoice matches a bill Cycle, and every
        bill Cycle includes at least one invoice.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many invoices belong to one calendar Day, every invoice matches a calendar Day, and
        a calendar Day may include no invoice.
  - identity_id: market_identity
