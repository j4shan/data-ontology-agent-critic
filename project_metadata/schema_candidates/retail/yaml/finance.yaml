schema_version: '2'
nodes:
- node_id: sf:retail.finance.dim_gl_account
  descriptor:
    qualified_name: retail.finance.dim_gl_account
    display_name: GL account
    description: General-ledger account that classifies a vendor invoice line.
    synonyms: []
    tags:
    - dimension
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: FINANCE
      object: DIM_GL_ACCOUNT
      format: table
  grain:
    description: One row is one gl account.
    components:
    - identity_id: gl_account_identity
      dataset_columns:
      - gl_account_id
      description: Identifies one general-ledger account.
  columns:
  - name: gl_account_id
    description: Identifies one general-ledger account.
  entity_definitions:
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    is_entity_universe: true
    entity_expression:
    - '[gl_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of gl account.
- node_id: sf:retail.finance.fact_cash_deposit
  descriptor:
    qualified_name: retail.finance.fact_cash_deposit
    display_name: Cash deposit
    description: Cash deposited from a storefront by an employee.
    synonyms: []
    tags:
    - fact
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: FINANCE
      object: FACT_CASH_DEPOSIT
      format: table
  grain:
    description: One row is one cash deposit.
    components:
    - identity_id: cash_deposit_identity
      dataset_columns:
      - cash_deposit_id
      description: Identifies one cash deposit.
  columns:
  - name: cash_deposit_id
    description: Identifies one cash deposit.
  - name: store_id
    description: Storefront the cash came from.
  - name: calendar_day_id
    description: Day the deposit was made.
  - name: employee_id
    description: Employee who made the deposit.
  - name: deposit_amount
    description: Amount of cash deposited.
  entity_definitions:
  - identity_id: cash_deposit_identity
    dataset_columns:
    - cash_deposit_id
    is_entity_universe: true
    entity_expression:
    - '[cash_deposit_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of cash deposit.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each deposit comes from exactly one storefront, and a storefront may have no cash
        deposit.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each deposit occurs on exactly one day, and a day may have no cash deposit.
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    is_entity_universe: false
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each deposit is made by exactly one employee, and an employee may make no cash deposit.
