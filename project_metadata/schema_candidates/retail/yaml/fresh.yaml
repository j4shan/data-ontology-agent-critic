schema_version: '2'
nodes:
- node_id: sf:retail.fresh.dim_recipe
  descriptor:
    qualified_name: retail.fresh.dim_recipe
    display_name: Recipe
    description: Fresh recipe whose finished good is a sellable item.
    synonyms: []
    tags:
    - dimension
    - fresh
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: FRESH
      object: DIM_RECIPE
      format: table
  grain:
    description: One row is one recipe.
    components:
    - identity_id: recipe_identity
      dataset_columns:
      - recipe_id
      description: Identifies one fresh recipe.
  columns:
  - name: recipe_id
    description: Identifies one fresh recipe.
  - name: item_id
    description: Finished fresh SKU the recipe produces.
  entity_definitions:
  - identity_id: recipe_identity
    dataset_columns:
    - recipe_id
    is_entity_universe: true
    entity_expression:
    - '[recipe_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of recipe.
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: false
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each recipe produces exactly one finished item, and an item may have no recipe.
