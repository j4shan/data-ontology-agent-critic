- node_id: sf:retail.merchandising.dim_item
  descriptor:
    qualified_name: retail.merchandising.dim_item
    display_name: Item
    description: Sellable or produced SKU classified under a subcategory.
    synonyms: []
    tags:
    - dimension
    - merchandising
  accessor:
    schema_id: accessor.snowflake.v1
