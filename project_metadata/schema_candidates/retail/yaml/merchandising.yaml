    is_entity_universe: false
    entity_expression:
    - '[brand_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An item may omit a brand, and a brand may be named on no item.
  - identity_id: uom_identity
    dataset_columns:
    - uom_id
    is_entity_universe: false
    entity_expression:
    - '[uom_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each item uses exactly one unit of measure, and a unit of measure may be unused.
