schema_version: '2'
nodes:
- node_id: sf:retail.merchandising.dim_category
  descriptor:
    qualified_name: retail.merchandising.dim_category
    display_name: Category
    description: Merchandise category inside a department.
    synonyms: []
    tags:
    - dimension
    - merchandising
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: MERCHANDISING
      object: DIM_CATEGORY
      format: table
  grain:
    description: One row is one category.
    components:
    - identity_id: category_identity
      dataset_columns:
      - category_id
      description: Identifies one merchandise category.
  columns:
  - name: category_id
    description: Identifies one merchandise category.
  - name: department_id
    description: Merchandise department that owns the category.
  entity_definitions:
  - identity_id: category_identity
    dataset_columns:
    - category_id
    is_entity_universe: true
    entity_expression:
    - '[category_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of category.
  - identity_id: department_identity
    dataset_columns:
    - department_id
    is_entity_universe: false
    entity_expression:
    - '[department_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each merchandise department contains one or more categories, and each category belongs
        to exactly one department.
