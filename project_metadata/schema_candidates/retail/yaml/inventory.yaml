schema_version: '2'
nodes:
- node_id: sf:retail.inventory.fact_inventory_position
  descriptor:
    qualified_name: retail.inventory.fact_inventory_position
    display_name: Inventory position
    description: On-hand position of an item at a storefront or a distribution-center location.
    synonyms: []
    tags:
    - fact
    - inventory
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: INVENTORY
      object: FACT_INVENTORY_POSITION
      format: table
  grain:
    description: One row is one inventory position.
    components:
    - identity_id: inventory_position_identity
      dataset_columns:
      - inventory_position_id
      description: Identifies one inventory position.
  columns:
  - name: inventory_position_id
    description: Identifies one inventory position.
  - name: item_id
    description: Item whose quantity is on hand.
  - name: store_id
    description: Storefront holding the inventory when the position is in a shop.
  - name: dc_location_id
    description: Distribution-center location holding the inventory when the position is in a warehouse.
  - name: on_hand_quantity
    description: Quantity on hand for the position.
  entity_definitions:
  - identity_id: inventory_position_identity
    dataset_columns:
    - inventory_position_id
    is_entity_universe: true
    entity_expression:
    - '[inventory_position_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of inventory position.
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: false
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each position names exactly one item, and an item may have no position.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A position may omit a storefront, and a storefront may have no inventory position.
  - identity_id: dc_location_identity
    dataset_columns:
    - dc_location_id
    is_entity_universe: false
    entity_expression:
    - '[dc_location_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A position may omit a distribution-center location, and a location may have no inventory
        position.
