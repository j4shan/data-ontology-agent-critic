- node_id: sf:retail.bridge.bridge_item_store
  descriptor:
    qualified_name: retail.bridge.bridge_item_store
    display_name: Item assortment
    description: Assortment listing of an item at a storefront.
    synonyms: []
    tags:
    - bridge
    - bridge
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: BRIDGE
      object: BRIDGE_ITEM_STORE
      format: table
  grain:
    description: One row is one item assortment.
    components:
    - identity_id: assortment_identity
      dataset_columns:
      - assortment_id
      description: Identifies one item-store assortment row.
  columns:
  - name: assortment_id
    description: Identifies one item-store assortment row.
  - name: item_id
    description: Item listed at the storefront.
  - name: store_id
    description: Storefront that carries the item.
  - name: assortment_status
    description: Listing status of the item at the storefront.
    value_description: listed, seasonal, discontinued
  entity_definitions:
  - identity_id: assortment_identity
    dataset_columns:
    - assortment_id
    is_entity_universe: true
    entity_expression:
    - '[assortment_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of item assortment.
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: false
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each assortment row lists exactly one item, and an item may be listed at no storefront.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each assortment row names exactly one storefront, and a storefront may have no assortment
        row.
