schema_version: '2'
nodes:
- node_id: sf:retail.price.fact_retail_price
  descriptor:
    qualified_name: retail.price.fact_retail_price
    display_name: Retail price
    description: Retail price of an item in a price zone on a day.
    synonyms: []
    tags:
    - fact
    - price
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: PRICE
      object: FACT_RETAIL_PRICE
      format: table
  grain:
    description: One row is one retail price.
    components:
    - identity_id: price_identity
      dataset_columns:
      - price_id
      description: Identifies one retail price.
  columns:
  - name: price_id
    description: Identifies one retail price.
  - name: item_id
    description: Item being priced.
  - name: price_zone_id
    description: Price zone the price applies in.
  - name: calendar_day_id
    description: Day the price is effective.
  - name: retail_price
    description: Retail selling price of the item in the zone on that day.
  entity_definitions:
  - identity_id: price_identity
    dataset_columns:
    - price_id
    is_entity_universe: true
    entity_expression:
    - '[price_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of retail price.
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: false
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each price names exactly one item, and an item may have no zone price.
  - identity_id: price_zone_identity
    dataset_columns:
    - price_zone_id
    is_entity_universe: false
    entity_expression:
    - '[price_zone_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each price names exactly one price zone, and a price zone may have no price row.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each price is effective on exactly one day, and a day may have no price row.
