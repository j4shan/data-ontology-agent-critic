schema_version: '2'
nodes:
- node_id: sf:retail.ecommerce.fact_ecommerce_order
  descriptor:
    qualified_name: retail.ecommerce.fact_ecommerce_order
    display_name: Ecommerce order
    description: Store e-commerce order fulfilled from a storefront.
    synonyms: []
    tags:
    - fact
    - ecommerce
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL
      schema: ECOMMERCE
      object: FACT_ECOMMERCE_ORDER
      format: table
  grain:
    description: One row is one ecommerce order.
    components:
    - identity_id: ecommerce_order_identity
      dataset_columns:
      - ecommerce_order_id
      description: Identifies one e-commerce order.
  columns:
  - name: ecommerce_order_id
    description: Identifies one e-commerce order.
  - name: customer_id
    description: Customer who placed the order.
  - name: store_id
    description: Storefront that fulfills the order.
  - name: fulfillment_type_id
    description: Way the order will be fulfilled.
  - name: delivery_slot_id
    description: Pickup or delivery slot promised for the order when a slot was chosen.
  - name: calendar_day_id
    description: Day the order was placed.
  - name: order_status
    description: Fulfillment status of the order.
    value_description: placed, picking, ready, delivered, cancelled
  entity_definitions:
  - identity_id: ecommerce_order_identity
    dataset_columns:
    - ecommerce_order_id
    is_entity_universe: true
    entity_expression:
    - '[ecommerce_order_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of ecommerce order.
  - identity_id: customer_identity
    dataset_columns:
    - customer_id
    is_entity_universe: false
    entity_expression:
    - '[customer_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each order is placed by exactly one customer, and a customer may place no order.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each order is fulfilled by exactly one storefront, and a storefront may fulfill no
        order.
  - identity_id: fulfillment_type_identity
    dataset_columns:
    - fulfillment_type_id
    is_entity_universe: false
    entity_expression:
    - '[fulfillment_type_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each order uses exactly one fulfillment type, and a fulfillment type may be used
        on no order.
  - identity_id: delivery_slot_identity
    dataset_columns:
    - delivery_slot_id
    is_entity_universe: false
    entity_expression:
    - '[delivery_slot_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An order may omit a delivery slot, and a delivery slot may be chosen on no order.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each order is placed on exactly one day, and a day may have no order.
