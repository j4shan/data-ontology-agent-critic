      dataset_columns:
      - inspection_plan_id
      description: Identifier of one inspection plan.
  columns:
  - name: inspection_plan_id
    description: Identifier of one inspection plan.
  - name: item_revision_id
    description: Item revision the plan inspects.
  - name: plan_name
