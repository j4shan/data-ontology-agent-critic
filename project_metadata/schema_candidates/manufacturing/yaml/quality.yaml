- node_id: sf:manufacturing.quality.fact_nonconformance
  descriptor:
    qualified_name: manufacturing.quality.fact_nonconformance
    display_name: Nonconformance
    description: Recorded failure of an item revision to meet requirements at a plant.
    synonyms: []
    tags:
    - fact
    - quality
  accessor:
    schema_id: accessor.snowflake.v1
