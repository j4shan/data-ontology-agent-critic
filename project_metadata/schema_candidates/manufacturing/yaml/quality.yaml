schema_version: '2'
nodes:
- node_id: sf:manufacturing.quality.dim_quality_characteristic
  descriptor:
    qualified_name: manufacturing.quality.dim_quality_characteristic
    display_name: Quality Characteristic
    description: Measurable characteristic inspected on a pump, part, or tool.
    synonyms: []
    tags:
    - dimension
    - quality
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: alderford.us-east-1
      database: MANUFACTURING
      schema: QUALITY
      object: DIM_QUALITY_CHARACTERISTIC
      format: table
  grain:
    description: One row is one quality characteristic.
    components:
    - identity_id: characteristic_identity
      dataset_columns:
      - characteristic_id
      description: Identifier of one quality characteristic.
  columns:
  - name: characteristic_id
    description: Identifier of one quality characteristic.
  - name: characteristic_name
    description: Name of the quality characteristic.
  entity_definitions:
  - identity_id: characteristic_identity
    dataset_columns:
    - characteristic_id
    is_entity_universe: true
    entity_expression:
    - '[characteristic_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of quality characteristic.
