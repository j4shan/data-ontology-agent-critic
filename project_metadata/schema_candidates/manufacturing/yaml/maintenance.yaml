schema_version: '2'
nodes:
- node_id: sf:manufacturing.maintenance.dim_asset
  descriptor:
    qualified_name: manufacturing.maintenance.dim_asset
    display_name: Asset
    description: Maintainable equipment installed at a plant.
    synonyms: []
    tags:
    - dimension
    - maintenance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: alderford.us-east-1
      database: MANUFACTURING
      schema: MAINTENANCE
      object: DIM_ASSET
      format: table
  grain:
    description: One row is one asset.
    components:
    - identity_id: asset_identity
      dataset_columns:
      - asset_id
      description: Identifier of one asset.
  columns:
  - name: asset_id
    description: Identifier of one asset.
  - name: plant_id
    description: Plant that owns the asset.
  - name: work_center_id
    description: Work center where the asset is installed, when it is on a line.
  - name: cost_center_id
    description: Cost center charged for the asset.
  - name: asset_tag
    description: Visible tag of the asset.
  entity_definitions:
  - identity_id: asset_identity
    dataset_columns:
    - asset_id
    is_entity_universe: true
    entity_expression:
    - '[asset_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of asset.
  - identity_id: plant_identity
    dataset_columns:
    - plant_id
    is_entity_universe: false
    entity_expression:
    - '[plant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many assets belong to one plant, every asset matches a plant, and a plant may include
        no asset.
  - identity_id: work_center_identity
    dataset_columns:
    - work_center_id
    is_entity_universe: false
    entity_expression:
    - '[work_center_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An asset may match one work center, and a work center may include no asset.
  - identity_id: cost_center_identity
    dataset_columns:
    - cost_center_id
    is_entity_universe: false
    entity_expression:
    - '[cost_center_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many assets belong to one cost center, every asset matches a cost center, and a cost
        center may include no asset.
