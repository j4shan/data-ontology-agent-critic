- node_id: sql-database:frappe-erp.stock.batch
  descriptor:
    qualified_name: frappe-erp.stock.batch
    display_name: Batch
    description: A group of units of an item made or received together.
    synonyms:
    - tabBatch
    tags:
    - stock
    - erpnext
  accessor:
    schema_id: accessor.sql-database.v1
