    value_description: Date
  - name: use_batchwise_valuation
    description: Use Batch-wise Valuation
    value_description: Check
  - name: allow_negative_stock_for_batch
    description: Allow Negative Stock for Batch. If enabled, the system will allow negative stock entries
      for this batch, overriding the 'Allow negative stock for Batch' setting in Stock Settings. This
      may lead to incorrect valuation rates, so it is recommended to avoid using this option.
    value_description: Check
  - name: disabled
    value_description: Check
  - name: reference_doctype
    description: Source Document Type
  - name: reference_name
    description: Source Document Name
  - name: supplier
    description: Supplier
