    description: Weight UOM
    value_description: Link
  - name: allow_negative_stock
    description: Allow Negative Stock. Allow stock to go below zero for this item, even if negative stock
      is disabled in Stock Settings.
  - name: has_batch_no
    description: Has Batch No. Track this item in batches. Cannot be changed after a stock transaction
      exists.
    value_description: Check
  - name: create_new_batch
    description: Automatically Create New Batch. Batch number will be auto-created in format AAAA.00001
      if not specified in transactions. Leave blank to always enter batch numbers manually.
    value_description: Check
    synonyms:
    - Automatically Create New Batch
  - name: batch_number_series
    description: 'Batch Number Series. Example: ABCD.#####. If series is set and Batch No is not mentioned
      in transactions, then automatic batch number will be created based on this series. If you always
      want to explicitly mention Batch No for this item, leave this blank. Note: this setting will take
      priority over the Naming Series Prefix in Stock Settings.'
    value_description: Data
  - name: has_expiry_date
    description: Has Expiry Date. Batch number will be created based on expiry date. Expiry dates can
      be set in the Batch master.
    value_description: Check
  - name: shelf_life_in_days
    description: Shelf Life In Days
    value_description: Int
  - name: retain_sample
    description: Retain Sample. Enable to reserve a small sample from each batch for any analysis arising
      ahead
    value_description: Check
  - name: sample_quantity
    description: Max Sample Quantity. Maximum sample quantity that can be retained
    value_description: Int
    synonyms:
    - Max Sample Quantity
  - name: has_serial_no
    description: Has Serial No. Track each unit with a unique serial number for warranty and return tracking.
      Cannot be changed after a stock transaction exists.
    value_description: Check
  - name: serial_no_series
    description: 'Serial Number Series. Example: ABCD.##### If series is set and Serial No is not mentioned
      in transactions, then automatic serial number will be created based on this series. If you always
      want to explicitly mention Serial Nos for this item. leave this blank.'
    value_description: Data
    synonyms:
    - Serial Number Series
  - name: use_serial_no_wise_valuation
  - name: variant_of
    description: Variant Of. If item is a variant of another item then description, image, pricing, taxes
      etc will be set from the template unless explicitly specified
  - name: variant_based_on
    description: Variant Based On
    value_description: Item Attribute, Manufacturer
  - name: purchase_uom
    description: Default Purchase Unit of Measure
    value_description: Link
  - name: min_order_qty
    value_description: Float
    synonyms:
    - Minimum Order Qty
  - name: safety_stock
    description: 'Safety Stock. Minimum stock level to maintain as a buffer. Used to calculate recommended
      reorder level: Reorder Level = Safety Stock + (Average Daily Consumption × Lead Time).'
    value_description: Float
  - name: lead_time_days
    description: Lead Time in days. Average time taken by the supplier to deliver
    value_description: Int
    synonyms:
    - Lead Time in days
  - name: last_purchase_rate
    description: Last Purchase Rate. The rate at which this item was last purchased via a Purchase Invoice.
      Auto-updated by the system.
    value_description: Float
  - name: delivered_by_supplier
    description: Delivered by Supplier (Drop Ship). If checked, this item is treated as drop-shipped by
      default in Sales Orders, Sales Invoices and Purchase Orders. The flag can be overridden on each
      transaction line.
    value_description: Check
    synonyms:
    - Delivered by Supplier (Drop Ship)
