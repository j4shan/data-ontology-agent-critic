    - Created By
  - name: creation
    description: Datetime when the document was created.
    value_description: Datetime
    synonyms:
    - Created On
  - name: modified
  - name: modified_by
    description: User who last updated the document.
    value_description: Link
    synonyms:
    - Last Updated By
  - name: docstatus
    description: 'Document status: 0 is Draft, 1 is Submitted, and 2 is Cancelled.'
    value_description: Int
    synonyms:
    - Document Status
  - name: idx
    description: Row index among sibling rows.
    value_description: Int
    synonyms:
    - Index
  entity_definitions:
  - identity_id: item_identity
    dataset_columns:
    - item
    entity_universe: partial
    unique: false
    total: true
    conforms: true
    entity_expression:
    - '[item]'
    entity_metadata:
      expression_context: MariaDB column reference
    description: Reference to a Item document.
  - identity_id: batch_identity
    dataset_columns:
