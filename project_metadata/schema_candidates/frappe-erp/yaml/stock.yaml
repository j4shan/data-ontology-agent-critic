    tags:
    - stock
    - erpnext
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: mariadb.frappe.internal
      database: frappe
      dialect: mariadb
      schema: stock
      object: tabStock Settings
  grain: unknown
  columns:
  - name: item_naming_by
    description: Item Naming By
    value_description: Item Code, Naming Series
  - name: item_group
    description: Default Item Group
    value_description: Link
  - name: valuation_method
    description: Default Valuation Method
    value_description: FIFO, Moving Average, LIFO, Standard Cost
  - name: auto_insert_price_list_rate_if_missing
    description: Auto insert Item Price if missing
    value_description: Check
  - name: update_existing_price_list_rate
    description: Update existing Price List Rate
    value_description: Check
  - name: update_price_list_based_on
    description: Update Price List based on
    value_description: Rate, Price List Rate
  - name: stock_uom
    description: Default Stock UOM
    value_description: Link
  - name: allow_to_edit_stock_uom_qty_for_sales
    description: Allow to edit stock UOM qty for Sales documents
  - name: allow_to_edit_stock_uom_qty_for_purchase
    description: Allow to edit stock UOM qty for Purchase documents
    value_description: Check
  - name: allow_to_edit_stock_uom_qty_for_stock_entry
    description: Allow to edit stock UOM qty for Stock Entry
    value_description: Check
  - name: allow_uom_with_conversion_rate_defined_in_item
    description: Allow UOM with conversion rate defined in Item. If enabled, the system will allow selecting
      UOMs in sales and purchase transactions only if the conversion rate is set in the item master.
  - name: allow_negative_stock
    description: Allow negative stock. This can be enabled at specific Item level as well
  - name: over_delivery_receipt_allowance
    description: Over Delivery/Receipt Allowance (%). The percentage you are allowed to receive or deliver
      more against the quantity ordered. For example, if you have ordered 100 units, and your Allowance
      is 10%, then you are allowed to receive 110 units.
    value_description: Float
    synonyms:
    - Over Delivery/Receipt Allowance (%)
  - name: mr_qty_allowance
    description: Over Transfer Allowance (%). The percentage you are allowed to transfer more against
      the quantity ordered. For example, if you have ordered 100 units, and your Allowance is 10%, then
      you are allowed transfer 110 units.
    value_description: Float
    synonyms:
    - Over Transfer Allowance (%)
  - name: over_picking_allowance
    description: Over Picking Allowance (%). The percentage you are allowed to pick more items in the
      pick list than the ordered quantity.
  - name: role_allowed_to_over_deliver_receive
    description: Role Allowed to Over Deliver/Receive. Users with this role are allowed to over deliver/receive
      against orders above the allowance percentage
    value_description: Link
    synonyms:
    - Role Allowed to Over Deliver/Receive
  - name: show_barcode_field
    description: Show barcode field in stock transactions
    value_description: Check
  - name: clean_description_html
    description: Convert Item description to clean HTML in transactions
    value_description: Check
  - name: allow_internal_transfer_at_arms_length_price
    description: Allow internal transfers at user-defined rate. If enabled, the item rate won't adjust
      to the valuation rate during internal transfers, but accounting will still use the valuation rate.
      This will allow the user to specify a different rate for printing or taxation purposes.
    value_description: Check
    synonyms:
    - Allow internal transfers at user-defined rate
  - name: validate_material_transfer_warehouses
    description: Validate Material Transfer warehouses. If enabled, the source and target warehouse in
      the Material Transfer Stock Entry must be different else an error will be thrown. If inventory dimensions
      are present, same source and target warehouse can be allowed but atleast any one of the inventory
      dimension fields must be different.
    value_description: Check
  - name: enable_serial_and_batch_no_for_item
    description: Activate Serial / Batch No for Item
    value_description: Check
  - name: pick_serial_and_batch_based_on
    description: Pick Serial / Batch Based On
    value_description: FIFO, LIFO, Expiry
  - name: allow_existing_serial_no
    description: Allow existing Serial No to be Manufactured/Received again
    value_description: Check
  - name: use_serial_batch_fields
    description: Use Serial / Batch fields. On submission of the stock transaction, system will auto create
      the Serial and Batch Bundle based on the Serial No / Batch fields.
    value_description: Check
  - name: use_inline_serial_batch_editor
    description: Use Inline Serial / Batch Editor. Show an inline editable table for serial numbers /
      batches on the item row instead of the dialog
    value_description: Check
    synonyms:
    - Use Inline Serial / Batch Editor
  - name: disable_serial_no_and_batch_selector
    description: Disable Serial No and Batch selector. If enabled, users must enter Serial No. / Batch
      data manually instead of using the selector dialog.
    value_description: Check
  - name: allow_negative_stock_for_batch
    description: Allow negative stock for Batch. If enabled, the system will allow negative stock entries
      for the batch. But, this may lead to incorrect valuation rates, so it is recommended to avoid using
      this option. The system will permit negative stock only when it is caused by backdated entries and
      will validate and block negative stock in all other cases.
    value_description: Check
  - name: do_not_use_batchwise_valuation
    description: Do not use Batch-wise Valuation. If enabled, the system will use the moving average valuation
      method to calculate the valuation rate for the batched items and will not consider the individual
      batch-wise incoming rate.
    value_description: Check
    synonyms:
    - Do not use Batch-wise Valuation
  - name: use_naming_series
    description: Have default Naming Series for Batch ID?. This will be applied if no naming series is
      configured in Item master
    value_description: Check
    synonyms:
    - Have default Naming Series for Batch ID?
  - name: naming_series_prefix
    description: Naming Series Prefix
    value_description: Data
  - name: auto_create_serial_and_batch_bundle_for_outward
    description: Auto create Serial and Batch Bundle for outward
    value_description: Check
  - name: do_not_update_serial_batch_on_creation_of_auto_bundle
    description: Do not update Serial / Batch on creation of auto bundle. If enabled, do not update serial
      / batch values in the stock transactions on creation of auto Serial / Batch Bundle.
    value_description: Check
    synonyms:
    - Do not update Serial / Batch on creation of auto bundle
  - name: auto_map_raw_materials_to_finished_goods
    description: Auto Map Raw Materials to Finished Goods. On submit of a Manufacture / Repack entry,
      map the raw material serial / batch nos that were not mapped in draft to the finished goods, in
      order
    value_description: Check
  - name: set_serial_and_batch_bundle_naming_based_on_naming_series
    description: Set Serial and Batch Bundle Naming Based on Naming Series
    value_description: Check
  - name: enable_stock_reservation
    description: Enable stock reservation. Allows to keep aside a specific quantity of inventory for a
      particular order.
    value_description: Check
  - name: auto_reserve_stock
    description: Auto reserve stock. Upon submission of the Sales Order, Work Order, or Production Plan,
      the system will automatically reserve the stock.
  - name: allow_partial_reservation
    description: Allow partial reservation. Partial stock can be reserved. For example, If you have a
      Sales Order of 100 units and the Available Stock is 90 units then a Stock Reservation Entry will
      be created for 90 units.
    value_description: Check
  - name: auto_reserve_stock_for_sales_order_on_purchase
    description: Auto reserve Stock for Sales Order on Purchase. Stock will be reserved on submission
      of Purchase Receipt created against Material Request for Sales Order.
    value_description: Check
  - name: auto_reserve_serial_and_batch
    description: Auto reserve Serial and Batch Nos. Serial and Batch Nos will be auto-reserved based on
      Pick Serial / Batch Based On
    value_description: Check
    synonyms:
    - Auto reserve Serial and Batch Nos
  - name: allow_to_make_quality_inspection_after_purchase_or_delivery
    description: Allow to make Quality Inspection after Purchase / Delivery
    value_description: Check
  - name: action_if_quality_inspection_is_rejected
    description: Action if Quality Inspection is rejected
    value_description: Stop, Warn
  - name: action_if_quality_inspection_is_not_submitted
    description: Action if Quality Inspection is not submitted
    value_description: Stop, Warn
  - name: auto_indent
    description: Raise Material Request when stock reaches re-order level. This option is useful if you
      want to ensure a constant supply of raw materials/products and avoid shortage. A Material Request
      will be raised automatically when stock reached the re-order level defined in the Item form.
    value_description: Check
    synonyms:
    - Raise Material Request when stock reaches re-order level
  - name: reorder_email_notify
    description: Notify by email on creation of automatic Material Request. An email will be sent to notify
      the User with the role 'Purchase Manager' when an automatic Material Request is created.
    value_description: Check
    synonyms:
    - Notify by email on creation of automatic Material Request
  - name: stock_frozen_upto_days
    description: Freeze stocks older than (days). Stock transactions that are older than the mentioned
      days cannot be modified.
    value_description: Int
    synonyms:
    - Freeze stocks older than (days)
  - name: stock_frozen_upto
    description: Stock frozen up to. No stock transactions can be created or modified before this date.
    value_description: Date
    synonyms:
    - Stock frozen up to
  - name: stock_auth_role
    description: Role allowed to edit frozen stock. The users with this Role are allowed to create/modify
      a stock transaction, even though the transaction is frozen.
    value_description: Link
    synonyms:
    - Role allowed to edit frozen stock
  - name: role_allowed_to_create_edit_back_dated_transactions
    description: Role allowed to create/edit back-dated transactions. If mentioned, the system will allow
      only the users with this Role to create or modify any stock transaction earlier than the latest
      stock transaction for a specific item and warehouse. If set as blank, it allows all users to create/edit
      back-dated transactions.
    value_description: Link
    synonyms:
    - Role allowed to create/edit back-dated transactions
