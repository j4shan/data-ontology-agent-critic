    components:
    - identity_id: country_identity
      dataset_columns:
      - country_id
      description: One row is one country.
  columns:
  - name: country_id
    description: Identifier of the country. This dataset holds the complete country population.
  - name: region_id
    description: Sales region that contains the country.
  - name: country_name
    description: Name of the country.
  - name: country_code
    description: Short code of the country.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: complete
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
