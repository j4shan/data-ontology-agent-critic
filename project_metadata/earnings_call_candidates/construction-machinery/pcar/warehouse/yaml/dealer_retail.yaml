- node_id: sf:truck.retail.fact_dealer_inventory
  descriptor:
    qualified_name: truck.retail.fact_dealer_inventory
    display_name: Dealer inventory
    description: Trucks on a dealer's books, including stock ordered ahead of an emissions change. This
      is not factory backlog and not a retail delivery.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: truck.us-central-1
      database: TRUCK
      schema: RETAIL
      object: FACT_DEALER_INVENTORY
      format: table
  grain:
    description: One row is one dealer, truck family, and accounting period.
    components:
    - identity_id: dealer_inventory_identity
      dataset_columns:
      - dealer_inventory_id
      description: One row is one dealer, truck family, and accounting period.
  columns:
  - name: dealer_inventory_id
    description: Identifier of the dealer inventory row. This dataset holds the complete dealer-inventory
      population.
  - name: dealer_id
    description: Dealer that holds the trucks.
  - name: dealer_location_id
    description: Location of the stock.
  - name: region_id
    description: Sales region of the dealer.
  - name: truck_family_id
    description: Truck family in stock. The family population is owned outside this slice.
  - name: powertrain_id
    description: Powertrain of the stocked trucks. The powertrain population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period of the stock. The period population is owned outside this slice.
  - name: on_hand_units
    description: Trucks on the dealer lot.
    synonyms:
    - dealer inventory
    - stock trucks
  - name: stock_order_units
    description: Trucks the dealer ordered for stock rather than for a named customer.
  - name: emissions_stocking_flag
    description: Whether the stock order is ahead of the emissions change.
    value_description: Y or N.
  entity_definitions:
  - identity_id: dealer_inventory_identity
    dataset_columns:
    - dealer_inventory_id
    entity_universe: complete
  - identity_id: dealer_identity
    dataset_columns:
    - dealer_id
    entity_universe: partial
  - identity_id: dealer_location_identity
    dataset_columns:
    - dealer_location_id
    entity_universe: partial
  - identity_id: region_identity
