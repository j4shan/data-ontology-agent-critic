schema_version: '3'
nodes:
- node_id: sf:truck.organization.dim_region
  descriptor:
    qualified_name: truck.organization.dim_region
    display_name: Region
    description: 'A Truck Inc sales region: the United States and Canada, Europe, South America, China, or
      the other markets.'
    tags:
    - dimension
    synonyms:
    - U.S. and Canada
    - Europe
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: truck.us-central-1
      database: TRUCK
      schema: ORGANIZATION
      object: DIM_REGION
      format: table
  grain:
    description: One row is one sales region.
    components:
    - identity_id: region_identity
      dataset_columns:
      - region_id
      description: One row is one sales region.
  columns:
  - name: region_id
    description: Identifier of the sales region. This dataset holds the complete region population.
  - name: region_code
    description: Code of the sales region.
    value_description: us_canada, europe, south_america, china, or other.
  - name: region_name
    description: Name of the sales region.
  entity_definitions:
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: complete
- node_id: sf:truck.organization.dim_country
  descriptor:
    qualified_name: truck.organization.dim_country
    display_name: Country
    description: A country inside one Truck Inc sales region.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: truck.us-central-1
      database: TRUCK
      schema: ORGANIZATION
      object: DIM_COUNTRY
      format: table
  grain:
