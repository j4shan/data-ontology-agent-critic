- node_id: sf:paccar.product.fact_emissions_program
  descriptor:
    qualified_name: paccar.product.fact_emissions_program
    display_name: Emissions program
    description: 'The emissions-rule timetable: phased rollout, the agency deadline, whether the rule
      is unchanged, and whether a prebuy is a first-half or second-half event.'
    tags:
    - fact
    synonyms:
    - EPA 2027
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: PRODUCT
      object: FACT_EMISSIONS_PROGRAM
      format: table
  grain:
