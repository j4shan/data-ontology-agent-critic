schema_version: '3'
nodes:
- node_id: sf:paccar.market.dim_end_market
  descriptor:
    qualified_name: paccar.market.dim_end_market
    display_name: End market
    description: An end market for PACCAR trucks, including over-the-road and vocational.
    tags:
    - dimension
    synonyms:
    - over the road
    - vocational
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: MARKET
      object: DIM_END_MARKET
      format: table
  grain:
    description: One row is one end market.
    components:
    - identity_id: end_market_identity
      dataset_columns:
      - end_market_id
      description: One row is one end market.
  columns:
  - name: end_market_id
    description: Identifier of the end market. This dataset holds the complete end-market population.
  - name: market_code
    description: Code of the end market.
    value_description: over_the_road or vocational.
  - name: market_name
    description: Name of the end market.
  entity_definitions:
  - identity_id: end_market_identity
    dataset_columns:
    - end_market_id
    entity_universe: complete
