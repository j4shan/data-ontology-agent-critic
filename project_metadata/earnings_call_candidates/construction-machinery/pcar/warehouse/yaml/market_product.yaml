- node_id: sf:paccar.product.fact_local_production
  descriptor:
    qualified_name: paccar.product.fact_local_production
    display_name: Local production
    description: Local-for-local production, the share of local content, and the production shortfall
      versus the plan before the sourcing shift.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: PRODUCT
      object: FACT_LOCAL_PRODUCTION
      format: table
  grain:
    description: One row is one region, plant, and accounting period.
    components:
    - identity_id: local_production_identity
      dataset_columns:
      - local_production_id
      description: One row is one region, plant, and accounting period.
  columns:
  - name: local_production_id
    description: Identifier of the local-production row. This dataset holds the complete local-production
      population.
  - name: region_id
    description: Region whose production moved local-for-local.
  - name: plant_id
    description: Plant that absorbed the local production.
  - name: accounting_period_id
    description: Accounting period of the sourcing result.
  - name: local_for_local_share
    description: Share of production built in the region where it is sold.
  - name: production_shortfall_units
    description: Units below the plan that preceded the sourcing shift.
  - name: plan_before_shift_units
    description: Units in the plan before the move to local-for-local production.
  - name: price_room_flag
    description: Whether the higher local mix leaves more room to realize price.
    value_description: Y or N.
  entity_definitions:
  - identity_id: local_production_identity
    dataset_columns:
    - local_production_id
    entity_universe: complete
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
  - identity_id: plant_identity
    dataset_columns:
    - plant_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
