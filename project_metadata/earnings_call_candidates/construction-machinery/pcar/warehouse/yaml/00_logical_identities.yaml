schema_version: '3'
logical_identities:
  region_identity:
    name: Region
    description: 'A Truck Inc sales region: the United States and Canada, Europe, South America, China, or
      the other markets.'
    synonyms:
    - U.S. and Canada
    - Europe
  country_identity:
    name: Country
    description: A country inside one Truck Inc sales region.
    synonyms: []
  dealer_identity:
    name: Dealer
    description: A Truck Inc dealer that stocks trucks and sells them to fleets.
    synonyms:
    - dealership
  dealer_location_identity:
    name: Dealer location
    description: A dealer branch that holds stock trucks. Stock here is dealer inventory, not a factory
      build slot.
    synonyms: []
  fleet_class_identity:
    name: Fleet class
    description: 'The size of the fleet buying or stocking trucks: a large fleet or a small and mid-sized
      fleet.'
    synonyms:
    - large fleet
    - small fleet
  demand_reason_identity:
    name: Demand reason
    description: 'Why a customer orders a truck: an emissions prebuy, replacement, fleet growth, or an
      ordinary need for trucks.'
    synonyms:
    - prebuy
    - replacement
    - fleet growth
  dealer_inventory_identity:
    name: Dealer inventory
    description: Trucks on a dealer's books, including stock ordered ahead of an emissions change. This
      is not factory backlog and not a retail delivery.
    synonyms: []
  industry_inventory_identity:
    name: Industry truck inventory
    description: Truck Inc truck inventory set next to industry truck inventory. Company stock is not the
      market stock.
    synonyms: []
  retail_outlook_identity:
    name: Retail market outlook
    description: The U.S. and Canada Class 8 retail range, including whether the range stays wide and
      whether a prebuy is still assumed.
    synonyms: []
  regional_delivery_identity:
    name: Regional delivery
    description: Truck deliveries by region. Unit volume is stored here and is not a price.
    synonyms: []
  used_truck_identity:
    name: Used truck market
    description: Used-truck values, tied to whether new orders are replacement or fleet growth.
    synonyms: []
  fleet_capacity_identity:
    name: Fleet capacity
    description: Trucks already in service compared with freight demand, including excess capacity in
      fleets.
    synonyms: []
  fleet_age_identity:
    name: Fleet age
    description: Whether customers are keeping trucks longer, which is the trade-cycle input to next year's
      parts demand.
    synonyms: []
  buy_reason_identity:
    name: Buy reason
    description: The share of customer orders that are a prebuy, replacement, fleet growth, or an ordinary
      need for trucks.
    synonyms: []
  region_outlook_identity:
    name: Regional retail outlook
    description: Whether the retail outlook for a region was raised, left unchanged, or lowered.
    synonyms: []
  end_market_identity:
    name: End market
    description: An end market for Truck Inc trucks, including over-the-road and vocational.
    synonyms:
    - over the road
    - vocational
  truck_family_identity:
    name: Truck family
    description: 'A Truck Inc truck family: Kenworth, Peterbilt, or DAF.'
    synonyms:
    - Kenworth
    - Peterbilt
    - DAF
  powertrain_identity:
    name: Powertrain
    description: 'A truck powertrain: the current diesel, a low-NOx emissions engine, or electric.'
    synonyms:
    - EPA 2027
    - low-NOx
    - electric truck
  plant_identity:
    name: Plant
    description: A Truck Inc truck plant, including Denton and Chillicothe.
    synonyms:
    - Denton
    - Chillicothe
  supplier_identity:
    name: Supplier
    description: A supplier Truck Inc asks to support a build cadence.
    synonyms: []
  input_commodity_identity:
    name: Input commodity
    description: 'An input whose tariff or availability can constrain trucks or parts: steel, aluminum,
      memory chips, or parts.'
    synonyms: []
  industry_peer_identity:
    name: Industry peer
    description: A competitor whose build location, emissions credits, or cost position is compared with
      Truck Inc. The peer is not a Truck Inc dealer.
    synonyms: []
  business_line_identity:
    name: Business line
    description: 'A Truck Inc business line: trucks, parts, or financial services.'
    synonyms:
    - aftermarket parts
    - trucks
  local_production_identity:
    name: Local production
    description: Local-for-local production, the share of local content, and the production shortfall
      versus the plan before the sourcing shift.
    synonyms: []
  regional_build_identity:
    name: Regional build
    description: Truck production by region, including a Europe shutdown and the richness of the North
      American mix.
    synonyms: []
  europe_order_identity:
    name: Europe order
    description: European truck orders, including whether conflict is showing up in the book.
    synonyms: []
  china_electric_identity:
    name: China electric trucks
    description: The change in electric truck demand in China, kept apart from European diesel orders.
    synonyms: []
  emissions_program_identity:
    name: Emissions program
    description: 'The emissions-rule timetable: phased rollout, the agency deadline, whether the rule
      is unchanged, and whether a prebuy is a first-half or second-half event.'
    synonyms:
    - EPA 2027
  emissions_credit_identity:
    name: Emissions credit
    description: Whether an industry peer's emissions credits create a share or price advantage.
    synonyms: []
  compliance_economics_identity:
    name: Compliance economics
    description: The penalty for selling the current engine compared with the cost of a compliant engine,
      and the product and pricing strategy that follows.
    synonyms: []
  supplier_cadence_identity:
    name: Supplier cadence
    description: The build cadence suppliers are asked to support, and whether that cadence supports parts
      growth.
    synonyms: []
  supply_constraint_identity:
    name: Supply constraint
    description: An input that can keep the second-half build from ramping, including memory chips and
      aluminum.
    synonyms: []
  plant_response_identity:
    name: Plant response
    description: How Denton and Chillicothe plans respond when customers talk about incremental share.
    synonyms: []
  sourcing_plan_identity:
    name: Sourcing plan
    description: Whether parts and component sourcing moves more production to the United States under
      a multi-year tariff offset.
    synonyms: []
  peer_position_identity:
    name: Peer cost position
    description: Truck Inc's cost position against peers given where those peers build, after the tariff
      rules.
    synonyms: []
  calendar_day_identity:
    name: Calendar day
    description: A calendar day in the Truck Inc reporting calendar.
    synonyms:
    - date
  accounting_period_identity:
    name: Accounting period
    description: A Truck Inc accounting period, with fiscal year, quarter, and half.
    synonyms:
    - quarter
  currency_identity:
    name: Currency
    description: A currency used on Truck Inc price, margin, and tariff amounts.
    synonyms: []
  cost_element_identity:
    name: Cost element
    description: A cost element that can move truck margin separately from price and mix.
    synonyms: []
  truck_price_identity:
    name: Truck price
    description: Truck price realization. This fact stores no unit volume.
    synonyms:
    - price realization
  price_component_identity:
    name: Price component
    description: Core price and the tariff surcharge stated separately, so a fading surcharge is not the
      same thing as core price.
    synonyms: []
  gross_margin_identity:
    name: Truck gross margin
    description: Truck gross margin and the mix and cost pieces that explain it. Delivery units on this
      row are the volume assumption of the margin guide, not the delivery population.
    synonyms:
    - gross margin
  profit_per_truck_identity:
    name: Profit per truck
    description: Profit per truck, split into cost execution, mix, parts contribution, and any emissions
      refund.
    synonyms: []
  emissions_refund_identity:
    name: Emissions refund
    description: An emissions-rule refund, kept apart from underlying cost so it can be tested as the
      driver of profit per truck.
    synonyms: []
  tariff_bridge_identity:
    name: Tariff bridge
    description: Tariff cost by business line and input, including a reversal, a quarterly benefit, and
      whether the result is a cost advantage or an even field.
    synonyms: []
  tariff_rebate_identity:
    name: Tariff rebate
    description: The tariff rebate, its timing, and its run-rate value against parts, steel, and aluminum
      costs.
    synonyms: []
  tariff_surcharge_identity:
    name: Tariff surcharge
    description: The per-truck tariff surcharge, including whether last year's surcharge is being rolled
      back.
    synonyms: []
  order_intake_identity:
    name: Order intake
    description: Truck orders. Units are volume and are stored without a price.
    synonyms: []
  backlog_identity:
    name: Order backlog
    description: Unfilled truck orders. Backlog is not dealer inventory and not a delivery.
    synonyms: []
  backlog_mix_identity:
    name: Backlog mix
    description: How backlog mix is shifting between small fleets and large fleets.
    synonyms: []
  slot_deferral_identity:
    name: Slot deferral
    description: Orders placed for a 2026 prebuy that customers now want pushed into 2027, and other delivery-date
      pushouts.
    synonyms: []
  build_slot_identity:
    name: Build slot
    description: Open and filled build slots, shifts, and whether production would be flexed up for a
      prebuy or kept limited.
    synonyms: []
  production_timing_identity:
    name: Production timing
    description: When recent orders turn into production.
    synonyms: []
  price_cost_identity:
    name: Price cost
    description: Price and cost moving separately, including the fourth-quarter gap and the path through
      the second half.
    synonyms: []
  incremental_margin_identity:
    name: Incremental margin
    description: Incremental margin this cycle versus the last, with tariffs, share, and the absence of
      a new-product wave kept apart.
    synonyms: []
  parts_result_identity:
    name: Parts result
    description: Parts revenue and gross margin, including a slow start, a back-half acceleration, and
      whether freight rates are required.
    synonyms:
    - aftermarket
    - parts margin
  share_choice_identity:
    name: Share choice
    description: Whether Truck Inc is prioritizing market share or profit per truck, and whether customers
      are talking about incremental share.
    synonyms: []
  freight_environment_identity:
    name: Freight environment
    description: Freight rates, driver supply, and freight volume, including whether rates are up because
      there are fewer drivers.
    synonyms: []
  customer_confidence_identity:
    name: Customer confidence
    description: How much of the improved order confidence is the freight environment versus clarity on
      the emissions rule.
    synonyms: []
  production_credit_identity:
    name: Production credit
    description: The announced production credit and when it applies.
    synonyms: []
  purchase_incentive_identity:
    name: Purchase incentive
    description: A customer incentive such as bonus depreciation that supports the North American retail
      outlook.
    synonyms: []
  lease_rental_identity:
    name: Lease and rental demand
    description: Financial-services lease and rental demand that follows a shift in backlog toward large
      fleets.
    synonyms:
    - financial services
  cycle_margin_identity:
    name: Cycle margin
    description: Truck margin compared with the historical cycle average as the market normalizes.
    synonyms: []
  margin_sequence_identity:
    name: Margin sequence
    description: Margin from one quarter to the next when deliveries are flat.
    synonyms: []
  order_coverage_identity:
    name: Order coverage
    description: How full the coming quarter's orders are by region, and whether that coverage is similar
      across regions.
    synonyms: []
