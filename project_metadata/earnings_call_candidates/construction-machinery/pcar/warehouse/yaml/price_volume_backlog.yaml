  - name: accounting_period_id
    description: Accounting period of the refund.
  - name: currency_id
    description: Currency of the refund.
  - name: refund_amount
    description: Emissions-rule refund amount.
  - name: drove_profit_flag
    description: Whether the refund, rather than underlying cost, drove profit per truck.
    value_description: Y or N.
  entity_definitions:
  - identity_id: emissions_refund_identity
    dataset_columns:
    - emissions_refund_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:paccar.commercial.fact_tariff_bridge
  descriptor:
    qualified_name: paccar.commercial.fact_tariff_bridge
    display_name: Tariff bridge
    description: Tariff cost by business line and input, including a reversal, a quarterly benefit, and
      whether the result is a cost advantage or an even field.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: COMMERCIAL
      object: FACT_TARIFF_BRIDGE
      format: table
  grain:
    description: One row is one business line, input, region, and accounting period.
    components:
    - identity_id: tariff_bridge_identity
      dataset_columns:
      - tariff_bridge_id
      description: One row is one business line, input, region, and accounting period.
  columns:
  - name: tariff_bridge_id
    description: Identifier of the tariff-bridge row. This dataset holds the complete tariff-bridge population.
  - name: business_line_id
    description: Trucks or parts the tariff hits.
  - name: input_commodity_id
    description: Steel, aluminum, or another input.
  - name: region_id
    description: Region of the tariff cost.
  - name: accounting_period_id
    description: Accounting period of the tariff.
  - name: currency_id
    description: Currency of the tariff amounts.
  - name: tariff_cost_amount
    description: Tariff cost.
  - name: prior_outlook_amount
    description: Tariff hit in the prior outlook, before the simplified metal rules.
  - name: reversal_amount
    description: Tariff cost reversed versus the older rules.
  - name: headwind_amount
    description: Tariff headwind still in the outlook.
  - name: quarter_benefit_amount
    description: Tariff benefit expected in a coming quarter.
  - name: cost_position_code
    description: Cost position after the rules.
    value_description: advantage or even_field.
  entity_definitions:
  - identity_id: tariff_bridge_identity
    dataset_columns:
    - tariff_bridge_id
