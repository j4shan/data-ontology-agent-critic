  - identity_id: business_line_identity
    dataset_columns:
    - business_line_id
    entity_universe: partial
  - identity_id: input_commodity_identity
    dataset_columns:
    - input_commodity_id
    entity_universe: partial
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
