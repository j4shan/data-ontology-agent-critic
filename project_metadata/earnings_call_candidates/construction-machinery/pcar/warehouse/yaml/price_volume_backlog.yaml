schema_version: '3'
nodes:
- node_id: sf:paccar.calendar.dim_calendar_day
  descriptor:
    qualified_name: paccar.calendar.dim_calendar_day
    display_name: Calendar day
    description: A calendar day in the PACCAR reporting calendar.
    tags:
    - dimension
    synonyms:
    - date
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: CALENDAR
      object: DIM_CALENDAR_DAY
      format: table
  grain:
    description: One row is one calendar day.
    components:
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
      description: One row is one calendar day.
  columns:
  - name: calendar_day_id
    description: Identifier of the calendar day. This dataset holds the complete calendar-day population.
  - name: accounting_period_id
    description: Accounting period that contains the day.
  - name: day_label
    description: Calendar date label of the day.
  entity_definitions:
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:paccar.calendar.dim_accounting_period
  descriptor:
    qualified_name: paccar.calendar.dim_accounting_period
    display_name: Accounting period
    description: A PACCAR accounting period, with fiscal year, quarter, and half.
    tags:
    - dimension
    synonyms:
    - quarter
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: CALENDAR
      object: DIM_ACCOUNTING_PERIOD
      format: table
  grain:
    description: One row is one accounting period.
    components:
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
      description: One row is one accounting period.
  columns:
  - name: accounting_period_id
    description: Identifier of the accounting period. This dataset holds the complete accounting-period
      population.
  - name: period_label
    description: Label of the accounting period.
  - name: fiscal_year
    description: Fiscal year of the period.
  - name: quarter_label
    description: Quarter label.
    value_description: Q1, Q2, Q3, or Q4.
  - name: half_code
    description: Half of the fiscal year.
    value_description: first_half or second_half.
  entity_definitions:
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: complete
- node_id: sf:paccar.commercial.dim_currency
  descriptor:
    qualified_name: paccar.commercial.dim_currency
    display_name: Currency
    description: A currency used on PACCAR price, margin, and tariff amounts.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: COMMERCIAL
      object: DIM_CURRENCY
      format: table
  grain:
    description: One row is one currency.
    components:
    - identity_id: currency_identity
      dataset_columns:
      - currency_id
      description: One row is one currency.
  columns:
  - name: currency_id
    description: Identifier of the currency. This dataset holds the complete currency population.
  - name: currency_code
    description: Short code of the currency.
  - name: currency_name
    description: Name of the currency.
  entity_definitions:
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: complete
- node_id: sf:paccar.commercial.dim_cost_element
  descriptor:
    qualified_name: paccar.commercial.dim_cost_element
    display_name: Cost element
    description: A cost element that can move truck margin separately from price and mix.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: COMMERCIAL
      object: DIM_COST_ELEMENT
      format: table
  grain:
    description: One row is one cost element.
    components:
    - identity_id: cost_element_identity
      dataset_columns:
      - cost_element_id
      description: One row is one cost element.
  columns:
  - name: cost_element_id
    description: Identifier of the cost element. This dataset holds the complete cost-element population.
  - name: element_code
    description: Code of the cost element.
    value_description: manufacturing, tariff, refund, or mix.
  - name: element_name
    description: Name of the cost element.
  entity_definitions:
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: complete
- node_id: sf:paccar.commercial.fact_truck_price
  descriptor:
    qualified_name: paccar.commercial.fact_truck_price
    display_name: Truck price
    description: Truck price realization. This fact stores no unit volume.
    tags:
    - fact
    synonyms:
    - price realization
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: COMMERCIAL
      object: FACT_TRUCK_PRICE
      format: table
  grain:
    description: One row is one region, powertrain, business line, and accounting period.
    components:
    - identity_id: truck_price_identity
      dataset_columns:
      - truck_price_id
      description: One row is one region, powertrain, business line, and accounting period.
  columns:
  - name: truck_price_id
    description: Identifier of the truck-price row. This dataset holds the complete truck-price population.
  - name: region_id
    description: Region of the price.
  - name: powertrain_id
    description: Powertrain the price applies to.
  - name: business_line_id
    description: Business line, normally trucks.
  - name: accounting_period_id
    description: Accounting period of the price.
  - name: currency_id
    description: Currency of the price.
  - name: market_price_direction
    description: Direction of market pricing.
    value_description: rising, flat, or falling.
  - name: realized_price_rate
    description: Price PACCAR realized. This measure is not a unit count.
    synonyms:
    - truck price
  - name: next_quarter_price_rate
    description: Price expected next quarter.
  - name: sequential_step_up_rate
    description: Step-up in price realization from one quarter to the next.
  - name: communicated_price_increase
    description: Price increase communicated to customers for the emissions engine.
  - name: price_given_back_flag
    description: Whether pricing taken to cover tariffs is being given back to gain share.
    value_description: Y or N.
  entity_definitions:
  - identity_id: truck_price_identity
    dataset_columns:
    - truck_price_id
    entity_universe: complete
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
  - identity_id: powertrain_identity
    dataset_columns:
    - powertrain_id
    entity_universe: partial
  - identity_id: business_line_identity
    dataset_columns:
    - business_line_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:paccar.commercial.fact_price_component
  descriptor:
    qualified_name: paccar.commercial.fact_price_component
    display_name: Price component
    description: Core price and the tariff surcharge stated separately, so a fading surcharge is not the
      same thing as core price.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: COMMERCIAL
      object: FACT_PRICE_COMPONENT
      format: table
  grain:
    description: One row is one accounting period.
    components:
    - identity_id: price_component_identity
      dataset_columns:
      - price_component_id
      description: One row is one accounting period.
  columns:
  - name: price_component_id
    description: Identifier of the price-component row. This dataset holds the complete price-component
      population.
  - name: accounting_period_id
    description: Accounting period of the price components.
  - name: currency_id
    description: Currency of the price changes.
  - name: core_price_change
    description: Change in core price, excluding the tariff surcharge.
  - name: surcharge_change
    description: Change in the tariff surcharge.
  - name: surcharge_fading_flag
    description: Whether the surcharge is fading.
    value_description: Y or N.
  - name: core_continuing_flag
    description: Whether core price increases continue.
    value_description: Y or N.
  entity_definitions:
  - identity_id: price_component_identity
    dataset_columns:
    - price_component_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:paccar.commercial.fact_gross_margin
  descriptor:
    qualified_name: paccar.commercial.fact_gross_margin
    display_name: Truck gross margin
    description: Truck gross margin and the mix and cost pieces that explain it. Delivery units on this
      row are the volume assumption of the margin guide, not the delivery population.
    tags:
    - fact
    synonyms:
    - gross margin
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: paccar.us-central-1
      database: PACCAR
      schema: COMMERCIAL
      object: FACT_GROSS_MARGIN
      format: table
  grain:
    description: One row is one region, business line, and accounting period.
    components:
    - identity_id: gross_margin_identity
      dataset_columns:
      - gross_margin_id
      description: One row is one region, business line, and accounting period.
  columns:
  - name: gross_margin_id
    description: Identifier of the gross-margin row. This dataset holds the complete gross-margin population.
  - name: region_id
    description: Region of the margin.
  - name: business_line_id
    description: Trucks, the business this margin describes.
  - name: accounting_period_id
    description: Accounting period of the margin.
  - name: currency_id
    description: Currency of the margin amounts.
  - name: cost_element_id
    description: Cost element highlighted in the bridge.
  - name: gross_margin_rate
    description: Truck gross margin rate.
  - name: mix_effect_amount
    description: Margin piece from mix.
  - name: cost_effect_amount
    description: Margin piece from cost.
  - name: versus_expectation
    description: How the margin compared with the prior expectation.
    value_description: stronger, in_line, or weaker.
  - name: guided_direction
    description: Direction of the guided margin.
    value_description: flat, up, or down.
  - name: delivery_units
    description: Delivery units assumed in the margin guide. The delivery population is a different fact.
  - name: north_america_mix_rate
    description: North American mix assumed in the guide.
  - name: europe_shutdown_flag
    description: Whether the guide assumes Europe is shut down.
    value_description: Y or N.
  - name: revenue_change_amount
    description: Sequential change in revenue.
  - name: gross_profit_change_amount
    description: Sequential change in gross profit.
  - name: tariff_reversal_flag
    description: Whether the gross-profit jump is a reversal of older tariffs.
    value_description: Y or N.
  entity_definitions:
  - identity_id: gross_margin_identity
    dataset_columns:
    - gross_margin_id
    entity_universe: complete
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
  - identity_id: business_line_identity
    dataset_columns:
    - business_line_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
- node_id: sf:paccar.commercial.fact_profit_per_truck
  descriptor:
    qualified_name: paccar.commercial.fact_profit_per_truck
    display_name: Profit per truck
    description: Profit per truck, split into cost execution, mix, parts contribution, and any emissions
