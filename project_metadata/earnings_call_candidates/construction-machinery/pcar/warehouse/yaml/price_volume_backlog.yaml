    description: Identifier of the profit-per-truck row. This dataset holds the complete profit-per-truck
      population.
  - name: region_id
    description: Region of the profit per truck.
  - name: accounting_period_id
    description: Accounting period of the profit per truck.
  - name: currency_id
    description: Currency of the profit per truck.
  - name: profit_per_truck_amount
    description: Profit per truck.
  - name: cost_execution_amount
    description: Portion from cost execution.
  - name: mix_effect_amount
    description: Portion from mix.
  - name: parts_contribution_amount
    description: Portion from parts.
  - name: refund_amount
    description: Emissions-rule refund included in the profit per truck.
  - name: underlying_cost_amount
