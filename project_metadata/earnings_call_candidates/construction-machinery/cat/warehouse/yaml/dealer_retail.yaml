- node_id: sf:caterpillar.retail.fact_dealer_inventory
  descriptor:
    qualified_name: caterpillar.retail.fact_dealer_inventory
    display_name: Dealer inventory
    description: Machines on a dealer's books. This is dealer stock, separate from factory production,
      shipments, and unfilled backlog.
    tags:
    - fact
    synonyms:
    - dealer stock
    - machine inventory
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: caterpillar.us-central-1
      database: CATERPILLAR
      schema: RETAIL
      object: FACT_DEALER_INVENTORY
      format: table
  grain:
    description: One row is one dealer, machine model, and accounting period.
    components:
    - identity_id: dealer_inventory_identity
      dataset_columns:
      - dealer_inventory_id
      description: One row is one dealer, machine model, and accounting period.
  columns:
  - name: dealer_inventory_id
    description: Identifier of the dealer inventory row. This dataset holds the complete dealer-inventory
      population.
  - name: dealer_id
    description: Dealer that holds the machines.
  - name: dealer_location_id
    description: Location of the on-hand machines.
  - name: machine_model_id
    description: Machine model in dealer stock. The model population is owned outside this slice.
  - name: segment_id
    description: Operating segment of the stock. The segment population is owned outside this slice.
  - name: region_id
    description: Sales region of the dealer.
  - name: accounting_period_id
    description: Accounting period of the stock observation. The period population is owned outside this
      slice.
  - name: on_hand_units
    description: Machines on the dealer lot in the period.
    synonyms:
    - dealer inventory
    - dealer stock
  - name: inventory_change_units
    description: Change in dealer on-hand units during the period. Positive is a restock and negative
      is a destock.
  - name: destock_flag
    description: Whether the dealer reduced stock in the period.
    value_description: Y or N.
  - name: prior_year_destock_units
    description: Units the dealer already destocked in the prior year, kept so a further reduction can
      be compared with that destock.
  entity_definitions:
  - identity_id: dealer_inventory_identity
    dataset_columns:
    - dealer_inventory_id
    entity_universe: complete
  - identity_id: dealer_identity
    dataset_columns:
    - dealer_id
    entity_universe: partial
  - identity_id: dealer_location_identity
    dataset_columns:
    - dealer_location_id
    entity_universe: partial
  - identity_id: machine_model_identity
    dataset_columns:
    - machine_model_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:caterpillar.retail.fact_retail_demand
  descriptor:
    qualified_name: caterpillar.retail.fact_retail_demand
    display_name: Retail demand
    description: Retail demand at a dealer, measured in units and amount. Retail demand is sales to users
      and rental customers, not dealer inventory and not a factory order.
    tags:
    - fact
    synonyms:
    - sales to users
    - retail sales
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: caterpillar.us-central-1
      database: CATERPILLAR
      schema: RETAIL
      object: FACT_RETAIL_DEMAND
      format: table
  grain:
    description: One row is one dealer, segment, channel, and accounting period.
    components:
    - identity_id: retail_demand_identity
      dataset_columns:
      - retail_demand_id
      description: One row is one dealer, segment, channel, and accounting period.
  columns:
  - name: retail_demand_id
    description: Identifier of the retail demand row. This dataset holds the complete retail-demand population.
  - name: dealer_id
    description: Dealer that faces the retail demand.
  - name: region_id
    description: Sales region of the demand.
  - name: segment_id
    description: Operating segment. The segment population is owned outside this slice.
  - name: sales_channel_id
    description: Channel of the retail demand.
  - name: accounting_period_id
    description: Accounting period. The period population is owned outside this slice.
  - name: retail_demand_units
    description: Retail units demanded. This measure is not a price.
  - name: retail_demand_amount
    description: Retail demand stated as a sales amount. Stored beside units so the amount is not treated
      as dealer stock.
  - name: expected_direction
    description: Expected direction of retail demand versus the prior view.
    value_description: up, down, or flat.
  entity_definitions:
  - identity_id: retail_demand_identity
    dataset_columns:
    - retail_demand_id
    entity_universe: complete
  - identity_id: dealer_identity
    dataset_columns:
    - dealer_id
    entity_universe: partial
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: sales_channel_identity
    dataset_columns:
    - sales_channel_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:caterpillar.retail.fact_production_versus_retail
  descriptor:
    qualified_name: caterpillar.retail.fact_production_versus_retail
    display_name: Production versus retail
    description: Factory production set next to retail demand for a segment and period, so a build-to-retail
      decision can be read without mixing in dealer stock.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: caterpillar.us-central-1
      database: CATERPILLAR
      schema: RETAIL
      object: FACT_PRODUCTION_VERSUS_RETAIL
      format: table
  grain:
    description: One row is one segment and accounting period.
    components:
    - identity_id: production_versus_retail_identity
      dataset_columns:
      - production_versus_retail_id
      description: One row is one segment and accounting period.
  columns:
  - name: production_versus_retail_id
    description: Identifier of the production-versus-retail row. This dataset holds the complete population
      of those comparisons.
  - name: segment_id
    description: Operating segment whose production is compared with retail demand.
  - name: accounting_period_id
    description: Accounting period of the comparison.
  - name: production_units
    description: Units Caterpillar plans to build. This is factory output, not dealer inventory.
  - name: retail_demand_units
    description: Retail units the production plan is being matched against.
  - name: build_to_retail_flag
    description: Whether the production decision is to build to retail demand.
    value_description: Y or N.
  entity_definitions:
  - identity_id: production_versus_retail_identity
    dataset_columns:
