schema_version: '3'
nodes:
- node_id: sf:caterpillar.organization.dim_region
  descriptor:
    qualified_name: caterpillar.organization.dim_region
    display_name: Region
    description: A Caterpillar sales region. North America is the region used when construction users
      and dealer stock are discussed together.
    tags:
    - dimension
    synonyms:
    - sales region
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: caterpillar.us-central-1
      database: CATERPILLAR
      schema: ORGANIZATION
      object: DIM_REGION
      format: table
  grain:
    description: One row is one sales region.
    components:
    - identity_id: region_identity
      dataset_columns:
      - region_id
      description: One row is one sales region.
  columns:
  - name: region_id
    description: Identifier of the sales region. This dataset holds the complete region population.
  - name: region_code
    description: Short code of the sales region.
    value_description: north_america, latin_america, emea, or asia_pacific.
  - name: region_name
    description: Name of the sales region.
  entity_definitions:
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: complete
- node_id: sf:caterpillar.organization.dim_country
  descriptor:
    qualified_name: caterpillar.organization.dim_country
    display_name: Country
    description: A country inside one Caterpillar sales region.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: caterpillar.us-central-1
      database: CATERPILLAR
      schema: ORGANIZATION
      object: DIM_COUNTRY
      format: table
  grain:
    description: One row is one country.
    components:
    - identity_id: country_identity
      dataset_columns:
      - country_id
      description: One row is one country.
  columns:
  - name: country_id
    description: Identifier of the country. This dataset holds the complete country population.
  - name: region_id
    description: Sales region that contains the country.
  - name: country_name
    description: Name of the country.
  - name: country_code
    description: Short code of the country.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: complete
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
