  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: power_product_identity
    dataset_columns:
    - power_product_id
    entity_universe: partial
- node_id: sf:machinery.commercial.fact_order_intake
  descriptor:
    qualified_name: machinery.commercial.fact_order_intake
    display_name: Order intake
