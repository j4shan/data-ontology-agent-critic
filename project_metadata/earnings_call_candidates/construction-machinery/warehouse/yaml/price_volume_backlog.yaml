      description: One row is one margin framework.
  columns:
  - name: margin_framework_id
    description: Identifier of the margin framework. This dataset holds the complete margin-framework
      population.
  - name: framework_name
    description: Name of the framework, including the analyst-day range and the supply-disruption range.
