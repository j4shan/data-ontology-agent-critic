    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:machinery.commercial.fact_price_realization
  descriptor:
    qualified_name: machinery.commercial.fact_price_realization
    display_name: Price realization
    description: Price realization by segment and period. This fact stores no unit volume.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: machinery.us-central-1
      database: MACHINERY
      schema: COMMERCIAL
      object: FACT_PRICE_REALIZATION
      format: table
  grain:
    description: One row is one segment and accounting period.
    components:
    - identity_id: price_realization_identity
      dataset_columns:
      - price_realization_id
      description: One row is one segment and accounting period.
  columns:
  - name: price_realization_id
    description: Identifier of the price-realization row. This dataset holds the complete price-realization
      population.
  - name: segment_id
    description: Operating segment of the price.
  - name: accounting_period_id
    description: Accounting period of the price.
  - name: currency_id
    description: Currency of the price.
  - name: power_product_id
    description: Power product whose price is in view, when the price is product-specific.
  - name: price_realization_rate
    description: Price realization rate. A negative rate is price down. This measure is not a unit count.
    synonyms:
    - price
