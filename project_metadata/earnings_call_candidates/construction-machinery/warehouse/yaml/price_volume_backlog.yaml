      - currency_id
      description: One row is one currency.
  columns:
  - name: currency_id
    description: Identifier of the currency. This dataset holds the complete currency population.
  - name: currency_code
    description: Short code of the currency.
  - name: currency_name
    description: Name of the currency.
  entity_definitions:
  - identity_id: currency_identity
    dataset_columns:
