- node_id: sf:machinery.commercial.dim_margin_framework
  descriptor:
    qualified_name: machinery.commercial.dim_margin_framework
    display_name: Margin framework
    description: The operating-margin range Machinery Inc set, including the range from the supply-chain
      disruption period and the analyst-day view.
    tags:
    - dimension
    synonyms:
    - margin target
    - analyst day
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: machinery.us-central-1
      database: MACHINERY
