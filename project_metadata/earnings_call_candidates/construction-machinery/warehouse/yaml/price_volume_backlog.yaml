- node_id: sf:machinery.commercial.fact_segment_volume
  descriptor:
    qualified_name: machinery.commercial.fact_segment_volume
    display_name: Segment volume
    description: Unit volume by operating segment. This fact stores no price.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: machinery.us-central-1
      database: MACHINERY
      schema: COMMERCIAL
      object: FACT_SEGMENT_VOLUME
      format: table
  grain:
    description: One row is one segment and accounting period.
    components:
    - identity_id: segment_volume_identity
      dataset_columns:
      - segment_volume_id
      description: One row is one segment and accounting period.
  columns:
  - name: segment_volume_id
    description: Identifier of the segment volume row. This dataset holds the complete segment-volume
      population.
  - name: segment_id
    description: Operating segment of the volume.
  - name: accounting_period_id
    description: Accounting period of the volume.
  - name: volume_units
    description: Units of segment volume. This measure is not a price.
    synonyms:
    - Construction Industries volume
    - Power & Energy volume
  - name: volume_versus_expectation
    description: How volume compared with the expectation coming into the period.
    value_description: stronger, in_line, or lighter.
  - name: excludes_power_generation_flag
    description: Whether the volume row is stated with power generation removed.
    value_description: Y or N.
