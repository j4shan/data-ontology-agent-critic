schema_version: '3'
nodes:
- node_id: sf:machinery.calendar.dim_calendar_day
  descriptor:
    qualified_name: machinery.calendar.dim_calendar_day
    display_name: Calendar day
    description: A calendar day in the Machinery Inc reporting calendar.
    tags:
    - dimension
    synonyms:
    - date
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: machinery.us-central-1
      database: MACHINERY
      schema: CALENDAR
      object: DIM_CALENDAR_DAY
      format: table
  grain:
    description: One row is one calendar day.
    components:
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
      description: One row is one calendar day.
  columns:
  - name: calendar_day_id
    description: Identifier of the calendar day. This dataset holds the complete calendar-day population.
  - name: accounting_period_id
    description: Accounting period that contains the day.
  - name: day_label
    description: Calendar date label of the day.
  entity_definitions:
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:machinery.calendar.dim_accounting_period
  descriptor:
    qualified_name: machinery.calendar.dim_accounting_period
    display_name: Accounting period
    description: A Machinery Inc accounting period, with fiscal year, quarter, and half.
    tags:
    - dimension
    synonyms:
    - quarter
    - fiscal period
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: machinery.us-central-1
      database: MACHINERY
      schema: CALENDAR
      object: DIM_ACCOUNTING_PERIOD
      format: table
  grain:
    description: One row is one accounting period.
    components:
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
      description: One row is one accounting period.
  columns:
  - name: accounting_period_id
    description: Identifier of the accounting period. This dataset holds the complete accounting-period
      population.
  - name: period_label
    description: Label of the accounting period.
  - name: fiscal_year
    description: Fiscal year of the period.
  - name: quarter_label
    description: Quarter label of the period.
    value_description: Q1, Q2, Q3, or Q4.
  - name: half_code
    description: Half of the fiscal year.
    value_description: first_half or second_half.
  entity_definitions:
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: complete
- node_id: sf:machinery.commercial.dim_currency
  descriptor:
    qualified_name: machinery.commercial.dim_currency
