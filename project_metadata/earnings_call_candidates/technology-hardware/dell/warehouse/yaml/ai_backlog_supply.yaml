  descriptor:
    qualified_name: computer.supply.fact_ai_backlog
    display_name: AI Backlog
    description: AI-server backlog by platform, when it ships, and whether capacity exists past the revenue
      target. Backlog is supply commitment, not a price.
    synonyms: []
    tags:
    - fact
    - ai
    - dell
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: computer.us-central-1
      database: COMPUTER
      schema: SUPPLY
      object: FACT_AI_BACKLOG
      format: table
  grain:
    description: One row is one ai backlog.
