schema_version: '3'
nodes:
- node_id: sf:apple.component.dim_component_class
  descriptor:
    qualified_name: apple.component.dim_component_class
    display_name: Component Class
    description: Whether a purchased commodity is memory or silicon. Apple buys both. This is not a fabrication
      class.
    synonyms: []
    tags:
    - dimension
    - supply
    - apple
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: apple.us-west-1
      database: APPLE
      schema: COMPONENT
      object: DIM_COMPONENT_CLASS
      format: table
  grain:
    description: One row is one component class.
    components:
    - identity_id: component_class_identity
      dataset_columns:
      - component_class_id
      description: Identifier of the component class.
  columns:
  - name: component_class_id
    description: Identifier of the component class.
  - name: class_name
    description: Name of the class.
  - name: class_code
    description: Class code.
    value_description: memory, silicon
  entity_definitions:
  - identity_id: component_class_identity
    dataset_columns:
    - component_class_id
    entity_universe: complete
- node_id: sf:apple.component.dim_component_commodity
  descriptor:
    qualified_name: apple.component.dim_component_commodity
    display_name: Component Commodity
    description: A purchased commodity such as DRAM, NAND, or a system-on-chip.
    synonyms:
    - commodity
    tags:
    - dimension
    - supply
    - apple
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: apple.us-west-1
