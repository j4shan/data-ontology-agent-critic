    - identity_id: component_commodity_identity
      dataset_columns:
      - component_commodity_id
      description: Identifier of the commodity.
  columns:
  - name: component_commodity_id
    description: Identifier of the commodity.
  - name: component_class_id
    description: Class of the commodity.
  - name: commodity_name
    description: Name of the commodity.
  - name: commodity_code
    description: Commodity code.
    value_description: dram, nand, soc, other_memory, other_silicon
