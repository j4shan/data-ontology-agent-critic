    description: Which component constraints are spreading or easing. This is a supply status, not a demand
      quantity and not a price.
    synonyms: []
    tags:
    - fact
    - supply
    - apple
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: apple.us-west-1
      database: APPLE
      schema: SUPPLY
      object: FACT_CONSTRAINT_SPREAD
      format: table
  grain:
    description: One row is one constraint spread.
    components:
    - identity_id: constraint_spread_identity
      dataset_columns:
      - constraint_spread_id
      description: Identifier of the constraint-spread row.
  columns:
  - name: constraint_spread_id
    description: Identifier of the constraint-spread row.
  - name: fiscal_quarter_id
    description: Fiscal quarter of the row.
  - name: component_commodity_id
    description: Commodity whose constraint is being read.
  - name: device_family_id
