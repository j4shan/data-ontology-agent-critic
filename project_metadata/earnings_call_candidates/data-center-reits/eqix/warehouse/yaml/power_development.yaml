nodes:
- node_id: sf:equinix.power.dim_campus
  descriptor:
    qualified_name: equinix.power.dim_campus
    display_name: Campus
    description: A colocation campus, including campuses such as Chicago and Manukau. A campus is not
      an office building.
    synonyms:
    - site
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: equinix.us-west-1
      database: EQUINIX
      schema: POWER
      object: DIM_CAMPUS
      format: table
  grain:
    description: One row is one campus.
    components:
    - identity_id: campus_identity
      dataset_columns:
      - campus_id
      description: Identifier of the campus.
  columns:
  - name: campus_id
    description: Identifier of the campus. This dataset holds the complete population.
  - name: metro_id
    description: Metro that contains the campus. The population is owned by its complete dataset.
  - name: campus_name
    description: Name of the campus.
  - name: campus_code
    description: Short code of the campus.
  entity_definitions:
  - identity_id: campus_identity
    dataset_columns:
    - campus_id
    entity_universe: complete
  - identity_id: metro_identity
    dataset_columns:
    - metro_id
    entity_universe: partial
