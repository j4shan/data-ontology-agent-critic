schema_version: '3'
nodes:
- node_id: sf:colocation.occupancy.dim_product_line
  descriptor:
    qualified_name: colocation.occupancy.dim_product_line
    display_name: Product Line
    description: Retail colocation, larger-footprint retail, or xScale. Not an office product.
    synonyms:
    - xscale
    - retail colocation
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: colocation.us-west-1
      database: COLOCATION
      schema: OCCUPANCY
      object: DIM_PRODUCT_LINE
      format: table
  grain:
    description: One row is one product line.
    components:
    - identity_id: product_line_identity
      dataset_columns:
      - product_line_id
      description: Identifier of the product line.
  columns:
  - name: product_line_id
    description: Identifier of the product line. This dataset holds the complete population.
  - name: product_line_name
    description: Name of the product line.
  - name: product_line_code
    description: Code of the product line.
    value_description: retail, larger_footprint_retail, or xscale.
