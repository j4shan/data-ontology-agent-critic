  - identity_id: customer_vertical_identity
    dataset_columns:
    - customer_vertical_id
    entity_universe: partial
  - identity_id: product_line_identity
    dataset_columns:
    - product_line_id
    entity_universe: partial
  - identity_id: workload_type_identity
    dataset_columns:
    - workload_type_id
    entity_universe: partial
  - identity_id: deal_band_identity
