- node_id: sf:colocation.occupancy.fact_booking
  descriptor:
    qualified_name: colocation.occupancy.fact_booking
    display_name: Booking
    description: A quarterly booking. Deal size, market, workload, and pre-lease flags sit on the booking,
      not on the lease master.
    synonyms: []
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: colocation.us-west-1
      database: COLOCATION
      schema: OCCUPANCY
      object: FACT_BOOKING
      format: table
  grain:
    description: One row is one booking.
    components:
    - identity_id: booking_identity
      dataset_columns:
      - booking_id
      description: Identifier of the booking.
  columns:
  - name: booking_id
    description: Identifier of the booking. This dataset holds the complete population.
  - name: fiscal_quarter_id
    description: Quarter the booking was signed. The population is owned by its complete dataset.
  - name: metro_id
    description: Metro of the booking. The population is owned by its complete dataset.
  - name: region_id
    description: Region of the booking. The population is owned by its complete dataset.
  - name: customer_id
    description: Customer that booked. The population is owned by its complete dataset.
  - name: customer_vertical_id
    description: Vertical of the customer on the booking. The population is owned by its complete dataset.
  - name: product_line_id
    description: Product line booked. The population is owned by its complete dataset.
  - name: workload_type_id
    description: Workload the booking is for. The population is owned by its complete dataset.
  - name: deal_band_id
    description: Size band of the booking. The population is owned by its complete dataset.
  - name: campus_id
    description: Campus booked, when a campus is named. The population is owned by its complete dataset.
  - name: ibx_id
    description: IBX booked, when an IBX is named. The population is owned by its complete dataset.
  - name: cabinet_id
    description: Cabinet booked, when the booking is a cabinet. The population is owned by its complete
      dataset.
  - name: annualized_booking_amount
    description: Annualized booking value.
  - name: deal_size_kw
    description: Kilowatts in the deal.
  - name: cabinet_count
    description: Cabinets in the deal.
  - name: term_months
    description: Term months committed on the booking.
  - name: price_per_kw_amount
    description: Price per kilowatt on the booking.
  - name: deposit_amount
    description: Deposit taken on the booking.
  - name: preleased_flag
    description: Whether the booking is pre-leased ahead of delivery.
    value_description: true or false.
  - name: seasonal_flag
    description: Whether the quarter is in the seasonal pattern used to read a bookings dip.
    value_description: true or false.
  - name: ai_booking_flag
    description: Whether the booking is an AI workload.
    value_description: true or false.
  - name: new_cabinet_flag
    description: Whether the booking uses newly delivered cabinets.
    value_description: true or false.
  - name: constrained_market_flag
    description: Whether the metro is a constrained market such as Northern Virginia or Frankfurt.
    value_description: true or false.
  - name: prior_run_rate_amount
    description: Annualized bookings run rate from the prior update, for the same market and workload.
