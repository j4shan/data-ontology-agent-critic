schema_version: '3'
nodes:
- node_id: sf:datahall.lease.dim_megawatt_band
  descriptor:
    qualified_name: datahall.lease.dim_megawatt_band
    display_name: Megawatt Band
    description: 'A deal-size band: 0 to 1 megawatt, above 1 megawatt, 2 to 3, 5 to 15, or multi-hundred.'
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: datahall.us-east-1
      database: DATA_HALL
      schema: LEASE
      object: DIM_MEGAWATT_BAND
      format: table
  grain:
    description: One row is one megawatt band.
    components:
    - identity_id: megawatt_band_identity
      dataset_columns:
      - megawatt_band_id
      description: Identifier of the megawatt band.
  columns:
  - name: megawatt_band_id
    description: Identifier of the megawatt band. This dataset holds the complete population.
  - name: band_name
    description: Name of the band.
  - name: band_code
    description: Code of the band.
    value_description: mw_0_1, mw_1_plus, mw_2_to_3, mw_5_to_15, or multi_hundred.
  entity_definitions:
  - identity_id: megawatt_band_identity
    dataset_columns:
    - megawatt_band_id
    entity_universe: complete
- node_id: sf:datahall.lease.dim_expense_line
  descriptor:
    qualified_name: datahall.lease.dim_expense_line
    display_name: Expense Line
    description: An operating-expense line. Energy is separate from the other lines that affect cash NOI.
    synonyms: []
    tags:
    - dimension
