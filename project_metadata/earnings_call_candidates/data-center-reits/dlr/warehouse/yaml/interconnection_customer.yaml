schema_version: '3'
nodes:
- node_id: sf:datahall.interconnection.dim_region
  descriptor:
    qualified_name: datahall.interconnection.dim_region
    display_name: Region
    description: Americas, EMEA, or Asia-Pacific.
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: datahall.us-east-1
      database: DATA_HALL
      schema: INTERCONNECTION
      object: DIM_REGION
      format: table
  grain:
    description: One row is one region.
    components:
    - identity_id: region_identity
      dataset_columns:
      - region_id
      description: Identifier of the region.
  columns:
  - name: region_id
    description: Identifier of the region. This dataset holds the complete population.
  - name: region_name
    description: Name of the region.
  - name: region_code
    description: Code of the region.
    value_description: americas, emea, or apac.
  entity_definitions:
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: complete
- node_id: sf:datahall.interconnection.dim_metro
  descriptor:
    qualified_name: datahall.interconnection.dim_metro
    display_name: Metro
    description: A market. Names in this population include Charlotte, Atlanta, Northern Virginia, Malaysia,
      Israel, and Portugal.
    synonyms:
    - market
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: datahall.us-east-1
      database: DATA_HALL
      schema: INTERCONNECTION
      object: DIM_METRO
      format: table
  grain:
    description: One row is one metro.
    components:
    - identity_id: metro_identity
      dataset_columns:
      - metro_id
      description: Identifier of the metro.
  columns:
  - name: metro_id
    description: Identifier of the metro. This dataset holds the complete population.
  - name: region_id
    description: Region that contains the metro. The population is owned by its complete dataset.
  - name: metro_name
    description: Name of the metro.
  - name: country_name
    description: Country of the metro, including Malaysia, Israel, and Portugal when the entry is national.
  entity_definitions:
  - identity_id: metro_identity
    dataset_columns:
    - metro_id
    entity_universe: complete
  - identity_id: region_identity
    dataset_columns:
    - region_id
    entity_universe: partial
