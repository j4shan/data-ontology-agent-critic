- node_id: sf:datahall.interconnection.dim_entry_product
  descriptor:
    qualified_name: datahall.interconnection.dim_entry_product
    display_name: Entry Product
    description: Whether a new market was entered as an interconnection site or as a hyperscale build.
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: datahall.us-east-1
      database: DATA_HALL
      schema: INTERCONNECTION
      object: DIM_ENTRY_PRODUCT
      format: table
  grain:
    description: One row is one entry product.
    components:
    - identity_id: entry_product_identity
      dataset_columns:
