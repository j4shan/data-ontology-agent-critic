- node_id: sf:datahall.interconnection.fact_interconnect_flow
  descriptor:
    qualified_name: datahall.interconnection.fact_interconnect_flow
    display_name: Interconnect Flow
    description: Interconnection that follows small-block leasing. It is not the lease and not the megawatt
      booking.
    synonyms: []
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: datahall.us-east-1
      database: DATA_HALL
      schema: INTERCONNECTION
      object: FACT_INTERCONNECT_FLOW
      format: table
  grain:
    description: One row is one interconnect flow.
    components:
    - identity_id: interconnect_flow_identity
      dataset_columns:
      - interconnect_flow_id
      description: Identifier of the interconnect flow row.
  columns:
  - name: interconnect_flow_id
    description: Identifier of the interconnect flow row. This dataset holds the complete population.
  - name: fiscal_quarter_id
    description: Quarter of the flow. The population is owned by its complete dataset.
  - name: megawatt_band_id
    description: Leasing band the flow follows, including 0 to 1 megawatt. The population is owned by
      its complete dataset.
  - name: metro_id
    description: Metro of the flow. The population is owned by its complete dataset.
  - name: customer_vertical_id
    description: Vertical the flow is attributed to. The population is owned by its complete dataset.
  - name: small_block_booked_mw
    description: Small-block megawatts the flow is compared with.
  - name: interconnect_revenue_amount
    description: Interconnection revenue.
  - name: flow_through_rate
    description: Interconnection revenue per megawatt of small-block leasing.
  entity_definitions:
  - identity_id: interconnect_flow_identity
    dataset_columns:
    - interconnect_flow_id
    entity_universe: complete
  - identity_id: fiscal_quarter_identity
    dataset_columns:
    - fiscal_quarter_id
    entity_universe: partial
  - identity_id: megawatt_band_identity
    dataset_columns:
    - megawatt_band_id
    entity_universe: partial
  - identity_id: metro_identity
    dataset_columns:
    - metro_id
    entity_universe: partial
  - identity_id: customer_vertical_identity
    dataset_columns:
    - customer_vertical_id
    entity_universe: partial
