- node_id: sf:surgicalsupply.finance.dim_gl_account
  descriptor:
    qualified_name: surgicalsupply.finance.dim_gl_account
    display_name: GL account
    description: A general-ledger account.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: FINANCE
      object: DIM_GL_ACCOUNT
      format: table
  grain:
    description: One row is one gl account.
    components:
    - identity_id: gl_account_identity
      dataset_columns:
      - gl_account_id
  columns:
  - name: gl_account_id
    description: Identifier of the gl account. This dataset holds the complete population.
  - name: account_name
    description: Name of the account.
  - name: statement_line
    description: Statement line the account rolls to.
    value_description: sales, operating_margin, cost, tariff
  entity_definitions:
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    entity_universe: complete
- node_id: sf:surgicalsupply.finance.dim_cost_element
  descriptor:
    qualified_name: surgicalsupply.finance.dim_cost_element
