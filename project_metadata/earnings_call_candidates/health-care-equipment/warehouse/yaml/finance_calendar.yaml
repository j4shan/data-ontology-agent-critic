    description: A cost element such as oil, other inflation, or tariff.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: FINANCE
      object: DIM_COST_ELEMENT
      format: table
  grain:
    description: One row is one cost element.
    components:
    - identity_id: cost_element_identity
      dataset_columns:
      - cost_element_id
  columns:
  - name: cost_element_id
    description: Identifier of the cost element. This dataset holds the complete population.
  - name: element_name
    description: Name of the cost element.
  - name: element_code
    description: Cost element code.
    value_description: oil, other_inflation, tariff, input, labor
  entity_definitions:
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: complete
- node_id: sf:surgicalsupply.finance.fact_journal_line
  descriptor:
    qualified_name: surgicalsupply.finance.fact_journal_line
    display_name: Journal line
    description: A posted ledger line for sales, cost, and margin.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: FINANCE
      object: FACT_JOURNAL_LINE
      format: table
  grain:
    description: One row is one journal line.
    components:
    - identity_id: journal_line_identity
      dataset_columns:
      - journal_line_id
  columns:
  - name: journal_line_id
    description: Identifier of the journal line. This dataset holds the complete population.
  - name: legal_entity_id
    description: Legal entity that posted the line. The complete population is not re-authored on this
      dataset.
  - name: gl_account_id
    description: Account posted. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the posting. The complete population is not re-authored on this dataset.
  - name: currency_id
    description: Currency of the amount. The complete population is not re-authored on this dataset.
  - name: cost_element_id
    description: Cost element, when the line is a cost. The complete population is not re-authored on
      this dataset.
  - name: signed_amount
    description: Signed posted amount.
  entity_definitions:
  - identity_id: journal_line_identity
    dataset_columns:
    - journal_line_id
    entity_universe: complete
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    entity_universe: partial
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
- node_id: sf:surgicalsupply.finance.fact_exchange_rate
  descriptor:
    qualified_name: surgicalsupply.finance.fact_exchange_rate
    display_name: Exchange rate
    description: A daily translation rate between two currencies.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: FINANCE
      object: FACT_EXCHANGE_RATE
      format: table
  grain:
    description: One row is one exchange rate.
    components:
    - identity_id: exchange_rate_identity
      dataset_columns:
      - exchange_rate_id
  columns:
  - name: exchange_rate_id
    description: Identifier of the exchange rate. This dataset holds the complete population.
  - name: from_currency_id
    description: Currency being translated. Same currency population, stored as a second role rather than
      a second join. The complete population is not re-authored on this dataset.
  - name: to_currency_id
    description: Currency translated into. The complete population is not re-authored on this dataset.
  - name: calendar_day_id
    description: Day of the rate. The complete population is not re-authored on this dataset.
  - name: rate_amount
    description: Translation rate.
  entity_definitions:
  - identity_id: exchange_rate_identity
    dataset_columns:
    - exchange_rate_id
    entity_universe: complete
  - identity_id: currency_identity
    dataset_columns:
    - to_currency_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
