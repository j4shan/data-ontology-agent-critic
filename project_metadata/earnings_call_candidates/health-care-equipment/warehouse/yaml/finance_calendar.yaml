  grain:
    description: One row is one currency.
    components:
    - identity_id: currency_identity
      dataset_columns:
      - currency_id
  columns:
  - name: currency_id
    description: Identifier of the currency. This dataset holds the complete population.
  - name: currency_code
    description: Currency code.
  - name: currency_name
    description: Name of the currency.
  entity_definitions:
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: complete
