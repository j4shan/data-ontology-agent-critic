schema_version: '3'
nodes:
- node_id: sf:surgicalsupply.procedure.dim_procedure_family
  descriptor:
    qualified_name: surgicalsupply.procedure.dim_procedure_family
    display_name: Procedure family
    description: A procedure family Surgical Supply Inc uses to read hospital demand, including hips, knees, shoulders,
      trauma, and vascular procedures.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: PROCEDURE
      object: DIM_PROCEDURE_FAMILY
      format: table
  grain:
    description: One row is one procedure family.
    components:
    - identity_id: procedure_family_identity
      dataset_columns:
      - procedure_family_id
  columns:
  - name: procedure_family_id
    description: Identifier of the procedure family. This dataset holds the complete population.
  - name: family_name
    description: Name of the procedure family.
  - name: family_code
    description: Procedure family code.
    value_description: hip, knee, shoulder, trauma, extremities, vascular, peripheral_vascular, endoscopy,
      spine, soft_tissue, ablation, breast, pulmonary_embolism
  entity_definitions:
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: complete
- node_id: sf:surgicalsupply.procedure.dim_procedure
  descriptor:
    qualified_name: surgicalsupply.procedure.dim_procedure
    display_name: Procedure
    description: A named procedure inside a procedure family. Every procedure family has at least one
      procedure.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: PROCEDURE
      object: DIM_PROCEDURE
      format: table
  grain:
    description: One row is one procedure.
    components:
    - identity_id: procedure_identity
      dataset_columns:
      - procedure_id
  columns:
  - name: procedure_id
    description: Identifier of the procedure. This dataset holds the complete population.
  - name: procedure_family_id
    description: Procedure family that contains the procedure. The complete population is not re-authored
      on this dataset.
  - name: procedure_name
    description: Name of the procedure.
  entity_definitions:
  - identity_id: procedure_identity
    dataset_columns:
    - procedure_id
    entity_universe: complete
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
- node_id: sf:surgicalsupply.procedure.fact_procedure_volume
  descriptor:
    qualified_name: surgicalsupply.procedure.fact_procedure_volume
    display_name: Procedure volume
    description: Hospital procedure volume by family, country, site of care, and quarter. This is device-maker
      case volume, not a claim.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: PROCEDURE
      object: FACT_PROCEDURE_VOLUME
      format: table
  grain:
    description: One row is one procedure volume.
    components:
    - identity_id: procedure_volume_identity
      dataset_columns:
      - procedure_volume_id
  columns:
  - name: procedure_volume_id
    description: Identifier of the procedure volume. This dataset holds the complete population.
  - name: hospital_id
    description: Hospital where the procedures were performed. The complete population is not re-authored
      on this dataset.
  - name: procedure_family_id
    description: Procedure family. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the volume. The complete population is not re-authored on this dataset.
  - name: site_of_care_id
    description: Site of care of the volume. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the volume. The complete population is not re-authored on this dataset.
  - name: procedure_count
    description: Procedures in the row.
  - name: stryker_case_count
    description: Procedures performed with Surgical Supply Inc products.
  - name: market_case_count
    description: Market procedure count for the same family and place.
  - name: growth_rate
    description: Surgical Supply Inc procedure growth versus the comparison period.
  - name: prior_period_growth_rate
    description: Growth rate in the prior quarter, used for harder comparisons.
  - name: deferred_case_count
    description: Procedures deferred because supply was short.
  - name: lost_case_count
    description: Procedures lost rather than deferred.
  - name: robotic_case_count
    description: Procedures performed on a Surgical Supply Inc robotic system.
  - name: robotic_penetration_rate
    description: Share of the family's procedures done robotically.
  - name: volume_driver_code
    description: What drove the volume change.
    value_description: demand, catchup, comparison, coverage, supply
  entity_definitions:
  - identity_id: procedure_volume_identity
    dataset_columns:
    - procedure_volume_id
    entity_universe: complete
  - identity_id: hospital_identity
    dataset_columns:
    - hospital_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:surgicalsupply.procedure.fact_procedure_catchup
  descriptor:
    qualified_name: surgicalsupply.procedure.fact_procedure_catchup
    display_name: Procedure catch-up
    description: Delayed procedure demand from an earlier quarter and how much of it returns in a later
      quarter.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: PROCEDURE
      object: FACT_PROCEDURE_CATCHUP
      format: table
  grain:
    description: One row is one procedure catch-up.
    components:
    - identity_id: procedure_catchup_identity
      dataset_columns:
      - procedure_catchup_id
  columns:
  - name: procedure_catchup_id
    description: Identifier of the procedure catch-up. This dataset holds the complete population.
  - name: procedure_family_id
    description: Procedure family of the delayed demand. The complete population is not re-authored on
      this dataset.
  - name: country_id
    description: Country of the delayed demand. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter in which catch-up is recognized. The complete population is not re-authored on
      this dataset.
  - name: source_accounting_period_id
    description: Quarter the demand was originally delayed from. Same population as the accounting period,
      stored as a second role rather than a second join. The complete population is not re-authored on
      this dataset.
  - name: delayed_case_count
    description: Cases delayed out of the source quarter.
  - name: recovered_case_count
    description: Cases recovered in the recognition quarter.
  - name: still_ahead_case_count
    description: Cases still expected in a later quarter.
  entity_definitions:
  - identity_id: procedure_catchup_identity
    dataset_columns:
    - procedure_catchup_id
    entity_universe: complete
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:surgicalsupply.procedure.fact_site_of_care_mix
  descriptor:
    qualified_name: surgicalsupply.procedure.fact_site_of_care_mix
    display_name: Site of care mix
    description: Share of a procedure family performed in each site of care, including ambulatory surgery
      centers.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: PROCEDURE
      object: FACT_SITE_OF_CARE_MIX
      format: table
  grain:
    description: One row is one site of care mix.
    components:
    - identity_id: site_of_care_mix_identity
      dataset_columns:
      - site_of_care_mix_id
  columns:
  - name: site_of_care_mix_id
    description: Identifier of the site of care mix. This dataset holds the complete population.
  - name: procedure_family_id
    description: Procedure family being mixed. The complete population is not re-authored on this dataset.
  - name: site_of_care_id
    description: Site of care. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the mix. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the mix. The complete population is not re-authored on this dataset.
  - name: procedure_share_rate
    description: Share of the family performed in this site of care.
  - name: procedure_count
    description: Procedures in this site of care.
  - name: category_shift_code
    description: Why the mix is moving.
    value_description: asc_orthopedics, ablation_to_asc, inpatient_only_exit, endoscopy_outpatient, none
  - name: share_change_rate
    description: Change in site-of-care share versus the prior period.
  entity_definitions:
  - identity_id: site_of_care_mix_identity
    dataset_columns:
    - site_of_care_mix_id
    entity_universe: complete
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:surgicalsupply.procedure.fact_procedure_market
  descriptor:
    qualified_name: surgicalsupply.procedure.fact_procedure_market
    display_name: Procedure market
    description: Market health and Surgical Supply Inc growth for a procedure family, including comparison difficulty.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: PROCEDURE
      object: FACT_PROCEDURE_MARKET
      format: table
  grain:
    description: One row is one procedure market.
    components:
    - identity_id: procedure_market_identity
      dataset_columns:
      - procedure_market_id
  columns:
  - name: procedure_market_id
    description: Identifier of the procedure market. This dataset holds the complete population.
  - name: procedure_family_id
    description: Procedure family. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the market read. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the market read. The complete population is not re-authored on this dataset.
  - name: market_growth_rate
    description: Market procedure growth.
  - name: stryker_growth_rate
    description: Surgical Supply Inc growth in the same family and country.
  - name: market_health_code
    description: Qualitative health of the procedure market.
    value_description: healthy, softer, pressured
  - name: comparison_difficulty_flag
    description: 1 when the growth rate faces a harder prior-period comparison.
  - name: early_placement_demand_count
    description: Procedure demand implied by early capital placements.
  entity_definitions:
  - identity_id: procedure_market_identity
    dataset_columns:
    - procedure_market_id
    entity_universe: complete
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
