schema_version: '3'
nodes:
- node_id: sf:surgicalsupply.reimbursement.dim_reimbursement_scheme
  descriptor:
    qualified_name: surgicalsupply.reimbursement.dim_reimbursement_scheme
    display_name: Reimbursement scheme
    description: A payment context Surgical Supply Inc watches because it changes hospital and physician economics.
      This is not a payer remittance ledger.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: REIMBURSEMENT
      object: DIM_REIMBURSEMENT_SCHEME
      format: table
  grain:
    description: One row is one reimbursement scheme.
    components:
    - identity_id: reimbursement_scheme_identity
      dataset_columns:
      - reimbursement_scheme_id
  columns:
  - name: reimbursement_scheme_id
    description: Identifier of the reimbursement scheme. This dataset holds the complete population.
  - name: country_id
    description: Country of the scheme. The complete population is not re-authored on this dataset.
  - name: scheme_name
    description: Name of the scheme.
  - name: scheme_code
    description: Scheme code.
    value_description: medicare_physician, medicaid, commercial, exchange
  entity_definitions:
  - identity_id: reimbursement_scheme_identity
    dataset_columns:
    - reimbursement_scheme_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
- node_id: sf:surgicalsupply.reimbursement.dim_reimbursement_code
  descriptor:
    qualified_name: surgicalsupply.reimbursement.dim_reimbursement_code
    display_name: Reimbursement code
    description: A physician-payment code for a procedure family. Every scheme has at least one code.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: REIMBURSEMENT
      object: DIM_REIMBURSEMENT_CODE
      format: table
  grain:
    description: One row is one reimbursement code.
    components:
    - identity_id: reimbursement_code_identity
      dataset_columns:
      - reimbursement_code_id
  columns:
  - name: reimbursement_code_id
    description: Identifier of the reimbursement code. This dataset holds the complete population.
  - name: reimbursement_scheme_id
    description: Scheme that defines the code. The complete population is not re-authored on this dataset.
  - name: procedure_family_id
    description: Procedure family the code pays for. The complete population is not re-authored on this
      dataset.
  - name: code_label
    description: Label of the code.
  - name: family_focus_code
    description: Procedure focus.
    value_description: hip, knee, shoulder
  entity_definitions:
  - identity_id: reimbursement_code_identity
    dataset_columns:
    - reimbursement_code_id
    entity_universe: complete
  - identity_id: reimbursement_scheme_identity
    dataset_columns:
    - reimbursement_scheme_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
- node_id: sf:surgicalsupply.reimbursement.fact_payment_change
  descriptor:
    qualified_name: surgicalsupply.reimbursement.fact_payment_change
    display_name: Payment change
    description: A change in physician payment, including the Medicare cut for hip, knee, and shoulder,
      and the procedure and price response.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: REIMBURSEMENT
      object: FACT_PAYMENT_CHANGE
      format: table
  grain:
    description: One row is one payment change.
    components:
    - identity_id: payment_change_identity
      dataset_columns:
      - payment_change_id
  columns:
  - name: payment_change_id
    description: Identifier of the payment change. This dataset holds the complete population.
  - name: reimbursement_code_id
    description: Code whose payment changed. The complete population is not re-authored on this dataset.
  - name: reimbursement_scheme_id
    description: Scheme of the change. The complete population is not re-authored on this dataset.
  - name: procedure_family_id
    description: Procedure family affected. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the payment change. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the change. The complete population is not re-authored on this dataset.
  - name: payment_change_amount
    description: Change in payment amount.
  - name: payment_change_rate
    description: Payment change as a rate, negative for a cut.
  - name: procedure_volume_response
    description: Procedure volume response Surgical Supply Inc observes.
  - name: price_response_amount
    description: Device price response alongside the payment cut.
  - name: industry_response_code
    description: How the orthopedic industry is responding.
    value_description: absorbing, repricing, volume_shift, unclear
  entity_definitions:
  - identity_id: payment_change_identity
    dataset_columns:
    - payment_change_id
    entity_universe: complete
  - identity_id: reimbursement_code_identity
    dataset_columns:
    - reimbursement_code_id
    entity_universe: partial
  - identity_id: reimbursement_scheme_identity
    dataset_columns:
    - reimbursement_scheme_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
