schema_version: '3'
nodes:
- node_id: sf:surgicalsupply.commercial.dim_sales_force
  descriptor:
    qualified_name: surgicalsupply.commercial.dim_sales_force
    display_name: Sales force
    description: A Surgical Supply Inc selling team, including the Inari team, a specialized breast-care team, and
      franchise representatives.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: COMMERCIAL
      object: DIM_SALES_FORCE
      format: table
  grain:
    description: One row is one sales force.
    components:
    - identity_id: sales_force_identity
      dataset_columns:
      - sales_force_id
  columns:
  - name: sales_force_id
    description: Identifier of the sales force. This dataset holds the complete population.
  - name: product_franchise_id
    description: Franchise the team sells. The complete population is not re-authored on this dataset.
  - name: sales_force_name
    description: Name of the sales force.
  - name: sales_force_code
    description: Sales force code.
    value_description: inari, breast_care, orthopedics, medsurg, vascular, endoscopy
  entity_definitions:
  - identity_id: sales_force_identity
    dataset_columns:
    - sales_force_id
    entity_universe: complete
  - identity_id: product_franchise_identity
    dataset_columns:
    - product_franchise_id
    entity_universe: partial
