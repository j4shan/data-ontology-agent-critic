schema_version: '3'
nodes:
- node_id: sf:stryker.product.dim_product_franchise
  descriptor:
    qualified_name: stryker.product.dim_product_franchise
    display_name: Product franchise
    description: A Stryker franchise such as Mako, Inari, endoscopy, MedSurg, or orthopedics.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: PRODUCT
      object: DIM_PRODUCT_FRANCHISE
      format: table
  grain:
    description: One row is one product franchise.
    components:
    - identity_id: product_franchise_identity
      dataset_columns:
      - product_franchise_id
  columns:
  - name: product_franchise_id
    description: Identifier of the product franchise. This dataset holds the complete population.
  - name: franchise_name
    description: Name of the franchise.
  - name: franchise_code
    description: Franchise code.
    value_description: mako, inari, endoscopy, instruments, trauma_extremities, vascular, peripheral_vascular,
      pangaea, lifepak, smartcare, vocera, amplitude, interventional_spine, optiblade, soft_tissue_robotics,
      intravascular_lithotripsy, medsurg, orthopedics, medical, hips, knees, shoulders, breast_care
  - name: franchise_group
    description: Reporting group of the franchise.
    value_description: medsurg, orthopedics, vascular, medical, capital
  entity_definitions:
  - identity_id: product_franchise_identity
    dataset_columns:
    - product_franchise_id
    entity_universe: complete
- node_id: sf:stryker.product.dim_product
  descriptor:
    qualified_name: stryker.product.dim_product
    display_name: Product
    description: A sellable Stryker product inside a franchise. Every franchise has at least one product.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: PRODUCT
      object: DIM_PRODUCT
      format: table
  grain:
    description: One row is one product.
    components:
    - identity_id: product_identity
      dataset_columns:
      - product_id
  columns:
  - name: product_id
    description: Identifier of the product. This dataset holds the complete population.
  - name: product_franchise_id
    description: Franchise that contains the product. The complete population is not re-authored on this
      dataset.
  - name: product_name
    description: Name of the product.
  - name: product_code
    description: Product code.
  - name: product_class
    description: Class of the product.
    value_description: capital_system, implant, instrument, disposable, communication, imaging
  - name: launch_year
    description: Year the product launched or is expected to launch.
  - name: cycle_stage
    description: Whether the product cycle is still incremental or already mature.
    value_description: incremental, mature
  entity_definitions:
  - identity_id: product_identity
    dataset_columns:
    - product_id
    entity_universe: complete
  - identity_id: product_franchise_identity
    dataset_columns:
    - product_franchise_id
    entity_universe: partial
- node_id: sf:stryker.capital.dim_capital_system
  descriptor:
    qualified_name: stryker.capital.dim_capital_system
    display_name: Capital system
    description: A capital system such as Mako, Mako 4, the handheld robot, or the new robotics platform.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: DIM_CAPITAL_SYSTEM
      format: table
  grain:
    description: One row is one capital system.
    components:
    - identity_id: capital_system_identity
      dataset_columns:
      - capital_system_id
  columns:
  - name: capital_system_id
    description: Identifier of the capital system. This dataset holds the complete population.
  - name: product_franchise_id
    description: Franchise of the capital system. The complete population is not re-authored on this dataset.
  - name: system_name
    description: Name of the capital system.
  - name: system_code
    description: System code.
    value_description: mako, mako_4, handheld, new_robotics_platform, soft_tissue, prior_mako
  - name: imaging_mode
    description: Imaging the system uses.
    value_description: xray, ct, not_applicable
  - name: form_factor
    description: Physical form of the system.
    value_description: console, handheld, single_platform
  entity_definitions:
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: complete
  - identity_id: product_franchise_identity
    dataset_columns:
    - product_franchise_id
    entity_universe: partial
- node_id: sf:stryker.capital.dim_installed_system
  descriptor:
    qualified_name: stryker.capital.dim_installed_system
    display_name: Installed system
    description: A capital system currently placed at a hospital site. Accounts without a robot have no
      installed row.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: DIM_INSTALLED_SYSTEM
      format: table
  grain:
    description: One row is one installed system.
    components:
    - identity_id: installed_system_identity
      dataset_columns:
      - installed_system_id
  columns:
  - name: installed_system_id
    description: Identifier of the installed system. This dataset holds the complete population.
  - name: capital_system_id
    description: Capital system that was placed. The complete population is not re-authored on this dataset.
  - name: hospital_id
    description: Hospital that holds the system. The complete population is not re-authored on this dataset.
  - name: hospital_site_id
    description: Site that holds the system. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the placement. The complete population is not re-authored on this dataset.
  - name: site_of_care_id
    description: Site of care of the placement. The complete population is not re-authored on this dataset.
  - name: installed_flag
    description: 1 when the system is currently installed.
  - name: greenfield_account_flag
    description: 1 when this is the account's first robot.
  entity_definitions:
  - identity_id: installed_system_identity
    dataset_columns:
    - installed_system_id
    entity_universe: complete
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: partial
  - identity_id: hospital_identity
    dataset_columns:
    - hospital_id
    entity_universe: partial
  - identity_id: hospital_site_identity
    dataset_columns:
    - hospital_site_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
- node_id: sf:stryker.capital.fact_capital_placement
  descriptor:
    qualified_name: stryker.capital.fact_capital_placement
    display_name: Capital placement
    description: Systems placed in a quarter, including greenfield accounts, upgrades, and surgery-center
      versus hospital mix.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: FACT_CAPITAL_PLACEMENT
      format: table
  grain:
    description: One row is one capital placement.
    components:
    - identity_id: capital_placement_identity
      dataset_columns:
      - capital_placement_id
  columns:
  - name: capital_placement_id
    description: Identifier of the capital placement. This dataset holds the complete population.
  - name: capital_system_id
    description: System placed. The complete population is not re-authored on this dataset.
  - name: hospital_id
    description: Hospital that took the placement. The complete population is not re-authored on this
      dataset.
  - name: hospital_site_id
    description: Site of the placement. The complete population is not re-authored on this dataset.
  - name: site_of_care_id
    description: Site of care of the placement. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the placement. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the placement. The complete population is not re-authored on this dataset.
  - name: procedure_family_id
    description: Application the placement was sold for. The complete population is not re-authored on
      this dataset.
  - name: placement_count
    description: Systems placed.
  - name: greenfield_flag
    description: 1 when the account did not already have this system.
  - name: upgrade_flag
    description: 1 when the placement upgrades an installed system.
  - name: asc_placement_count
    description: Placements into ambulatory surgery centers.
  - name: hospital_placement_count
    description: Placements into hospitals.
  - name: application_code
    description: Application driving the placement.
    value_description: shoulder, spine, hip, knee, multi
  - name: attach_to_installed_base_flag
    description: 1 when the system attaches to an existing Mako base.
  - name: independent_placement_flag
    description: 1 when the system is placed on its own, not as an add-on.
  entity_definitions:
  - identity_id: capital_placement_identity
    dataset_columns:
    - capital_placement_id
    entity_universe: complete
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: partial
  - identity_id: hospital_identity
    dataset_columns:
    - hospital_id
    entity_universe: partial
  - identity_id: hospital_site_identity
    dataset_columns:
    - hospital_site_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
- node_id: sf:stryker.capital.fact_system_price
  descriptor:
    qualified_name: stryker.capital.fact_system_price
    display_name: System price
    description: List price of a capital system versus the prior system, and upgrade fees for added applications.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: FACT_SYSTEM_PRICE
      format: table
  grain:
    description: One row is one system price.
    components:
    - identity_id: system_price_identity
      dataset_columns:
      - system_price_id
  columns:
  - name: system_price_id
    description: Identifier of the system price. This dataset holds the complete population.
  - name: capital_system_id
    description: System being priced. The complete population is not re-authored on this dataset.
  - name: prior_capital_system_id
    description: Prior system the price is compared with. Same capital-system population, stored as a
      second role rather than a second join. The complete population is not re-authored on this dataset.
  - name: procedure_family_id
    description: Application the upgrade fee adds, such as shoulder or spine. The complete population
      is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter the price is in effect. The complete population is not re-authored on this dataset.
  - name: currency_id
    description: Currency of the price. The complete population is not re-authored on this dataset.
  - name: system_price_amount
    description: Price of the system.
  - name: prior_system_price_amount
    description: Price of the prior system.
  - name: upgrade_fee_amount
    description: Fee to add an application to the installed system.
  - name: higher_price_flag
    description: 1 when this system is priced above the prior system.
  entity_definitions:
  - identity_id: system_price_identity
    dataset_columns:
    - system_price_id
    entity_universe: complete
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:stryker.capital.fact_mako_utilization
  descriptor:
    qualified_name: stryker.capital.fact_mako_utilization
    display_name: System utilization
    description: Utilization of an installed system and the share of knee or hip procedures done on that
      system.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: FACT_MAKO_UTILIZATION
      format: table
  grain:
    description: One row is one system utilization.
    components:
    - identity_id: system_utilization_identity
      dataset_columns:
