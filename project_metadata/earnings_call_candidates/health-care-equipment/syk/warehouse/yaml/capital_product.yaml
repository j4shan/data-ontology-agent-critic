  columns:
  - name: system_utilization_id
    description: Identifier of the system utilization. This dataset holds the complete population.
  - name: installed_system_id
    description: Installed system. The complete population is not re-authored on this dataset.
  - name: procedure_family_id
    description: Procedure family measured on the system. The complete population is not re-authored on
      this dataset.
  - name: country_id
    description: Country of the system. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the utilization. The complete population is not re-authored on this dataset.
  - name: utilization_rate
    description: Utilization of the installed system.
  - name: procedure_share_on_system
    description: Share of the family's procedures done on this system.
  - name: adoption_driver_code
    description: What is pushing utilization.
    value_description: shoulder, spine, hip, knee, other
  entity_definitions:
  - identity_id: system_utilization_identity
    dataset_columns:
    - system_utilization_id
    entity_universe: complete
  - identity_id: installed_system_identity
    dataset_columns:
    - installed_system_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:stryker.capital.fact_robotics_portfolio
  descriptor:
    qualified_name: stryker.capital.fact_robotics_portfolio
    display_name: Robotics portfolio
    description: 'How a capital system fits the robotics portfolio: imaging choice, form factor, single-platform
      strategy, and autonomy.'
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: FACT_ROBOTICS_PORTFOLIO
      format: table
  grain:
    description: One row is one robotics portfolio.
    components:
    - identity_id: robotics_portfolio_identity
      dataset_columns:
      - robotics_portfolio_id
  columns:
  - name: robotics_portfolio_id
    description: Identifier of the robotics portfolio. This dataset holds the complete population.
  - name: capital_system_id
    description: System being positioned. The complete population is not re-authored on this dataset.
  - name: related_capital_system_id
    description: Other system it is compared with, such as Mako 4 versus the handheld robot. Same capital-system
      population, stored as a second role rather than a second join. The complete population is not re-authored
      on this dataset.
  - name: accounting_period_id
    description: Quarter of the portfolio read. The complete population is not re-authored on this dataset.
  - name: imaging_choice_code
    description: Imaging choice versus the installed base.
    value_description: xray, ct
  - name: form_factor_code
    description: Form factor in the portfolio.
    value_description: console, handheld, single_platform
  - name: single_platform_strategy_flag
    description: 1 when the commercial strategy stays on one robot platform.
  - name: autonomy_expectation_code
    description: Expected surgeon adoption of fully autonomous robotics.
    value_description: low, mixed, high
  - name: surgeon_preference_code
    description: Whether surgeons are asking for another form factor.
    value_description: current_platform, other_form_factor
  - name: portfolio_role_code
    description: Role of the system next to Mako.
    value_description: add_on, independent, upgrade
  entity_definitions:
  - identity_id: robotics_portfolio_identity
    dataset_columns:
    - robotics_portfolio_id
    entity_universe: complete
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:stryker.capital.fact_international_system
  descriptor:
    qualified_name: stryker.capital.fact_international_system
    display_name: International system ramp
    description: International adoption of a capital system compared with the earlier United States ramp,
      including spine and shoulder outside the United States.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: stryker.us-east-1
      database: STRYKER
      schema: CAPITAL
      object: FACT_INTERNATIONAL_SYSTEM
      format: table
  grain:
    description: One row is one international system ramp.
    components:
    - identity_id: international_system_identity
      dataset_columns:
      - international_system_id
  columns:
  - name: international_system_id
    description: Identifier of the international system ramp. This dataset holds the complete population.
  - name: capital_system_id
    description: System whose ramp is compared. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the international ramp. The complete population is not re-authored on this
      dataset.
  - name: procedure_family_id
    description: Application, such as spine or shoulder. The complete population is not re-authored on
      this dataset.
  - name: accounting_period_id
    description: Quarter of the comparison. The complete population is not re-authored on this dataset.
  - name: us_launch_calendar_day_id
    description: Day the United States launch started. The complete population is not re-authored on this
      dataset.
  - name: us_ramp_rate
    description: Adoption pace observed in the United States.
  - name: international_ramp_rate
    description: Adoption pace in this country.
  - name: structural_constraint_flag
    description: 1 when something structural makes the international ramp differ.
  - name: commercial_path_status
    description: Where the international commercial path stands.
    value_description: not_started, in_registration, selling
  - name: international_available_flag
    description: 1 when the application is commercially available in this country.
  entity_definitions:
  - identity_id: international_system_identity
    dataset_columns:
    - international_system_id
    entity_universe: complete
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: procedure_family_identity
    dataset_columns:
    - procedure_family_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - us_launch_calendar_day_id
    entity_universe: partial
