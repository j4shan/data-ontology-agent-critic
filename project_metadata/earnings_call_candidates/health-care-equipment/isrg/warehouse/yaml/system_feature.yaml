    components:
    - identity_id: regulatory_clearance_identity
      dataset_columns:
      - regulatory_clearance_id
  columns:
  - name: regulatory_clearance_id
    description: Identifier of the regulatory clearance. This dataset holds the complete population.
  - name: system_generation_id
    description: Generation the clearance covers. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the clearance. The complete population is not re-authored on this dataset.
  - name: clearance_name
    description: Name of the clearance.
  - name: clearance_status_code
    description: Status.
    value_description: pending, granted
  entity_definitions:
  - identity_id: regulatory_clearance_identity
    dataset_columns:
