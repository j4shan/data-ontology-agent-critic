schema_version: '3'
nodes:
- node_id: sf:surgicalrobot.system.fact_feature_hardware
  descriptor:
    qualified_name: surgicalrobot.system.fact_feature_hardware
    display_name: Feature hardware
    description: Whether a feature, including advanced imaging, uses the installed hardware or needs new
      hardware.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: FACT_FEATURE_HARDWARE
      format: table
  grain:
    description: One row is one feature hardware.
    components:
    - identity_id: feature_hardware_identity
      dataset_columns:
      - feature_hardware_id
  columns:
  - name: feature_hardware_id
    description: Identifier of the feature hardware. This dataset holds the complete population.
  - name: system_feature_id
    description: Feature. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: Generation the feature is judged against. The complete population is not re-authored
      on this dataset.
  - name: hardware_requirement_code
    description: What the feature needs.
    value_description: existing_hardware, new_hardware
  - name: installed_base_compatible_flag
    description: 1 when the current installed base can take the feature.
  entity_definitions:
  - identity_id: feature_hardware_identity
    dataset_columns:
    - feature_hardware_id
    entity_universe: complete
  - identity_id: system_feature_identity
    dataset_columns:
    - system_feature_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
- node_id: sf:surgicalrobot.system.fact_feature_adoption
  descriptor:
    qualified_name: surgicalrobot.system.fact_feature_adoption
    display_name: Feature adoption
    description: Adoption of a feature, including hub, cloud accounts, and force feedback, against system
      utilization and procedure category.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: FACT_FEATURE_ADOPTION
      format: table
  grain:
    description: One row is one feature adoption.
    components:
    - identity_id: feature_adoption_identity
      dataset_columns:
      - feature_adoption_id
  columns:
  - name: feature_adoption_id
    description: Identifier of the feature adoption. This dataset holds the complete population.
  - name: system_feature_id
    description: Feature. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: Generation the feature runs on. The complete population is not re-authored on this dataset.
  - name: procedure_category_id
    description: Category that benefits, when the feature is procedure-specific. The complete population
      is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the adoption. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the adoption. The complete population is not re-authored on this dataset.
  - name: adoption_rate
    description: Share of eligible systems using the feature.
  - name: utilization_rate
    description: Utilization of systems using the feature.
  - name: benefit_rank
    description: Where the category ranks among those that benefit.
  - name: broad_launch_flag
    description: 1 when the feature arrives with the broader launch.
  - name: limited_release_flag
    description: 1 when the feature is still in a limited release.
  entity_definitions:
  - identity_id: feature_adoption_identity
    dataset_columns:
    - feature_adoption_id
    entity_universe: complete
  - identity_id: system_feature_identity
    dataset_columns:
    - system_feature_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
- node_id: sf:surgicalrobot.system.fact_subscription_attach
  descriptor:
    qualified_name: surgicalrobot.system.fact_subscription_attach
    display_name: Subscription attach
    description: Digital subscription attach on da Vinci 5 and the adoption and revenue it adds.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: FACT_SUBSCRIPTION_ATTACH
      format: table
  grain:
    description: One row is one subscription attach.
    components:
    - identity_id: subscription_attach_identity
      dataset_columns:
      - subscription_attach_id
  columns:
  - name: subscription_attach_id
    description: Identifier of the subscription attach. This dataset holds the complete population.
  - name: system_feature_id
    description: Digital subscription feature. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: Generation, typically da Vinci 5. The complete population is not re-authored on this
      dataset.
  - name: accounting_period_id
    description: Quarter of the attach. The complete population is not re-authored on this dataset.
  - name: attach_rate
    description: Share of systems taking the subscription.
  - name: adoption_lift_rate
    description: Adoption lift associated with the subscription.
  - name: subscription_revenue_amount
    description: Revenue from the subscription.
  entity_definitions:
  - identity_id: subscription_attach_identity
    dataset_columns:
    - subscription_attach_id
    entity_universe: complete
  - identity_id: system_feature_identity
    dataset_columns:
    - system_feature_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:surgicalrobot.system.fact_digital_roadmap
  descriptor:
    qualified_name: surgicalrobot.system.fact_digital_roadmap
    display_name: Digital roadmap
    description: How digital infrastructure, augmented dexterity, and biopsy work change the path versus
      the current system and procedure mix.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: FACT_DIGITAL_ROADMAP
      format: table
  grain:
    description: One row is one digital roadmap.
    components:
    - identity_id: digital_roadmap_identity
      dataset_columns:
      - digital_roadmap_id
  columns:
  - name: digital_roadmap_id
    description: Identifier of the digital roadmap. This dataset holds the complete population.
  - name: system_feature_id
    description: Capability on the roadmap. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: Current or next system the capability lands on. The complete population is not re-authored
      on this dataset.
  - name: procedure_category_id
    description: Procedure mix the capability changes. The complete population is not re-authored on this
      dataset.
  - name: roadmap_status_code
    description: Where the capability sits.
    value_description: current, in_development, launched
  - name: changes_procedure_mix_flag
    description: 1 when the capability changes which procedures are done.
  - name: changes_system_path_flag
    description: 1 when the capability changes the system roadmap.
  entity_definitions:
  - identity_id: digital_roadmap_identity
    dataset_columns:
    - digital_roadmap_id
    entity_universe: complete
  - identity_id: system_feature_identity
    dataset_columns:
    - system_feature_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
- node_id: sf:surgicalrobot.system.fact_force_feedback
  descriptor:
    qualified_name: surgicalrobot.system.fact_force_feedback
    display_name: Force feedback rollout
    description: Where force-feedback evaluations and manufacturing capacity stand, and whether instruments
      per procedure are already changing.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: FACT_FORCE_FEEDBACK
      format: table
  grain:
    description: One row is one force feedback rollout.
    components:
    - identity_id: force_feedback_identity
      dataset_columns:
      - force_feedback_id
  columns:
  - name: force_feedback_id
    description: Identifier of the force feedback rollout. This dataset holds the complete population.
  - name: system_feature_id
    description: Force-feedback feature. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: Generation carrying force feedback. The complete population is not re-authored on this
      dataset.
  - name: accounting_period_id
    description: Quarter of the rollout. The complete population is not re-authored on this dataset.
  - name: manufacturing_facility_id
    description: Facility whose capacity supports the rollout. The complete population is not re-authored
      on this dataset.
  - name: evaluation_status_code
    description: Stage of evaluation.
    value_description: evaluation, limited, broad
  - name: capacity_available_flag
    description: 1 when capacity can support the rollout.
  - name: instruments_per_procedure
    description: Instruments and accessories used per procedure.
  - name: instruments_per_procedure_change
    description: Change in instruments per procedure versus the prior period.
  entity_definitions:
  - identity_id: force_feedback_identity
    dataset_columns:
    - force_feedback_id
    entity_universe: complete
  - identity_id: system_feature_identity
    dataset_columns:
    - system_feature_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: manufacturing_facility_identity
    dataset_columns:
    - manufacturing_facility_id
    entity_universe: partial
- node_id: sf:surgicalrobot.system.dim_regulatory_clearance
  descriptor:
    qualified_name: surgicalrobot.system.dim_regulatory_clearance
    display_name: Regulatory clearance
    description: A clearance Surgical Robot Inc needs before a generation or instrument can be sold in a country.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: DIM_REGULATORY_CLEARANCE
      format: table
  grain:
