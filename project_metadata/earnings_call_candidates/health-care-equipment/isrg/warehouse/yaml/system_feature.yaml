    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
- node_id: sf:surgicalrobot.system.fact_clearance_milestone
  descriptor:
    qualified_name: surgicalrobot.system.fact_clearance_milestone
    display_name: Clearance milestone
    description: Procedure clearances still required before single-port adoption accelerates, and Europe
      or Japan approvals that open placements.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: SYSTEM
      object: FACT_CLEARANCE_MILESTONE
      format: table
  grain:
    description: One row is one clearance milestone.
    components:
    - identity_id: clearance_milestone_identity
      dataset_columns:
      - clearance_milestone_id
  columns:
  - name: clearance_milestone_id
    description: Identifier of the clearance milestone. This dataset holds the complete population.
  - name: regulatory_clearance_id
    description: Clearance. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: Generation, including single-port. The complete population is not re-authored on this
      dataset.
  - name: procedure_category_id
    description: Procedure the clearance covers. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country, including Europe or Japan. The complete population is not re-authored on this
      dataset.
  - name: expected_calendar_day_id
    description: Expected day of the clearance. The complete population is not re-authored on this dataset.
  - name: required_before_adoption_flag
    description: 1 when adoption waits on this clearance.
  - name: granted_flag
    description: 1 when the clearance has been granted.
  - name: adoption_effect_code
    description: How the clearance changes adoption.
    value_description: blocked, unlocks, no_change
  entity_definitions:
  - identity_id: clearance_milestone_identity
    dataset_columns:
    - clearance_milestone_id
    entity_universe: complete
  - identity_id: regulatory_clearance_identity
    dataset_columns:
    - regulatory_clearance_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - expected_calendar_day_id
    entity_universe: partial
