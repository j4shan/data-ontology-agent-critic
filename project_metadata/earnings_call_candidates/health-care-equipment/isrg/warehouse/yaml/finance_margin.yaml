- node_id: sf:intuitive.finance.fact_generation_margin
  descriptor:
    qualified_name: intuitive.finance.fact_generation_margin
    display_name: Generation margin
    description: da Vinci 5 contribution margin compared with Xi. The comparison generation is a second
      role of the same population.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: FINANCE
      object: FACT_GENERATION_MARGIN
      format: table
  grain:
    description: One row is one generation margin.
    components:
    - identity_id: generation_margin_identity
      dataset_columns:
      - generation_margin_id
  columns:
  - name: generation_margin_id
    description: Identifier of the generation margin. This dataset holds the complete population.
  - name: system_generation_id
    description: Generation whose contribution margin is measured. The complete population is not re-authored
      on this dataset.
  - name: compared_system_generation_id
    description: Generation it is compared with, typically Xi. Same population, stored as a second role
      rather than a second join. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the comparison. The complete population is not re-authored on this dataset.
  - name: contribution_margin_rate
    description: Contribution margin of this generation.
  - name: compared_contribution_margin_rate
    description: Contribution margin of the comparison generation.
  - name: mix_share_rate
    description: Share of system mix that is this generation.
  entity_definitions:
  - identity_id: generation_margin_identity
    dataset_columns:
    - generation_margin_id
    entity_universe: complete
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
