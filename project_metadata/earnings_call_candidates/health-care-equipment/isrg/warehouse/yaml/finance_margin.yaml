schema_version: '3'
nodes:
- node_id: sf:intuitive.finance.fact_gross_margin
  descriptor:
    qualified_name: intuitive.finance.fact_gross_margin
    display_name: Gross margin
    description: Gross margin for a quarter.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: FINANCE
      object: FACT_GROSS_MARGIN
      format: table
  grain:
    description: One row is one gross margin.
    components:
    - identity_id: gross_margin_identity
      dataset_columns:
      - gross_margin_id
  columns:
  - name: gross_margin_id
    description: Identifier of the gross margin. This dataset holds the complete population.
  - name: accounting_period_id
    description: Quarter of the margin. The complete population is not re-authored on this dataset.
  - name: currency_id
    description: Currency of the amount. The complete population is not re-authored on this dataset.
  - name: legal_entity_id
    description: Legal entity. The complete population is not re-authored on this dataset.
  - name: gross_margin_rate
    description: Gross margin rate.
  - name: gross_margin_amount
    description: Gross margin amount.
  - name: one_time_flag
    description: 1 when part of the margin is a one-time item.
  entity_definitions:
  - identity_id: gross_margin_identity
    dataset_columns:
    - gross_margin_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    entity_universe: partial
