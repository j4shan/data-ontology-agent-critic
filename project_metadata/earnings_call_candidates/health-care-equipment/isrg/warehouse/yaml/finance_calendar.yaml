schema_version: '3'
nodes:
- node_id: sf:surgicalrobot.calendar.dim_accounting_period
  descriptor:
    qualified_name: surgicalrobot.calendar.dim_accounting_period
    display_name: Accounting period
    description: An Surgical Robot Inc fiscal quarter.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: CALENDAR
      object: DIM_ACCOUNTING_PERIOD
      format: table
  grain:
    description: One row is one accounting period.
    components:
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: accounting_period_id
    description: Identifier of the accounting period. This dataset holds the complete population.
  - name: period_label
    description: Label of the quarter.
  - name: fiscal_year
    description: Fiscal year.
  - name: fiscal_quarter
    description: Fiscal quarter number.
  entity_definitions:
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: complete
- node_id: sf:surgicalrobot.calendar.dim_calendar_day
  descriptor:
    qualified_name: surgicalrobot.calendar.dim_calendar_day
    display_name: Calendar day
    description: A calendar day for clearance dates. Every day belongs to one quarter, and every quarter
      has at least one day.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: CALENDAR
      object: DIM_CALENDAR_DAY
      format: table
  grain:
    description: One row is one calendar day.
    components:
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
  columns:
  - name: calendar_day_id
    description: Identifier of the calendar day. This dataset holds the complete population.
  - name: accounting_period_id
    description: Quarter that contains the day. The complete population is not re-authored on this dataset.
  - name: calendar_date
    description: Civil date of the day.
  entity_definitions:
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
