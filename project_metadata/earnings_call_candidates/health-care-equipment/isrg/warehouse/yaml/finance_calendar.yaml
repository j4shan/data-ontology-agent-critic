- node_id: sf:surgicalrobot.finance.fact_journal_line
  descriptor:
    qualified_name: surgicalrobot.finance.fact_journal_line
    display_name: Journal line
    description: A posted ledger line for revenue, cost, and margin.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: FINANCE
      object: FACT_JOURNAL_LINE
      format: table
  grain:
    description: One row is one journal line.
    components:
    - identity_id: journal_line_identity
      dataset_columns:
      - journal_line_id
  columns:
  - name: journal_line_id
    description: Identifier of the journal line. This dataset holds the complete population.
  - name: legal_entity_id
    description: Legal entity. The complete population is not re-authored on this dataset.
  - name: gl_account_id
    description: Account posted. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the posting. The complete population is not re-authored on this dataset.
  - name: currency_id
    description: Currency of the amount. The complete population is not re-authored on this dataset.
  - name: cost_element_id
    description: Cost element, when the line is a cost. The complete population is not re-authored on
