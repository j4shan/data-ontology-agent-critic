- node_id: sf:surgicalrobot.finance.fact_exchange_rate
  descriptor:
    qualified_name: surgicalrobot.finance.fact_exchange_rate
    display_name: Exchange rate
    description: A daily translation rate. The source currency is stored as a second role of the currency
      population.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: FINANCE
      object: FACT_EXCHANGE_RATE
      format: table
  grain:
    description: One row is one exchange rate.
    components:
    - identity_id: exchange_rate_identity
      dataset_columns:
      - exchange_rate_id
  columns:
  - name: exchange_rate_id
    description: Identifier of the exchange rate. This dataset holds the complete population.
  - name: from_currency_id
    description: Currency being translated. Same currency population, stored as a second role rather than
      a second join. The complete population is not re-authored on this dataset.
  - name: to_currency_id
    description: Currency translated into. The complete population is not re-authored on this dataset.
  - name: calendar_day_id
    description: Day of the rate. The complete population is not re-authored on this dataset.
  - name: rate_amount
    description: Translation rate.
  entity_definitions:
  - identity_id: exchange_rate_identity
    dataset_columns:
    - exchange_rate_id
    entity_universe: complete
  - identity_id: currency_identity
    dataset_columns:
    - to_currency_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
