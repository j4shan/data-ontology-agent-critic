schema_version: '3'
nodes:
- node_id: sf:intuitive.procedure.dim_procedure_category
  descriptor:
    qualified_name: intuitive.procedure.dim_procedure_category
    display_name: Procedure category
    description: A procedure category Intuitive uses to read adoption, including general surgery, gynecology,
      urology, bariatric, cardiac, and biopsy.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: PROCEDURE
      object: DIM_PROCEDURE_CATEGORY
      format: table
  grain:
    description: One row is one procedure category.
    components:
    - identity_id: procedure_category_identity
      dataset_columns:
      - procedure_category_id
  columns:
  - name: procedure_category_id
    description: Identifier of the procedure category. This dataset holds the complete population.
  - name: category_name
    description: Name of the procedure category.
  - name: category_code
    description: Category code.
    value_description: general_surgery, gynecology, urology, thoracic, bariatric, cardiac, biopsy, lower_acuity,
      other
  entity_definitions:
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: complete
- node_id: sf:intuitive.procedure.dim_disease_state
  descriptor:
    qualified_name: intuitive.procedure.dim_disease_state
    display_name: Disease state
    description: A disease state used to judge how much of the procedure opportunity is still ahead.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: PROCEDURE
      object: DIM_DISEASE_STATE
      format: table
  grain:
    description: One row is one disease state.
    components:
    - identity_id: disease_state_identity
      dataset_columns:
      - disease_state_id
  columns:
  - name: disease_state_id
    description: Identifier of the disease state. This dataset holds the complete population.
  - name: procedure_category_id
    description: Category the disease state belongs to. The complete population is not re-authored on
      this dataset.
  - name: disease_state_name
    description: Name of the disease state.
  entity_definitions:
  - identity_id: disease_state_identity
    dataset_columns:
    - disease_state_id
    entity_universe: complete
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
- node_id: sf:intuitive.procedure.dim_procedure
  descriptor:
    qualified_name: intuitive.procedure.dim_procedure
    display_name: Procedure
    description: A named procedure inside a category. Every category has at least one procedure.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: PROCEDURE
      object: DIM_PROCEDURE
      format: table
  grain:
    description: One row is one procedure.
    components:
    - identity_id: procedure_identity
      dataset_columns:
      - procedure_id
  columns:
  - name: procedure_id
    description: Identifier of the procedure. This dataset holds the complete population.
  - name: procedure_category_id
    description: Category that contains the procedure. The complete population is not re-authored on this
      dataset.
  - name: procedure_name
    description: Name of the procedure.
  entity_definitions:
  - identity_id: procedure_identity
    dataset_columns:
    - procedure_id
    entity_universe: complete
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
- node_id: sf:intuitive.procedure.fact_procedure_volume
  descriptor:
    qualified_name: intuitive.procedure.fact_procedure_volume
    display_name: Procedure volume
    description: da Vinci procedure volume by category, country, and quarter. This is system procedure
      volume, not a claim.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: PROCEDURE
      object: FACT_PROCEDURE_VOLUME
      format: table
  grain:
    description: One row is one procedure volume.
    components:
    - identity_id: procedure_volume_identity
      dataset_columns:
      - procedure_volume_id
  columns:
  - name: procedure_volume_id
    description: Identifier of the procedure volume. This dataset holds the complete population.
  - name: hospital_id
    description: Hospital, when volume is hospital-specific. The complete population is not re-authored
      on this dataset.
  - name: procedure_category_id
    description: Procedure category. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the volume. The complete population is not re-authored on this dataset.
  - name: site_of_care_id
    description: Site of care. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the volume. The complete population is not re-authored on this dataset.
  - name: system_generation_id
    description: System generation used, when the volume is generation-specific. The complete population
      is not re-authored on this dataset.
  - name: procedure_count
    description: Procedures in the row.
  - name: growth_rate
    description: Procedure growth versus the comparison period.
  - name: prior_period_growth_rate
    description: Growth rate in the prior quarter.
  - name: pull_forward_count
    description: Procedures pulled forward, including late-2025 timing.
  - name: after_hours_procedure_count
    description: Procedures performed after hours.
  entity_definitions:
  - identity_id: procedure_volume_identity
    dataset_columns:
    - procedure_volume_id
    entity_universe: complete
  - identity_id: hospital_identity
    dataset_columns:
    - hospital_id
    entity_universe: partial
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
- node_id: sf:intuitive.procedure.fact_procedure_growth
  descriptor:
    qualified_name: intuitive.procedure.fact_procedure_growth
    display_name: Procedure growth
    description: Procedure growth in the United States versus outside the United States, and whether that
      rate looks sustainable.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: PROCEDURE
      object: FACT_PROCEDURE_GROWTH
      format: table
  grain:
    description: One row is one procedure growth.
    components:
    - identity_id: procedure_growth_identity
      dataset_columns:
      - procedure_growth_id
  columns:
  - name: procedure_growth_id
    description: Identifier of the procedure growth. This dataset holds the complete population.
  - name: country_id
    description: Country of the growth. The complete population is not re-authored on this dataset.
  - name: procedure_category_id
    description: Category, when growth is category-specific. The complete population is not re-authored
      on this dataset.
  - name: accounting_period_id
    description: Quarter of the growth. The complete population is not re-authored on this dataset.
  - name: growth_rate
    description: Procedure growth rate.
  - name: prior_period_growth_rate
    description: Prior-quarter growth rate.
  - name: geography_code
    description: Which geography the row describes.
    value_description: us, international
  - name: sustainable_flag
    description: 1 when the growth rate is expected to hold.
  - name: driver_code
    description: What is driving the growth.
    value_description: utilization, new_categories, mix, comparison, installed_base
  entity_definitions:
  - identity_id: procedure_growth_identity
    dataset_columns:
    - procedure_growth_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: procedure_category_identity
    dataset_columns:
    - procedure_category_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
