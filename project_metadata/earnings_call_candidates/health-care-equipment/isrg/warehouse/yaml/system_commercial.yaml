    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: competitor_identity
    dataset_columns:
    - competitor_id
    entity_universe: partial
