- node_id: sf:surgicalrobot.commercial.fact_go_to_market
  descriptor:
    qualified_name: surgicalrobot.commercial.fact_go_to_market
    display_name: Go to market
    description: 'International actions read together: distributors, refurbished systems, and the China
      joint venture, against procedure and placement growth.'
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: COMMERCIAL
      object: FACT_GO_TO_MARKET
      format: table
  grain:
    description: One row is one go to market.
    components:
    - identity_id: go_to_market_identity
      dataset_columns:
      - go_to_market_id
  columns:
  - name: go_to_market_id
    description: Identifier of the go to market. This dataset holds the complete population.
  - name: country_id
    description: Country of the action. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the action. The complete population is not re-authored on this dataset.
  - name: distributor_id
    description: Distributor, when the action uses one. The complete population is not re-authored on
      this dataset.
  - name: joint_venture_id
    description: Joint venture, when the action uses one. The complete population is not re-authored on
      this dataset.
  - name: system_generation_id
    description: Generation, including refurbished Xi. The complete population is not re-authored on this
      dataset.
  - name: action_code
    description: Kind of go-to-market move.
    value_description: distributor, refurbished, joint_venture
  - name: procedure_growth_rate
    description: Procedure growth in the country.
  - name: placement_growth_rate
    description: Placement growth in the country.
  entity_definitions:
  - identity_id: go_to_market_identity
    dataset_columns:
    - go_to_market_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: distributor_identity
    dataset_columns:
    - distributor_id
    entity_universe: partial
  - identity_id: joint_venture_identity
    dataset_columns:
    - joint_venture_id
    entity_universe: partial
  - identity_id: system_generation_identity
    dataset_columns:
    - system_generation_id
    entity_universe: partial
- node_id: sf:surgicalrobot.commercial.fact_refurbished_offer
  descriptor:
    qualified_name: surgicalrobot.commercial.fact_refurbished_offer
    display_name: Refurbished offer
    description: Refurbished Xi systems placed as customers upgrade, including the site of care the older
      system moves to.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: COMMERCIAL
      object: FACT_REFURBISHED_OFFER
      format: table
  grain:
    description: One row is one refurbished offer.
    components:
    - identity_id: refurbished_offer_identity
      dataset_columns:
      - refurbished_offer_id
  columns:
  - name: refurbished_offer_id
    description: Identifier of the refurbished offer. This dataset holds the complete population.
  - name: system_generation_id
    description: Refurbished generation. The complete population is not re-authored on this dataset.
  - name: country_id
    description: Country of the offer. The complete population is not re-authored on this dataset.
  - name: site_of_care_id
    description: Site of care receiving the older system. The complete population is not re-authored on
      this dataset.
  - name: accounting_period_id
    description: Quarter of the placement. The complete population is not re-authored on this dataset.
  - name: competitor_id
    description: Rival the offer is aimed at. The complete population is not re-authored on this dataset.
  - name: placement_count
    description: Refurbished systems placed.
  - name: upgrade_source_flag
    description: 1 when the unit comes from a customer upgrading.
  - name: tier_code
    description: Price tier of the offer.
    value_description: refurbished, new_premium, lower_price_form
  entity_definitions:
  - identity_id: refurbished_offer_identity
    dataset_columns:
    - refurbished_offer_id
    entity_universe: complete
  - identity_id: system_generation_identity
    dataset_columns:
