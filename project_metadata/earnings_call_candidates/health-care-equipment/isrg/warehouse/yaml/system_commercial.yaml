schema_version: '3'
nodes:
- node_id: sf:surgicalrobot.commercial.dim_distributor
  descriptor:
    qualified_name: surgicalrobot.commercial.dim_distributor
    display_name: Distributor
    description: An international distributor, including a European distributor, used to place systems.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalrobot.us-west-1
      database: SURGICAL_ROBOT
      schema: COMMERCIAL
      object: DIM_DISTRIBUTOR
      format: table
  grain:
    description: One row is one distributor.
    components:
    - identity_id: distributor_identity
      dataset_columns:
      - distributor_id
  columns:
  - name: distributor_id
    description: Identifier of the distributor. This dataset holds the complete population.
  - name: country_id
    description: Country the distributor covers. The complete population is not re-authored on this dataset.
  - name: distributor_name
    description: Name of the distributor.
  entity_definitions:
  - identity_id: distributor_identity
    dataset_columns:
    - distributor_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
