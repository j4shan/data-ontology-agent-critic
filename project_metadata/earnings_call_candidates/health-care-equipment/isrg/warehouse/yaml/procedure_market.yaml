schema_version: '3'
nodes:
- node_id: sf:intuitive.market.dim_competitor
  descriptor:
    qualified_name: intuitive.market.dim_competitor
    display_name: Competitor
    description: A competing robotic system discussed by geography. The row is a rival offer, not a payer.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: MARKET
      object: DIM_COMPETITOR
      format: table
  grain:
    description: One row is one competitor.
    components:
    - identity_id: competitor_identity
      dataset_columns:
      - competitor_id
  columns:
  - name: competitor_id
    description: Identifier of the competitor. This dataset holds the complete population.
  - name: competitor_name
    description: Label of the rival system.
  - name: rival_scope_code
    description: Where the rival is showing up.
    value_description: us, china, europe, global
  entity_definitions:
  - identity_id: competitor_identity
    dataset_columns:
    - competitor_id
    entity_universe: complete
- node_id: sf:intuitive.market.fact_coverage_policy
  descriptor:
    qualified_name: intuitive.market.fact_coverage_policy
    display_name: Coverage policy
    description: Medicaid coverage and expiring exchange subsidies as they show up in procedure demand.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: MARKET
      object: FACT_COVERAGE_POLICY
      format: table
  grain:
    description: One row is one coverage policy.
    components:
    - identity_id: coverage_policy_identity
      dataset_columns:
      - coverage_policy_id
  columns:
  - name: coverage_policy_id
    description: Identifier of the coverage policy. This dataset holds the complete population.
  - name: country_id
    description: Country of the policy. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the effect. The complete population is not re-authored on this dataset.
  - name: policy_code
    description: Policy being watched.
    value_description: medicaid, exchange_subsidy, other
  - name: procedure_effect_count
    description: Procedures the policy is expected to move.
  - name: placement_effect_count
    description: System placements the policy is expected to move.
  entity_definitions:
  - identity_id: coverage_policy_identity
    dataset_columns:
    - coverage_policy_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:intuitive.market.fact_china_outlook
  descriptor:
    qualified_name: intuitive.market.fact_china_outlook
    display_name: China outlook
    description: China procedure demand and how constrained and competitive that outlook is versus the
      global procedure trend.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: intuitive.us-west-1
      database: INTUITIVE_SURGICAL
      schema: MARKET
      object: FACT_CHINA_OUTLOOK
      format: table
  grain:
    description: One row is one china outlook.
    components:
    - identity_id: china_outlook_identity
      dataset_columns:
      - china_outlook_id
  columns:
  - name: china_outlook_id
    description: Identifier of the china outlook. This dataset holds the complete population.
  - name: country_id
    description: China. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter of the outlook. The complete population is not re-authored on this dataset.
  - name: competitor_id
    description: Rival intensity in China. The complete population is not re-authored on this dataset.
  - name: procedure_growth_rate
    description: China procedure growth.
  - name: global_procedure_growth_rate
    description: Global procedure growth used as the comparison.
  - name: constraint_code
    description: What constrains China.
    value_description: demand, competition, regulatory, capital
  - name: competitive_intensity_code
    description: Competitive intensity.
    value_description: low, moderate, high
  entity_definitions:
  - identity_id: china_outlook_identity
    dataset_columns:
    - china_outlook_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: competitor_identity
    dataset_columns:
    - competitor_id
    entity_universe: partial
