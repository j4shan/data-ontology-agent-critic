schema_version: '3'
nodes:
- node_id: sf:burger.finance.dim_capex_project
  descriptor:
    qualified_name: burger.finance.dim_capex_project
    display_name: Capex project
    description: Capital project for a new restaurant, a remodel, or restaurant technology. A technology
      project may have no single restaurant or franchisee.
    tags:
    - capital
    - finance
    synonyms:
    - capital project
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: FINANCE
      object: DIM_CAPEX_PROJECT
      format: table
  grain:
    description: One row is one capital project.
    components:
    - identity_id: capex_project_identity
      dataset_columns:
      - capex_project_id
  columns:
  - name: capex_project_id
    description: Surrogate key of the capital project.
  - name: project_name
    description: Project name.
  - name: project_type
    description: Capital use of the project.
    value_description: new_restaurant, remodel, or technology
    synonyms:
    - new restaurant
    - remodel
    - restaurant technology
  - name: restaurant_id
    description: Restaurant the project is for, when the project is site-specific. Empty for a technology
      project that is not tied to one restaurant. Partial reference to the restaurant master.
  - name: franchisee_id
    description: Franchisee associated with the project when the project supports a franchised restaurant.
      Empty for a company-only project. Partial reference to the franchisee dimension.
  - name: country_id
    description: Country of the project. Partial reference to the organization country dimension.
  - name: segment_id
    description: Operating segment of the project. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: currency_id
    description: Planning currency of the project.
  entity_definitions:
  - identity_id: capex_project_identity
    dataset_columns:
    - capex_project_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:burger.finance.fact_capex
  descriptor:
    qualified_name: burger.finance.fact_capex
    display_name: Capex spend
    description: Capital spend and capital budget by project and accounting period. Project type separates
      new-restaurant construction, remodels, and restaurant technology so the capital budget can be read
      by use.
    tags:
    - capital
    - finance
    synonyms:
    - capital expenditure
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: FINANCE
      object: FACT_CAPEX
      format: table
  grain:
    description: One row is the capital spend and budget for one project and one accounting period.
    components:
    - identity_id: capex_project_identity
      dataset_columns:
      - capex_project_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: capex_project_id
    description: Capital project.
  - name: accounting_period_id
    description: Accounting period of the spend and budget.
  - name: currency_id
    description: Currency of the spend and budget.
  - name: restaurant_id
    description: Restaurant tied to the spend when the project is site-specific. Empty when the project
      is not tied to one restaurant. Partial reference to the restaurant master.
  - name: segment_id
    description: Operating segment of the spend. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: project_type
    description: Capital use charged in the period.
    value_description: new_restaurant, remodel, or technology
  - name: capital_spend_amount
    description: Capital spent on the project in the accounting period.
    synonyms:
    - capex
    - capital expenditure
  - name: capital_budget_amount
    description: Capital budget for the project in the accounting period. Compared with spend by project
      type to see whether the budget is concentrated in new restaurants.
    synonyms:
    - capital budget
  entity_definitions:
  - identity_id: capex_project_identity
    dataset_columns:
    - capex_project_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:burger.finance.fact_support_payment
  descriptor:
    qualified_name: burger.finance.fact_support_payment
    display_name: Franchisee support payment
    description: Company cash paid to a franchisee. Value co-investment is support for the value offer.
      Energy-cost support is the cash response to an energy-price spike. Start and end calendar days bound
      the window so a later spike can be compared with an earlier support window. This amount is support
      paid, not franchisee profit.
    tags:
    - capital
    - finance
    synonyms:
    - value co-investment
    - franchisee cash support
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: FINANCE
      object: FACT_SUPPORT_PAYMENT
      format: table
  grain:
    description: One row is one company support payment to a franchisee, with its start and end.
    components:
    - identity_id: support_payment_identity
      dataset_columns:
      - support_payment_id
  columns:
  - name: support_payment_id
    description: Surrogate key of the support payment.
  - name: franchisee_id
    description: Franchisee that receives the cash. Partial reference to the franchisee dimension.
  - name: restaurant_id
    description: Restaurant the support is tied to when the payment is site-specific. Empty for franchisee-level
      support. Partial reference to the restaurant master.
  - name: legal_entity_id
    description: Legal entity that pays the support.
  - name: country_id
    description: Country of the support. Partial reference to the organization country dimension.
  - name: segment_id
    description: Operating segment of the support. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: currency_id
    description: Currency of the support amount.
  - name: start_calendar_day_id
    description: First calendar day the support is in force.
  - name: end_calendar_day_id
    description: Last calendar day the support is in force.
  - name: support_purpose
    description: Why the company paid the franchisee.
    value_description: value_coinvestment or energy_cost_support
    synonyms:
    - value co-investment
    - energy support
  - name: support_amount
    description: Company cash paid to the franchisee for the support window.
    synonyms:
    - company co-investment
    - franchisee support
  entity_definitions:
  - identity_id: support_payment_identity
    dataset_columns:
    - support_payment_id
    entity_universe: complete
  - identity_id: calendar_day_identity
    dataset_columns:
    - end_calendar_day_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - start_calendar_day_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:burger.finance.fact_segment_consolidation
  descriptor:
    qualified_name: burger.finance.fact_segment_consolidation
    display_name: Segment consolidation
    description: Consolidated finance result for the U.S., international operated, and developmental license
      segments. Amounts are in the reporting currency. The local currency and the translation rate are
      carried on the row so currency and consolidation can be read together. Franchisee profit is not
      a column.
    tags:
    - capital
    - finance
    synonyms:
    - segment consolidation
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: FINANCE
      object: FACT_SEGMENT_CONSOLIDATION
      format: table
  grain:
    description: One row is the consolidated result for one operating segment and one accounting period
      in one reporting currency.
    components:
    - identity_id: consolidation_identity
      dataset_columns:
      - consolidation_id
  columns:
  - name: consolidation_id
    description: Surrogate key of the segment consolidation result.
  - name: segment_id
    description: Operating segment being consolidated. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: accounting_period_id
    description: Accounting period of the consolidation.
  - name: reporting_currency_id
    description: Currency in which the consolidated amounts are stated.
  - name: local_currency_id
    description: Local currency translated into the reporting currency.
  - name: fx_rate_used
    description: Rate applied to translate the local currency into the reporting currency for this segment
      and period.
    synonyms:
    - translation rate
  - name: sales_amount
    description: Consolidated sales for the segment and period in the reporting currency.
    synonyms:
    - consolidated sales
  - name: royalty_income_amount
    description: Consolidated franchise royalty income for the segment and period in the reporting currency.
    synonyms:
    - franchise royalty income
  - name: rent_income_amount
    description: Consolidated rent income for the segment and period in the reporting currency.
    synonyms:
    - rent income
  - name: ga_amount
    description: Consolidated G&A for the segment and period in the reporting currency.
    synonyms:
    - G&A
  - name: company_operated_margin_amount
    description: Consolidated company-operated margin for the segment and period in the reporting currency.
      Not franchisee profit.
    synonyms:
    - company-operated margin
  entity_definitions:
  - identity_id: consolidation_identity
    dataset_columns:
    - consolidation_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - local_currency_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - reporting_currency_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
