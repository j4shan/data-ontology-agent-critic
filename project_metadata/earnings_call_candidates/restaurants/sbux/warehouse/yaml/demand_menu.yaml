schema_version: '3'
nodes:
- node_id: sf:starbucks.menu.dim_beverage_platform
  descriptor:
    qualified_name: starbucks.menu.dim_beverage_platform
    display_name: Beverage platform
    description: Beverage platforms as rows. Brewed coffee, espresso, cold, refresher, energy, and protein
      are the population.
    synonyms:
    - platform
    tags:
    - starbucks
    - menu
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: MENU
      object: DIM_BEVERAGE_PLATFORM
      format: table
  grain:
    description: One beverage platform.
    components:
    - dataset_columns:
      - beverage_platform_id
      description: One beverage platform.
      identity_id: beverage_platform_identity
  columns:
  - name: beverage_platform_id
    description: Identifier of one beverage platform.
  - name: platform_code
    description: Stable platform code.
    value_description: brewed_coffee, espresso, cold, refresher, energy, or protein.
  - name: platform_name
    description: Business name of the beverage platform.
  - name: temperature_class_code
    description: Temperature class of the platform. Cold, refresher, energy, and protein are cold. Brewed
      coffee and espresso are hot.
    value_description: hot or cold.
  entity_definitions:
  - identity_id: beverage_platform_identity
    dataset_columns:
    - beverage_platform_id
    entity_universe: complete
    entity_expression:
    - '[beverage_platform_id]'
- node_id: sf:starbucks.menu.dim_menu_item
  descriptor:
    qualified_name: starbucks.menu.dim_menu_item
    display_name: Menu item
    description: Sellable menu items, including items removed since the turnaround started and items still
      on the menu.
    synonyms:
    - SKU
    - item
    tags:
    - starbucks
    - menu
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: MENU
      object: DIM_MENU_ITEM
      format: table
  grain:
    description: One menu item.
    components:
    - dataset_columns:
      - menu_item_id
      description: One menu item.
      identity_id: menu_item_identity
  columns:
  - name: menu_item_id
    description: Identifier of one menu item.
  - name: beverage_platform_id
    description: Beverage platform of a beverage item. Empty for a non-beverage item.
  - name: item_name
    description: Guest-facing item name.
  - name: item_status_code
    description: Current item status.
    value_description: active, removed, or planned.
  - name: menu_role_code
    description: Role of the item in the assortment.
    value_description: core, limited_time, or seasonal.
  entity_definitions:
  - identity_id: menu_item_identity
    dataset_columns:
    - menu_item_id
    entity_universe: complete
    entity_expression:
    - '[menu_item_id]'
  - identity_id: beverage_platform_identity
    dataset_columns:
    - beverage_platform_id
    entity_universe: partial
    entity_expression:
    - '[beverage_platform_id]'
- node_id: sf:starbucks.menu.fact_menu_assortment_snapshot
  descriptor:
    qualified_name: starbucks.menu.fact_menu_assortment_snapshot
    display_name: Menu assortment snapshot
    description: One menu item in one country and fiscal period, with the flags that show the cut since
      the turnaround started.
    synonyms:
    - menu cut
    - assortment
    tags:
    - starbucks
    - menu
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: MENU
      object: FACT_MENU_ASSORTMENT_SNAPSHOT
      format: table
  grain:
    description: One menu item in one country and fiscal period.
    components:
    - dataset_columns:
      - menu_item_id
      description: Menu item.
      identity_id: menu_item_identity
    - dataset_columns:
      - country_id
      description: Country.
      identity_id: country_identity
    - dataset_columns:
      - fiscal_period_id
      description: Fiscal period.
      identity_id: fiscal_period_identity
  columns:
  - name: menu_item_id
    description: Menu item this snapshot row describes.
  - name: country_id
    description: Country of the assortment.
  - name: fiscal_period_id
    description: Fiscal period of the snapshot.
  - name: on_menu_flag
    description: True when the item is on the menu in this period.
    value_description: true or false.
  - name: on_menu_at_turnaround_start_flag
    description: True when the item was on the menu at the start of the turnaround.
    value_description: true or false.
  - name: removed_since_turnaround_flag
    description: True when the item was removed after the turnaround started.
    value_description: true or false.
  - name: assortment_hole_flag
    description: True when this item's absence or thin role is an assortment hole.
    value_description: true or false.
  - name: needs_new_item_flag
    description: True when the hole still needs a new item.
    value_description: true or false.
  - name: needs_marketing_flag
    description: True when the hole or item still needs marketing.
    value_description: true or false.
  - name: transaction_count
    description: Guest checks in this row's grain.
    synonyms:
    - transactions
    - traffic
    - checks
  - name: net_sales_amount
    description: Net sales dollars after discounts in this row's grain.
    synonyms:
    - net sales
    - sales
  - name: ticket_amount
    description: Average guest check in this row's grain.
    synonyms:
    - ticket
    - average ticket
    - check
  - name: unit_count
    description: Menu units in this row's grain.
    synonyms:
    - units
  - name: discount_amount
    description: Discount dollars in this row's grain.
    synonyms:
    - discount
  entity_definitions:
  - identity_id: menu_item_identity
    dataset_columns:
    - menu_item_id
    entity_universe: partial
    entity_expression:
    - '[menu_item_id]'
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
    entity_expression:
    - '[country_id]'
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
    entity_expression:
    - '[fiscal_period_id]'
- node_id: sf:starbucks.menu.fact_menu_hole
  descriptor:
    qualified_name: starbucks.menu.fact_menu_hole
    display_name: Menu hole
    description: An assortment gap in a country and fiscal period. The gap can name a removed item and
      the platform that is thin.
    synonyms:
    - assortment hole
    tags:
    - starbucks
    - menu
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: MENU
      object: FACT_MENU_HOLE
      format: table
  grain:
    description: One assortment gap in one country and fiscal period.
    components:
    - dataset_columns:
      - country_id
      description: Country.
      identity_id: country_identity
    - dataset_columns:
      - fiscal_period_id
      description: Fiscal period.
      identity_id: fiscal_period_identity
    - dataset_columns:
      - hole_code
      description: Assortment gap.
  columns:
  - name: country_id
    description: Country where the gap is open.
  - name: fiscal_period_id
    description: Fiscal period of the gap.
  - name: hole_code
    description: Identifier of the assortment gap.
    value_description: A gap code such as a platform gap, a daypart gap, or an item gap.
  - name: removed_menu_item_id
    description: Menu item removed where this gap opened. Empty when the gap has no retired item.
  - name: beverage_platform_id
    description: Beverage platform the gap sits on. Empty when the gap is not a platform gap.
  - name: marketing_campaign_id
    description: Campaign aimed at the gap. Empty when no campaign is assigned.
  - name: hole_reason_code
    description: Why the gap is open.
    value_description: platform_gap, daypart_gap, or item_gap.
  - name: needs_new_item_flag
    description: True when the gap needs a new item.
    value_description: true or false.
  - name: needs_marketing_flag
    description: True when the gap needs marketing.
    value_description: true or false.
  - name: transaction_count
    description: Guest checks in this row's grain.
    synonyms:
    - transactions
    - traffic
    - checks
  - name: net_sales_amount
    description: Net sales dollars after discounts in this row's grain.
    synonyms:
    - net sales
    - sales
  - name: ticket_amount
    description: Average guest check in this row's grain.
    synonyms:
    - ticket
    - average ticket
    - check
  - name: unit_count
    description: Menu units in this row's grain.
    synonyms:
    - units
  - name: discount_amount
    description: Discount dollars in this row's grain.
    synonyms:
    - discount
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
    entity_expression:
    - '[country_id]'
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
    entity_expression:
    - '[fiscal_period_id]'
  - identity_id: menu_item_identity
    dataset_columns:
    - removed_menu_item_id
    entity_universe: partial
    entity_expression:
    - '[removed_menu_item_id]'
  - identity_id: beverage_platform_identity
    dataset_columns:
    - beverage_platform_id
    entity_universe: partial
    entity_expression:
    - '[beverage_platform_id]'
  - identity_id: marketing_campaign_identity
    dataset_columns:
    - marketing_campaign_id
    entity_universe: partial
    entity_expression:
    - '[marketing_campaign_id]'
