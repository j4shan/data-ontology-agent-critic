- node_id: sf:starbucks.demand.fact_transaction
  descriptor:
    qualified_name: starbucks.demand.fact_transaction
    display_name: Transaction
    description: One settled guest check. This is the raw transaction population. A menu line is a different
      fact, and a comparable-sales component is a different fact.
    synonyms:
    - guest check
    - ticket header
    tags:
    - starbucks
    - demand
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: DEMAND
      object: FACT_TRANSACTION
      format: table
  grain:
    description: One settled guest check.
    components:
    - dataset_columns:
      - transaction_id
      description: One guest check.
      identity_id: transaction_identity
  columns:
  - name: transaction_id
    description: Identifier of one guest check.
  - name: coffeehouse_id
    description: Coffeehouse that served the check.
  - name: country_id
    description: Country of the coffeehouse.
  - name: calendar_day_id
    description: Calendar day of the check.
  - name: fiscal_period_id
    description: Fiscal period of the check.
  - name: daypart_id
    description: Daypart of the check.
  - name: order_channel_id
    description: Order channel of the check.
  - name: rewards_member_id
    description: Rewards member who paid the check. Empty when the guest is not a Rewards member.
  - name: rewards_participation_code
    description: Whether the check is a Rewards member or a non-Rewards guest.
    value_description: rewards_member or non_rewards.
  - name: transaction_count
    description: Guest checks contributed by this row. The row is one settled check.
    synonyms:
    - transactions
    - traffic
    - checks
  - name: net_sales_amount
    description: Net sales dollars of the check after discounts.
    synonyms:
    - net sales
    - sales
  - name: ticket_amount
    description: Guest check total for this one check.
    synonyms:
    - ticket
    - average ticket
    - check
  - name: unit_count
    description: Menu units sold on the check.
    synonyms:
    - units
  - name: discount_amount
    description: Discount dollars on the check.
    synonyms:
    - discount
  entity_definitions:
  - identity_id: transaction_identity
    dataset_columns:
    - transaction_id
    entity_universe: complete
    entity_expression:
    - '[transaction_id]'
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
    entity_expression:
    - '[coffeehouse_id]'
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
    entity_expression:
    - '[country_id]'
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
    entity_expression:
    - '[calendar_day_id]'
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
    entity_expression:
    - '[fiscal_period_id]'
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: partial
    entity_expression:
    - '[daypart_id]'
  - identity_id: order_channel_identity
    dataset_columns:
    - order_channel_id
    entity_universe: partial
    entity_expression:
    - '[order_channel_id]'
  - identity_id: rewards_member_identity
    dataset_columns:
    - rewards_member_id
    entity_universe: partial
    entity_expression:
    - '[rewards_member_id]'
