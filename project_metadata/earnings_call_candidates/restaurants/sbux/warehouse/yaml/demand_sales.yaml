- node_id: sf:starbucks.demand.fact_comp_bridge_component
  descriptor:
    qualified_name: starbucks.demand.fact_comp_bridge_component
    display_name: Comparable sales bridge component
    description: One comparable-sales component for a country and fiscal period. Hours effect, closure
      transfer, delivery, and brand initiative are components of this population. Service, innovation,
      and marketing are components too. Service is a foreign driver keyed here; this slice does not hold
      the service population. The raw guest check is a different population.
    synonyms:
    - comp bridge
    - hours effect
    - brand initiative
    tags:
    - starbucks
    - demand
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: DEMAND
      object: FACT_COMP_BRIDGE_COMPONENT
      format: table
  grain:
    description: One comparable-sales component for one country and fiscal period.
    components:
    - dataset_columns:
      - country_id
      description: Country.
      identity_id: country_identity
    - dataset_columns:
      - fiscal_period_id
      description: Fiscal period.
      identity_id: fiscal_period_identity
    - dataset_columns:
      - comp_driver_code
      description: Comparable-sales component.
  columns:
  - name: country_id
    description: Country of the comp bridge.
  - name: fiscal_period_id
    description: Fiscal period of the comp bridge.
  - name: comp_driver_code
    description: Comparable-sales component.
    value_description: hours_effect, closure_transfer, delivery, brand_initiative, service, innovation,
      or marketing. service is a foreign driver and is not a complete population in this slice.
  - name: marketing_campaign_id
    description: Campaign that carries a brand-initiative or marketing component. Empty for hours, closure
      transfer, delivery, and service.
  - name: beverage_platform_id
    description: Beverage platform that carries an innovation component. Empty when the component is not
      a platform innovation.
  - name: comparable_sales_contribution_amount
    description: Comparable-sales dollars attributed to this component.
  - name: transaction_count
    description: Guest checks attributed to this comparable-sales component. This is the comp-bridge population.
    synonyms:
    - transactions
    - traffic
    - checks
  - name: net_sales_amount
    description: Net sales dollars attributed to this comparable-sales component.
    synonyms:
    - net sales
    - sales
  - name: ticket_amount
    description: Average guest check inside this comparable-sales component.
    synonyms:
    - ticket
    - average ticket
    - check
  - name: unit_count
    description: Menu units attributed to this comparable-sales component.
    synonyms:
    - units
  - name: discount_amount
    description: Discount dollars attributed to this comparable-sales component.
    synonyms:
    - discount
