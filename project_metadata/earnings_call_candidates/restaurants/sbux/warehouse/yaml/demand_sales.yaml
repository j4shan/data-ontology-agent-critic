schema_version: '3'
nodes:
- node_id: sf:starbucks.demand.dim_daypart
  descriptor:
    qualified_name: starbucks.demand.dim_daypart
    display_name: Daypart
    description: Dayparts as rows. The population is morning and afternoon.
    synonyms:
    - morning
    - afternoon
    tags:
    - starbucks
    - demand
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: DEMAND
      object: DIM_DAYPART
      format: table
  grain:
    description: One daypart.
    components:
    - dataset_columns:
      - daypart_id
      description: One daypart.
      identity_id: daypart_identity
  columns:
  - name: daypart_id
    description: Identifier of one daypart.
  - name: daypart_code
    description: Stable daypart code.
    value_description: morning or afternoon.
  - name: daypart_name
    description: Business name of the daypart.
  entity_definitions:
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: complete
    entity_expression:
    - '[daypart_id]'
- node_id: sf:starbucks.demand.dim_order_channel
  descriptor:
    qualified_name: starbucks.demand.dim_order_channel
    display_name: Order channel
    description: Order channels as rows. Cafe, drive-thru, delivery, and mobile order are the population.
    synonyms:
    - order type
    - channel
    tags:
    - starbucks
    - demand
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: DEMAND
      object: DIM_ORDER_CHANNEL
      format: table
  grain:
    description: One order channel.
    components:
    - dataset_columns:
      - order_channel_id
      description: One order channel.
      identity_id: order_channel_identity
  columns:
  - name: order_channel_id
    description: Identifier of one order channel.
  - name: channel_code
    description: Stable order-channel code.
    value_description: cafe, drive_thru, delivery, or mobile_order.
  - name: channel_name
    description: Business name of the order channel.
  - name: premise_code
    description: Whether the channel is in the cafe or off premise.
    value_description: in_cafe or off_premise. Cafe is in_cafe. Drive-thru, delivery, and mobile order
      are off_premise.
  entity_definitions:
  - identity_id: order_channel_identity
    dataset_columns:
    - order_channel_id
    entity_universe: complete
    entity_expression:
    - '[order_channel_id]'
- node_id: sf:starbucks.demand.dim_competitor_format
  descriptor:
    qualified_name: starbucks.demand.dim_competitor_format
    display_name: Competitor format
    description: Competitive formats Starbucks demand is compared with. Rows are formats, not company
      names.
    synonyms:
    - competitive set
    - coffee specialist
    - drive-thru competitor
    tags:
    - starbucks
    - demand
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: DEMAND
      object: DIM_COMPETITOR_FORMAT
      format: table
  grain:
    description: One competitive format.
    components:
    - dataset_columns:
      - competitor_format_id
      description: One competitive format.
      identity_id: competitor_format_identity
  columns:
  - name: competitor_format_id
    description: Identifier of one competitive format.
  - name: format_code
    description: Stable competitive-format code.
    value_description: coffee_specialist, drive_thru_takeout, non_specialist_advertiser, or energy_occasion.
