schema_version: '3'
nodes:
- node_id: sf:coffee.labor.dim_labor_model_cohort
  descriptor:
    qualified_name: coffee.labor.dim_labor_model_cohort
    display_name: Labor model cohort
    description: Green Apron rollout waves. Each wave is its own row. A coffeehouse receives a wave through
      the cohort-assignment fact, which also holds the install date.
    tags:
    - labor
    - operations
    - green-apron
    synonyms:
    - Green Apron wave
    - rollout wave
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: DIM_LABOR_MODEL_COHORT
      format: table
  grain:
    description: One row is one Green Apron rollout wave.
    components:
    - dataset_columns:
      - labor_model_cohort_id
      identity_id: labor_model_cohort_identity
  columns:
  - name: labor_model_cohort_id
    description: Surrogate key of one Green Apron rollout wave.
  - name: wave_name
    description: Name of the rollout wave.
    value_description: Distinguishes the earliest Green Apron wave, the August wave, and later waves.
    synonyms:
    - Green Apron cohort
  - name: wave_sequence_number
    description: Order of the rollout wave. Lower numbers are earlier cohorts, including the original
      Green Apron stores.
  - name: program_name
    description: Labor program of the wave.
    value_description: Green Apron.
  entity_definitions:
  - identity_id: labor_model_cohort_identity
    dataset_columns:
    - labor_model_cohort_id
    entity_universe: complete
- node_id: sf:coffee.labor.dim_operating_week
  descriptor:
    qualified_name: coffee.labor.dim_operating_week
    display_name: Operating week
    description: Coffee Inc operating weeks, including weeks already operated and weeks still ahead. Each
      week belongs to one Coffee Inc fiscal period. The fiscal year ends on the Sunday closest to September
      30.
    tags:
    - labor
    - operations
    - calendar
    synonyms:
    - fiscal week
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: DIM_OPERATING_WEEK
      format: table
  grain:
    description: One row is one operating week.
    components:
    - dataset_columns:
      - operating_week_id
      identity_id: operating_week_identity
  columns:
  - name: operating_week_id
    description: Surrogate key of one operating week.
  - name: fiscal_period_id
    description: Foreign key to fiscal_period_id on coffee.finance.dim_fiscal_period. Coffeehouse operations
      does not hold the complete fiscal calendar.
  - name: period_label
    description: Coffee Inc fiscal-period label for fiscal_period_id, in the same form as period_label
      on coffee.finance.dim_fiscal_period.
    value_description: Labels such as FY2026-P03 and FY2027-P01.
  - name: fiscal_year
    description: Coffee Inc fiscal year of the week, matching fiscal_year on coffee.finance.dim_fiscal_period.
  - name: fiscal_week_in_year
    description: Position of the operating week inside the Coffee Inc fiscal year.
  - name: week_start_calendar_day_id
    description: First calendar day of the operating week. Foreign key to calendar_day_id on coffee.calendar.dim_calendar_day.
      Coffeehouse operations does not hold the complete calendar.
  - name: week_start_date
    description: Civil date for week_start_calendar_day_id.
    value_description: YYYY-MM-DD.
  - name: week_end_date
    description: Civil date of the last day of the operating week.
    value_description: YYYY-MM-DD.
  entity_definitions:
  - identity_id: operating_week_identity
    dataset_columns:
    - operating_week_id
    entity_universe: complete
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - week_start_calendar_day_id
    entity_universe: partial
- node_id: sf:coffee.labor.dim_service_interval
  descriptor:
    qualified_name: coffee.labor.dim_service_interval
    display_name: Service interval
    description: Service-measurement intervals and the ticket-time target for each interval. The four-minute
      promise is a target of 240 seconds.
    tags:
    - labor
    - operations
    - service
    synonyms:
    - service window
    - throughput interval
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: DIM_SERVICE_INTERVAL
      format: table
  grain:
    description: One row is one service-measurement interval.
    components:
    - dataset_columns:
      - service_interval_id
      identity_id: service_interval_identity
  columns:
  - name: service_interval_id
    description: Surrogate key of one service interval.
  - name: daypart_schedule_id
    description: Daypart that contains the interval. Foreign key to daypart_schedule_id on coffee.labor.dim_daypart_schedule.
  - name: interval_name
    description: Name of the service interval.
  - name: interval_sequence_number
    description: Order of the interval inside the operating day.
  - name: target_ticket_time_seconds
    description: Ticket-time target for the interval, in seconds.
    value_description: The four-minute promise is 240 seconds.
    synonyms:
    - service-time target
  entity_definitions:
  - identity_id: service_interval_identity
    dataset_columns:
    - service_interval_id
    entity_universe: complete
  - identity_id: daypart_schedule_identity
    dataset_columns:
    - daypart_schedule_id
    entity_universe: partial
- node_id: sf:coffee.labor.dim_daypart_schedule
  descriptor:
    qualified_name: coffee.labor.dim_daypart_schedule
    display_name: Daypart schedule
    description: Operating dayparts used to schedule coffeehouse hours, including morning, afternoon,
      evening, and overnight.
    tags:
    - labor
    - operations
    - hours
    synonyms:
    - daypart
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: DIM_DAYPART_SCHEDULE
      format: table
  grain:
    description: One row is one daypart schedule.
    components:
    - dataset_columns:
      - daypart_schedule_id
      identity_id: daypart_schedule_identity
  columns:
  - name: daypart_schedule_id
    description: Surrogate key of one daypart schedule.
  - name: daypart_name
    description: Name of the daypart.
    value_description: morning, afternoon, evening, or overnight.
  - name: start_minute_of_day
    description: Minute of the day when the daypart starts. Overnight dayparts wrap past midnight.
  - name: end_minute_of_day
    description: Minute of the day when the daypart ends.
  - name: is_overnight
    description: Whether this daypart is the overnight window used when a coffeehouse runs 24 hours.
    value_description: overnight or not_overnight.
  - name: is_extended_hours
    description: Whether this daypart is outside the base schedule and counts as extended hours.
    value_description: extended or base.
  entity_definitions:
  - identity_id: daypart_schedule_identity
    dataset_columns:
    - daypart_schedule_id
    entity_universe: complete
- node_id: sf:coffee.labor.dim_partner
  descriptor:
    qualified_name: coffee.labor.dim_partner
    display_name: Partner
    description: Coffee Inc store partners who work coffeehouse labor and record service feedback.
    tags:
    - labor
    - operations
    synonyms:
    - store partner
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: DIM_PARTNER
      format: table
  grain:
    description: One row is one store partner.
    components:
    - dataset_columns:
      - partner_id
      identity_id: partner_identity
  columns:
  - name: partner_id
    description: Surrogate key of one store partner.
  - name: coffeehouse_id
    description: Home coffeehouse of the partner. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: partner_role_name
    description: Role of the partner at the coffeehouse.
  - name: partner_status_code
    description: Whether the partner is active at the home coffeehouse.
    value_description: active or inactive.
  entity_definitions:
  - identity_id: partner_identity
    dataset_columns:
    - partner_id
    entity_universe: complete
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
- node_id: sf:coffee.labor.fact_coffeehouse_operating_week
  descriptor:
    qualified_name: coffee.labor.fact_coffeehouse_operating_week
    display_name: Coffeehouse operating week
    description: One operating week at one coffeehouse. Holds hours open, transactions, labor hours, labor
      dollars, and average ticket time. Transaction counts are coffeehouse operating totals.
    tags:
    - labor
    - operations
    - fact
    synonyms:
    - store week
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: FACT_COFFEEHOUSE_OPERATING_WEEK
      format: table
  grain:
    description: One row is one coffeehouse in one operating week.
    components:
    - dataset_columns:
      - coffeehouse_id
      identity_id: coffeehouse_identity
    - dataset_columns:
      - operating_week_id
      identity_id: operating_week_identity
  columns:
  - name: coffeehouse_id
    description: Coffeehouse of the week. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: operating_week_id
    description: Operating week. Foreign key to operating_week_id on coffee.labor.dim_operating_week.
  - name: hours_open
    description: Hours the coffeehouse was open in the week.
    synonyms:
    - hours open
  - name: extended_hours_open
    description: Hours open beyond the base daypart schedule in the week.
  - name: operates_24_hours
    description: Whether the coffeehouse was scheduled through every daypart, including overnight, in
      the week.
    value_description: operates_24_hours or not_24_hours.
  - name: transaction_count
    description: Transactions at the coffeehouse in the week, including transactions received from closures.
  - name: transactions_received_from_closures
    description: Transactions in this coffeehouse-week that transferred in from closed coffeehouses. Underlying
      traffic is transaction_count minus this amount.
  - name: extended_hours_transaction_count
    description: Transactions recorded during extended hours in the week.
  - name: extended_hours_sales_amount
    description: Sales recorded during extended hours in the week. Coffeehouse operating sales for those
      hours.
  - name: labor_hours
    description: Labor hours worked at the coffeehouse in the week.
    synonyms:
    - labor hours
  - name: labor_dollars
    description: Coffeehouse labor dollars for the week.
    synonyms:
    - labor dollars
  - name: transactions_per_labor_hour
    description: Transactions divided by labor hours for the coffeehouse-week.
    synonyms:
    - transactions per labor hour
  - name: average_ticket_time_seconds
    description: Average ticket time in seconds for the coffeehouse-week.
    synonyms:
    - average ticket time
    - ticket time seconds
  - name: ticket_time_gap_seconds
    description: Average ticket time minus the service-interval target, summarized for the coffeehouse-week.
      A remaining positive gap is service runway.
  - name: operations_comparable_sales_percent
    description: Comparable-sales contribution attributed to coffeehouse operations in the week.
  entity_definitions:
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: operating_week_identity
    dataset_columns:
    - operating_week_id
    entity_universe: partial
  - identity_id: coffeehouse_operating_week_identity
    dataset_columns:
    - coffeehouse_id
    - operating_week_id
    entity_universe: partial
- node_id: sf:coffee.labor.fact_green_apron_cohort_assignment
  descriptor:
    qualified_name: coffee.labor.fact_green_apron_cohort_assignment
    display_name: Green Apron cohort assignment
    description: Assignment of one coffeehouse to one Green Apron wave, with the install date. This is
      the record of wave and install date. The wave is also a row on the labor-model cohort dimension.
    tags:
    - labor
    - operations
    - fact
    - green-apron
    synonyms:
    - Green Apron install
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: FACT_GREEN_APRON_COHORT_ASSIGNMENT
      format: table
  grain:
    description: One row is one coffeehouse assigned to one Green Apron wave.
    components:
    - dataset_columns:
      - coffeehouse_id
      identity_id: coffeehouse_identity
    - dataset_columns:
      - labor_model_cohort_id
      identity_id: labor_model_cohort_identity
  columns:
  - name: coffeehouse_id
    description: Coffeehouse receiving the wave. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: labor_model_cohort_id
    description: Green Apron wave. Foreign key to labor_model_cohort_id on coffee.labor.dim_labor_model_cohort.
  - name: install_calendar_day_id
    description: Calendar day the wave was installed at the coffeehouse. Foreign key to calendar_day_id
      on coffee.calendar.dim_calendar_day. Coffeehouse operations does not hold the complete calendar.
  - name: install_date
    description: Civil date for install_calendar_day_id. August installs are read from this date and compared
      with earlier install dates.
    value_description: YYYY-MM-DD.
  entity_definitions:
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: labor_model_cohort_identity
    dataset_columns:
    - labor_model_cohort_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - install_calendar_day_id
    entity_universe: partial
  - identity_id: coffeehouse_labor_model_cohort_identity
    dataset_columns:
    - coffeehouse_id
    - labor_model_cohort_id
    entity_universe: complete
- node_id: sf:coffee.labor.fact_green_apron_weekly_outcome
  descriptor:
    qualified_name: coffee.labor.fact_green_apron_weekly_outcome
    display_name: Green Apron weekly outcome
    description: Weekly labor and traffic outcome for a coffeehouse after its Green Apron install. weeks_since_install
      places the row in the life of the wave. Wave and install date stay on the cohort dimension and the
      assignment fact.
    tags:
    - labor
    - operations
    - fact
    - green-apron
    synonyms:
    - Green Apron cohort week
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: FACT_GREEN_APRON_WEEKLY_OUTCOME
      format: table
  grain:
    description: One row is one assigned coffeehouse in one operating week.
    components:
    - dataset_columns:
      - coffeehouse_id
      identity_id: coffeehouse_identity
    - dataset_columns:
      - operating_week_id
      identity_id: operating_week_identity
  columns:
  - name: coffeehouse_id
    description: Coffeehouse on the Green Apron wave. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: operating_week_id
    description: Operating week of the outcome. Foreign key to operating_week_id on coffee.labor.dim_operating_week.
  - name: labor_model_cohort_id
    description: Green Apron wave of the coffeehouse. Foreign key to labor_model_cohort_id on coffee.labor.dim_labor_model_cohort.
  - name: weeks_since_install
    description: Operating weeks since the coffeehouse's Green Apron install date. Shows whether the cohort
      is still improving after a few months.
  - name: labor_hours
    description: Labor hours at the coffeehouse in the week.
    synonyms:
    - labor hours
  - name: green_apron_labor_hours
    description: Green Apron labor hours at the coffeehouse in the week.
    synonyms:
    - Green Apron hours
  - name: labor_dollars
    description: Coffeehouse labor dollars for the week.
    synonyms:
    - labor dollars
  - name: transaction_count
    description: Transactions at the coffeehouse in the week.
  - name: transaction_count_change
    description: Change in transaction count from the prior operating week at this coffeehouse. A positive
      change means the coffeehouse is still adding traffic.
  - name: transactions_per_labor_hour
    description: Transactions divided by labor hours for the coffeehouse-week.
    synonyms:
    - transactions per labor hour
  - name: ticket_time_seconds
    description: Average ticket time in seconds for the coffeehouse-week.
    synonyms:
    - ticket time seconds
  entity_definitions:
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: operating_week_identity
    dataset_columns:
    - operating_week_id
    entity_universe: partial
  - identity_id: labor_model_cohort_identity
    dataset_columns:
    - labor_model_cohort_id
    entity_universe: partial
  - identity_id: coffeehouse_operating_week_identity
    dataset_columns:
    - coffeehouse_id
    - operating_week_id
    entity_universe: partial
  - identity_id: coffeehouse_labor_model_cohort_identity
    dataset_columns:
    - coffeehouse_id
    - labor_model_cohort_id
    entity_universe: partial
- node_id: sf:coffee.labor.fact_service_performance
  descriptor:
    qualified_name: coffee.labor.fact_service_performance
    display_name: Service performance
    description: Ticket time for one coffeehouse, operating week, and service interval, with the scheduling
      algorithm and scheduled-ordering transactions in effect.
    tags:
    - labor
    - operations
    - fact
    - service
    synonyms:
    - ticket time
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: FACT_SERVICE_PERFORMANCE
      format: table
  grain:
    description: One row is one coffeehouse, operating week, and service interval.
    components:
    - dataset_columns:
      - coffeehouse_id
      identity_id: coffeehouse_identity
    - dataset_columns:
      - operating_week_id
      identity_id: operating_week_identity
    - dataset_columns:
      - service_interval_id
      identity_id: service_interval_identity
  columns:
  - name: coffeehouse_id
    description: Coffeehouse measured. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: operating_week_id
    description: Operating week. Foreign key to operating_week_id on coffee.labor.dim_operating_week.
  - name: service_interval_id
    description: Service interval and its ticket-time target. Foreign key to service_interval_id on coffee.labor.dim_service_interval.
  - name: ticket_time_seconds
    description: Ticket time in seconds for the coffeehouse, week, and interval.
    synonyms:
    - ticket time seconds
  - name: transaction_count
    description: Transactions in the interval.
  - name: within_target_transaction_count
    description: Transactions whose ticket time was within the interval target, including the four-minute
      promise when the target is 240 seconds.
  - name: scheduling_algorithm_code
    description: Labor-scheduling algorithm in effect for the coffeehouse and week. The same code repeats
      on each interval in that week.
  - name: scheduled_order_transaction_count
    description: Transactions placed through scheduled ordering in the interval.
  entity_definitions:
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: operating_week_identity
    dataset_columns:
    - operating_week_id
    entity_universe: partial
  - identity_id: service_interval_identity
    dataset_columns:
    - service_interval_id
    entity_universe: partial
  - identity_id: coffeehouse_operating_week_identity
    dataset_columns:
    - coffeehouse_id
    - operating_week_id
    entity_universe: partial
- node_id: sf:coffee.labor.fact_daypart_hours
  descriptor:
    qualified_name: coffee.labor.fact_daypart_hours
    display_name: Daypart hours
    description: Hours open and transactions by daypart for one coffeehouse and operating week. Overnight
      hours show a 24-hour schedule. Extended dayparts show what longer hours add.
    tags:
    - labor
    - operations
    - fact
    - hours
    synonyms:
    - store hours
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: FACT_DAYPART_HOURS
      format: table
  grain:
    description: One row is one coffeehouse, operating week, and daypart.
    components:
    - dataset_columns:
      - coffeehouse_id
      identity_id: coffeehouse_identity
    - dataset_columns:
      - operating_week_id
      identity_id: operating_week_identity
    - dataset_columns:
      - daypart_schedule_id
      identity_id: daypart_schedule_identity
  columns:
  - name: coffeehouse_id
    description: Coffeehouse. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: operating_week_id
    description: Operating week. Foreign key to operating_week_id on coffee.labor.dim_operating_week.
  - name: daypart_schedule_id
    description: Daypart. Foreign key to daypart_schedule_id on coffee.labor.dim_daypart_schedule.
  - name: hours_open
    description: Hours the coffeehouse was open in this daypart during the week.
    synonyms:
    - hours open
  - name: transaction_count
    description: Transactions during this daypart in the week.
  entity_definitions:
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: operating_week_identity
    dataset_columns:
    - operating_week_id
    entity_universe: partial
  - identity_id: daypart_schedule_identity
    dataset_columns:
    - daypart_schedule_id
    entity_universe: partial
  - identity_id: coffeehouse_operating_week_identity
    dataset_columns:
    - coffeehouse_id
    - operating_week_id
    entity_universe: partial
- node_id: sf:coffee.labor.fact_green_apron_labor_investment
  descriptor:
    qualified_name: coffee.labor.fact_green_apron_labor_investment
    display_name: Green Apron labor investment
    description: Coffeehouse labor hours, labor dollars, and planned productivity for one country, Coffee Inc
      fiscal period, and Green Apron wave. P&L recognition of Green Apron cost is coffee.finance.fact_green_apron_cost_stage.
    tags:
    - labor
    - operations
    - fact
    - green-apron
    synonyms:
    - Green Apron labor plan
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: LABOR
      object: FACT_GREEN_APRON_LABOR_INVESTMENT
      format: table
  grain:
    description: One row is one country, fiscal period, and Green Apron wave.
    components:
    - dataset_columns:
      - country_id
      identity_id: country_identity
    - dataset_columns:
      - fiscal_period_id
      identity_id: fiscal_period_identity
    - dataset_columns:
      - labor_model_cohort_id
      identity_id: labor_model_cohort_identity
  columns:
  - name: country_id
    description: Country of the investment. Foreign key to country_id on coffee.organization.dim_country.
  - name: fiscal_period_id
    description: Foreign key to fiscal_period_id on coffee.finance.dim_fiscal_period. Coffeehouse operations
      does not hold the complete fiscal calendar.
  - name: period_label
    description: Coffee Inc fiscal-period label for fiscal_period_id.
    value_description: Labels such as FY2026-P03.
  - name: fiscal_year
    description: Coffee Inc fiscal year of the period.
  - name: labor_model_cohort_id
    description: Green Apron wave. Foreign key to labor_model_cohort_id on coffee.labor.dim_labor_model_cohort.
  - name: labor_hours
    description: Labor hours in place for the wave, country, and fiscal period.
    synonyms:
    - labor hours
  - name: labor_hours_planned
    description: Labor hours planned for the wave, country, and fiscal period.
  - name: labor_dollars
    description: Coffeehouse labor dollars for the wave, country, and fiscal period.
    synonyms:
    - labor dollars
  - name: labor_dollars_planned
    description: Coffeehouse labor dollars planned for the wave, country, and fiscal period.
  - name: labor_dollars_remaining
    description: Coffeehouse labor dollars still to be invested for the wave, country, and fiscal period.
  - name: transactions_per_labor_hour
    description: Transactions per labor hour achieved for the wave, country, and fiscal period.
    synonyms:
    - transactions per labor hour
  - name: transactions_per_labor_hour_planned
    description: Transactions per labor hour planned against the Green Apron labor dollars for the wave,
      country, and fiscal period.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: labor_model_cohort_identity
    dataset_columns:
    - labor_model_cohort_id
    entity_universe: partial
- node_id: sf:coffee.labor.fact_partner_service_feedback
  descriptor:
    qualified_name: coffee.labor.fact_partner_service_feedback
    display_name: Partner service feedback
    description: Service feedback from one store partner for one operating week at one coffeehouse, compared
      with ticket time for that coffeehouse-week.
    tags:
    - labor
    - operations
    - fact
    - service
    synonyms:
    - partner feedback
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
