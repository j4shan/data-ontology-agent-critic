schema_version: '3'
nodes:
- node_id: sf:coffee.finance.dim_currency
  descriptor:
    qualified_name: coffee.finance.dim_currency
    display_name: Currency
    description: Currency used for Coffee Inc ledger amounts, rates, and plan amounts.
    tags:
    - finance
    - currency
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: DIM_CURRENCY
      format: table
  grain:
    description: One row is one currency.
    components:
    - dataset_columns:
      - currency_id
      identity_id: currency_identity
  columns:
  - name: currency_id
    description: Surrogate key of one currency.
  - name: currency_code
    description: ISO currency code.
  - name: currency_name
    description: Name of the currency.
  entity_definitions:
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: complete
- node_id: sf:coffee.finance.dim_legal_entity
  descriptor:
    qualified_name: coffee.finance.dim_legal_entity
    display_name: Legal entity
    description: Coffee Inc legal entity that can be the book of a journal posting. Country and functional
      currency are partial references.
    tags:
    - finance
    - ledger
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: DIM_LEGAL_ENTITY
      format: table
  grain:
    description: One row is one legal entity.
    components:
    - dataset_columns:
      - legal_entity_id
      identity_id: legal_entity_identity
  columns:
  - name: legal_entity_id
    description: Surrogate key of one Coffee Inc legal entity.
  - name: legal_entity_name
    description: Legal name of the entity.
  - name: country_id
    description: Partial foreign key to country_id on coffee.organization.dim_country. Finance does
      not contain the complete country population.
  - name: functional_currency_id
    description: Currency in which the legal entity keeps its books. Partial reference to currency.
  entity_definitions:
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - functional_currency_id
    entity_universe: partial
- node_id: sf:coffee.finance.dim_gl_account
  descriptor:
    qualified_name: coffee.finance.dim_gl_account
    display_name: GL account
    description: General-ledger account in the Coffee Inc chart of accounts. Profit-and-loss accounts map
      to a cost element when they belong to coffee, other product cost, distribution, store labor, marketing,
      occupancy, or general and administrative.
    tags:
    - finance
    - ledger
    synonyms:
    - chart of accounts
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: DIM_GL_ACCOUNT
      format: table
  grain:
    description: One row is one general-ledger account.
    components:
    - dataset_columns:
      - gl_account_id
      identity_id: gl_account_identity
  columns:
  - name: gl_account_id
    description: Surrogate key of one general-ledger account.
  - name: account_number
    description: Chart-of-accounts number.
  - name: account_name
    description: Account name.
  - name: financial_statement_section
    description: Statement section of the account.
    value_description: profit_and_loss or balance_sheet
  - name: cost_element_id
    description: P&L cost element of the account. Empty for accounts that are not one of the seven margin-bridge
      cost elements.
  entity_definitions:
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    entity_universe: complete
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
- node_id: sf:coffee.finance.fact_journal_line
  descriptor:
    qualified_name: coffee.finance.fact_journal_line
    display_name: Journal line
    description: Posted Coffee Inc general-ledger journal line. Occupancy, general and administrative,
      and the other cost elements are separated with cost_element_id. Coffeehouse is an optional partial
      foreign key.
    tags:
    - finance
    - ledger
    synonyms:
    - GL posting
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_JOURNAL_LINE
      format: table
  grain:
    description: One row is one posted journal line.
    components:
    - dataset_columns:
      - journal_line_id
      identity_id: journal_line_identity
  columns:
  - name: journal_line_id
    description: Surrogate key of one posted journal line.
  - name: calendar_day_id
    description: Posting date of the line.
  - name: fiscal_period_id
    description: Coffee Inc fiscal period of the posting date.
  - name: legal_entity_id
    description: Legal entity whose books hold the line.
  - name: gl_account_id
    description: General-ledger account posted.
  - name: cost_element_id
    description: P&L cost element when the line is coffee, other product cost, distribution, store labor,
      marketing, occupancy, or general and administrative. Empty otherwise.
  - name: currency_id
    description: Currency of the debit, credit, and signed amounts.
  - name: country_id
    description: Partial foreign key to country_id on coffee.organization.dim_country. Finance does
      not contain the complete country population.
  - name: coffeehouse_id
    description: Partial foreign key to coffeehouse_id on coffee.store.dim_coffeehouse. Populated when
      the line posts to a coffeehouse. Finance does not contain the complete coffeehouse population.
  - name: debit_amount
    description: Debit amount in currency_id. Zero when the line is a credit.
  - name: credit_amount
    description: Credit amount in currency_id. Zero when the line is a debit.
  - name: signed_amount
    description: Debit amount minus credit amount, in currency_id. Used to aggregate a cost element such
      as occupancy or general and administrative.
  entity_definitions:
  - identity_id: journal_line_identity
    dataset_columns:
    - journal_line_id
    entity_universe: complete
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: legal_entity_identity
    dataset_columns:
    - legal_entity_id
    entity_universe: partial
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    entity_universe: partial
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
- node_id: sf:coffee.finance.fact_exchange_rate
  descriptor:
    qualified_name: coffee.finance.fact_exchange_rate
    display_name: Exchange rate
    description: Daily rate between two currencies. Translates legal-entity functional currency and journal
      amounts. This is back-office currency coverage.
    tags:
    - finance
    - currency
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_EXCHANGE_RATE
      format: table
  grain:
    description: One row is the rate for one date, one source currency, and one target currency.
    components:
    - dataset_columns:
      - calendar_day_id
      identity_id: calendar_day_identity
    - dataset_columns:
      - from_currency_id
      identity_id: currency_identity
    - dataset_columns:
      - to_currency_id
      identity_id: currency_identity
  columns:
  - name: calendar_day_id
    description: Date of the rate.
  - name: from_currency_id
    description: Currency being converted.
  - name: to_currency_id
    description: Currency the amount is converted into.
  - name: exchange_rate
    description: Units of to_currency_id per one unit of from_currency_id on calendar_day_id.
  entity_definitions:
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - from_currency_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - to_currency_id
    entity_universe: partial
