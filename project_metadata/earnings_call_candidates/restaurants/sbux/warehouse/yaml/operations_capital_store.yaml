schema_version: '3'
nodes:
- node_id: sf:coffee.capital_store.dim_remodel
  descriptor:
    qualified_name: coffee.capital_store.dim_remodel
    display_name: Remodel
    description: Coffeehouse remodel projects, including store uplifts. Start, finish, cost, and per-store
      sales lift are on the remodel fact.
    tags:
    - capital
    - operations
    - remodel
    synonyms:
    - store uplift
    - uplift
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: CAPITAL_STORE
      object: DIM_REMODEL
      format: table
  grain:
    description: One row is one remodel project.
    components:
    - dataset_columns:
      - remodel_id
      identity_id: remodel_identity
  columns:
  - name: remodel_id
    description: Surrogate key of one remodel.
  - name: coffeehouse_id
    description: Coffeehouse being remodeled. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: remodel_program_name
    description: Uplift program of the remodel.
    synonyms:
    - store uplift
  - name: remodel_scope_code
    description: Scope of work in the remodel.
  entity_definitions:
  - identity_id: remodel_identity
    dataset_columns:
    - remodel_id
    entity_universe: complete
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
- node_id: sf:coffee.capital_store.fact_remodel
  descriptor:
    qualified_name: coffee.capital_store.fact_remodel
    display_name: Remodel result
    description: 'Per-coffeehouse remodel measurement: start, finish, remodel cost, and sales lift for
      that store.'
    tags:
    - capital
    - operations
    - fact
    - remodel
    synonyms:
    - uplift result
    - per-store sales lift
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: CAPITAL_STORE
      object: FACT_REMODEL
      format: table
  grain:
    description: One row is one remodel.
    components:
    - dataset_columns:
      - remodel_id
      identity_id: remodel_identity
  columns:
  - name: remodel_id
    description: Remodel measured. Foreign key to remodel_id on coffee.capital_store.dim_remodel.
  - name: coffeehouse_id
    description: Coffeehouse of the remodel. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: start_calendar_day_id
    description: Calendar day the remodel started. Foreign key to calendar_day_id on coffee.calendar.dim_calendar_day.
      Coffeehouse operations does not hold the complete calendar.
  - name: remodel_start_date
    description: Civil date for start_calendar_day_id.
    value_description: YYYY-MM-DD.
  - name: finish_calendar_day_id
    description: Calendar day the remodel finished. Empty while the remodel is open. Foreign key to calendar_day_id
      on coffee.calendar.dim_calendar_day. Coffeehouse operations does not hold the complete calendar.
  - name: remodel_finish_date
    description: Civil date for finish_calendar_day_id.
    value_description: YYYY-MM-DD. Empty while the remodel is open.
  - name: remodel_cost
    description: Cost of the remodel for this coffeehouse.
    synonyms:
    - remodel cost
  - name: sales_lift_amount
    description: Sales change attributed to the uplift at this coffeehouse.
    synonyms:
    - per-store sales lift
  - name: sales_lift_percent
    description: Sales lift at this coffeehouse as a percent of pre-remodel sales.
  entity_definitions:
  - identity_id: remodel_identity
    dataset_columns:
    - remodel_id
    entity_universe: partial
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - start_calendar_day_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - finish_calendar_day_id
    entity_universe: partial
- node_id: sf:coffee.capital_store.fact_remodel_pace
  descriptor:
    qualified_name: coffee.capital_store.fact_remodel_pace
    display_name: Remodel pace
    description: Remodel starts, finishes, contractor capacity, and coffeehouses available to remodel
      for one country and Coffee Inc fiscal period. Later fiscal years, including 2027, carry planned_remodel_count
      against that capacity.
    tags:
    - capital
    - operations
    - fact
    - remodel
    synonyms:
    - remodel capacity
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: CAPITAL_STORE
      object: FACT_REMODEL_PACE
      format: table
  grain:
    description: One row is one country in one fiscal period.
    components:
    - dataset_columns:
      - country_id
      identity_id: country_identity
    - dataset_columns:
      - fiscal_period_id
      identity_id: fiscal_period_identity
  columns:
  - name: country_id
    description: Country of the pace measure. Foreign key to country_id on coffee.organization.dim_country.
  - name: fiscal_period_id
    description: Foreign key to fiscal_period_id on coffee.finance.dim_fiscal_period. Coffeehouse operations
      does not hold the complete fiscal calendar.
  - name: period_label
    description: Coffee Inc fiscal-period label for fiscal_period_id.
    value_description: Labels such as FY2027-P01.
  - name: fiscal_year
    description: Coffee Inc fiscal year of the period, including 2027.
  - name: remodels_started_count
    description: Remodels that started in the country and fiscal period.
  - name: remodels_finished_count
    description: Remodels that finished in the country and fiscal period.
  - name: contractor_capacity_count
    description: Contractor capacity available for remodels in the country and fiscal period.
  - name: stores_available_to_remodel_count
    description: Coffeehouses that can enter a remodel in the period without exceeding store operating
      capacity.
  - name: planned_remodel_count
    description: Remodels planned to start in the country and fiscal period. Fiscal 2027 periods show
      whether the pace can rise above contractor and store capacity.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
- node_id: sf:coffee.capital_store.dim_closure
  descriptor:
    qualified_name: coffee.capital_store.dim_closure
    display_name: Closure
    description: Coffeehouse closures, including closures already completed and closures announced for
      coffeehouses that may still close.
    tags:
    - capital
    - operations
    - closure
    synonyms:
    - store closure
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: CAPITAL_STORE
      object: DIM_CLOSURE
      format: table
  grain:
    description: One row is one closure.
    components:
    - dataset_columns:
      - closure_id
      identity_id: closure_identity
  columns:
  - name: closure_id
    description: Surrogate key of one closure.
  - name: coffeehouse_id
    description: Coffeehouse of the closure. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: closure_status_code
    description: Status of the closure.
    value_description: announced or completed. announced marks coffeehouses that may still close.
  - name: closure_reason_code
    description: Reason recorded for the closure.
  entity_definitions:
  - identity_id: closure_identity
    dataset_columns:
    - closure_id
    entity_universe: complete
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
- node_id: sf:coffee.capital_store.fact_closure
  descriptor:
    qualified_name: coffee.capital_store.fact_closure
    display_name: Closure result
    description: Store-level volume, operating cost, sales transferred, transferred transactions, and
      the coffeehouse margin and overhead effect of one closure.
    tags:
    - capital
    - operations
    - fact
    - closure
    synonyms:
    - sales transfer
    - store closure result
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: CAPITAL_STORE
      object: FACT_CLOSURE
      format: table
  grain:
    description: One row is one closure.
    components:
    - dataset_columns:
      - closure_id
      identity_id: closure_identity
  columns:
  - name: closure_id
    description: Closure measured. Foreign key to closure_id on coffee.capital_store.dim_closure.
  - name: coffeehouse_id
    description: Closed coffeehouse. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: closure_calendar_day_id
    description: Calendar day of the closure. Foreign key to calendar_day_id on coffee.calendar.dim_calendar_day.
      Coffeehouse operations does not hold the complete calendar.
  - name: closure_date
    description: Civil date for closure_calendar_day_id. September closures are read from this date.
    value_description: YYYY-MM-DD.
  - name: fiscal_period_id
    description: Foreign key to fiscal_period_id on coffee.finance.dim_fiscal_period. Coffeehouse operations
      does not hold the complete fiscal calendar.
  - name: period_label
    description: Coffee Inc fiscal-period label for fiscal_period_id.
  - name: fiscal_year
    description: Coffee Inc fiscal year of the closure.
  - name: average_unit_volume
    description: Average unit volume of the coffeehouse at closure, used to see whether closings are low-volume.
  - name: store_operating_cost
    description: Operating cost of the coffeehouse at closure, used to see whether closings are high-cost.
      Coffeehouse operating cost.
  - name: sales_transferred_amount
    description: Sales from the closed coffeehouse that continue at other coffeehouses.
    synonyms:
    - sales transferred
  - name: transferred_transaction_count
    description: Transactions from the closed coffeehouse that continue at other coffeehouses.
  - name: restaurant_margin_effect_amount
    description: Coffeehouse operating-margin amount associated with the closure.
  - name: overhead_effect_amount
    description: Coffeehouse overhead amount associated with the closure.
  entity_definitions:
  - identity_id: closure_identity
    dataset_columns:
    - closure_id
    entity_universe: partial
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - closure_calendar_day_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
- node_id: sf:coffee.capital_store.fact_new_unit_pipeline
  descriptor:
    qualified_name: coffee.capital_store.fact_new_unit_pipeline
    display_name: New-unit pipeline
    description: 'One pipeline record for a coffeehouse site: trade-area penetration, site return, and
      expected open period. Supports how fast the U.S. store count can grow.'
    tags:
    - capital
    - operations
    - fact
    - pipeline
    synonyms:
    - new units
    - site return
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: CAPITAL_STORE
      object: FACT_NEW_UNIT_PIPELINE
      format: table
  grain:
    description: One row is the current pipeline record for one coffeehouse.
    components:
    - dataset_columns:
      - coffeehouse_id
      identity_id: coffeehouse_identity
  columns:
  - name: coffeehouse_id
    description: Pipeline coffeehouse. Foreign key to coffeehouse_id on coffee.store.dim_coffeehouse.
  - name: fiscal_period_id
    description: Coffee Inc fiscal period when the coffeehouse is expected to open. Foreign key to fiscal_period_id
      on coffee.finance.dim_fiscal_period. Coffeehouse operations does not hold the complete fiscal
      calendar.
  - name: period_label
    description: Coffee Inc fiscal-period label for fiscal_period_id.
  - name: fiscal_year
    description: Coffee Inc fiscal year of the expected open period.
  - name: expected_open_calendar_day_id
    description: Calendar day the coffeehouse is expected to open. Foreign key to calendar_day_id on coffee.calendar.dim_calendar_day.
      Coffeehouse operations does not hold the complete calendar.
  - name: expected_open_date
    description: Civil date for expected_open_calendar_day_id.
    value_description: YYYY-MM-DD.
  - name: pipeline_stage_code
    description: Current stage of the site from identification through opening.
  - name: trade_area_penetration_rate
    description: Share of the trade area already served. Read with site return to judge a larger store
      count.
    synonyms:
    - penetration
  - name: site_return_rate
    description: Expected return of the site. Read with penetration to judge a larger store count.
    synonyms:
    - site return
  - name: projected_average_unit_volume
    description: Projected average unit volume of the site.
  entity_definitions:
  - identity_id: coffeehouse_identity
    dataset_columns:
    - coffeehouse_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - expected_open_calendar_day_id
    entity_universe: partial
