schema_version: '3'
nodes:
- node_id: sf:starbucks.organization.dim_country
  descriptor:
    qualified_name: starbucks.organization.dim_country
    display_name: Country
    description: Countries used for Starbucks coffeehouse operations. region_name groups countries for
      North America. The United States is the country for U.S. coffeehouse results.
    tags:
    - organization
    - operations
    synonyms:
    - market country
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: ORGANIZATION
      object: DIM_COUNTRY
      format: table
  grain:
    description: One row is one country.
    components:
    - dataset_columns:
      - country_id
      identity_id: country_identity
  columns:
  - name: country_id
    description: Surrogate key of one country.
  - name: country_code
    description: Short code of the country.
    value_description: The United States is the country for U.S. store uplifts, extended hours, and unit
      growth.
  - name: country_name
    description: Name of the country.
  - name: region_name
    description: Operating region that contains the country.
    value_description: North America is the region for company-operated and licensed comparisons and for
      closure-transfer traffic.
    synonyms:
    - operating region
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: complete
- node_id: sf:starbucks.organization.dim_licensee
  descriptor:
    qualified_name: starbucks.organization.dim_licensee
    display_name: Licensee
    description: Licensees that operate licensed Starbucks coffeehouses. license_model_code describes
      how that licensed business is run.
    tags:
    - organization
    - operations
    - licensee
    synonyms:
    - licensed operator
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: ORGANIZATION
      object: DIM_LICENSEE
      format: table
  grain:
    description: One row is one licensee.
    components:
    - dataset_columns:
      - licensee_id
      identity_id: licensee_identity
  columns:
  - name: licensee_id
    description: Surrogate key of one licensee.
  - name: licensee_name
    description: Name of the licensee.
  - name: country_id
    description: Country of the licensee. Foreign key to country_id on starbucks.organization.dim_country.
  - name: license_model_code
    description: Operating model of the licensed coffeehouses. Used with company-operated results to see
      whether a simpler license model changes sales at company-operated coffeehouses.
    synonyms:
    - licensed operating model
  entity_definitions:
  - identity_id: licensee_identity
    dataset_columns:
    - licensee_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
