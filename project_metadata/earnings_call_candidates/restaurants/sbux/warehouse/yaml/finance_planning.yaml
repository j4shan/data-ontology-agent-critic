schema_version: '3'
nodes:
- node_id: sf:coffee.finance.dim_guidance_scenario
  descriptor:
    qualified_name: coffee.finance.dim_guidance_scenario
    display_name: Guidance scenario
    description: Earnings guidance scenario for a Coffee Inc fiscal year. The high end and the low end
      of the range are separate scenarios.
    tags:
    - finance
    - planning
    synonyms:
    - high end
    - low end
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: DIM_GUIDANCE_SCENARIO
      format: table
  grain:
    description: One row is one guidance scenario.
    components:
    - dataset_columns:
      - guidance_scenario_id
      identity_id: guidance_scenario_identity
  columns:
  - name: guidance_scenario_id
    description: Surrogate key of one guidance scenario.
  - name: scenario_end_code
    description: Which end of the earnings range this scenario represents.
    value_description: high_end or low_end
  - name: guidance_fiscal_year
    description: Coffee Inc fiscal year the scenario covers. Fiscal 2026 is the year ending on the Sunday
      closest to September 30, 2026.
  - name: scenario_name
    description: Business name of the scenario.
  entity_definitions:
  - identity_id: guidance_scenario_identity
    dataset_columns:
    - guidance_scenario_id
    entity_universe: complete
- node_id: sf:coffee.finance.fact_guidance_scenario
  descriptor:
    qualified_name: coffee.finance.fact_guidance_scenario
    display_name: Guidance scenario earnings
    description: Earnings outcome of one guidance scenario, including the labor-model annualization already
      in the plan and any room for further investment. Sales and cost drivers of the same scenario are
      attached on the guidance-scenario driver fact.
    tags:
    - finance
    - planning
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_GUIDANCE_SCENARIO
      format: table
  grain:
    description: One row is the earnings outcome of one guidance scenario.
    components:
    - dataset_columns:
      - guidance_scenario_id
      identity_id: guidance_scenario_identity
  columns:
  - name: guidance_scenario_id
    description: Guidance scenario of this earnings outcome.
  - name: currency_id
    description: Currency of the earnings and investment amounts.
  - name: guided_earnings_amount
    description: Fiscal-year earnings at this scenario end, in currency_id.
  - name: labor_model_annualization_cost_amount
    description: Labor-model annualization cost already inside the scenario, in currency_id.
  - name: incremental_investment_capacity_amount
    description: Investment capacity still available on top of the labor-model annualization, in currency_id.
  - name: additional_investment_room_code
    description: Whether guidance leaves room for more investment this year on top of annualizing the
      labor model.
    value_description: room_remains or no_room
  entity_definitions:
  - identity_id: guidance_scenario_identity
    dataset_columns:
    - guidance_scenario_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:coffee.finance.fact_guidance_scenario_driver
  descriptor:
    qualified_name: coffee.finance.fact_guidance_scenario_driver
    display_name: Guidance scenario driver
    description: Sales or cost driver attached to a guidance scenario. The scenario end, high or low,
      is on the guidance-scenario dimension. Several drivers may attach to one scenario.
    tags:
    - finance
    - planning
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_GUIDANCE_SCENARIO_DRIVER
      format: table
  grain:
    description: One row is one sales or cost driver attached to one guidance scenario.
    components:
    - dataset_columns:
      - guidance_scenario_id
      identity_id: guidance_scenario_identity
    - dataset_columns:
      - driver_code
      description: One sales or cost driver attached to the scenario.
  columns:
  - name: guidance_scenario_id
    description: Guidance scenario the driver belongs to.
  - name: driver_code
    description: Code of one sales or cost item inside the scenario. Labor-model annualization is a cost
      driver when it is one of the items in the range.
  - name: driver_role_code
    description: Whether the driver is a sales item or a cost item.
    value_description: sales or cost
  - name: currency_id
    description: Currency of driver_amount.
  - name: driver_amount
    description: Amount of the driver, in currency_id.
  - name: driver_description
    description: Business description of the driver.
  entity_definitions:
  - identity_id: guidance_scenario_identity
    dataset_columns:
    - guidance_scenario_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:coffee.finance.fact_cost_savings_roadmap
  descriptor:
    qualified_name: coffee.finance.fact_cost_savings_roadmap
    display_name: Cost-savings roadmap
    description: Cost-savings opportunity and the Coffee Inc fiscal year it hits the P&L. landing_horizon_code
      separates opportunities that land this year from opportunities that land in later years. Product-cost
      savings are the rows whose cost element is coffee or other product cost.
    tags:
    - finance
    - planning
    synonyms:
    - cost opportunity timing
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_COST_SAVINGS_ROADMAP
      format: table
  grain:
    description: One row is one cost-savings opportunity.
    components:
    - dataset_columns:
      - savings_roadmap_line_id
      description: One cost-savings opportunity on the roadmap.
  columns:
  - name: savings_roadmap_line_id
    description: Surrogate key of one roadmap opportunity.
  - name: cost_element_id
    description: Cost element the opportunity reduces.
  - name: currency_id
    description: Currency of savings_amount.
  - name: opportunity_name
    description: Name of the cost opportunity.
  - name: roadmap_fiscal_year
    description: Coffee Inc fiscal year in which the roadmap is stated. This is the year that landing_horizon_code
      calls this year.
  - name: landing_horizon_code
    description: Whether the opportunity hits the P&L in the roadmap fiscal year or in a later Coffee Inc
      fiscal year.
    value_description: this_year or later_years
  - name: landing_fiscal_year
    description: Coffee Inc fiscal year the savings hit the P&L.
  - name: first_recognition_fiscal_period_id
    description: First Coffee Inc fiscal period the savings hit the P&L. Empty when a later-year opportunity
      has a year but not yet a period.
  - name: savings_amount
    description: Savings amount, in currency_id.
  entity_definitions:
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - first_recognition_fiscal_period_id
    entity_universe: partial
- node_id: sf:coffee.finance.fact_green_apron_cost_stage
  descriptor:
    qualified_name: coffee.finance.fact_green_apron_cost_stage
    display_name: Green Apron cost stage
    description: Green Apron labor cost staged onto the P&L by Coffee Inc fiscal period. The cost element
      is store labor. productivity_rate_id is a foreign key to productivity rates owned outside finance.
      This dataset has no productivity identity and no complete productivity population.
    tags:
    - finance
    - planning
    synonyms:
    - Green Apron labor cost
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_GREEN_APRON_COST_STAGE
      format: table
  grain:
    description: One row is one Green Apron cost stage recognized in one Coffee Inc fiscal period.
    components:
    - dataset_columns:
      - green_apron_cost_stage_id
      description: One Green Apron labor cost stage on the P&L.
  columns:
  - name: green_apron_cost_stage_id
    description: Surrogate key of one Green Apron cost stage.
  - name: fiscal_period_id
    description: Coffee Inc fiscal period in which this stage hits the P&L.
  - name: cost_element_id
    description: Cost element of the staged cost. Green Apron labor stages use store labor.
  - name: currency_id
    description: Currency of the staged cost amounts.
  - name: stage_name
    description: Name of the cost stage inside the fiscal year.
  - name: staged_pnl_cost_amount
    description: Green Apron cost recognized on the P&L in the fiscal period, in currency_id.
  - name: cumulative_staged_pnl_cost_amount
    description: Running Green Apron P&L cost through this stage, in currency_id.
  - name: productivity_rate_id
    description: Foreign key to the productivity rate planned against this cost stage. Productivity rates
      are owned outside finance. This column has no logical identity and no complete population.
  entity_definitions:
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:coffee.finance.fact_price_cost_plan
  descriptor:
    qualified_name: coffee.finance.fact_price_cost_plan
    display_name: Price and cost plan
    description: Price and cost plan by Coffee Inc fiscal period. The plan holds the price change, the
      cost change, the comparable-sales build, and the periods when product inflation and distribution
      inflation are planned to ease. value_perception_score_id is a foreign key to the guest value-perception
      score, which is owned outside finance and has no column of score values here.
    tags:
    - finance
    - planning
    synonyms:
    - pricing plan
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: FINANCE
      object: FACT_PRICE_COST_PLAN
      format: table
  grain:
    description: One row is the price and cost plan for one Coffee Inc fiscal period.
    components:
    - dataset_columns:
      - fiscal_period_id
      identity_id: fiscal_period_identity
  columns:
  - name: fiscal_period_id
    description: Coffee Inc fiscal period the plan row covers.
  - name: currency_id
    description: Currency of the planned inflation amounts.
  - name: planned_price_change_pct
    description: Planned price change for the period, as a percent. This column is the pricing plan.
  - name: planned_cost_change_pct
    description: Planned cost change for the period, as a percent.
  - name: planned_comp_sales_pct
    description: Comparable-sales percent the plan assumes for the period.
  - name: comps_build_through_year_code
    description: Whether the plan assumes comparable sales build as the Coffee Inc fiscal year progresses.
    value_description: builds_through_year or does_not_build_through_year
  - name: planned_product_inflation_amount
    description: Product inflation the plan assumes for the period, in currency_id.
  - name: planned_distribution_inflation_amount
    description: Distribution inflation the plan assumes for the period, in currency_id.
  - name: product_inflation_ease_fiscal_period_id
    description: Coffee Inc fiscal period when product inflation is planned to ease.
  - name: distribution_inflation_ease_fiscal_period_id
    description: Coffee Inc fiscal period when distribution inflation is planned to ease.
  - name: value_perception_score_id
    description: Foreign key to the guest value-perception score owned outside finance. The score value
      is owned outside this dataset. This key has no logical identity and no complete population.
  entity_definitions:
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - product_inflation_ease_fiscal_period_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - distribution_inflation_ease_fiscal_period_id
    entity_universe: partial
