schema_version: '3'
nodes:
- node_id: sf:starbucks.finance.dim_cost_element
  descriptor:
    qualified_name: starbucks.finance.dim_cost_element
    display_name: Cost element
    description: P&L cost element used to separate the margin bridge and the ledger. The complete set
      used here is coffee, other product cost, distribution, store labor, marketing, occupancy, and general
      and administrative.
    tags:
    - finance
    - cost
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: DIM_COST_ELEMENT
      format: table
  grain:
    description: One row is one cost element.
    components:
    - dataset_columns:
      - cost_element_id
      identity_id: cost_element_identity
  columns:
  - name: cost_element_id
    description: Surrogate key of one cost element.
  - name: cost_element_code
    description: Stable code for the cost element.
    value_description: coffee, other_product_cost, distribution, store_labor, marketing, occupancy, general_and_administrative
  - name: cost_element_name
    description: Business name of the cost element.
  entity_definitions:
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: complete
- node_id: sf:starbucks.finance.dim_commodity
  descriptor:
    qualified_name: starbucks.finance.dim_commodity
    display_name: Commodity
    description: Purchased commodity whose price and inflation are compared with product-cost savings.
      Coffee commodities are identified by commodity_group_code.
    tags:
    - finance
    - cost
    synonyms:
    - coffee commodity
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: DIM_COMMODITY
      format: table
  grain:
    description: One row is one commodity.
    components:
    - dataset_columns:
      - commodity_id
      identity_id: commodity_identity
  columns:
  - name: commodity_id
    description: Surrogate key of one commodity.
  - name: commodity_code
    description: Commodity code.
  - name: commodity_name
    description: Commodity name.
  - name: commodity_group_code
    description: Group used to separate coffee from other commodities when savings are netted against
      inflation.
    value_description: coffee or other
  entity_definitions:
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: complete
- node_id: sf:starbucks.finance.dim_tariff
  descriptor:
    qualified_name: starbucks.finance.dim_tariff
    display_name: Tariff
    description: Tariff program. Refunds are stored on the tariff-refund fact and as their own margin-bridge
      driver.
    tags:
    - finance
    - cost
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: DIM_TARIFF
      format: table
  grain:
    description: One row is one tariff program.
    components:
    - dataset_columns:
      - tariff_id
      identity_id: tariff_identity
  columns:
  - name: tariff_id
    description: Surrogate key of one tariff program.
  - name: tariff_code
    description: Tariff program code.
  - name: tariff_name
    description: Tariff program name.
  - name: commodity_id
    description: Commodity the tariff applies to, when the program is commodity-specific. Empty when it
      is not.
  entity_definitions:
  - identity_id: tariff_identity
    dataset_columns:
    - tariff_id
    entity_universe: complete
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: partial
- node_id: sf:starbucks.finance.fact_commodity_price_savings
  descriptor:
    qualified_name: starbucks.finance.fact_commodity_price_savings
    display_name: Commodity price and product-cost savings
    description: Commodity price, commodity inflation, and product-cost savings for one commodity, one
      cost element, and one Starbucks fiscal period. Fiscal 2026 savings are netted against inflation
      on net_savings_against_inflation_amount. Join fiscal_period_id to the fiscal-period dimension to
      select the fiscal year. Coffee and other product cost remain separate cost elements. Tariff refunds
      are recorded on the tariff-refund fact.
    tags:
    - finance
    - cost
    synonyms:
    - product cost savings
    - commodity inflation
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: FACT_COMMODITY_PRICE_SAVINGS
      format: table
  grain:
    description: One row is one commodity, one cost element, and one Starbucks fiscal period.
    components:
    - dataset_columns:
      - commodity_id
      identity_id: commodity_identity
    - dataset_columns:
      - cost_element_id
      identity_id: cost_element_identity
    - dataset_columns:
      - fiscal_period_id
      identity_id: fiscal_period_identity
  columns:
  - name: commodity_id
    description: Commodity whose price and inflation are measured.
  - name: cost_element_id
    description: Product-cost element the savings and inflation belong to. Coffee and other product cost
      are separate.
  - name: fiscal_period_id
    description: Starbucks fiscal period of the price, inflation, and savings.
  - name: currency_id
    description: Currency of the price, inflation, savings, and net amounts.
  - name: commodity_price_amount
    description: Commodity price for the period, in currency_id.
  - name: commodity_inflation_amount
    description: Commodity inflation for the period, in currency_id. The period series shows when product
      inflation eases.
  - name: product_cost_savings_amount
    description: Product-cost savings recognized in the period, in currency_id.
  - name: net_savings_against_inflation_amount
    description: Product-cost savings minus commodity inflation for the same commodity, cost element,
      and fiscal period, in currency_id. A positive amount means savings offset inflation.
  entity_definitions:
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: partial
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:starbucks.finance.fact_tariff_refund
  descriptor:
    qualified_name: starbucks.finance.fact_tariff_refund
    display_name: Tariff refund
    description: Tariff refund fact. Each row is a received refund or an expected further refund. The
      refund is not a note on coffee cost. Received rows carry the Starbucks fiscal period received. Expected
      rows say whether more refunds are expected, whether that expectation is the fourth quarter, and
      whether guidance includes the refund.
    tags:
    - finance
    - cost
    synonyms:
    - tariff refund
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: FACT_TARIFF_REFUND
      format: table
  grain:
    description: One row is one tariff-refund line.
    components:
    - dataset_columns:
      - tariff_refund_line_id
      description: One received or expected tariff refund, separate from coffee cost.
  columns:
  - name: tariff_refund_line_id
    description: Surrogate key of one tariff-refund line.
  - name: tariff_id
    description: Tariff program of the refund.
  - name: currency_id
    description: Currency of refund_amount.
  - name: refund_status_code
    description: Whether this line has been received or is still an expectation.
    value_description: received or expected
  - name: received_fiscal_period_id
    description: Starbucks fiscal period in which the refund was received. Empty when refund_status_code
      is expected.
  - name: refund_amount
    description: Refund amount in currency_id.
  - name: included_in_guidance_code
    description: Whether guidance includes this refund.
    value_description: included or excluded
  - name: additional_refund_expected_code
    description: Whether more tariff refunds are expected after the refunds already identified.
    value_description: expected or not_expected
  - name: expected_in_fourth_quarter_code
    description: Whether an additional refund is expected in the Starbucks fourth quarter. Confirm the
      quarter with expected_fiscal_period_id joined to fiscal_quarter_number.
    value_description: fourth_quarter or not_fourth_quarter
  - name: expected_fiscal_period_id
    description: Starbucks fiscal period in which an additional refund is expected. Empty when no further
      refund is expected.
  entity_definitions:
  - identity_id: tariff_identity
    dataset_columns:
    - tariff_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - received_fiscal_period_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - expected_fiscal_period_id
    entity_universe: partial
- node_id: sf:starbucks.finance.fact_marketing_spend
  descriptor:
    qualified_name: starbucks.finance.fact_marketing_spend
    display_name: Marketing spend
    description: Marketing spend for one media channel in one Starbucks fiscal period. Dollars, percent
      of sales, the year-over-year change, and the media mix are columns. prior_year_fiscal_period_id
      is the comparison period.
    tags:
    - finance
    - marketing
    synonyms:
    - advertising spend
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: FACT_MARKETING_SPEND
      format: table
  grain:
    description: One row is one marketing-spend record for one media channel and one Starbucks fiscal
      period.
    components:
    - dataset_columns:
      - marketing_spend_id
      identity_id: marketing_spend_identity
  columns:
  - name: marketing_spend_id
    description: Surrogate key of one marketing-spend row.
  - name: fiscal_period_id
    description: Starbucks fiscal period of the spend.
  - name: prior_year_fiscal_period_id
    description: Starbucks fiscal period used as the year-ago comparison for this spend.
  - name: currency_id
    description: Currency of the spend amounts.
  - name: media_channel_code
    description: Media channel whose mix share is media_mix_pct.
  - name: marketing_spend_amount
    description: Marketing spend for the channel and period, in currency_id.
  - name: prior_year_marketing_spend_amount
    description: Marketing spend in prior_year_fiscal_period_id for the same channel, in currency_id.
  - name: marketing_spend_yoy_change_amount
    description: marketing_spend_amount minus prior_year_marketing_spend_amount, in currency_id.
  - name: marketing_spend_pct_of_sales
    description: Marketing spend as a percent of sales for the fiscal period.
  - name: prior_year_marketing_spend_pct_of_sales
    description: Marketing spend as a percent of sales in the prior-year fiscal period.
  - name: media_mix_pct
    description: Share of the period marketing spend that belongs to media_channel_code.
  - name: advertising_capacity_code
    description: Whether advertising for the period can still rise as a percent of sales, or only the
      media mix can change.
    value_description: percent_of_sales_increase or media_mix_shift_only
  entity_definitions:
  - identity_id: marketing_spend_identity
    dataset_columns:
    - marketing_spend_id
    entity_universe: complete
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - prior_year_fiscal_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:starbucks.finance.fact_na_company_operated_operating_margin
  descriptor:
    qualified_name: starbucks.finance.fact_na_company_operated_operating_margin
    display_name: North America company-operated operating margin
    description: Operating margin for Starbucks North America company-operated stores. One row is one
      country inside that scope, one company-operated ownership type, and one Starbucks fiscal period.
      First-half and second-half rows are the same grain in different periods. Compare them by joining
      fiscal_period_id to fiscal_half_number. Country and ownership type are partial foreign keys.
    tags:
    - finance
    - margin
    synonyms:
    - North America company-operated margin
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: FACT_NA_COMPANY_OPERATED_OPERATING_MARGIN
      format: table
  grain:
    description: One row is North America company-operated operating margin for one country, one ownership
      type, and one Starbucks fiscal period.
    components:
    - dataset_columns:
      - country_id
      identity_id: country_identity
    - dataset_columns:
      - fiscal_period_id
      identity_id: fiscal_period_identity
    - dataset_columns:
      - ownership_type_id
      identity_id: ownership_type_identity
  columns:
  - name: country_id
    description: Partial foreign key to country_id on starbucks.organization.dim_country. Finance does
      not contain the complete country population.
  - name: fiscal_period_id
    description: Starbucks fiscal period of the margin. Half-year comparison uses the fiscal period, not
      a separate half-year grain.
  - name: ownership_type_id
    description: Partial foreign key to ownership_type_id on starbucks.store.dim_ownership_type. Finance
      does not contain the complete ownership-type population. North America margin rows use the company-operated
      type.
  - name: currency_id
    description: Currency of the revenue and margin amounts.
  - name: market_scope_code
    description: Market scope held by this dataset.
    value_description: north_america
  - name: net_revenue_amount
    description: Net revenue for the North America company-operated row, in currency_id.
  - name: operating_margin_amount
    description: Operating margin amount for the row, in currency_id.
  - name: operating_margin_pct
    description: Operating margin as a percent of net revenue for the row.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: ownership_type_identity
    dataset_columns:
    - ownership_type_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:starbucks.finance.fact_margin_bridge
  descriptor:
    qualified_name: starbucks.finance.fact_margin_bridge
    display_name: Margin bridge
    description: Operating-margin bridge for Starbucks North America company-operated stores. Each line
      isolates one driver for one Starbucks fiscal period. Drivers separate product inflation, distribution,
      labor investment, a permanent marketing rebase, temporary turnaround marketing spend, and tariff
      refunds. Cost elements separately identify coffee, other product cost, distribution, store labor,
      marketing, occupancy, and general and administrative. A tariff-refund line leaves cost_element_id
      empty and keeps the refund on bridge_driver_code tariff_refund. Occupancy and general and administrative
      are their own drivers and cost elements.
    tags:
    - finance
    - margin
    synonyms:
    - operating margin bridge
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: starbucks.us-west-2
      database: STARBUCKS
      schema: FINANCE
      object: FACT_MARGIN_BRIDGE
      format: table
  grain:
    description: One row is one isolated line of the North America company-operated margin bridge.
    components:
    - dataset_columns:
      - margin_bridge_id
      identity_id: margin_bridge_identity
  columns:
  - name: margin_bridge_id
    description: Surrogate key of one margin-bridge line.
  - name: fiscal_period_id
    description: Starbucks fiscal period of the bridge line.
  - name: country_id
    description: Partial foreign key to country_id on starbucks.organization.dim_country. Finance does
      not contain the complete country population.
  - name: ownership_type_id
    description: Partial foreign key to ownership_type_id on starbucks.store.dim_ownership_type. Finance
      does not contain the complete ownership-type population. North America margin rows use the company-operated
      type.
  - name: currency_id
    description: Currency of the component and margin-impact amounts.
  - name: market_scope_code
    description: Market scope held by this dataset.
    value_description: north_america
  - name: cost_element_id
    description: Cost element of the line when the line is one of coffee, other product cost, distribution,
      store labor, marketing, occupancy, or general and administrative. Empty on a tariff-refund line.
  - name: bridge_driver_code
    description: Isolated driver of the margin change.
    value_description: product_inflation, distribution, labor_investment, marketing_permanent_rebase,
      marketing_temporary_turnaround, tariff_refund, occupancy, general_and_administrative
  - name: marketing_spend_nature_code
    description: Whether a marketing line is a permanent rebase or temporary turnaround spend.
    value_description: permanent_rebase, temporary_turnaround, or not_applicable
  - name: marketing_spend_id
    description: Marketing-spend row for a marketing driver. Empty when the driver is not marketing.
  - name: tariff_id
    description: Tariff program for a tariff-refund driver. Empty when the driver is not a tariff refund.
  - name: component_amount
    description: Dollar amount of the isolated driver, in currency_id. On a tariff-refund line this is
      the refund amount on its own driver.
  - name: margin_impact_amount
    description: Effect of the driver on North America company-operated operating margin, in currency_id.
  entity_definitions:
  - identity_id: margin_bridge_identity
    dataset_columns:
    - margin_bridge_id
    entity_universe: complete
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: ownership_type_identity
    dataset_columns:
    - ownership_type_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: cost_element_identity
    dataset_columns:
    - cost_element_id
    entity_universe: partial
  - identity_id: marketing_spend_identity
    dataset_columns:
    - marketing_spend_id
    entity_universe: partial
  - identity_id: tariff_identity
    dataset_columns:
    - tariff_id
    entity_universe: partial
