schema_version: '3'
logical_identities:
  transaction_identity:
    name: Transaction
    description: One settled Starbucks guest check. The check is a different population from its menu
      lines and from a comparable-sales bridge component.
    synonyms:
    - guest check
    - ticket header
  transaction_line_identity:
    name: Transaction line
    description: One menu item line on a Starbucks guest check.
    synonyms:
    - check line
    - item line
  daypart_identity:
    name: Daypart
    description: A serving daypart. The complete population is the morning and afternoon rows of the daypart
      dimension.
    synonyms:
    - day part
    - morning
    - afternoon
  order_channel_identity:
    name: Order channel
    description: How the guest placed and received the order. The complete population is cafe, drive-thru,
      delivery, and mobile order.
    synonyms:
    - order type
    - channel
  menu_item_identity:
    name: Menu item
    description: A sellable menu item, including items removed since the turnaround started.
    synonyms:
    - SKU
    - item
  beverage_platform_identity:
    name: Beverage platform
    description: A beverage platform. The complete population is brewed coffee, espresso, cold, refresher,
      energy, and protein.
    synonyms:
    - platform
  rewards_member_identity:
    name: Rewards member
    description: A Starbucks Rewards member. A non-Rewards guest is not a member.
    synonyms:
    - member
    - loyalty member
  marketing_campaign_identity:
    name: Marketing campaign
    description: A Starbucks marketing campaign or sustained advertising effort, including brand initiatives,
      broad acquisition, menu innovation, and the digital menu board test.
    synonyms:
    - campaign
    - advertising
  competitor_format_identity:
    name: Competitor format
    description: A competitive format in the coffee and away-from-home beverage market, such as a coffee
      specialist, a drive-thru and takeout format, a non-specialist advertiser, or an energy-drink occasion.
    synonyms:
    - competitive format
    - competitive set
  age_cohort_identity:
    name: Age cohort
    description: An age band of guests. The complete population distinguishes guests under 35 from guests
      35 and older.
    synonyms:
    - age band
    - guest cohort
  coffeehouse_identity:
    name: Coffeehouse
    description: One Starbucks coffeehouse, including pipeline, open, identified-to-close, and closed
      locations. The complete population is starbucks.store.dim_coffeehouse.
    synonyms:
    - store
  ownership_type_identity:
    name: Ownership type
    description: One coffeehouse ownership type. The codes are company_operated and licensed. The complete
      population is starbucks.store.dim_ownership_type.
    synonyms:
    - company-operated
    - licensed
  country_identity:
    name: Country
    description: One country used for Starbucks coffeehouse operations. The complete population is starbucks.organization.dim_country.
  licensee_identity:
    name: Licensee
    description: One licensee that operates licensed Starbucks coffeehouses. The complete population is
      starbucks.organization.dim_licensee.
    synonyms:
    - licensed operator
  partner_identity:
    name: Partner
    description: One Starbucks store partner. The complete population is starbucks.labor.dim_partner.
    synonyms:
    - store partner
  labor_model_cohort_identity:
    name: Labor model cohort
    description: One Green Apron rollout wave. Wave, install date, and weeks since install are carried
      by the cohort dimension, the assignment fact, and the weekly outcome fact. The complete population
      of waves is starbucks.labor.dim_labor_model_cohort.
    synonyms:
    - Green Apron wave
    - rollout wave
  operating_week_identity:
    name: Operating week
    description: One Starbucks operating week. The complete population is starbucks.labor.dim_operating_week.
    synonyms:
    - fiscal week
  coffeehouse_operating_week_identity:
    name: Coffeehouse operating week
    description: One coffeehouse in one operating week. Operating results, Green Apron weekly outcomes,
      service, daypart hours, and partner feedback reconcile on this key. No dataset in this slice is
      the complete population of coffeehouse-weeks.
  coffeehouse_labor_model_cohort_identity:
    name: Coffeehouse labor-model assignment
    description: One coffeehouse assigned to one Green Apron wave. The complete population is starbucks.labor.fact_green_apron_cohort_assignment.
      Weekly outcomes are partial.
    synonyms:
    - Green Apron assignment
  service_interval_identity:
    name: Service interval
    description: One service-measurement interval and its ticket-time target, including the four-minute
      promise. The complete population is starbucks.labor.dim_service_interval.
    synonyms:
    - service window
  daypart_schedule_identity:
    name: Daypart schedule
    description: One operating daypart, including morning, afternoon, evening, and overnight. The complete
      population is starbucks.labor.dim_daypart_schedule.
    synonyms:
    - daypart
  remodel_identity:
    name: Remodel
    description: One coffeehouse remodel project. The complete population is starbucks.capital_store.dim_remodel.
    synonyms:
    - store uplift
  closure_identity:
    name: Closure
    description: One coffeehouse closure. The complete population is starbucks.capital_store.dim_closure.
    synonyms:
    - store closure
  calendar_day_identity:
    name: Calendar day
    description: One calendar date on the Starbucks fiscal calendar. The complete population is the calendar-day
      dimension.
  fiscal_period_identity:
    name: Fiscal period
    description: One Starbucks fiscal period. The fiscal year ends on the Sunday closest to September
      30, quarters are 13 weeks except a 14-week fourth quarter in a 53-week year, and periods follow
      a 4-4-5 week pattern. The half and the quarter are attributes of the period. Labels use the Starbucks
      fiscal-period form, such as FY2026-P03.
    synonyms:
    - Starbucks fiscal period
    - 4-4-5 period
  currency_identity:
    name: Currency
    description: One currency in which Starbucks records amounts and exchange rates. The complete population
      is the currency dimension.
  legal_entity_identity:
    name: Legal entity
    description: One Starbucks legal entity that can hold journal postings. The complete population is
      the legal-entity dimension.
  gl_account_identity:
    name: GL account
    description: One general-ledger account. The complete population is the GL-account dimension.
  cost_element_identity:
    name: Cost element
    description: One P&L cost element. The complete population separates coffee, other product cost, distribution,
      store labor, marketing, occupancy, and general and administrative.
  journal_line_identity:
    name: Journal line
    description: One posted general-ledger journal line. The complete population is the journal-line fact.
  commodity_identity:
    name: Commodity
    description: One purchased commodity, including coffee. The complete population is the commodity dimension.
    synonyms:
    - coffee commodity
  tariff_identity:
    name: Tariff
    description: One tariff program. Refunds against a tariff are their own fact. The complete population
      is the tariff dimension.
  marketing_spend_identity:
    name: Marketing spend
    description: One marketing-spend record with dollars, percent of sales, and a media channel. The complete
      population is the marketing-spend fact.
    synonyms:
    - advertising spend
  margin_bridge_identity:
    name: Margin bridge line
    description: One line of the North America company-operated operating-margin bridge. The complete
      population is the margin-bridge fact.
  guidance_scenario_identity:
    name: Guidance scenario
    description: One earnings guidance scenario, including the high end and the low end of a Starbucks
      fiscal-year range. The complete population is the guidance-scenario dimension.
    synonyms:
    - high end
    - low end
