schema_version: '3'
nodes:
- node_id: sf:coffee.rewards.dim_rewards_member
  descriptor:
    qualified_name: coffee.rewards.dim_rewards_member
    display_name: Rewards member
    description: Coffee Inc Rewards members. Non-Rewards guests are not rows of this dataset.
    synonyms:
    - member
    - loyalty member
    tags:
    - starbucks
    - rewards
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: REWARDS
      object: DIM_REWARDS_MEMBER
      format: table
  grain:
    description: One Rewards member.
    components:
    - dataset_columns:
      - rewards_member_id
      description: One Rewards member.
      identity_id: rewards_member_identity
  columns:
  - name: rewards_member_id
    description: Identifier of one Rewards member.
  - name: country_id
    description: Home country of the member.
  - name: member_status_code
    description: Current membership status.
    value_description: active or inactive.
  entity_definitions:
  - identity_id: rewards_member_identity
    dataset_columns:
    - rewards_member_id
    entity_universe: complete
    entity_expression:
    - '[rewards_member_id]'
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
    entity_expression:
    - '[country_id]'
- node_id: sf:coffee.rewards.fact_rewards_member_day
  descriptor:
    qualified_name: coffee.rewards.fact_rewards_member_day
    display_name: Rewards member day
    description: One Rewards member on one calendar day, including days after the March program change.
    synonyms:
    - member activity
    - visit frequency
    tags:
    - starbucks
    - rewards
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: coffee.us-west-2
      database: COFFEE
      schema: REWARDS
      object: FACT_REWARDS_MEMBER_DAY
      format: table
  grain:
    description: One Rewards member on one calendar day.
    components:
    - dataset_columns:
      - rewards_member_id
      description: Rewards member.
      identity_id: rewards_member_identity
    - dataset_columns:
      - calendar_day_id
      description: Calendar day.
      identity_id: calendar_day_identity
  columns:
  - name: rewards_member_id
    description: Rewards member.
  - name: calendar_day_id
    description: Calendar day of the member's activity.
  - name: fiscal_period_id
    description: Fiscal period that contains the day.
  - name: country_id
    description: Country of the activity.
  - name: program_phase_code
    description: Position of the day relative to the March Rewards program change.
    value_description: before_march_program_change or after_march_program_change. April days use after_march_program_change.
  - name: transaction_count
    description: Guest checks in this row's grain.
    synonyms:
    - transactions
    - traffic
    - checks
  - name: net_sales_amount
    description: Net sales dollars after discounts in this row's grain.
    synonyms:
    - net sales
    - sales
  - name: ticket_amount
    description: Average guest check in this row's grain.
    synonyms:
    - ticket
    - average ticket
    - check
  - name: unit_count
    description: Menu units in this row's grain.
    synonyms:
    - units
  - name: discount_amount
    description: Discount dollars in this row's grain.
    synonyms:
    - discount
  entity_definitions:
  - identity_id: rewards_member_identity
    dataset_columns:
    - rewards_member_id
    entity_universe: partial
    entity_expression:
    - '[rewards_member_id]'
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
