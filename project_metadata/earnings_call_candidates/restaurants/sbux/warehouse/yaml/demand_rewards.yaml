  - name: active_member_count
    description: Rewards members active on the census day.
  - name: enrolled_member_count
    description: Rewards members enrolled as of the census day.
  - name: visit_frequency
    description: Average guest checks per active member on the census day.
  - name: transaction_count
    description: Guest checks in this row's grain.
    synonyms:
