      description: Calendar day.
      identity_id: calendar_day_identity
    - dataset_columns:
      - daypart_id
      description: Daypart.
      identity_id: daypart_identity
    - dataset_columns:
      - order_channel_id
      description: Order channel.
      identity_id: order_channel_identity
    - dataset_columns:
      - rewards_participation_code
      description: Rewards participation.
