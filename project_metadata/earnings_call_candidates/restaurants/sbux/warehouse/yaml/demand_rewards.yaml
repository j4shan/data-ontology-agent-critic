    display_name: Rewards participation sales
    description: Guest checks and sales by Rewards participation, daypart, and channel. Non-Rewards guests
      are a participation row, not members.
    synonyms:
    - non-Rewards
    - member sales
    tags:
    - starbucks
    - rewards
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
