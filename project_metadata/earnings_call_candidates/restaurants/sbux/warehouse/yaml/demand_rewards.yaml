  - name: calendar_day_id
    description: Calendar day of the sales.
  - name: fiscal_period_id
    description: Fiscal period that contains the day.
  - name: daypart_id
    description: Daypart of the sales.
  - name: order_channel_id
    description: Order channel of the sales.
  - name: rewards_participation_code
    description: Whether the checks are from Rewards members or non-Rewards guests.
    value_description: rewards_member or non_rewards.
  - name: transaction_growth_rate
    description: Change in guest checks versus the comparable prior period for this participation, daypart,
