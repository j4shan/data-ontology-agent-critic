schema_version: '3'
nodes:
- node_id: sf:mcdonalds.offer.dim_offer
  descriptor:
    qualified_name: mcdonalds.offer.dim_offer
    display_name: Offer
    description: Complete population of value offers, including meal discounts, sharp price points, and
      everyday value meals.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: OFFER
      object: DIM_OFFER
      format: table
  grain:
    description: One row is one offer iteration.
    components:
    - identity_id: offer_identity
      dataset_columns:
      - offer_id
      description: One value offer iteration.
  columns:
  - name: offer_id
    description: Identifier of the offer iteration. This dataset holds the complete offer population.
  - name: prior_offer_id
    description: Immediate predecessor offer. Absent on the first iteration.
  - name: offer_name
    description: Name of the offer.
  - name: offer_structure
    description: Commercial structure of the offer.
    value_description: meal_discount, sharp_price_point, or everyday_value_meal.
  - name: price_certainty_model
    description: How the offer states price to the guest.
    value_description: posted_national_price is one advertised price for the market. stated_meal_discount
      is a published discount off the meal. Which market uses which pattern is read from country_id.
  - name: iteration_number
    description: Sequence number of this offer reset, starting at 1.
  - name: change_cadence_days
    description: Days from the prior iteration to this one. Empty on the first iteration.
  entity_definitions:
  - identity_id: offer_identity
    dataset_columns:
    - offer_id
    entity_universe: complete
  - identity_id: offer_identity
    dataset_columns:
    - prior_offer_id
    entity_universe: partial
- node_id: sf:mcdonalds.marketing.dim_marketing_campaign
  descriptor:
    qualified_name: mcdonalds.marketing.dim_marketing_campaign
    display_name: Marketing campaign
    description: Complete population of marketing campaigns, including development process, tactic, and
      event tie-in.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: MARKETING
      object: DIM_MARKETING_CAMPAIGN
      format: table
  grain:
    description: One row is one marketing campaign.
    components:
    - identity_id: marketing_campaign_identity
      dataset_columns:
      - marketing_campaign_id
      description: One marketing campaign.
  columns:
  - name: marketing_campaign_id
    description: Identifier of the campaign. This dataset holds the complete campaign population.
  - name: campaign_name
    description: Name of the campaign.
  - name: tactic_name
    description: Guest tactic the campaign uses, including tactics tested in one market for transfer to
      others.
  - name: development_process_name
    description: Name of the process that built the campaign.
  - name: supersedes_prior_process_flag
    description: Whether this campaign was built after the marketing development process changed.
    value_description: true when the campaign uses the changed process; false when it uses the prior process.
  - name: demand_anticipation_method
    description: How this campaign anticipates guest demand. Campaigns with supersedes_prior_process_flag
      false carry the prior method.
  - name: is_world_cup_campaign
    description: Whether the campaign is a World Cup sponsorship or event campaign.
    value_description: true for a World Cup campaign; false otherwise.
  - name: digital_led_flag
    description: Whether the campaign is led by digital media or the digital ordering experience.
    value_description: true when digital leads the campaign; false otherwise.
  entity_definitions:
  - identity_id: marketing_campaign_identity
    dataset_columns:
    - marketing_campaign_id
    entity_universe: complete
- node_id: sf:mcdonalds.offer.fact_offer_performance
  descriptor:
    qualified_name: mcdonalds.offer.fact_offer_performance
    display_name: Offer performance
    description: Offer results by offer, franchisee, country, and accounting period, including opt-in
      and the sales response to meal discounts versus sharp price points.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: OFFER
      object: FACT_OFFER_PERFORMANCE
      format: table
  grain:
    description: One row is one offer at one franchisee in one country and accounting period.
    components:
    - identity_id: offer_identity
      dataset_columns:
      - offer_id
    - identity_id: franchisee_identity
      dataset_columns:
      - franchisee_id
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: offer_id
    description: Offer iteration being measured. This fact holds a partial offer population.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice. The franchisee
      whose opt-in and results are measured.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: opted_in_restaurant_count
    description: Restaurants of this franchisee that opted into the offer.
  - name: eligible_restaurant_count
    description: Restaurants of this franchisee eligible for the offer.
  - name: opt_in_rate
    description: Share of eligible restaurants that opted in.
  - name: redeemed_check_count
    description: Checks that redeemed the offer.
  - name: offer_sales_amount
    description: Net sales amount on checks that redeemed the offer.
  - name: incremental_guest_count
    description: Guest-count lift attributed to the offer versus the prior iteration's baseline.
  - name: discount_amount
    description: Discount amount funded by the offer.
  - name: discount_rate
    description: Discount depth of the meal offer as a share of the undiscounted meal price.
  - name: sharp_price_amount
    description: Advertised sharp price point. Empty when the offer is not a sharp price point.
  - name: traffic_lift_rate
    description: Guest-count change rate attributed to this offer iteration.
  - name: average_check_amount
    description: Average check amount on offer redemptions.
  entity_definitions:
  - identity_id: offer_identity
    dataset_columns:
    - offer_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.marketing.fact_marketing_campaign
  descriptor:
    qualified_name: mcdonalds.marketing.fact_marketing_campaign
    display_name: Marketing campaign performance
    description: Campaign demand, digital adoption, and attributed sales by campaign, country, and accounting
      period.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: MARKETING
      object: FACT_MARKETING_CAMPAIGN
      format: table
  grain:
    description: One row is one campaign in one country and accounting period.
    components:
    - identity_id: marketing_campaign_identity
      dataset_columns:
      - marketing_campaign_id
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: marketing_campaign_id
    description: Campaign being measured. This fact holds a partial campaign population.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: media_spend_amount
    description: Media amount spent on the campaign in the country and period.
  - name: attributed_sales_amount
    description: Sales amount attributed to the campaign.
  - name: attributed_guest_count
    description: Guest count attributed to the campaign.
  - name: incremental_visit_count
    description: Visits attributed above the non-campaign baseline.
  - name: digital_adoption_lift_rate
    description: Change in digital-order adoption attributed to the campaign, including World Cup campaigns.
  - name: demand_lift_rate
    description: Change in overall guest demand attributed to the campaign.
  - name: forecast_guest_count
    description: Guest count the campaign's demand-anticipation method forecast for the period.
  entity_definitions:
  - identity_id: marketing_campaign_identity
    dataset_columns:
    - marketing_campaign_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.marketing.bridge_campaign_offer
  descriptor:
    qualified_name: mcdonalds.marketing.bridge_campaign_offer
    display_name: Campaign offer bridge
    description: Pairs each campaign with the offers it features. A campaign can feature many offers,
      and an offer can appear in many campaigns.
    tags:
    - bridge
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: MARKETING
      object: BRIDGE_CAMPAIGN_OFFER
      format: table
  grain:
    description: One row is one campaign featured with one offer.
    components:
    - identity_id: marketing_campaign_identity
      dataset_columns:
      - marketing_campaign_id
    - identity_id: offer_identity
      dataset_columns:
      - offer_id
  columns:
  - name: marketing_campaign_id
    description: Campaign in the pair. This bridge holds a partial campaign population.
  - name: offer_id
    description: Offer featured by the campaign. This bridge holds a partial offer population.
  entity_definitions:
  - identity_id: marketing_campaign_identity
    dataset_columns:
    - marketing_campaign_id
    entity_universe: partial
  - identity_id: offer_identity
    dataset_columns:
    - offer_id
    entity_universe: partial
