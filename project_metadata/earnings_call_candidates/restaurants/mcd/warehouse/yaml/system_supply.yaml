schema_version: '3'
nodes:
- node_id: sf:burger.supply.dim_supplier
  descriptor:
    qualified_name: burger.supply.dim_supplier
    display_name: Supplier
    description: Every supplier of restaurant commodities or kitchen equipment.
    tags:
    - dimension
    - supply
    synonyms:
    - vendor
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: SUPPLY
      object: DIM_SUPPLIER
      format: table
  grain:
    description: One row is one supplier.
    components:
    - dataset_columns:
      - supplier_id
      identity_id: supplier_identity
  columns:
  - name: supplier_id
    description: Identifier of the supplier.
  - name: supplier_name
    description: Name of the supplier.
  - name: country_id
    description: Country of the supplier.
  - name: supplier_role
    description: What the supplier provides.
    value_description: commodity, distribution, or kitchen_equipment.
  entity_definitions:
  - identity_id: supplier_identity
    dataset_columns:
    - supplier_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
- node_id: sf:burger.supply.dim_commodity
  descriptor:
    qualified_name: burger.supply.dim_commodity
    display_name: Commodity
    description: Restaurant supply commodities. The population includes beef, chicken, and energy.
    tags:
    - dimension
    - supply
    synonyms:
    - beef
    - chicken
    - energy
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: SUPPLY
      object: DIM_COMMODITY
      format: table
  grain:
    description: One row is one commodity.
    components:
    - dataset_columns:
      - commodity_id
      identity_id: commodity_identity
  columns:
  - name: commodity_id
    description: Identifier of the commodity.
  - name: commodity_code
    description: Stable code of the commodity.
    value_description: Includes beef, chicken, and energy.
  - name: commodity_name
    description: Name of the commodity.
  - name: commodity_group
    description: Supply group of the commodity.
    value_description: protein, energy, or other. beef and chicken are protein. energy is energy.
  entity_definitions:
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: complete
- node_id: sf:burger.supply.dim_distribution_center
  descriptor:
    qualified_name: burger.supply.dim_distribution_center
    display_name: Distribution center
    description: Every distribution center that ships commodities to restaurants.
    tags:
    - dimension
    - supply
    synonyms:
    - warehouse
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: SUPPLY
      object: DIM_DISTRIBUTION_CENTER
      format: table
  grain:
    description: One row is one distribution center.
    components:
    - dataset_columns:
      - distribution_center_id
      identity_id: distribution_center_identity
  columns:
  - name: distribution_center_id
    description: Identifier of the distribution center.
  - name: distribution_center_name
    description: Name of the distribution center.
  - name: country_id
    description: Country of the distribution center.
  - name: segment_id
    description: Reporting segment served by the distribution center.
  entity_definitions:
  - identity_id: distribution_center_identity
    dataset_columns:
    - distribution_center_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:burger.supply.fact_commodity_cost
  descriptor:
    qualified_name: burger.supply.fact_commodity_cost
    display_name: Commodity cost
    description: Commodity unit cost by country and accounting period. Commodities include beef, chicken,
      and energy.
    tags:
    - fact
    - supply
    synonyms:
    - beef cost
    - chicken cost
    - energy cost
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: SUPPLY
      object: FACT_COMMODITY_COST
      format: table
  grain:
    description: One row is one commodity in one country and accounting period.
    components:
    - dataset_columns:
      - commodity_id
      identity_id: commodity_identity
    - dataset_columns:
      - country_id
      identity_id: country_identity
    - dataset_columns:
      - accounting_period_id
      identity_id: accounting_period_identity
  columns:
  - name: commodity_id
    description: Commodity whose cost this row records.
  - name: country_id
    description: Country of the commodity cost.
  - name: accounting_period_id
    description: Accounting period of the commodity cost.
  - name: currency_id
    description: Currency of the unit cost.
  - name: unit_cost_amount
    description: 'Measure: unit cost of the commodity in the country and period.'
  - name: cost_index_value
    description: 'Measure: index of the commodity''s unit cost for the country and period.'
  - name: cost_change_rate
    description: 'Measure: change in the commodity''s unit cost from the prior period.'
  entity_definitions:
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
- node_id: sf:burger.supply.fact_supplier_shipment
  descriptor:
    qualified_name: burger.supply.fact_supplier_shipment
    display_name: Supplier shipment
    description: Quantity and cost shipped by one supplier through one distribution center for one commodity
      in one accounting period.
    tags:
    - fact
    - supply
    synonyms:
    - distribution shipment
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: SUPPLY
      object: FACT_SUPPLIER_SHIPMENT
      format: table
  grain:
    description: One row is one supplier, distribution center, commodity, and accounting period.
    components:
    - dataset_columns:
      - supplier_id
      identity_id: supplier_identity
    - dataset_columns:
      - distribution_center_id
      identity_id: distribution_center_identity
    - dataset_columns:
      - commodity_id
      identity_id: commodity_identity
    - dataset_columns:
      - accounting_period_id
      identity_id: accounting_period_identity
  columns:
  - name: supplier_id
    description: Supplier that shipped the commodity.
  - name: distribution_center_id
    description: Distribution center that received or forwarded the shipment.
  - name: commodity_id
    description: Commodity shipped.
  - name: country_id
    description: Country that receives the shipment.
  - name: accounting_period_id
    description: Accounting period of the shipment.
  - name: currency_id
    description: Currency of the shipped cost.
  - name: shipped_quantity
    description: 'Measure: quantity shipped.'
  - name: received_quantity
    description: 'Measure: quantity received at the distribution center.'
  - name: shipped_cost_amount
    description: 'Measure: cost of the shipped quantity.'
  entity_definitions:
  - identity_id: supplier_identity
    dataset_columns:
    - supplier_id
    entity_universe: partial
  - identity_id: distribution_center_identity
    dataset_columns:
    - distribution_center_id
    entity_universe: partial
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
