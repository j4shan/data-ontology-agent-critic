  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: channel_id
    description: Channel of the parent check.
  - name: daypart_id
    description: Daypart of the parent check.
  - name: income_cohort_id
    description: Income cohort of the guest on the parent check.
  - name: quantity
    description: Units sold on the line.
  - name: gross_sales_amount
    description: Line sales amount before discounts.
  - name: net_sales_amount
    description: Line sales amount after discounts.
  - name: discount_amount
    description: Discount amount on the line.
  - name: menu_price_amount
