    entity_universe: partial
  - identity_id: protein_identity
    dataset_columns:
    - protein_id
    entity_universe: partial
  - identity_id: beverage_platform_identity
    dataset_columns:
    - beverage_platform_id
    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
