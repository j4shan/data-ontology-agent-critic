    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: FACT_CHECK_LINE
      format: table
  grain:
    description: One row is one item line on one check.
    components:
    - dataset_columns:
      - check_line_id
      description: One sold line on a check. The line has no separate logical identity.
  columns:
  - name: check_line_id
    description: Identifier of the line on the check.
  - name: check_id
    description: Check that contains the line.
  - name: product_id
    description: Menu item sold on the line.
  - name: product_category_id
    description: Category of the item on the line.
  - name: protein_id
    description: Protein of the item. Absent when the line is not a protein food.
  - name: beverage_platform_id
    description: Beverage platform of the item. Absent when the line is not a beverage.
  - name: restaurant_id
    description: Restaurant identifier. The restaurant population is owned outside this slice.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
