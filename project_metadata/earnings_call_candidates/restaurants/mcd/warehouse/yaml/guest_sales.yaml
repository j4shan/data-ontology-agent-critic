schema_version: '3'
nodes:
- node_id: sf:mcdonalds.sales.dim_check
  descriptor:
    qualified_name: mcdonalds.sales.dim_check
    display_name: Check
    description: Complete population of transaction tickets, including tickets that never become a sales
      row. Closed commercial checks are measured on the check fact.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: DIM_CHECK
      format: table
  grain:
    description: One row is one check.
    components:
    - identity_id: check_identity
      dataset_columns:
      - check_id
      description: One transaction ticket.
  columns:
  - name: check_id
    description: Identifier of the check. This dataset holds the complete check population.
  - name: restaurant_id
    description: Restaurant identifier. The restaurant population is owned outside this slice.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: channel_id
    description: Channel of the check.
  - name: daypart_id
    description: Daypart of the check.
  - name: offer_id
    description: Offer redeemed on the check. Absent when the check uses no offer.
  - name: income_cohort_id
    description: Income cohort of the guest on the check.
  - name: loyalty_member_id
    description: Loyalty member on the check. Absent when the check is not identified to a member.
  - name: check_status
    description: Disposition of the ticket.
    value_description: open, closed, or void.
  entity_definitions:
  - identity_id: check_identity
    dataset_columns:
    - check_id
    entity_universe: complete
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    entity_universe: partial
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: partial
  - identity_id: offer_identity
    dataset_columns:
    - offer_id
    entity_universe: partial
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: partial
  - identity_id: loyalty_member_identity
    dataset_columns:
    - loyalty_member_id
    entity_universe: partial
- node_id: sf:mcdonalds.sales.fact_restaurant_day_sales
  descriptor:
    qualified_name: mcdonalds.sales.fact_restaurant_day_sales
    display_name: Restaurant day sales
    description: Daily guest counts and comparable sales by restaurant, split into traffic, check, and
      price. Baseline and promoted demand are separate measures on the same row.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: FACT_RESTAURANT_DAY_SALES
      format: table
  grain:
    description: One row is one restaurant on one calendar day.
    components:
    - identity_id: restaurant_identity
      dataset_columns:
      - restaurant_id
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
  columns:
  - name: restaurant_id
    description: Restaurant identifier. The restaurant population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: guest_count
    description: Guest visits at the restaurant on the day.
  - name: baseline_guest_count
    description: Guest visits not tied to an identified promotion.
  - name: promoted_guest_count
    description: Guest visits tied to an identified promotion or offer.
  - name: promoted_sales_amount
    description: Net sales amount on promoted checks.
  - name: comparable_sales_amount
    description: Comparable sales amount for the restaurant-day.
  - name: comparable_guest_count
    description: Comparable guest count, the traffic piece of the sales change.
  - name: average_check_amount
    description: Average check amount, the check piece of the sales change.
  - name: traffic_contribution_amount
    description: Portion of the comparable-sales change attributed to guest counts.
  - name: check_contribution_amount
    description: Portion of the comparable-sales change attributed to check size.
  - name: price_contribution_amount
    description: Portion of the comparable-sales change attributed to price.
  - name: weather_event_code
    description: Weather disruption on that restaurant-day, or none when weather did not affect sales.
    value_description: none, storm, snow, heat, other
  - name: food_safety_comparison_flag
    description: Whether this day still sits in the prior-year food-safety comparison window.
  - name: sales_excluding_temporary_drag_amount
    description: Comparable sales after removing the weather and food-safety comparison drags.
  entity_definitions:
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.sales.fact_check
  descriptor:
    qualified_name: mcdonalds.sales.fact_check
    display_name: Check sales
    description: Commercial measures for closed checks. Void and open tickets stay on the check dimension
      and are absent here, so this is a partial check population at the same grain as the check identity.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: FACT_CHECK
      format: table
  grain:
    description: One row is one closed check.
    components:
    - identity_id: check_identity
      dataset_columns:
      - check_id
      description: One closed commercial check.
  columns:
  - name: check_id
    description: Closed check being measured. This fact holds a partial check population.
  - name: restaurant_id
    description: Restaurant identifier. The restaurant population is owned outside this slice.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: channel_id
    description: Channel of the check.
  - name: daypart_id
    description: Daypart of the check.
  - name: offer_id
    description: Offer redeemed on the check. Absent when the check uses no offer.
  - name: income_cohort_id
    description: Income cohort of the guest on the check.
  - name: loyalty_member_id
    description: Loyalty member on the check. Absent when the check is not identified to a member.
  - name: gross_sales_amount
    description: Sales amount before offer discounts.
  - name: net_sales_amount
    description: Sales amount after offer discounts.
  - name: discount_amount
    description: Offer discount amount on the check.
  - name: item_count
    description: Count of items on the check.
  - name: guest_count
    description: Guests represented by the check.
  - name: average_selling_price_amount
    description: Average selling price of the items on the check.
  entity_definitions:
  - identity_id: check_identity
    dataset_columns:
    - check_id
    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    entity_universe: partial
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: partial
  - identity_id: offer_identity
    dataset_columns:
    - offer_id
    entity_universe: partial
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: partial
  - identity_id: loyalty_member_identity
    dataset_columns:
    - loyalty_member_id
    entity_universe: partial
- node_id: sf:mcdonalds.sales.fact_check_line
  descriptor:
    qualified_name: mcdonalds.sales.fact_check_line
    display_name: Check line
