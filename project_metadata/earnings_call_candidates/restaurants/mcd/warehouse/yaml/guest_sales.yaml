- node_id: sf:mcdonalds.sales.fact_beverage_test_market
  descriptor:
    qualified_name: mcdonalds.sales.fact_beverage_test_market
    display_name: Beverage test market
    description: Beverage test and rollout results by platform, country, segment, and day, with a separate
      row for the arm that includes the energy drink and the arm that does not.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: FACT_BEVERAGE_TEST_MARKET
      format: table
  grain:
    description: One row is one beverage platform in one country, segment, calendar day, and energy test
      arm.
    components:
    - identity_id: beverage_platform_identity
      dataset_columns:
      - beverage_platform_id
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: segment_identity
      dataset_columns:
      - segment_id
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
    - dataset_columns:
      - includes_energy_flag
      description: Test arm. True includes the energy drink; false excludes it.
  columns:
  - name: beverage_platform_id
    description: Beverage platform under test. This fact holds a partial platform population.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: includes_energy_flag
    description: Whether this test-market arm includes the energy drink.
    value_description: true when this test arm includes the energy drink; false when the arm excludes
      it.
  - name: test_restaurant_count
    description: Restaurants in this test arm on this day.
  - name: rolled_out_restaurant_count
    description: Restaurants that have received this platform in the current rollout wave.
  - name: remaining_rollout_restaurant_count
    description: Restaurants still to be added for this platform in the current rollout wave.
  - name: beverage_unit_count
    description: Beverage units sold in this arm.
  - name: beverage_sales_amount
    description: Net sales amount of beverages in this arm.
  - name: check_count
    description: Checks in the test arm.
  - name: attached_check_count
    description: Checks in the arm that included a beverage.
  - name: attachment_rate
    description: Share of checks that included a beverage.
  - name: platform_mix_rate
    description: This platform's share of beverage units in the arm.
  - name: energy_share_rate
    description: Share of this arm's beverage sales amount that is energy drinks.
  entity_definitions:
  - identity_id: beverage_platform_identity
    dataset_columns:
    - beverage_platform_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.sales.fact_value_score_country
  descriptor:
    qualified_name: mcdonalds.sales.fact_value_score_country
    display_name: Value score by country
    description: Value perception, value mix, premium mix, and price-certainty rates by country, segment,
      and accounting period.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: FACT_VALUE_SCORE_COUNTRY
      format: table
  grain:
    description: One row is one country and segment in one accounting period.
    components:
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: segment_identity
      dataset_columns:
      - segment_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: value_score
    description: Guest value score for the country and segment.
  - name: value_leadership_index
    description: Index of value leadership versus the score the market is measured against.
  - name: value_mix_rate
    description: Share of checks or sales on value-tier items and value offers.
  - name: premium_mix_rate
    description: Share of sales on premium-tier items, the other side of the barbell.
  - name: everyday_meal_discount_rate
    description: Depth of the everyday value meal discount as a share of the undiscounted meal.
  - name: national_price_certainty_rate
    description: Share of sales sold at a posted national price rather than a varying local discount.
  - name: guest_count
    description: Guest visits in the country and segment for the period.
  - name: comparable_sales_amount
    description: Comparable sales amount for the country and segment.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.sales.fact_market_period_outlook
  descriptor:
    qualified_name: mcdonalds.sales.fact_market_period_outlook
    display_name: Market period sales outlook
    description: Period sales, the next period's sales, and the lead time to fix operations and marketing,
      with value, marketing, and menu contributions kept as separate amounts.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: SALES
      object: FACT_MARKET_PERIOD_OUTLOOK
      format: table
  grain:
    description: One row is one country and segment in one accounting period. The population is the forward
      sales reading, not the value-score reading and not the restaurant-day actual.
    components:
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: segment_identity
      dataset_columns:
      - segment_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: comparable_sales_amount
    description: Comparable sales amount for the period.
  - name: next_period_comparable_sales_amount
    description: Comparable sales amount for the following accounting period.
  - name: guest_count
    description: Guest visits in the period.
  - name: operations_fix_lead_time_days
    description: Days required to close the operations issues holding back guest throughput.
  - name: marketing_fix_lead_time_days
    description: Days required to close the marketing issues holding back demand.
  - name: value_driver_sales_amount
    description: Period sales amount attributed to the value offer and value menu.
  - name: marketing_driver_sales_amount
    description: Period sales amount attributed to marketing.
  - name: menu_innovation_driver_sales_amount
    description: Period sales amount attributed to menu innovation.
  - name: consumer_pressure_index
    description: Index of consumer weakness in the market. Higher readings are the weak-consumer case.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
