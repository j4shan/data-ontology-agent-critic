schema_version: '3'
nodes:
- node_id: sf:mcdonalds.guest.dim_daypart
  descriptor:
    qualified_name: mcdonalds.guest.dim_daypart
    display_name: Daypart
    description: Complete population of serving periods, including breakfast.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: GUEST
      object: DIM_DAYPART
      format: table
  grain:
    description: One row is one daypart.
    components:
    - identity_id: daypart_identity
      dataset_columns:
      - daypart_id
      description: One serving period.
  columns:
  - name: daypart_id
    description: Identifier of the daypart. This dataset holds the complete daypart population.
  - name: daypart_name
    description: Name of the serving period.
    value_description: breakfast, lunch, afternoon, dinner, or late_night.
  - name: is_breakfast
    description: Whether the daypart is breakfast.
    value_description: true for breakfast; false otherwise.
  entity_definitions:
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: complete
- node_id: sf:mcdonalds.guest.dim_income_cohort
  descriptor:
    qualified_name: mcdonalds.guest.dim_income_cohort
    display_name: Income cohort
    description: Complete population of guest income bands used to compare lower-, middle-, and higher-income
      demand.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: GUEST
      object: DIM_INCOME_COHORT
      format: table
  grain:
    description: One row is one income cohort.
    components:
    - identity_id: income_cohort_identity
      dataset_columns:
      - income_cohort_id
      description: One income band.
  columns:
  - name: income_cohort_id
    description: Identifier of the income cohort. This dataset holds the complete cohort population.
  - name: cohort_name
    description: Name of the income cohort.
    value_description: lower_income, middle_income, higher_income, or unclassified.
  - name: income_band_name
    description: Income band label used in guest reporting.
    value_description: lower_income, middle_income, higher_income, or unclassified.
  entity_definitions:
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: complete
- node_id: sf:mcdonalds.guest.dim_channel
  descriptor:
    qualified_name: mcdonalds.guest.dim_channel
    display_name: Channel
    description: Complete population of order channels, including digital and in-restaurant paths.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: GUEST
      object: DIM_CHANNEL
      format: table
  grain:
    description: One row is one order channel.
    components:
    - identity_id: channel_identity
      dataset_columns:
      - channel_id
      description: One order channel.
  columns:
  - name: channel_id
    description: Identifier of the order channel. This dataset holds the complete channel population.
  - name: channel_name
    description: Name of the order channel.
    value_description: in_restaurant, drive_thru, kiosk, digital_app, or delivery.
  - name: is_digital
    description: Whether the channel is a digital order path.
    value_description: true for digital app and other digital orders; false otherwise.
  entity_definitions:
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    entity_universe: complete
- node_id: sf:mcdonalds.guest.dim_guest_visit
  descriptor:
    qualified_name: mcdonalds.guest.dim_guest_visit
    display_name: Guest visit
    description: Complete population of guest occasions. A visit can exist without a closed check, which
      is how traffic is kept distinct from transactions.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: GUEST
      object: DIM_GUEST_VISIT
      format: table
  grain:
    description: One row is one guest visit.
    components:
    - identity_id: guest_visit_identity
      dataset_columns:
      - guest_visit_id
      description: One guest occasion.
  columns:
  - name: guest_visit_id
    description: Identifier of the guest occasion. This dataset holds the complete visit population.
  - name: check_id
    description: Check that closed the visit. Absent when the occasion is counted as traffic without a
      ticket.
  - name: restaurant_id
    description: Restaurant identifier. The restaurant population is owned outside this slice.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: daypart_id
    description: Daypart of the visit.
  - name: income_cohort_id
    description: Income cohort of the guest. Unclassified is a cohort, so the identifier is always present.
  - name: channel_id
    description: Channel of the visit.
  - name: loyalty_member_id
    description: Loyalty member on the visit. Absent when the guest is not identified as a member.
  - name: is_baseline_visit
    description: Whether the visit is in the unpromoted baseline rather than a promoted occasion.
    value_description: true for a baseline visit; false when the visit is promoted.
  - name: is_promoted_visit
    description: Whether the visit is tied to an identified promotion or offer.
    value_description: true when the visit is promoted; false for baseline traffic.
  entity_definitions:
  - identity_id: guest_visit_identity
    dataset_columns:
    - guest_visit_id
    entity_universe: complete
  - identity_id: check_identity
    dataset_columns:
    - check_id
    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: partial
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: partial
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    entity_universe: partial
  - identity_id: loyalty_member_identity
    dataset_columns:
    - loyalty_member_id
    entity_universe: partial
- node_id: sf:mcdonalds.loyalty.dim_loyalty_member
  descriptor:
    qualified_name: mcdonalds.loyalty.dim_loyalty_member
    display_name: Loyalty member
    description: Complete population of people enrolled in McDonald's loyalty.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: LOYALTY
      object: DIM_LOYALTY_MEMBER
      format: table
  grain:
    description: One row is one loyalty member.
    components:
    - identity_id: loyalty_member_identity
      dataset_columns:
      - loyalty_member_id
      description: One enrolled member.
  columns:
  - name: loyalty_member_id
    description: Identifier of the loyalty member. This dataset holds the complete member population.
  - name: income_cohort_id
    description: Income cohort of the member.
  - name: enrollment_channel_id
    description: Channel through which the member enrolled.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice. Home country
      of the member.
  - name: member_status
    description: Enrollment status.
    value_description: active or inactive.
  entity_definitions:
  - identity_id: loyalty_member_identity
    dataset_columns:
    - loyalty_member_id
    entity_universe: complete
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: partial
  - identity_id: channel_identity
    dataset_columns:
    - enrollment_channel_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
- node_id: sf:mcdonalds.loyalty.fact_loyalty_member_period
  descriptor:
    qualified_name: mcdonalds.loyalty.fact_loyalty_member_period
    display_name: Loyalty member period
    description: Visit frequency and digital use for members who have a recorded period. Members with
      no period activity are absent, so this is a partial member population.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: LOYALTY
      object: FACT_LOYALTY_MEMBER_PERIOD
      format: table
  grain:
    description: One row is one loyalty member in one accounting period.
    components:
    - identity_id: loyalty_member_identity
      dataset_columns:
      - loyalty_member_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: loyalty_member_id
    description: Member whose frequency is measured. This fact holds a partial member population.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice. Country of the
      member's activity in the period.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: income_cohort_id
    description: Income cohort of the member in the period.
  - name: visit_count
    description: Visits by the member in the period.
  - name: visit_frequency_rate
    description: Visits per week for the member in the period.
  - name: digital_transaction_count
    description: Digital transactions by the member in the period.
  - name: digital_adoption_rate
    description: Share of the member's visits that were digital orders.
  - name: member_sales_amount
    description: Net sales amount on the member's checks in the period.
  entity_definitions:
  - identity_id: loyalty_member_identity
    dataset_columns:
    - loyalty_member_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: partial
- node_id: sf:mcdonalds.guest.fact_cohort_daypart_demand
  descriptor:
    qualified_name: mcdonalds.guest.fact_cohort_daypart_demand
    display_name: Cohort and daypart demand
    description: Guest demand by income cohort, daypart, country, segment, and calendar day, including
      trade-down, digital, fuel price, and the consumer-pressure reading.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: GUEST
      object: FACT_COHORT_DAYPART_DEMAND
      format: table
  grain:
    description: One row is one income cohort in one daypart, country, segment, and calendar day.
    components:
    - identity_id: income_cohort_identity
      dataset_columns:
      - income_cohort_id
    - identity_id: daypart_identity
      dataset_columns:
      - daypart_id
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: segment_identity
      dataset_columns:
      - segment_id
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
  columns:
  - name: income_cohort_id
    description: Income cohort being measured.
  - name: daypart_id
    description: Daypart being measured, including breakfast.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: guest_count
    description: Guest visits for the cohort and daypart.
  - name: guest_count_change_rate
    description: Change in guest count versus the comparable prior period.
  - name: baseline_guest_count
    description: Unpromoted guest count inside this cohort and daypart.
  - name: sales_amount
    description: Net sales amount for the cohort and daypart.
  - name: traffic_share_rate
    description: This cohort's share of guest count in the country, segment, and daypart.
  - name: trade_down_guest_count
    description: Guests in this cohort counted as trading into McDonald's from a higher-priced occasion.
  - name: fast_casual_trade_down_guest_count
    description: Guests counted as trading down from fast casual.
  - name: retained_guest_count
    description: Guests in this cohort who also visited in the comparable prior period.
  - name: digital_guest_count
    description: Guest count on digital channels.
  - name: digital_sales_amount
    description: Net sales amount on digital channels.
  - name: menu_driven_guest_count
    description: Guest count attributed to menu and product moves rather than price alone.
  - name: value_offer_guest_count
    description: Guest count on a value offer, including the everyday value meal.
  - name: gas_price_amount
    description: National fuel price for the country on this calendar day. The same daily price is repeated
      across cohorts and dayparts so lower-income demand can be read against it.
  - name: demand_index
    description: Index of guest demand for the cohort. Lower readings are the weak-consumer case.
  entity_definitions:
  - identity_id: income_cohort_identity
    dataset_columns:
    - income_cohort_id
    entity_universe: partial
  - identity_id: daypart_identity
    dataset_columns:
    - daypart_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.guest.fact_restaurant_day_throughput
  descriptor:
    qualified_name: mcdonalds.guest.fact_restaurant_day_throughput
    display_name: Restaurant day throughput
    description: Launch load and guest throughput by restaurant and day. This population is the operations
      constraint, separate from the comparable-sales decomposition.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: GUEST
      object: FACT_RESTAURANT_DAY_THROUGHPUT
      format: table
  grain:
    description: One row is one restaurant on one calendar day.
    components:
    - identity_id: restaurant_identity
      dataset_columns:
      - restaurant_id
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
  columns:
  - name: restaurant_id
    description: Restaurant identifier. The restaurant population is owned outside this slice.
  - name: calendar_day_id
    description: Calendar day identifier. The calendar population is owned outside this slice.
  - name: franchisee_id
    description: Franchisee identifier. The franchisee population is owned outside this slice.
  - name: country_id
    description: Country identifier. The country population is owned outside this slice.
  - name: segment_id
    description: Segment identifier for the U.S., international operated markets, and developmental license.
      The segment population is owned outside this slice.
  - name: accounting_period_id
    description: Accounting period identifier. The period population is owned outside this slice.
  - name: concurrent_launch_count
    description: Count of menu items launching at this restaurant on this day.
  - name: throughput_rate
    description: Guests served per hour.
  - name: service_time_seconds
    description: Average service time in seconds.
  - name: guest_count
    description: Guest visits at the restaurant on the day.
  entity_definitions:
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: partial
  - identity_id: franchisee_identity
    dataset_columns:
    - franchisee_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:mcdonalds.technology.dim_technology_program
  descriptor:
    qualified_name: mcdonalds.technology.dim_technology_program
    display_name: Technology program
    description: One component of the global restaurant technology stack.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: TECHNOLOGY
      object: DIM_TECHNOLOGY_PROGRAM
      format: table
  grain:
    description: One row is one technology program.
    components:
    - identity_id: technology_program_identity
      dataset_columns:
      - technology_program_id
  columns:
  - name: technology_program_id
    description: Identifier of the technology program.
  - name: program_name
    description: Name of the stack component.
  - name: stack_role
    description: Role of the component in the global stack.
    value_description: loyalty, point_of_sale, kitchen, digital_order, other
  entity_definitions:
  - identity_id: technology_program_identity
    dataset_columns:
    - technology_program_id
    entity_universe: complete
- node_id: sf:mcdonalds.technology.fact_technology_rollout
  descriptor:
    qualified_name: mcdonalds.technology.fact_technology_rollout
    display_name: Technology rollout
    description: Period status of a technology program in a country, including what still blocks a finished global stack and the loyalty-frequency lift where that program is loyalty.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: TECHNOLOGY
      object: FACT_TECHNOLOGY_ROLLOUT
      format: table
  grain:
    description: One row is one technology program in one country and one accounting period.
    components:
    - identity_id: technology_program_identity
      dataset_columns:
      - technology_program_id
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: technology_program_id
    description: Technology program being rolled out.
  - name: country_id
    description: Country where the rollout status is measured.
  - name: segment_id
    description: Operating segment of that country.
  - name: accounting_period_id
    description: Accounting period of the rollout status.
  - name: stores_live_count
    description: Restaurants where the program is live.
  - name: stores_blocked_count
    description: Restaurants still blocked from the program.
  - name: blocker_reason
    description: What still blocks finishing the rollout.
    value_description: franchisee_funding, hardware, integration, training, regulatory, none
  - name: loyalty_visit_lift_rate
    description: Change in member visit frequency where the loyalty program is live. Empty for other programs.
  - name: system_sales_lift_amount
    description: Comparable sales attributed to the higher visit frequency of members on this program.
  entity_definitions:
  - identity_id: technology_program_identity
    dataset_columns:
    - technology_program_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
