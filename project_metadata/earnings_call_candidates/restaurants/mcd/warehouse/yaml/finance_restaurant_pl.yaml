    entity_universe: partial
  - identity_id: restaurant_identity
    dataset_columns:
    - restaurant_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:mcdonalds.finance.fact_margin_bridge_month
  descriptor:
    qualified_name: mcdonalds.finance.fact_margin_bridge_month
    display_name: Monthly margin bridge
    description: Monthly explanation of company-operated margin. Inflation, mix, and price are separate
      amounts. Beef and energy are portions of inflation. Value mix is a portion of mix. The standardized
      meal discount and sharp price points are offer attributions stored beside that split, and restaurant-technology
      savings are stored beside it as well, so none of those effects is buried inside company-operated
      margin.
    tags:
    - restaurant-pl
    - finance
    synonyms:
    - margin bridge
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: FINANCE
      object: FACT_MARGIN_BRIDGE_MONTH
      format: table
  grain:
    description: One row is the monthly margin bridge for one company-operated restaurant P&L.
    components:
    - identity_id: company_store_pl_identity
      dataset_columns:
      - company_store_pl_id
      description: The company-operated restaurant period result this monthly bridge explains.
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
    - identity_id: restaurant_identity
      dataset_columns:
      - restaurant_id
  columns:
  - name: company_store_pl_id
    description: Company-operated restaurant period P&L this bridge explains.
  - name: restaurant_id
    description: Company-operated restaurant. Partial reference to the restaurant master.
  - name: accounting_period_id
    description: Accounting month of the bridge.
  - name: currency_id
    description: Currency of the bridge amounts.
  - name: country_id
    description: Country of the restaurant. Partial reference to the organization country dimension.
  - name: segment_id
    description: Operating segment of the restaurant. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: company_operated_margin_amount
    description: Company-operated margin being explained for the month. Equal in meaning to the P&L margin.
      Not the sum of the effect columns.
    synonyms:
    - company-operated margin
  - name: inflation_effect_amount
    description: Change in company-operated margin attributed to cost inflation. Excludes mix and price.
      Beef and energy inflation amounts are portions of this effect, not extra effects added to it.
    synonyms:
    - inflation
  - name: beef_inflation_effect_amount
    description: Portion of the inflation effect that comes from beef cost. Separable from value mix and
      from price.
    synonyms:
    - beef cost inflation
  - name: energy_inflation_effect_amount
    description: Portion of the inflation effect that comes from energy cost. Separable from value mix
      and from price.
    synonyms:
    - energy cost inflation
  - name: mix_effect_amount
    description: Change in company-operated margin attributed to sales mix. Excludes inflation and price.
      The value-mix effect is the value-menu portion of this mix effect, not an extra effect added to
      it.
    synonyms:
    - mix
  - name: value_mix_effect_amount
    description: Portion of the mix effect that comes from a shift into value-menu sales. Separable from
      beef inflation and energy inflation.
    synonyms:
    - value mix
  - name: price_effect_amount
    description: Change in company-operated margin attributed to pricing taken. Excludes inflation and
      mix.
    synonyms:
    - price
    - pricing
  - name: meal_discount_sales_effect_amount
    description: Company-operated sales change attributed to the standardized meal discount. Stored beside,
      and not added to, the inflation, mix, and price split.
    synonyms:
    - standardized meal discount sales
  - name: sharp_price_point_sales_effect_amount
    description: Company-operated sales change attributed to sharp price points. Stored beside, and not
      added to, the standardized meal discount sales effect.
    synonyms:
    - sharp price point sales
  - name: meal_discount_margin_effect_amount
    description: Company-operated margin change attributed to the standardized meal discount. Answers
      whether that offer pressured restaurant margin. Not added to inflation_effect_amount.
    synonyms:
    - meal discount margin pressure
  - name: sharp_price_point_margin_effect_amount
    description: Company-operated margin change attributed to sharp price points. Answers whether those
      price points pressured restaurant margin. Not added to inflation_effect_amount.
    synonyms:
    - sharp price point margin pressure
  - name: technology_offset_amount
    description: Company-operated margin recovered from labor or throughput savings attributed to restaurant
      technology. Stored beside the inflation, mix, and price split so it can be compared with value-driven
      margin pressure.
    synonyms:
    - restaurant technology offset
  entity_definitions:
  - identity_id: company_store_pl_identity
    dataset_columns:
    - company_store_pl_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
