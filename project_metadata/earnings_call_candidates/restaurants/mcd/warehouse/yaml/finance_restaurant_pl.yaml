- node_id: sf:mcdonalds.finance.fact_commodity_cost
  descriptor:
    qualified_name: mcdonalds.finance.fact_commodity_cost
    display_name: Commodity cost
    description: Monthly commodity cost movement for beef and energy, by country and segment. Used to
      read commodity inflation and the beef-cost or energy-price outlook separately from company-operated
      margin and value mix.
    tags:
    - restaurant-pl
    - finance
    synonyms:
    - beef cost
    - energy cost
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: FINANCE
      object: FACT_COMMODITY_COST
      format: table
  grain:
    description: One row is the cost change and outlook for one commodity in one country, segment, currency,
      and accounting period.
    components:
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
    - identity_id: commodity_identity
      dataset_columns:
      - commodity_id
    - identity_id: country_identity
      dataset_columns:
      - country_id
    - identity_id: currency_identity
      dataset_columns:
      - currency_id
    - identity_id: segment_identity
      dataset_columns:
      - segment_id
  columns:
  - name: commodity_id
    description: Commodity. Partial reference to the supply commodity dimension.
  - name: commodity_group
    description: Local finance grouping of the commodity so beef and energy can be filtered in this slice.
    value_description: beef or energy
    synonyms:
    - beef
    - energy
  - name: accounting_period_id
    description: Accounting period of the cost movement.
  - name: currency_id
    description: Currency of the cost amounts.
  - name: country_id
    description: Country of the cost observation. Partial reference to the organization country dimension.
  - name: segment_id
    description: Operating segment of the cost observation. Partial reference to the organization segment
      dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: cost_change_amount
    description: Change in unit cost for the commodity during the accounting period. This is the inflation
      input, not a company-operated margin amount.
    synonyms:
    - commodity inflation
  - name: cost_outlook_amount
    description: Forward unit-cost outlook for the commodity. Used for the beef-cost outlook and for judging
      an energy-price spike.
    synonyms:
    - beef cost outlook
    - energy price outlook
  entity_definitions:
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: commodity_identity
    dataset_columns:
    - commodity_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    entity_universe: partial
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
