schema_version: '3'
nodes:
- node_id: sf:mcdonalds.finance.fact_company_store_pl
  descriptor:
    qualified_name: mcdonalds.finance.fact_company_store_pl
    display_name: Company-operated restaurant P&L
    description: Period profit and loss for a restaurant McDonald's operates. Sales, value-menu sales,
      and the value-mix flag are stored separately from food, paper, labor, and occupancy so margin can
      be read without folding in commodity inflation. Franchisee profit is not a column on this fact.
    tags:
    - restaurant-pl
    - finance
    synonyms:
    - company-operated P&L
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: FINANCE
      object: FACT_COMPANY_STORE_PL
      format: table
  grain:
    description: One row is the published P&L for one company-operated restaurant and one accounting period.
    components:
    - identity_id: company_store_pl_identity
      dataset_columns:
      - company_store_pl_id
  columns:
  - name: company_store_pl_id
    description: Surrogate key of the company-operated restaurant period P&L.
  - name: restaurant_id
    description: Company-operated restaurant. Partial reference to the restaurant master.
  - name: accounting_period_id
    description: Accounting period of the P&L.
  - name: currency_id
    description: Currency of the P&L amounts.
  - name: legal_entity_id
    description: Legal entity that operates the restaurant.
  - name: country_id
    description: Country of the restaurant. Partial reference to the organization country dimension.
  - name: segment_id
    description: Operating segment of the restaurant. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: sales_amount
    description: Company-operated restaurant sales for the period, before separating value-menu sales.
    synonyms:
    - restaurant sales
    - company-operated sales
  - name: food_cost_amount
    description: Food cost for the company-operated restaurant period. Stored as its own amount so it
      is not netted into the value-mix flag or the margin bridge.
    synonyms:
    - food cost
  - name: paper_cost_amount
    description: Paper cost for the company-operated restaurant period.
    synonyms:
    - paper cost
  - name: labor_cost_amount
    description: Labor cost for the company-operated restaurant period. Used to tell an operations cost
      problem from a value-menu sales mix.
    synonyms:
    - labor cost
  - name: occupancy_cost_amount
    description: Occupancy cost the company bears on the restaurant it operates. Distinct from rent income
      charged to franchisees.
    synonyms:
    - occupancy
  - name: company_operated_margin_amount
    description: Company-operated restaurant margin after sales, food cost, paper cost, labor cost, and
      occupancy. Not franchisee profit. The margin-bridge inflation, mix, and price effects explain the
      change in this amount and are not subtracted inside it.
    synonyms:
    - company-operated margin
    - company store margin
  - name: value_sales_amount
    description: Sales from value-menu items in the period. Kept separate from food, paper, labor, and
      occupancy so a value-menu mix can be compared with commodity inflation.
    synonyms:
    - value-menu sales
    - value mix sales
  - name: value_mix_flag
    description: Marks whether the restaurant period is classified as value-menu weighted. Does not change
      the cost amounts.
    value_description: Y or N
    synonyms:
    - value mix flag
  entity_definitions:
  - identity_id: company_store_pl_identity
    dataset_columns:
    - company_store_pl_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: country_identity
