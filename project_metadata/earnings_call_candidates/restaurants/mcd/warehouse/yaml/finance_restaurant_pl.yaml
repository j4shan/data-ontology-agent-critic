  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:mcdonalds.finance.fact_company_store_cost
  descriptor:
    qualified_name: mcdonalds.finance.fact_company_store_cost
    display_name: Company-operated restaurant cost
    description: Cost-element detail under a company-operated restaurant P&L. Food, paper, labor, and
      occupancy stay on separate elements so an operations problem can be separated from value-menu cost.
    tags:
    - restaurant-pl
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: mcdonalds.us-east-1
      database: MCDONALDS
      schema: FINANCE
      object: FACT_COMPANY_STORE_COST
      format: table
  grain:
    description: One row is one cost element for one company-operated restaurant period P&L, split between
      value-menu cost and the remaining operations cost.
    components:
    - identity_id: company_store_pl_identity
      dataset_columns:
      - company_store_pl_id
    - identity_id: cost_element_identity
      dataset_columns:
      - cost_element_id
    - dataset_columns:
      - value_menu_cost_flag
      description: Separates value-menu cost from the remaining operations cost for the same element.
  columns:
  - name: company_store_pl_id
    description: Company-operated restaurant period P&L this cost line belongs to.
  - name: restaurant_id
    description: Company-operated restaurant. Partial reference to the restaurant master.
  - name: accounting_period_id
    description: Accounting period of the cost.
  - name: cost_element_id
    description: Cost element, such as food, paper, labor, or occupancy.
  - name: currency_id
    description: Currency of the cost amount.
  - name: country_id
    description: Country of the restaurant. Partial reference to the organization country dimension.
  - name: segment_id
    description: Operating segment of the restaurant. Partial reference to the organization segment dimension.
  - name: segment_code
    description: Finance segment code for the row, used to separate the U.S., international operated markets,
      and developmental license markets.
    value_description: us, international_operated, or developmental_license
    synonyms:
    - operating segment
  - name: cost_amount
    description: Cost amount for the element on the company-operated restaurant period.
  - name: value_menu_cost_flag
    description: Marks whether this cost amount is attributed to value-menu items. N leaves the amount
      as the remaining operations cost.
    value_description: Y or N
  entity_definitions:
  - identity_id: company_store_pl_identity
