schema_version: '3'
nodes:
- node_id: sf:burger.organization.dim_country
  descriptor:
    qualified_name: burger.organization.dim_country
    display_name: Country
    description: Countries where Burger Inc restaurants operate, including the United States, France,
      the United Kingdom, Australia, and China.
    tags:
    - dimension
    - organization
    synonyms:
    - market country
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: ORGANIZATION
      object: DIM_COUNTRY
      format: table
  grain:
    description: One row is one country.
    components:
    - dataset_columns:
      - country_id
      identity_id: country_identity
  columns:
  - name: country_id
    description: Identifier of the country.
  - name: country_name
    description: Name of the country.
    value_description: Includes United States, France, United Kingdom, Australia, and China. United States
      belongs to segment united_states. France, the United Kingdom, and Australia belong to segment international_operated.
      China belongs to segment developmental_license.
  - name: iso_country_code
    description: ISO country code.
    value_description: Includes US, FR, GB, AU, and CN.
  - name: segment_id
    description: Reporting segment that contains the country.
  - name: population_growth_band
    description: Population-growth band of the country, used to separate slow-population markets from
      other markets.
    value_description: slow, moderate, or fast.
  entity_definitions:
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: complete
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: partial
- node_id: sf:burger.organization.dim_segment
  descriptor:
    qualified_name: burger.organization.dim_segment
    display_name: Segment
    description: Burger Inc reporting segments. The population is exactly the United States, international
      operated markets, and developmental-license markets.
    tags:
    - dimension
    - organization
    synonyms:
    - reporting segment
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: ORGANIZATION
      object: DIM_SEGMENT
      format: table
  grain:
    description: One row is one reporting segment.
    components:
    - dataset_columns:
      - segment_id
      identity_id: segment_identity
  columns:
  - name: segment_id
    description: Identifier of the reporting segment.
  - name: segment_code
    description: Stable code of the reporting segment.
    value_description: Exactly one of united_states, international_operated, developmental_license.
  - name: segment_name
    description: Display name of the reporting segment.
    value_description: United States, International Operated, or Developmental License.
  entity_definitions:
  - identity_id: segment_identity
    dataset_columns:
    - segment_id
    entity_universe: complete
