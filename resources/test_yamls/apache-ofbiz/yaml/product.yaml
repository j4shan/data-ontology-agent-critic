    description: Auth Error Message (long text).
    value_description: OFBiz field type long-varchar.
  - name: visual_theme_id
    description: Visual Theme Id (identifier).
    value_description: OFBiz field type id.
  - name: store_credit_account_enum_id
    description: Specify the type (Billing Account or Financial Account) of Store Credit Account used for refund return. Default
      to Financial Account. This field is override by ReturnHeader.billingAccountId or ReturnHeader.finAccountId, whichever
      is specified but if only finAccountId is specified explicitly then system will first try to locate any billing account
      with -ve amount. If found, then amount is credit to this billing account else the amount will be credit to the financial
      account of the user.
    value_description: OFBiz field type id.
  - name: use_primary_email_username
    description: Use Primary Email Username (indicator flag).
    value_description: OFBiz field type indicator.
  - name: require_customer_role
    description: Require Customer Role (indicator flag).
    value_description: OFBiz field type indicator.
  - name: auto_invoice_digital_items
    description: Default Y. Invoice digital items when order is placed rather than waiting for completing order items (though
      shipment/fulfillment).
    value_description: OFBiz field type indicator.
  - name: req_ship_addr_for_dig_items
    description: Default Y. Require Shipping Address for Digital Items? Note this only has an effect if there are ONLY digital
      goods in the cart.
    value_description: OFBiz field type indicator.
  - name: show_checkout_gift_options
    description: Show Checkout Gift Options (indicator flag).
    value_description: OFBiz field type indicator.
  - name: select_payment_type_per_item
    description: Select Payment Type Per Item (indicator flag).
  - name: show_prices_with_vat_tax
    description: Show Prices With Vat Tax (indicator flag).
    value_description: OFBiz field type indicator.
  - name: show_tax_is_exempt
    description: default Y; if set to N do not show isExempt checkbox for PartyTaxAuthInfo, always force to N.
  - name: vat_tax_auth_geo_id
    description: Vat Tax Auth Geo Id (identifier).
    value_description: OFBiz field type id.
  - name: vat_tax_auth_party_id
    description: Vat Tax Auth Party Id (identifier).
    value_description: OFBiz field type id.
  - name: enable_auto_suggestion_list
    description: The auto-suggestion list is a special ShoppingList that the addSuggestionsToShoppingList service will maintain
      for cross-sells of ordered items.
    value_description: OFBiz field type indicator.
  - name: enable_dig_prod_upload
    description: Enable Dig Prod Upload (indicator flag).
    value_description: OFBiz field type indicator.
  - name: prod_search_exclude_variants
    description: default Y; if set to Y an additional constraint will of isVariant!=Y will be added to all product searches
      for the store.
    value_description: OFBiz field type indicator.
  - name: dig_prod_upload_category_id
    description: Dig Prod Upload Category Id (identifier).
    value_description: OFBiz field type id.
  - name: auto_order_cc_try_exp
    description: For auto-orders try other Credit Card expiration dates (if date is wrong or general failure where type not
      known)?
    value_description: OFBiz field type indicator.
  - name: auto_order_cc_try_other_cards
    description: For auto-orders try other Credit Cards for the customer?
  - name: auto_order_cc_try_later_nsf
    description: For auto-orders if Credit Cards fails for NSF (Not Sufficient Funds) try again later?
    value_description: OFBiz field type indicator.
  - name: auto_order_cc_try_later_max
    description: For auto-orders if Credit Cards fails for NSF try again how many times?
    value_description: OFBiz field type numeric.
  - name: store_credit_valid_days
    description: How many days that store credit is valid for. Null value implies no expiration.
    value_description: OFBiz field type numeric.
  - name: auto_approve_invoice
    description: If Y or empty, sales invoices created from orders will be marked ready.
    value_description: OFBiz field type indicator.
  - name: auto_approve_order
    description: If N, orders will not be automatically approved when payment is authorized.
    value_description: OFBiz field type indicator.
  - name: ship_if_capture_fails
    description: If N, the captureOrderPayments will cause a service error if credit card capture fails.
    value_description: OFBiz field type indicator.
  - name: set_owner_upon_issuance
    description: If Y or empty, set the inventory item owner upon issuance.
    value_description: OFBiz field type indicator.
  - name: req_return_inventory_receive
    description: Default N. This is the default value for the ReturnHeader.needsInventoryReceive field. If set to Y return
      will automatically go to the Received status when Accepted instead of waiting for actual receipt of the return.
    value_description: OFBiz field type indicator.
  - name: add_to_cart_remove_incompat
    description: Default N. If Y then on add to cart remove all products in cart with a ProductAssoc record related to or
      from the product and with the PRODUCT_INCOMPATABLE type.
    value_description: OFBiz field type indicator.
  - name: add_to_cart_replace_upsell
    description: Default N. If Y then on add to cart remove all products in cart with a ProductAssoc record related from the
      product and with the PRODUCT_UPGRADE type.
    value_description: OFBiz field type indicator.
  - name: split_pay_pref_per_shp_grp
    description: Default N. If Y then before the order is stored the OrderPaymentPreference record will be split, one for
      each OrderItemShipGroup.
    value_description: OFBiz field type indicator.
  - name: managed_by_lot
    description: If Y, the preparator can choose the InventoryItem by this lotId when he makes the picklist.
    value_description: OFBiz field type indicator.
  - name: show_out_of_stock_products
    description: Default Y. If N then out of stock products will not be displayed on site.
    value_description: OFBiz field type indicator.
  - name: order_decimal_quantity
    description: use to indicate if decimal quantity can be ordered for this producStore. Default value is Y.
    value_description: OFBiz field type indicator.
  - name: allow_comment
    description: Allow comments for order line items per store.
    value_description: OFBiz field type indicator.
  - name: allocate_inventory
    description: Default N. If Y then allocation plans for the product will be created.
