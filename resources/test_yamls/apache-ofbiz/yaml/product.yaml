    description: Days To Cancel Non Pay (number).
    value_description: OFBiz field type numeric.
  - name: manualAuthIsCapture
    description: Manual Auth Is Capture (indicator flag).
    value_description: OFBiz field type indicator.
  - name: prorateShipping
    description: Prorate Shipping (indicator flag).
    value_description: OFBiz field type indicator.
  - name: prorateTaxes
    description: Prorate Taxes (indicator flag).
    value_description: OFBiz field type indicator.
  - name: viewCartOnAdd
    description: View Cart On Add (indicator flag).
    value_description: OFBiz field type indicator.
  - name: autoSaveCart
    value_description: OFBiz field type indicator.
  - name: autoApproveReviews
    description: Auto Approve Reviews (indicator flag).
    value_description: OFBiz field type indicator.
  - name: isDemoStore
    description: Is Demo Store (indicator flag).
    value_description: OFBiz field type indicator.
  - name: isImmediatelyFulfilled
    description: 'If immediately fulfilled (for physical stores, etc): don''t send email notices, don''t reserve inventory,
      and IFF inventory info isn''t found on the server then don''t issue inventory right away.'
    value_description: OFBiz field type indicator.
  - name: inventoryFacilityId
    description: Inventory Facility Id (identifier).
    value_description: OFBiz field type id.
  - name: oneInventoryFacility
    description: One Inventory Facility (indicator flag).
    value_description: OFBiz field type indicator.
  - name: checkInventory
    description: Check Inventory (indicator flag).
    value_description: OFBiz field type indicator.
  - name: reserveInventory
    description: Reserve Inventory (indicator flag).
    value_description: OFBiz field type indicator.
  - name: reserveOrderEnumId
    description: Reserve Order Enum Id (identifier).
    value_description: OFBiz field type id.
  - name: requireInventory
    description: Require Inventory (indicator flag).
    value_description: OFBiz field type indicator.
  - name: balanceResOnOrderCreation
    description: If set to Y, when a new sales order is created with backordered items, then reservations on the facility/product
      are reassigned according to the priority given by the shipBeforeDate field.
    value_description: OFBiz field type indicator.
  - name: requirementMethodEnumId
    description: Requirement Method Enum Id (identifier).
  - name: orderNumberPrefix
    description: Order Number Prefix (long identifier).
    value_description: OFBiz field type id-long.
  - name: defaultLocaleString
    description: Default Locale String (very short text).
    value_description: OFBiz field type very-short.
  - name: defaultCurrencyUomId
    description: Default Currency Uom Id (identifier).
    value_description: OFBiz field type id.
  - name: defaultTimeZoneString
    description: Default Time Zone String (long identifier).
    value_description: OFBiz field type id-long.
  - name: defaultSalesChannelEnumId
