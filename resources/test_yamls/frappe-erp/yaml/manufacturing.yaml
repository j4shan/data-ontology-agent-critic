- node_id: sql-database:frappe-erp.manufacturing.bom_creator
  descriptor:
    qualified_name: frappe-erp.manufacturing.bom_creator
    display_name: BOM Creator
    description: Build a multi-level BOM by hand or from a CAD design, plan its operations, and create
      the BOMs.
    synonyms:
    - tabBOM Creator
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: mariadb.frappe.internal
      database: frappe
      dialect: mariadb
      schema: manufacturing
      object: tabBOM Creator
  grain:
    description: One row per BOM Creator document.
    components:
    - identity_id: bom_creator_identity
      dataset_columns:
      - name
      description: Document name
  columns:
  - name: design_name
    value_description: Data
  - name: item_code
    description: Finished Good
    value_description: Link
  - name: company
    description: Company
    value_description: Link
  - name: design_file
    description: Design File. STEP file (.step or .stp) or CSV file. A CSV file needs a Level or Item
      Number column, a Part Number or Part Name column, and a Quantity column.
    value_description: Attach
  - name: track_semi_finished_goods
    description: Produce Item per Operation. Each operation makes an item that a later operation can use.
      The last operation makes the finished good.
    synonyms:
    - Produce Item per Operation
  - name: qty
    description: Finished Good Quantity. The BOM of the finished good is made for this quantity. Part
      quantities are for one finished good.
    value_description: Float
  - name: rm_cost_as_per
    description: Rate Of Materials Based On
    value_description: Valuation Rate, Last Purchase Rate, Price List
  - name: buying_price_list
    description: Price List
    value_description: Link
  - name: price_list_currency
    description: Price List Currency
    value_description: Link
  - name: plc_conversion_rate
    description: Price List Exchange Rate
    value_description: Float
  - name: set_rate_based_on_warehouse
    description: Set Valuation Rate Based on Source Warehouse
    value_description: Check
  - name: default_warehouse
    description: Default Source Warehouse
    value_description: Link
  - name: currency
    description: Currency
    value_description: Link
  - name: conversion_rate
    value_description: Float
  - name: raw_material_cost
