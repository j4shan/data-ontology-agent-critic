- node_id: sql-database:frappe-erp.manufacturing.manufacturing_settings
  descriptor:
    qualified_name: frappe-erp.manufacturing.manufacturing_settings
    display_name: Manufacturing Settings
    tags:
    - manufacturing
    - erpnext
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: mariadb.frappe.internal
      database: frappe
      dialect: mariadb
      schema: manufacturing
      object: tabManufacturing Settings
  grain: unknown
  columns:
  - name: material_consumption
    description: Allow Continuous Material Consumption. Allow material consumptions without immediately
      manufacturing finished goods against a Work Order
    value_description: Check
    synonyms:
    - Allow Continuous Material Consumption
  - name: get_rm_cost_from_consumption_entry
    description: Get Raw Materials Cost from Consumption Entry
    value_description: Check
  - name: backflush_raw_materials_based_on
    description: Backflush Raw Materials Based On
    value_description: BOM, Material Transferred for Manufacture
  - name: validate_components_quantities_per_bom
    description: Validate Components and Quantities Per BOM
    value_description: Check
  - name: update_bom_costs_automatically
    description: Update BOM cost automatically via scheduler, based on the latest Valuation Rate/Price
      List Rate/Last Purchase Rate of raw materials
    value_description: Check
    synonyms:
    - Update BOM Cost Automatically
  - name: allow_editing_of_items_and_quantities_in_work_order
    description: Allow Editing of Items and Quantities in Work Order. If enabled, the system will allow
      users to edit the raw materials and their quantities in the Work Order. The system will not reset
      the quantities as per the BOM, if the user has changed them.
    value_description: Check
  - name: allow_alternative_finished_goods
    description: Allow Alternative Finished Goods. If enabled, the produced item of a Work Order can be
      converted into one of its alternative items (defined via Item Alternative) using the 'Change Finished
      Item' action. The conversion creates a Repack entry linked to the Work Order.
    value_description: Check
  - name: overproduction_percentage_for_sales_order
    value_description: Percent
  - name: overproduction_percentage_for_work_order
    description: Overproduction Percentage For Work Order
    value_description: Percent
  - name: transfer_extra_materials_percentage
    description: Transfer Extra Raw Materials to WIP (%). The user will be able to transfer additional
      materials from the store to the Work in Progress (WIP) warehouse.
    value_description: Percent
    synonyms:
    - Transfer Extra Raw Materials to WIP (%)
  - name: add_corrective_operation_cost_in_finished_good_valuation
    description: Add Corrective Operation Cost in Finished Good Valuation
    value_description: Check
  - name: enforce_time_logs
    description: Enforce Time Logs. Enabling this checkbox will force each Job Card Time Log to have From
      Time and To Time
    value_description: Check
  - name: job_card_excess_transfer
    description: Allow Excess Material Transfer. Allow transferring raw materials even after the Required
      Quantity is fulfilled
    value_description: Check
    synonyms:
    - Allow Excess Material Transfer
  - name: disable_capacity_planning
    description: Disable Capacity Planning
    value_description: Check
  - name: allow_overtime
    description: Allow Overtime. Plan time logs outside Workstation working hours
    value_description: Check
  - name: allow_production_on_holidays
    description: Allow Production on Holidays
    value_description: Check
  - name: capacity_planning_for_days
    description: Capacity Planning For (Days). Plan operations X days in advance
    value_description: Int
    synonyms:
    - Capacity Planning For (Days)
  - name: mins_between_operations
    description: 'Time Between Operations (Mins). Default: 10 mins'
    value_description: Int
    synonyms:
    - Time Between Operations (Mins)
  - name: set_op_cost_and_secondary_items_from_sub_assemblies
    description: Set Operating Cost / Secondary Items From Sub-assemblies. To include sub-assembly costs
      and secondary items in Finished Goods on a work order without using a job card, when the 'Use Multi-Level
      BOM' option is enabled.
    value_description: Check
  - name: make_serial_no_batch_from_work_order
    description: Make Serial No / Batch from Work Order. System will automatically create the serial numbers
      / batch for the Finished Good on submission of work order
    value_description: Check
    synonyms:
    - Make Serial No / Batch from Work Order
  entity_definitions: []
