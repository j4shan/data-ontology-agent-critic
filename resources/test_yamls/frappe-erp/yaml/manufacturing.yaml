- node_id: sql-database:frappe-erp.manufacturing.bom
  descriptor:
    qualified_name: frappe-erp.manufacturing.bom
    display_name: BOM
    description: The materials and operations it takes to make an item.
    synonyms:
    - tabBOM
    tags:
    - manufacturing
    - erpnext
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: mariadb.frappe.internal
      database: frappe
      dialect: mariadb
      schema: manufacturing
      object: tabBOM
  grain:
    description: One row per BOM document.
    components:
    - identity_id: bom_identity
      dataset_columns:
      - name
      description: Document name
  columns:
  - name: company
    description: Company
    value_description: Link
  - name: item
    description: Item to manufacture. The final item that will be produced using this BOM.
    value_description: Link
    synonyms:
    - Item to manufacture
  - name: quantity
    description: Quantity (Output Qty). How many units of the final product this BOM makes.
    value_description: Float
    synonyms:
    - Quantity (Output Qty)
  - name: uom
    description: Unit of Measure
    value_description: Link
  - name: with_operations
    description: With Operations. Manage cost of operations
    value_description: Check
  - name: track_semi_finished_goods
    description: Produce Item per Operation. Each operation produces its own output item and puts it in
      stock, for example Cut Sheet, then Painted Sheet, then the final Box.
    value_description: Check
    synonyms:
    - Produce Item per Operation
  - name: transfer_material_against
    description: Transfer material against
    value_description: Work Order, Job Card
  - name: routing
    description: Routing
    value_description: Link
  - name: fg_based_operating_cost
    description: Finished goods based operating cost
    value_description: Check
  - name: operating_cost_per_bom_quantity
    description: Operating cost per BOM quantity
    value_description: Currency
  - name: process_loss_percentage
    description: '% Process loss'
    value_description: Percent
  - name: process_loss_qty
    description: Process loss qty
    value_description: Float
  - name: set_qty_based_on_percentage
    description: Set component quantities based on percentage. Component quantities are derived from their
      percentage of the Output Qty. One component row can be marked as Balance Item to absorb the remaining
      percentage.
    value_description: Check
  - name: cost_allocation_per
    description: '% Cost allocation for Finished Good'
  - name: cost_allocation
    description: Cost allocation for Finished Good
  - name: is_active
    description: Is active
    value_description: Check
  - name: is_default
    description: Set as default. This BOM will be selected by default in Work Orders etc. when the Item
      is selected.
    value_description: Check
    synonyms:
    - Set as default
  - name: allow_alternative_item
    description: Allow alternative raw material. Enable this to select an alternative material when the
      required item is unavailable.
    value_description: Check
    synonyms:
    - Allow alternative raw material
  - name: is_phantom_bom
    description: Set as Phantom BOM. Enable this to define the BOM as a logical grouping of raw materials
      without producing an item. The Production Item must be non-stock and will be automatically exploded
      when used as a raw material in another BOM.
    value_description: Check
    synonyms:
    - Set as Phantom BOM
  - name: inspection_required
    description: Quality Inspection required
    value_description: Check
  - name: quality_inspection_template
    description: Quality Inspection Template
    value_description: Link
  - name: default_source_warehouse
    description: Default Source Warehouse
    value_description: Link
  - name: default_target_warehouse
    description: Default Target Warehouse
    value_description: Link
  - name: backflush_based_on
    description: Based on. Controls how raw materials are consumed during the ‘Manufacture’ stock entry.
    value_description: BOM, Material Transferred for Manufacture
    synonyms:
    - Based on
  - name: operating_cost
    description: Operating Cost
    value_description: Currency
  - name: raw_material_cost
    description: Raw Material Cost
    value_description: Currency
  - name: secondary_items_cost
    description: Secondary Items Cost
    value_description: Currency
  - name: base_operating_cost
    description: Operating Cost (Company Currency)
    value_description: Currency
  - name: base_raw_material_cost
    description: Raw Material Cost (Company Currency)
    value_description: Currency
  - name: base_secondary_items_cost
    description: Secondary Items Cost (Company Currency)
    value_description: Currency
  - name: total_cost
    description: Total Cost
    value_description: Currency
  - name: base_total_cost
    description: Total Cost (Company Currency)
    value_description: Currency
  - name: rm_cost_as_per
    description: Rate of Materials based on
