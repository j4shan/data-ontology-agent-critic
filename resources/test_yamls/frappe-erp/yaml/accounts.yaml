- node_id: sql-database:frappe-erp.accounts.accounts_settings
  descriptor:
    qualified_name: frappe-erp.accounts.accounts_settings
    display_name: Accounts Settings
    description: The Accounts Settings single settings record in the Accounts module.
    tags:
    - accounts
    - erpnext
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: mariadb.frappe.internal
      database: frappe
      dialect: mariadb
      schema: accounts
      object: tabAccounts Settings
  grain: unknown
  columns:
  - name: unlink_payment_on_cancellation_of_invoice
  - name: unlink_advance_payment_on_cancelation_of_order
    description: Unlink Advance Payment on cancellation of order
    value_description: Check
  - name: delete_linked_ledger_entries
    description: Delete Accounting and Stock Ledger entries on deletion of transaction
    value_description: Check
  - name: enable_immutable_ledger
    description: Enable Immutable Ledger. On enabling this cancellation entries will be posted on the
      actual cancellation date and reports will consider cancelled entries as well
    value_description: Check
  - name: check_supplier_invoice_uniqueness
    description: Check Supplier invoice number uniqueness. Enabling this ensures each Purchase Invoice
      has a unique value in Supplier Invoice No. field within a particular fiscal year
    value_description: Check
    synonyms:
    - Check Supplier invoice number uniqueness
  - name: automatically_fetch_payment_terms
    description: Automatically fetch Payment Terms from Order/Quotation. Payment Terms from orders will
      be fetched into the invoices as is
    value_description: Check
    synonyms:
    - Automatically fetch Payment Terms from Order/Quotation
  - name: enable_subscription
    description: Enable Subscription tracking in invoice
    value_description: Check
  - name: enable_common_party_accounting
    description: Enable Common Party Accounting. Learn about Common Party
    value_description: Check
  - name: allow_multi_currency_invoices_against_single_party_account
    description: Allow multi-currency invoices against single party account. Enabling this will allow
      creation of multi-currency invoices against single party account in company currency
    value_description: Check
    synonyms:
    - Allow multi-currency invoices against single party account
  - name: confirm_before_resetting_posting_date
    description: Confirm before resetting posting date. If enabled, user will be alerted before resetting
      posting date to current date in relevant transactions
    value_description: Check
  - name: preview_mode
    description: Preview mode. Runs a preview check on save before submission without making any actual
      changes.
    value_description: Check
  - name: book_stock_expense_gl_entries
    description: Book Stock Expense GL Entries. Books Purchase Expense and Expenses Added To Stock account
      pairs against stock value. On enabling this, the accounts become mandatory in Company or Item Defaults
      for Purchase Receipt, Purchase Invoice, Stock Entry, Stock Reconciliation and Landed Cost Voucher
  - name: enable_discounts_and_margin
    description: Enable Discounts and Margin. Apply discounts and margins on products
    value_description: Check
  - name: enable_accounting_dimensions
    description: Enable Accounting Dimensions. Enable cost center, projects and other custom accounting
      dimensions
    value_description: Check
  - name: merge_similar_account_heads
    description: Merge similar Account Heads. Merge rows with the same account head in the ledger for
      Journal Entries and Payment Entries only.
    value_description: Check
  - name: book_deferred_entries_based_on
    description: Book Deferred entries based on. If "Months" is selected, a fixed amount will be booked
      as deferred revenue or expense for each month irrespective of the number of days in a month. It
      will be prorated if deferred revenue or expense is not booked for an entire month
    value_description: Days, Months
  - name: automatically_process_deferred_accounting_entry
    description: Automatically process deferred Accounting entry
    value_description: Check
  - name: book_deferred_entries_via_journal_entry
    description: Book deferred entries via Journal Entry. If this is unchecked, direct GL entries will
      be created to book deferred revenue or expense
    value_description: Check
  - name: submit_journal_entries
    description: Submit Journal entries. If this is unchecked Journal Entries will be saved in a Draft
      state and will have to be submitted manually
    value_description: Check
  - name: determine_address_tax_category_from
    description: Determine Address Tax Category from. Address used to determine Tax Category in transactions
    value_description: Billing Address, Shipping Address
  - name: add_taxes_from_item_tax_template
    description: Automatically add Taxes and Charges from Item Tax Template
    value_description: Check
  - name: add_taxes_from_taxes_and_charges_template
    description: Automatically add taxes from Taxes and Charges Template. If no taxes are set, and Taxes
      and Charges Template is selected, the system will automatically apply the taxes from the chosen
      template.
    value_description: Check
    synonyms:
    - Automatically add taxes from Taxes and Charges Template
  - name: book_tax_discount_loss
    value_description: Check
    synonyms:
    - Book tax loss on early payment discount
  - name: round_row_wise_tax
    description: Round tax amount row-wise. Tax Amount will be rounded on a row(items) level
    synonyms:
    - Round tax amount row-wise
  - name: show_inclusive_tax_in_print
    description: Show inclusive tax in print
    value_description: Check
  - name: show_taxes_as_table_in_print
    description: Show taxes as table in print
    value_description: Check
  - name: show_payment_schedule_in_print
    description: Show Payment Schedule in print
    value_description: Check
  - name: maintain_same_internal_transaction_rate
    description: Maintain same rate throughout internal Transaction
    value_description: Check
  - name: fetch_valuation_rate_for_internal_transaction
    description: Fetch valuation rate for internal Transaction
    value_description: Check
  - name: maintain_same_rate_action
    description: Action if same rate is not maintained throughout internal transaction
    value_description: Stop, Warn
  - name: role_to_override_stop_action
    description: Role allowed to override stop action
    value_description: Link
  - name: allow_stale
    description: Allow Stale Exchange Rates. System will use the latest saved Currency Exchange rate on
      or before the transaction date, however old it is. Uncheck to ignore rates older than Stale Days
      and fetch a fresh rate from the exchange rate provider instead.
    value_description: Check
    synonyms:
    - Allow Stale Exchange Rates
  - name: allow_pegged_currencies_exchange_rates
    description: 'Allow Implicit Pegged Currency Conversion. System will do an implicit conversion using
      the pegged currency. Ex: Instead of AED -> INR, system will do AED -> USD -> INR using the pegged
      exchange rate of AED against USD.'
    value_description: Check
    synonyms:
    - Allow Implicit Pegged Currency Conversion
  - name: stale_days
    description: Stale Days
    value_description: Int
  - name: auto_reconcile_payments
    description: Auto reconcile Payments
    value_description: Check
  - name: exchange_gain_loss_posting_date
    description: Posting Date inheritance for exchange gain / loss. Only applies for Normal Payments
    value_description: Invoice, Payment, Reconciliation Date
    synonyms:
    - Posting Date inheritance for exchange gain / loss
  - name: auto_reconciliation_job_trigger
    description: Auto Reconciliation job trigger. Interval should be between 1 to 59 MInutes
    value_description: Int
  - name: reconciliation_queue_size
    description: Reconciliation queue size. Documents Processed on each trigger. Queue Size should be
      between 5 and 100
    value_description: Int
  - name: fetch_payment_schedule_in_payment_request
    description: Fetch Payment Schedule in Payment Request
    value_description: Check
  - name: enable_loyalty_point_program
    description: Enable Loyalty Point Program
    value_description: Check
  - name: make_payment_via_journal_entry
    description: Make Payment via Journal Entry
    value_description: Check
  - name: over_billing_allowance
    description: Over Billing Allowance (%). The percentage you are allowed to bill more against the amount
      ordered. For example, if the order value is $100 for an item and tolerance is set as 10%, then you
      are allowed to bill up to $110
    value_description: Currency
  - name: credit_controller
    description: Role allowed to bypass credit limit
    value_description: Link
  - name: role_allowed_to_over_bill
    description: Role Allowed to over bill. Users with this role are allowed to over bill above the allowance
      percentage
    value_description: Link
  - name: enable_overdue_billing_threshold
    description: Prevent Sales Invoice when Customer is Overdue. Enabling this option prevents the creation
      of a new Sales Invoice when the customer has an overdue limit set and their outstanding overdue
      amount exceeds that limit.
    value_description: Check
  - name: role_allowed_to_bypass_overdue_billing
    description: Role Allowed to Bypass Over Billing Restriction. Users with this role can still submit
      invoices for customers who have crossed their Overdue Limit.
    value_description: Link
    synonyms:
    - Role Allowed to Bypass Over Billing Restriction
  - name: book_asset_depreciation_entry_automatically
    description: Book Asset Depreciation entry automatically
    value_description: Check
  - name: calculate_depr_using_total_days
    description: Calculate daily depreciation using total days in depreciation period. Enable this option
      to calculate daily depreciation by considering the total number of days in the entire depreciation
      period, (including leap years) while using daily pro-rata based depreciation
    value_description: Check
    synonyms:
    - Calculate daily depreciation using total days in depreciation period
  - name: role_to_notify_on_depreciation_failure
    description: Role to Notify on Depreciation Failure. Users with this role will be notified if the
      asset depreciation gets failed
    value_description: Link
  - name: ignore_account_closing_balance
    description: Ignore Account closing balance. Financial reports will be generated using GL Entry doctypes
      (should be enabled if Period Closing Voucher is not posted for all years sequentially or missing)
    value_description: Check
  - name: use_legacy_controller_for_pcv
    description: Use legacy controller for Period Closing Voucher
  - name: pcv_job_timeout
    description: PCV Job Timeout (seconds). Timeout (in seconds) for each background job enqueued by Process
      Period Closing Voucher
    value_description: Int
    synonyms:
    - PCV Job Timeout (seconds)
  - name: disable_include_dimensions
    description: Disable "Consider Accounting Dimension" Filter
    value_description: Check
  - name: general_ledger_remarks_length
    description: General Ledger remarks length. Truncates 'Remarks' column to set character length
  - name: receivable_payable_fetch_method
    description: Data fetch method
    value_description: Buffered Cursor, UnBuffered Cursor
  - name: default_ageing_range
    description: Default Ageing Range
    value_description: Data
  - name: receivable_payable_remarks_length
    description: Accounts Receivable / Payable remarks length. Truncates 'Remarks' column to set character
      length
    value_description: Int
    synonyms:
    - Accounts Receivable / Payable remarks length
  - name: ignore_is_opening_check_for_reporting
    description: Ignore Is Opening check for reporting. Ignores legacy Is Opening field in GL Entry that
      allows adding opening balance post the system is in use while generating reports
  - name: show_balance_in_coa
    description: Show balances in Chart of Accounts
    value_description: Check
  - name: enable_party_matching
    description: Enable Automatic Party Matching. Auto match and set the Party in Bank Transactions
    value_description: Check
    synonyms:
    - Enable Automatic Party Matching
  - name: automatically_run_rules_on_unreconciled_transactions
    value_description: Check
  - name: enable_fuzzy_matching
    description: Enable Fuzzy Matching. Approximately match the description/party name against parties
    value_description: Check
  - name: transfer_match_days
    description: Match transfers within 'N' days. Number of days to consider for matching transfers across
      bank accounts
    value_description: Int
    synonyms:
    - Match transfers within 'N' days
  - name: create_pr_in_draft_status
    description: Create payment requests in Draft status. Payment Requests made from Sales / Purchase
      Invoice will be put in Draft explicitly
    value_description: Check
    synonyms:
    - Create payment requests in Draft status
  - name: use_legacy_budget_controller
    description: Use legacy Budget Controller. Enable this if you are experiencing issues with the new
      budget controller. Uses the older budget validation logic
    value_description: Check
