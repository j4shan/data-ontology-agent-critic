schema_version: '4'
nodes:
- node_id: sql-database:frappe-erp.selling.customer
  descriptor:
    qualified_name: frappe-erp.selling.customer
    display_name: Customer
    description: A company or person you sell goods or services to.
    synonyms:
    - tabCustomer
    tags:
    - selling
    - erpnext
  accessor:
    schema_id: accessor.sql-database.v1
    properties:
      host: mariadb.frappe.internal
      database: frappe
      dialect: mariadb
      schema: frappe
      object: tabCustomer
  grain:
    description: One row per Customer document.
    components:
    - identity_id: customer_identity
      dataset_columns:
      - name
      description: Document name
  columns:
  - name: naming_series
    value_description: CUST-.YYYY.-
  - name: customer_name
    description: Customer Name
    value_description: Data
  - name: alias
    description: Alias
    value_description: Data
  - name: customer_type
    description: Customer Type
    value_description: Company, Individual, Partnership
  - name: gender
    description: Gender
    value_description: Link
  - name: customer_group
    description: Customer Group
    value_description: Link
  - name: territory
    description: Territory
    value_description: Link
  - name: image
    description: Image
  - name: default_currency
    description: Billing Currency. All invoices and orders for this customer will be created in this currency.
    value_description: Link
    synonyms:
    - Billing Currency
  - name: default_bank_account
    description: Company Bank Account. Pre-filled on payment entries for this customer. Must be a company
      account.
    value_description: Link
    synonyms:
    - Company Bank Account
  - name: default_price_list
    description: Price List. Fetched automatically on sales orders and invoices for this customer.
    value_description: Link
  - name: payment_terms
    description: Payment Terms Template. Defines when payment is due (e.g. Net 30, 50% advance). Applied
      automatically on invoices for this customer.
    value_description: Link
    synonyms:
    - Payment Terms Template
  - name: loyalty_program
    description: Loyalty Program. Loyalty scheme this customer earns points under. Auto-assigned if a
      matching program exists.
    value_description: Link
  - name: loyalty_program_tier
    value_description: Data
  - name: customer_primary_address
  - name: primary_address
    description: Primary Address
    value_description: Text Editor
  - name: customer_primary_contact
    description: Customer Primary Contact. Reselect, if the chosen contact is edited after save
    value_description: Link
  - name: mobile_no
    description: Mobile No
    value_description: Read Only
  - name: email_id
    description: Email Id
    value_description: Read Only
  - name: first_name
    description: First Name
    value_description: Read Only
  - name: last_name
    description: Last Name
    value_description: Read Only
  - name: is_internal_customer
    description: Is Internal Customer. Mark if this customer represents an internal company. Enables inter-company
      transactions.
    value_description: Check
  - name: represents_company
    description: Represents Company. Select the related company that this Customer represents for inter-company
      transactions.
    value_description: Link
  - name: tax_id
    description: Tax ID
    value_description: Data
  - name: tax_category
    description: Tax Category. Controls which tax template is auto-applied when this customer is selected
      on a transaction.
    value_description: Link
  - name: tax_withholding_group
    description: Tax Withholding Group. Select the group first to filter the applicable withholding categories
      below.
    value_description: Link
  - name: tax_withholding_category
    description: Tax Withholding Category. TDS/TCS is calculated at the rate defined here on every payment
      from this customer.
    value_description: Link
  - name: restrict_to_companies
    description: Restrict to Companies. If checked, this Customer is only available for transactions in
      the companies listed below.
    value_description: Check
  - name: so_required
    description: Allow sales invoice creation without sales order
    value_description: Check
  - name: dn_required
    description: Allow sales invoice creation without delivery note
    value_description: Check
  - name: disabled
    value_description: Check
  - name: is_frozen
    description: Is Frozen. Blocks new transactions and further accounting entries on this customer's
      account. Only users with the role set in Company's "Roles Allowed to Set and Edit Frozen Account
      Entries" can transact.
    value_description: Check
  - name: on_hold
    description: Block Customer. Blocks saving or submitting Sales Orders, Delivery Notes, Sales Invoices
      and POS Invoices for this customer.
    value_description: Check
    synonyms:
    - Block Customer
  - name: release_date
    description: Release Date. Leave blank if the Customer is blocked indefinitely
    value_description: Date
  - name: account_manager
    description: Account Manager
    value_description: Link
  - name: default_sales_partner
    description: Sales Partner
    value_description: Link
  - name: default_commission_rate
    description: Commission Rate
    value_description: Float
  - name: lead_name
    description: Lead
    value_description: Link
  - name: opportunity_name
    description: Opportunity
    value_description: Link
  - name: prospect_name
    description: Prospect
    value_description: Link
  - name: market_segment
    description: Market Segment. Classify the type of market this customer belongs to, used for sales
      analysis and targeting.
    value_description: Link
  - name: industry
    description: Industry
    value_description: Link
  - name: website
    description: Website
    value_description: Data
  - name: language
    description: Print Language
    value_description: Link
  - name: customer_pos_id
    description: Customer POS ID
    value_description: Data
  - name: customer_details
  - name: name
    description: Primary key of the Customer document.
    value_description: Data
    synonyms:
    - ID
  - name: owner
    description: User who created the document.
    value_description: Link
    synonyms:
    - Created By
  - name: creation
    description: Datetime when the document was created.
    value_description: Datetime
    synonyms:
    - Created On
  - name: modified
    description: Datetime when the document was last updated.
    value_description: Datetime
    synonyms:
    - Last Updated On
  - name: modified_by
    description: User who last updated the document.
    value_description: Link
    synonyms:
    - Last Updated By
  - name: docstatus
    description: 'Document status: 0 is Draft, 1 is Submitted, and 2 is Cancelled.'
    value_description: Int
    synonyms:
    - Document Status
  - name: idx
    description: Row index among sibling rows.
    synonyms:
    - Index
  entity_definitions:
  - identity_id: gender_identity
    dataset_columns:
    - gender
    entity_universe: partial
    unique: unknown
    total: unknown
    conforms: true
    entity_metadata:
      expression_context: MariaDB column reference
    description: Reference to a Gender document.
  - identity_id: customer_group_identity
