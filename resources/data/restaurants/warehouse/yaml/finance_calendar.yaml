schema_version: '3'
nodes:
- node_id: sf:burger.calendar.dim_calendar_day
  descriptor:
    qualified_name: burger.calendar.dim_calendar_day
    display_name: Calendar day
    description: Conformed calendar day for posting dates, support-payment windows, and exchange rates.
    tags:
    - calendar
    - finance
    synonyms:
    - date dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: CALENDAR
      object: DIM_CALENDAR_DAY
      format: table
  grain:
    description: One row is one reporting calendar day.
    components:
    - identity_id: calendar_day_identity
      dataset_columns:
      - calendar_day_id
  columns:
  - name: calendar_day_id
    description: Surrogate key of the reporting calendar day.
  - name: calendar_date
    description: Civil date represented by the calendar day.
  - name: accounting_period_id
    description: Accounting period that contains this calendar day.
  - name: fiscal_year
    description: Fiscal year that contains this calendar day.
  - name: fiscal_month
    description: Fiscal month number that contains this calendar day.
  - name: fiscal_quarter
    description: Fiscal quarter that contains this calendar day.
  entity_definitions:
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    entity_universe: complete
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:burger.finance.dim_accounting_period
  descriptor:
    qualified_name: burger.finance.dim_accounting_period
    display_name: Accounting period
    description: Fiscal month used to close company-operated margins, the ledger, royalties, rent, capital,
      and segment consolidation.
    tags:
    - calendar
    - finance
    synonyms:
    - fiscal period
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: FINANCE
      object: DIM_ACCOUNTING_PERIOD
      format: table
  grain:
    description: One row is one fiscal accounting month.
    components:
    - identity_id: accounting_period_identity
      dataset_columns:
      - accounting_period_id
  columns:
  - name: accounting_period_id
    description: Surrogate key of the fiscal accounting month.
  - name: period_label
    description: Display label of the fiscal month.
  - name: fiscal_year
    description: Fiscal year of the accounting period.
  - name: fiscal_month
    description: Fiscal month number within the fiscal year.
  - name: period_start_calendar_day_id
    description: First calendar day of the accounting period.
  - name: period_end_calendar_day_id
    description: Last calendar day of the accounting period.
  entity_definitions:
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: complete
  - identity_id: calendar_day_identity
    dataset_columns:
    - period_end_calendar_day_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - period_start_calendar_day_id
    entity_universe: partial
