schema_version: '3'
logical_identities:
  guest_visit_identity:
    name: Guest visit
    description: One guest occasion at a Burger Inc restaurant. Traffic counts can exist without a closed
      check.
    synonyms:
    - guest occasion
    - traffic occasion
  check_identity:
    name: Check
    description: One commercial transaction ticket. Several guests can share one check.
    synonyms:
    - transaction
    - ticket
  product_identity:
    name: Product
    description: One sellable menu item, including food, beverages, and limited-time items.
    synonyms:
    - menu item
  product_category_identity:
    name: Product category
    description: A menu grouping used for mix, including chicken, beef, and beverages.
    synonyms:
    - menu category
  offer_identity:
    name: Offer
    description: A value offer iteration, including a meal discount, a sharp price point, or an everyday
      value meal.
    synonyms:
    - value offer
    - deal
  loyalty_member_identity:
    name: Loyalty member
    description: A person enrolled in Burger Inc loyalty.
    synonyms:
    - member
  daypart_identity:
    name: Daypart
    description: A serving period such as breakfast, lunch, afternoon, dinner, or late night.
    synonyms:
    - serving period
  income_cohort_identity:
    name: Income cohort
    description: A guest income band used to compare lower-, middle-, and higher-income demand.
    synonyms:
    - income band
  channel_identity:
    name: Channel
    description: How the guest ordered, including in restaurant, drive thru, kiosk, digital, and delivery.
    synonyms:
    - order channel
  marketing_campaign_identity:
    name: Marketing campaign
    description: A marketing effort, including its development process, tactic, and event tie-in.
    synonyms:
    - campaign
  beverage_platform_identity:
    name: Beverage platform
    description: A beverage lineup or brand platform, including energy drinks and the rest of the lineup.
    synonyms:
    - beverage lineup
    - beverage brand
  protein_identity:
    name: Protein
    description: The primary protein of a food item, including chicken and beef.
    synonyms:
    - primary protein
  restaurant_identity:
    name: Restaurant
    description: A Burger Inc restaurant site.
    synonyms:
    - store
    - restaurant site
  franchisee_identity:
    name: Franchisee
    description: A franchisee that operates Burger Inc restaurants, including a conventional franchisee
      and a developmental licensee.
    synonyms:
    - franchise owner
    - licensee
  operator_identity:
    name: Operator
    description: The operator accountable for a restaurant, either a franchise operator or a company operator.
    synonyms:
    - store operator
  ownership_spell_identity:
    name: Ownership spell
    description: One continuous interval during which a restaurant is company-operated or operated by
      one franchisee.
    synonyms:
    - ownership interval
  development_project_identity:
    name: Development project
    description: A new-restaurant or remodel project in the development plan.
    synonyms:
    - development project
  remodel_identity:
    name: Remodel
    description: One restaurant remodel, including its cost, kitchen and experience scope, and the split
      of company and franchisee funding.
    synonyms:
    - restaurant remodel
    - experience remodel
  kitchen_asset_identity:
    name: Kitchen asset
    description: A kitchen equipment or layout standard used to reach taste and quality goals.
    synonyms:
    - kitchen equipment
    - layout standard
  supplier_identity:
    name: Supplier
    description: A supplier of restaurant commodities or kitchen equipment.
    synonyms:
    - vendor
  commodity_identity:
    name: Commodity
    description: A restaurant supply commodity, including beef, chicken, and energy.
    synonyms:
    - supply commodity
  distribution_center_identity:
    name: Distribution center
    description: A distribution center that ships commodities to restaurants.
    synonyms:
    - warehouse
    - DC
  country_identity:
    name: Country
    description: A country in which Burger Inc restaurants operate. The country population includes the
      United States, France, the United Kingdom, Australia, and China.
    synonyms:
    - market country
  segment_identity:
    name: Segment
    description: A Burger Inc reporting segment. The population is exactly united_states, international_operated,
      and developmental_license.
    synonyms:
    - reporting segment
  calendar_day_identity:
    name: Calendar day
    description: One civil date on the Burger Inc reporting calendar. The complete population is the calendar
      day dimension in this finance slice.
  accounting_period_identity:
    name: Accounting period
    description: One fiscal accounting month used to close the ledger, company-operated restaurant P&L,
      royalties, rent, capital, and segment consolidation.
  currency_identity:
    name: Currency
    description: One currency in which Burger Inc records a local amount or translates a segment result
      into the reporting currency.
  legal_entity_identity:
    name: Legal entity
    description: One Burger Inc legal entity that keeps a book of record for journal activity, royalty
      and rent income, G&A, and franchisee support.
  gl_account_identity:
    name: GL account
    description: One account in the Burger Inc chart of accounts, including sales, restaurant costs, franchise
      royalty income, rent income, and G&A.
  cost_element_identity:
    name: Cost element
    description: One cost element used to classify food, paper, labor, occupancy, commodity cost, and
      G&A inside the ledger and company-operated P&L.
  journal_line_identity:
    name: Journal line
    description: One posted general-ledger journal line.
  company_store_pl_identity:
    name: Company-operated restaurant P&L
    description: One company-operated restaurant profit-and-loss result for one accounting period. Franchisee
      profit is a different population and is not this identity.
  royalty_charge_identity:
    name: Royalty charge
    description: One franchise royalty charge that records franchise royalty income.
  rent_charge_identity:
    name: Rent charge
    description: One rent charge that records rent income from a franchisee.
  capex_project_identity:
    name: Capex project
    description: One capital project classified as a new restaurant, a remodel, or restaurant technology.
  support_payment_identity:
    name: Franchisee support payment
    description: One company cash payment to a franchisee, including value co-investment and energy-cost
      support, with a start day and an end day.
  consolidation_identity:
    name: Segment consolidation
    description: One consolidated finance result for an operating segment and accounting period. The segments
      in this fact are the U.S., international operated markets, and developmental license markets.
  technology_program_identity:
    name: Technology program
    description: One named piece of the global restaurant technology stack, such as loyalty or the point-of-sale platform.
