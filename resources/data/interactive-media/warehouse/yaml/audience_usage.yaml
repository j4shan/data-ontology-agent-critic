    qualified_name: social.time.dim_fiscal_quarter
    display_name: Fiscal Quarter
    description: Fiscal quarter on the Social Inc earnings calendar.
    synonyms: []
    tags:
    - dimension
    - audience
    - interactive-media
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: social.us-west-1
      database: SOCIAL
      schema: TIME
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter, identified by fiscal_quarter_id.
    components:
    - identity_id: fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
      description: Identifier of the fiscal quarter.
  columns:
  - name: fiscal_quarter_id
    description: Identifier of the fiscal quarter.
  - name: fiscal_quarter_name
    description: Name of the fiscal quarter.
  - name: fiscal_quarter_code
    description: Code of the fiscal quarter.
    value_description: 2025Q2, 2025Q3, 2025Q4, 2026Q1, 2026Q2
