    display_name: Fiscal Quarter
    description: Automaker Inc fiscal quarter used on the earnings calendar.
    synonyms: []
    tags:
    - dimension
    - demand_vehicle
    - automobile-manufacturers
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: automaker.us-central-1
      database: AUTOMAKER
      schema: TIME
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter.
    components:
    - identity_id: fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
      description: Identifier of the fiscal quarter.
  columns:
