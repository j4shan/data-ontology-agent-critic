schema_version: '3'
nodes:
- node_id: sf:automaker.price.fact_price_action
  descriptor:
    qualified_name: automaker.price.fact_price_action
    display_name: Price Action
    description: Vehicle price action. Deliveries are not stored here.
    synonyms: []
    tags:
    - price
    - price_profit
    - automobile-manufacturers
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: automaker.us-central-1
      database: AUTOMAKER
      schema: PRICE
      object: FACT_PRICE_ACTION
      format: table
  grain:
    description: One row is one price action.
    components:
    - identity_id: price_action_identity
      dataset_columns:
      - price_action_id
      description: Identifier of the price action.
  columns:
  - name: price_action_id
    description: Identifier of the price action.
  - name: fiscal_quarter_id
    description: Identifier of the fiscal quarter.
  - name: vehicle_family_id
    description: Identifier of the vehicle family.
  - name: country_id
    description: Identifier of the country.
  - name: powertrain_id
    description: Identifier of the powertrain.
  - name: price_change_rate
    description: Price change.
  - name: smaller_than_cost_flag
    description: Whether the cut is smaller than the cost reduction.
  - name: credit_end_flag
    description: Whether the action is tied to purchase credits ending.
  entity_definitions:
  - identity_id: price_action_identity
    dataset_columns:
    - price_action_id
    entity_universe: complete
  - identity_id: fiscal_quarter_identity
    dataset_columns:
    - fiscal_quarter_id
    entity_universe: partial
  - identity_id: vehicle_family_identity
    dataset_columns:
    - vehicle_family_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: powertrain_identity
    dataset_columns:
    - powertrain_id
    entity_universe: partial
