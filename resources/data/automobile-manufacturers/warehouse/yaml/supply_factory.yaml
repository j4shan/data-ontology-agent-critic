schema_version: '3'
nodes:
- node_id: sf:automaker.supply.dim_component
  descriptor:
    qualified_name: automaker.supply.dim_component
    display_name: Component
    description: 'Component Automaker Inc buys or designs: memory, battery, sensors, actuators, aluminum,
      rare earths, silicon carbide.'
    synonyms: []
    tags:
    - dimension
    - supply_factory
    - automobile-manufacturers
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: automaker.us-central-1
      database: AUTOMAKER
      schema: SUPPLY
      object: DIM_COMPONENT
      format: table
  grain:
    description: One row is one component.
    components:
    - identity_id: component_identity
      dataset_columns:
      - component_id
      description: Identifier of the component.
  columns:
  - name: component_id
    description: Identifier of the component.
  - name: component_name
    description: Name of the component.
  - name: component_code
    description: Code of the component.
    value_description: memory, battery, sensor, camera, processor, controller, actuator, aluminum, rare_earth,
      silicon_carbide, semiconductor
  entity_definitions:
  - identity_id: component_identity
    dataset_columns:
    - component_id
    entity_universe: complete
