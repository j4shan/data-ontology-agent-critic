    qualified_name: chemical.price.dim_price_action
    display_name: Price Action
    description: Price action Chemical Inc has announced.
    synonyms: []
    tags:
    - dim
    - price_margin
    - chemical
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: chemical.us-east-1
      database: CHEMICAL
      schema: PRICE
      object: DIM_PRICE_ACTION
      format: table
  grain:
    description: One row is one price action.
    components:
    - identity_id: price_action_identity
      dataset_columns:
