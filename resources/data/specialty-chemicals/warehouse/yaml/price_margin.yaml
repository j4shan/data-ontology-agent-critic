    description: Name of the action.
  - name: action_code
    description: Action code.
    value_description: january_increase, post_march, surgical, value_capture, tariff_surcharge, energy_surcharge
  - name: announced_date
    description: Date the action was announced.
  entity_definitions:
  - identity_id: price_action_identity
