    description: Health Plan Inc fiscal quarter used on the earnings calendar.
    synonyms: []
    tags:
    - dimension
    - membership_channel
    - managed-care
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: healthplan.us-east-1
      database: HEALTH_PLAN
      schema: TIME
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter.
    components:
    - identity_id: fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
      description: Identifier of the fiscal quarter.
  columns:
  - name: fiscal_quarter_id
    description: Identifier of the fiscal quarter.
  - name: fiscal_quarter_name
    description: Name of the fiscal quarter.
  - name: fiscal_quarter_code
    description: Code of the fiscal quarter.
    value_description: 2025Q2, 2025Q3, 2025Q4, 2026Q1, 2026Q2, 2026Q3, 2026Q4
