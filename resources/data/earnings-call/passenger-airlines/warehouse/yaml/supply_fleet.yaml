nodes:
- node_id: sf:airline.fleet.dim_aircraft_model
  descriptor:
    qualified_name: airline.fleet.dim_aircraft_model
    display_name: Aircraft Model
    description: Specific aircraft model operated by Airline Inc.
    synonyms: []
    tags:
    - dimension
    - supply_fleet
    - passenger-airlines
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: airline.us-central-1
      database: AIRLINE
      schema: FLEET
      object: DIM_AIRCRAFT_MODEL
      format: table
  grain:
    description: One row is one aircraft model, identified by aircraft_model_id.
    components:
    - identity_id: aircraft_model_identity
      dataset_columns:
      - aircraft_model_id
      description: Identifier of the aircraft model.
  columns:
  - name: aircraft_model_id
    description: Identifier of the aircraft model.
  - name: aircraft_model_name
    description: Name of the aircraft model.
  - name: aircraft_model_code
    description: Code of the aircraft model.
    value_description: boeing_737_800, boeing_737_max_9, airbus_a321neo, airbus_a220_300, boeing_767_300,
      airbus_a330_900, boeing_787_9, airbus_a350_900, embraer_e175
