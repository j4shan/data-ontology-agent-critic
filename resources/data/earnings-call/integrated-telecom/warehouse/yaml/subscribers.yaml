    description: Fiscal quarter in which the owner reports results.
    synonyms: []
    tags:
    - dimension
    - subscribers
    - carrier
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: carrier.us-east-1
      database: CARRIER
      schema: SUBSCRIBERS
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter.
    components:
    - identity_id: dim_fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
