- node_id: sf:energy.supply.fact_production_quantity
  descriptor:
    qualified_name: energy.supply.fact_production_quantity
    display_name: Production Quantity
    description: Production quantity by hydrocarbon, field, play, asset, and country. Gross operated and net entitlement are
      separate measures. Stores crude and NGL in barrels and natural gas in thousand cubic feet as labelled by hydrocarbon.
    synonyms: []
    tags:
    - fact
    - supply
    - energy
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: energy.us-central-1
      database: ENERGY
      schema: SUPPLY
      object: FACT_PRODUCTION_QUANTITY
      format: table
  grain:
    description: One row is one combination of fiscal quarter, scenario, hydrocarbon, field, play, asset, country.
    components:
    - identity_id: dim_fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
      description: Identifier of the fiscal quarter.
    - identity_id: dim_scenario_identity
      dataset_columns:
      - scenario_id
      description: Identifier of the scenario.
    - identity_id: dim_hydrocarbon_identity
      dataset_columns:
      - hydrocarbon_id
      description: Identifier of the hydrocarbon.
    - identity_id: dim_field_identity
      dataset_columns:
      - field_id
      description: Identifier of the field.
    - identity_id: dim_play_identity
      dataset_columns:
      - play_id
      description: Identifier of the play.
    - identity_id: dim_asset_identity
      dataset_columns:
      - asset_id
      description: Identifier of the asset.
    - identity_id: dim_country_identity
      dataset_columns:
      - country_id
      description: Identifier of the country.
  columns:
  - name: production_record_id
    description: Surrogate record identifier for this production quantity row. It is not the grain.
  - name: fiscal_quarter_id
    description: Identifier of the related fiscal quarter.
  - name: scenario_id
    description: Identifier of the related scenario.
  - name: hydrocarbon_id
    description: Identifier of the related hydrocarbon.
  - name: field_id
    description: Identifier of the related field.
  - name: play_id
    description: Identifier of the related play.
  - name: asset_id
    description: Identifier of the related asset.
  - name: country_id
    description: Identifier of the related country.
  - name: gross_operated_production_quantity
    description: Gross operated production quantity in barrels for crude and NGL and in thousand cubic feet for natural gas.
  - name: net_entitlement_production_quantity
    description: Net entitlement production quantity in barrels for crude and NGL and in thousand cubic feet for natural gas.
  entity_definitions:
  - identity_id: dim_fiscal_quarter_identity
    dataset_columns:
    - fiscal_quarter_id
    entity_universe: partial
  - identity_id: dim_scenario_identity
    dataset_columns:
    - scenario_id
    entity_universe: partial
  - identity_id: dim_hydrocarbon_identity
