- node_id: sf:app.economics.dim_cost_bucket
  descriptor:
    qualified_name: app.economics.dim_cost_bucket
    display_name: Cost Bucket
    description: Cost bucket.
    synonyms: []
    tags:
    - dimension
    - economics
    - app
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: app.us-west-1
      database: APP
      schema: ECONOMICS
      object: DIM_COST_BUCKET
      format: table
  grain:
    description: One row is one cost bucket.
    components:
    - identity_id: dim_cost_bucket_identity
      dataset_columns:
      - cost_bucket_id
      description: Identifier of the cost bucket.
  columns:
  - name: cost_bucket_id
    description: Identifier of the cost bucket.
  - name: cost_bucket_code
