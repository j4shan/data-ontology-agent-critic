schema_version: '3'
nodes:
- node_id: sf:app.adoption.dim_fiscal_quarter
  descriptor:
    qualified_name: app.adoption.dim_fiscal_quarter
    display_name: Fiscal Quarter
    description: Fiscal quarter in which the owner reports results.
    synonyms: []
    tags:
    - dimension
    - adoption
    - app
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: app.us-west-1
      database: APP
      schema: ADOPTION
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter.
    components:
    - identity_id: dim_fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
      description: Identifier of the fiscal quarter.
  columns:
  - name: fiscal_quarter_id
    description: Identifier of the fiscal quarter.
  - name: fiscal_quarter_code
    description: Fiscal Quarter code.
    value_description: 2024Q3, 2024Q4, 2025Q1, 2025Q2, 2025Q3, 2025Q4, 2026Q1, 2026Q2
  - name: fiscal_quarter_name
    description: Fiscal Quarter name.
  - name: fiscal_year
    description: Fiscal year number.
  - name: quarter_number
    description: Quarter number within the fiscal year.
  entity_definitions:
  - identity_id: dim_fiscal_quarter_identity
    dataset_columns:
    - fiscal_quarter_id
    entity_universe: complete
