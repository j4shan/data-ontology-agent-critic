      account: bank.us-east-1
      database: BANK
      schema: LOAN
      object: DIM_LOAN_PRODUCT
      format: table
  grain:
    description: One row is one loan product, identified by loan_product_id.
    components:
    - identity_id: loan_product_identity
      dataset_columns:
