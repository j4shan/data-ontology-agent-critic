- node_id: sf:burger.development.fact_development_quantity
  descriptor:
    qualified_name: burger.development.fact_development_quantity
    display_name: Development Quantity
    description: Opening targets, openings and ending sites by country and operating model.
    synonyms: []
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: burger.us-east-1
      database: BURGER
      schema: DEVELOPMENT
      object: FACT_DEVELOPMENT_QUANTITY
      format: table
  grain:
    description: One row per development quantity for the combination of fiscal_period_id, scenario_id,
      country_id, operating_model_id.
    components:
    - identity_id: fiscal_period_identity
      dataset_columns:
      - fiscal_period_id
      description: Identifier of the Fiscal Period.
    - identity_id: scenario_identity
      dataset_columns:
      - scenario_id
      description: Identifier of the Scenario.
    - identity_id: country_identity
      dataset_columns:
      - country_id
      description: Identifier of the Country.
    - identity_id: operating_model_identity
      dataset_columns:
      - operating_model_id
      description: Identifier of the Operating Model.
  columns:
  - name: fiscal_period_id
    description: Identifier of the Fiscal Period. The complete population is owned by its owner dataset.
  - name: scenario_id
    description: Identifier of the Scenario. The complete population is owned by its owner dataset.
  - name: country_id
    description: Identifier of the Country. The complete population is owned by its owner dataset.
  - name: operating_model_id
    description: Identifier of the Operating Model. The complete population is owned by its owner dataset.
  - name: target_opening_count
    description: Target Opening Count measured in restaurants.
  - name: actual_opening_count
    description: Actual Opening Count measured in restaurants.
  - name: ending_restaurant_count
    description: Ending Restaurant Count measured in restaurants.
  entity_definitions:
  - identity_id: fiscal_period_identity
    dataset_columns:
    - fiscal_period_id
    entity_universe: partial
  - identity_id: scenario_identity
    dataset_columns:
    - scenario_id
    entity_universe: partial
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
  - identity_id: operating_model_identity
    dataset_columns:
    - operating_model_id
    entity_universe: partial
