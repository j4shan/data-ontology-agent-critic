schema_version: '3'
nodes:
- node_id: sf:colocation.finance.dim_cost_category
  descriptor:
    qualified_name: colocation.finance.dim_cost_category
    display_name: Cost Category
    description: One operating cost category.
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: colocation.us-west-1
      database: COLOCATION
      schema: FINANCE
      object: DIM_COST_CATEGORY
      format: table
  grain:
    description: One row per Cost Category identified by cost_category_id.
    components:
    - identity_id: cost_category_identity
      dataset_columns:
      - cost_category_id
      description: Identifier of the Cost Category.
  columns:
  - name: cost_category_id
    description: Identifier of the Cost Category. This dataset holds the complete population.
  - name: cost_category_name
    description: Name of the Cost Category.
  - name: cost_category_code
    description: Code of the Cost Category.
    value_description: energy, labor, maintenance, information_technology, other_operating.
  entity_definitions:
  - identity_id: cost_category_identity
    dataset_columns:
    - cost_category_id
    entity_universe: complete
