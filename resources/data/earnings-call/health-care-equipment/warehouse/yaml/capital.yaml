nodes:
- node_id: sf:surgicalsupply.capital.dim_payment_arrangement
  descriptor:
    qualified_name: surgicalsupply.capital.dim_payment_arrangement
    display_name: Payment Arrangement
    description: How a hospital pays for a placed system.
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: CAPITAL
      object: DIM_PAYMENT_ARRANGEMENT
      format: table
  grain:
    description: One row per Payment Arrangement identified by payment_arrangement_id.
    components:
    - identity_id: payment_arrangement_identity
      dataset_columns:
      - payment_arrangement_id
      description: Identifier of the Payment Arrangement.
  columns:
  - name: payment_arrangement_id
    description: Identifier of the Payment Arrangement. This dataset holds the complete population.
  - name: payment_arrangement_name
    description: Name of the Payment Arrangement.
  - name: payment_arrangement_code
    description: Code of the Payment Arrangement.
    value_description: outright_sale, operating_lease, usage_based, financing.
  entity_definitions:
  - identity_id: payment_arrangement_identity
    dataset_columns:
    - payment_arrangement_id
    entity_universe: complete
