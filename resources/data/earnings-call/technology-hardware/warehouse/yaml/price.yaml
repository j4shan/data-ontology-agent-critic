    description: One currency.
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: device.us-west-1
      database: DEVICE
      schema: FINANCE
      object: DIM_CURRENCY
      format: table
  grain:
    description: One row per Currency identified by currency_id.
