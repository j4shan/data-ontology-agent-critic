nodes:
- node_id: sf:device.component.dim_component_commodity
  descriptor:
    qualified_name: device.component.dim_component_commodity
    display_name: Component Commodity
    description: One purchased component commodity.
    synonyms: []
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: device.us-west-1
      database: DEVICE
      schema: COMPONENT
      object: DIM_COMPONENT_COMMODITY
      format: table
  grain:
    description: One row per Component Commodity identified by component_commodity_id.
    components:
    - identity_id: component_commodity_identity
      dataset_columns:
      - component_commodity_id
      description: Identifier of the Component Commodity.
  columns:
  - name: component_commodity_id
    description: Identifier of the Component Commodity. This dataset holds the complete population.
  - name: component_commodity_name
    description: Name of the Component Commodity.
  - name: component_type_id
    description: Identifier of the Component Type. The complete population is owned by its owner dataset.
  - name: commodity_code
    description: Code of the component commodity.
    value_description: dram, nand, soc, printed_circuit_board, display_panel, other_commodity.
