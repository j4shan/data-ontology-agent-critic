nodes:
- node_id: sf:merchandise.time.dim_fiscal_quarter
  descriptor:
    qualified_name: merchandise.time.dim_fiscal_quarter
    display_name: Fiscal Quarter
    description: Fiscal quarter on the Merchandise Inc earnings calendar.
    synonyms: []
    tags:
    - dimension
    - member
    - merchandise-retail
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: merchandise.us-east-1
      database: MERCHANDISE
      schema: TIME
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter, identified by fiscal_quarter_id.
    components:
    - identity_id: fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
      description: Identifier of the fiscal quarter.
  columns:
  - name: fiscal_quarter_id
    description: Identifier of the fiscal quarter.
  - name: fiscal_quarter_name
    description: Name of the fiscal quarter.
  - name: fiscal_quarter_code
    description: Code of the fiscal quarter.
    value_description: 2025Q3, 2025Q4, 2026Q1, 2026Q2, 2026Q3
  entity_definitions:
  - identity_id: fiscal_quarter_identity
    dataset_columns:
    - fiscal_quarter_id
    entity_universe: complete
