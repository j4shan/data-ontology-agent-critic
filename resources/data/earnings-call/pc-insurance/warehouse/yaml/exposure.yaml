    description: Identifier of the fiscal quarter.
  - name: fiscal_quarter_code
    description: Fiscal Quarter code.
    value_description: 2024Q3, 2024Q4, 2025Q1, 2025Q2, 2025Q3, 2025Q4, 2026Q1, 2026Q2
