    qualified_name: energy.demand.fact_low_carbon_demand
    display_name: Low-Carbon Gas Demand
    description: Demand for low-carbon gas versus ordinary gas power.
    synonyms: []
    tags:
    - fact
    - demand
    - energy
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: energy.us-central-1
      database: ENERGY
      schema: DEMAND
      object: FACT_LOW_CARBON_DEMAND
      format: table
  grain:
    description: One row is one low-carbon gas demand.
    components:
    - identity_id: fact_low_carbon_demand_identity
      dataset_columns:
      - low_carbon_demand_id
      description: Identifier of the low-carbon gas demand.
  columns:
  - name: low_carbon_demand_id
    description: Identifier of the low-carbon gas demand.
  - name: demand_quantity
    description: Demand quantity on this row. The value is a quantity, not a price.
  - name: prefers_low_carbon_flag
    description: Whether this row is marked prefers low carbon.
  - name: fiscal_quarter_id
    description: Identifier of the related fiscal quarter.
  - name: customer_id
    description: Identifier of the related customer.
  - name: product_id
    description: Identifier of the related product.
  entity_definitions:
  - identity_id: fact_low_carbon_demand_identity
    dataset_columns:
    - low_carbon_demand_id
    entity_universe: complete
  - identity_id: dim_fiscal_quarter_identity
    dataset_columns:
    - fiscal_quarter_id
    entity_universe: partial
  - identity_id: dim_customer_identity
    dataset_columns:
    - customer_id
    entity_universe: partial
  - identity_id: dim_product_identity
    dataset_columns:
    - product_id
    entity_universe: partial
