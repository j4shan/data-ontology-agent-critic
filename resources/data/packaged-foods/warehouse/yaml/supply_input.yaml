- node_id: sf:food.supply.dim_commodity
  descriptor:
    qualified_name: food.supply.dim_commodity
    display_name: Commodity
    description: Food commodity input, separate from energy inputs.
    synonyms: []
    tags:
    - dimension
    - supply_input
    - packaged-foods
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: food.us-east-1
      database: FOOD
      schema: SUPPLY
      object: DIM_COMMODITY
      format: table
  grain:
    description: One row is one commodity, identified by commodity_id.
    components:
    - identity_id: commodity_identity
      dataset_columns:
      - commodity_id
      description: Identifier of the commodity.
  columns:
