schema_version: '3'
nodes:
- node_id: sf:merchandise.merchandise.dim_category
  descriptor:
    qualified_name: merchandise.merchandise.dim_category
    display_name: Category
    description: Single merchandise hierarchy; a category rolls up to the parent category named on the
      row.
    synonyms: []
    tags:
    - dimension
    - merchandise
    - merchandise-retail
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: merchandise.us-east-1
      database: MERCHANDISE
      schema: MERCHANDISE
      object: DIM_CATEGORY
      format: table
  grain:
    description: One row is one category, identified by category_id.
    components:
    - identity_id: category_identity
      dataset_columns:
      - category_id
      description: Identifier of the category.
  columns:
  - name: category_id
    description: Identifier of the category.
  - name: category_name
    description: Name of the category.
  - name: category_code
    description: Code of the category.
    value_description: fresh_food, packaged_grocery, general_merchandise, apparel, electronics, health_and_wellness,
      home, automotive
  - name: parent_category_name
    description: Name of the parent category in the single merchandise hierarchy.
  entity_definitions:
  - identity_id: category_identity
    dataset_columns:
    - category_id
    entity_universe: complete
