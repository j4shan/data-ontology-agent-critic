nodes:
- node_id: sf:merchandise.network.dim_market
  descriptor:
    qualified_name: merchandise.network.dim_market
    display_name: Market
    description: Market area served by Merchandise Inc stores.
    synonyms: []
    tags:
    - dimension
    - network
    - merchandise-retail
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: merchandise.us-east-1
      database: MERCHANDISE
      schema: NETWORK
      object: DIM_MARKET
      format: table
  grain:
    description: One row is one market, identified by market_id.
    components:
    - identity_id: market_identity
      dataset_columns:
      - market_id
      description: Identifier of the market.
  columns:
  - name: market_id
    description: Identifier of the market.
  - name: market_name
    description: Name of the market.
  - name: market_code
    description: Code of the market.
    value_description: urban, suburban, rural, international_market
