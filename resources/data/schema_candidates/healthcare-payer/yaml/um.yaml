nodes:
- node_id: sf:healthcare-payer.um.fact_prior_auth
  descriptor:
    qualified_name: healthcare-payer.um.fact_prior_auth
    display_name: Prior Authorization
    description: One prior authorization.
    synonyms: []
    tags:
    - fact
    - um
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: harbor.us-east-1
      database: HEALTHCARE_PAYER
      schema: UM
      object: FACT_PRIOR_AUTH
      format: table
  grain:
    description: One row is one prior authorization.
    components:
    - identity_id: prior_auth_identity
      dataset_columns:
      - prior_auth_id
      description: Identifier of one prior Authorization.
  columns:
  - name: prior_auth_id
    description: Identifier of one prior Authorization.
  - name: member_id
    description: Reference to the member.
  - name: provider_id
    description: Reference to the provider.
  - name: auth_type_id
    description: Reference to the authorization Type.
  - name: calendar_day_id
    description: Reference to the calendar Day.
  - name: plan_id
    description: Reference to the plan.
  - name: employee_id
    description: Reference to the employee.
  - name: auth_status
    description: Status of the authorization.
    value_description: pended, approved, denied, void
  entity_definitions:
  - identity_id: prior_auth_identity
    dataset_columns:
    - prior_auth_id
    is_entity_universe: true
    entity_expression:
    - '[prior_auth_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of prior authorization.
  - identity_id: member_identity
    dataset_columns:
    - member_id
    is_entity_universe: false
    entity_expression:
    - '[member_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many prior Authorizations belong to one member, every prior Authorization matches
        a member, and a member may include no prior Authorization.
  - identity_id: provider_identity
    dataset_columns:
    - provider_id
    is_entity_universe: false
    entity_expression:
    - '[provider_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many prior Authorizations belong to one provider, every prior Authorization matches
        a provider, and a provider may include no prior Authorization.
  - identity_id: auth_type_identity
    dataset_columns:
    - auth_type_id
    is_entity_universe: false
    entity_expression:
    - '[auth_type_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many prior Authorizations belong to one authorization Type, every prior Authorization
        matches a authorization Type, and every authorization Type includes at least one prior Authorization.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many prior Authorizations belong to one calendar Day, every prior Authorization matches
        a calendar Day, and a calendar Day may include no prior Authorization.
  - identity_id: plan_identity
    dataset_columns:
    - plan_id
    is_entity_universe: false
    entity_expression:
    - '[plan_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many prior Authorizations belong to one plan, every prior Authorization matches a
        plan, and a plan may include no prior Authorization.
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    is_entity_universe: false
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A prior Authorization may match one employee, and a employee may include no prior
        Authorization.
