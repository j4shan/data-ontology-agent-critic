schema_version: '2'
nodes:
- node_id: sf:retail-grocery.pos.fact_pos_transaction
  descriptor:
    qualified_name: retail-grocery.pos.fact_pos_transaction
    display_name: POS transaction
    description: Basket rung at a storefront by a cashier on a workstation.
    synonyms: []
    tags:
    - fact
    - pos
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL_GROCERY
      schema: POS
      object: FACT_POS_TRANSACTION
      format: table
  grain:
    description: One row is one pos transaction.
    components:
    - identity_id: pos_transaction_identity
      dataset_columns:
      - pos_transaction_id
      description: Identifies one POS transaction.
  columns:
  - name: pos_transaction_id
    description: Identifies one POS transaction.
  - name: store_id
    description: Storefront where the basket was rung.
  - name: cashier_id
    description: Cashier who rang the basket.
  - name: workstation_id
    description: Workstation that recorded the basket.
  - name: calendar_day_id
    description: Day the basket was rung.
  - name: hour_id
    description: Hour the basket was rung.
  - name: channel_id
    description: Selling channel of the basket.
  - name: loyalty_account_id
    description: Loyalty account presented with the basket when the shopper identified one.
  - name: transaction_status
    description: Completion status of the basket.
    value_description: completed, voided, suspended
  entity_definitions:
  - identity_id: pos_transaction_identity
    dataset_columns:
    - pos_transaction_id
    is_entity_universe: true
    entity_expression:
    - '[pos_transaction_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of pos transaction.
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each transaction occurs at exactly one storefront, and a storefront may have no transaction.
  - identity_id: cashier_identity
    dataset_columns:
    - cashier_id
    is_entity_universe: false
    entity_expression:
    - '[cashier_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each transaction is rung by exactly one cashier, and a cashier may ring no transaction.
  - identity_id: workstation_identity
    dataset_columns:
    - workstation_id
    is_entity_universe: false
    entity_expression:
    - '[workstation_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each transaction is recorded on exactly one workstation, and a workstation may record
        no transaction.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each transaction occurs on exactly one calendar day, and a day may have no transaction.
  - identity_id: hour_identity
    dataset_columns:
    - hour_id
    is_entity_universe: false
    entity_expression:
    - '[hour_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each transaction occurs in exactly one hour, and an hour may have no transaction.
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    is_entity_universe: false
    entity_expression:
    - '[channel_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each transaction uses exactly one channel, and a channel may have no transaction.
  - identity_id: loyalty_account_identity
    dataset_columns:
    - loyalty_account_id
    is_entity_universe: false
    entity_expression:
    - '[loyalty_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A transaction may omit a loyalty account, and a loyalty account may appear on no
        transaction.
- node_id: sf:retail-grocery.pos.fact_pos_line
