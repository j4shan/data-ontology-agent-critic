      business_rule: Complete authored population of pos line.
  - identity_id: pos_transaction_identity
    dataset_columns:
    - pos_transaction_id
    is_entity_universe: false
    entity_expression:
    - '[pos_transaction_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each POS transaction has one or more item lines, and each line belongs to exactly
        one transaction.
  - identity_id: item_identity
    dataset_columns:
    - item_id
    is_entity_universe: false
    entity_expression:
    - '[item_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each line sells exactly one item, and an item may appear on no line.
  - identity_id: uom_identity
    dataset_columns:
    - uom_id
    is_entity_universe: false
    entity_expression:
    - '[uom_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A line may omit a selling unit of measure, and a unit of measure may appear on no
        line.
  - identity_id: promotion_identity
    dataset_columns:
    - promotion_id
    is_entity_universe: false
    entity_expression:
    - '[promotion_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A line may omit a promotion, and a promotion may apply to no line.
