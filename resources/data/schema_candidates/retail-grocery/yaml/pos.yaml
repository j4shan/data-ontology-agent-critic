      dataset_columns:
      - pos_line_id
      description: Identifies one POS item line.
  columns:
  - name: pos_line_id
    description: Identifies one POS item line.
  - name: pos_transaction_id
    description: Transaction that contains the line.
  - name: item_id
    description: Item sold on the line.
  - name: uom_id
    description: Selling unit of measure when it differs from the item default.
  - name: promotion_id
    description: Promotion applied to the line when one was used.
  - name: sold_quantity
    description: Quantity of the item sold on the line.
  - name: extended_amount
    description: Extended selling amount of the line.
  entity_definitions:
