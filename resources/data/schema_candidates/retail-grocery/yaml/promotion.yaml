schema_version: '2'
nodes:
- node_id: sf:retail-grocery.promotion.dim_promotion
  descriptor:
    qualified_name: retail-grocery.promotion.dim_promotion
    display_name: Promotion
    description: Merchandising promotion that groups one or more offers.
    synonyms: []
    tags:
    - dimension
    - promotion
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL_GROCERY
      schema: PROMOTION
      object: DIM_PROMOTION
      format: table
  grain:
    description: One row is one promotion.
    components:
    - identity_id: promotion_identity
      dataset_columns:
      - promotion_id
      description: Identifies one promotion.
  columns:
  - name: promotion_id
    description: Identifies one promotion.
  - name: promotion_status
    description: Lifecycle status of the promotion.
    value_description: planned, active, expired
  entity_definitions:
  - identity_id: promotion_identity
    dataset_columns:
    - promotion_id
    is_entity_universe: true
    entity_expression:
    - '[promotion_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of promotion.
