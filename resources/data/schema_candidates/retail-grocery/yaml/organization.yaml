schema_version: '2'
nodes:
- node_id: sf:retail-grocery.organization.dim_banner
  descriptor:
    qualified_name: retail-grocery.organization.dim_banner
    display_name: Banner
    description: Single consumer-facing banner under which Greenbasket storefronts trade.
    synonyms: []
    tags:
    - dimension
    - organization
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL_GROCERY
      schema: ORGANIZATION
      object: DIM_BANNER
      format: table
  grain:
    description: One row is one banner.
    components:
    - identity_id: banner_identity
      dataset_columns:
      - banner_id
      description: Identifies the Greenbasket banner.
  columns:
  - name: banner_id
    description: Identifies the Greenbasket banner.
  - name: banner_name
    description: Consumer-facing name of the banner.
  entity_definitions:
  - identity_id: banner_identity
    dataset_columns:
    - banner_id
    is_entity_universe: true
    entity_expression:
    - '[banner_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of banner.
- node_id: sf:retail-grocery.organization.dim_region
