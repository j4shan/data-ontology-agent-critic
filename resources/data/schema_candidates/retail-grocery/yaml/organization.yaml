    is_entity_universe: false
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every storefront employs one or more employees, and every employee is assigned to
        one storefront.
  - identity_id: department_identity
    dataset_columns:
    - department_id
    is_entity_universe: false
    entity_expression:
    - '[department_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: An employee may omit a merchandise department, and a merchandise department may have
        no employees.
