- node_id: sf:retail-grocery.organization.dim_store
  descriptor:
    qualified_name: retail-grocery.organization.dim_store
    display_name: Store
    description: Storefront shop where customers buy merchandise and pick up e-commerce orders.
    synonyms:
    - storefront
    tags:
    - dimension
    - organization
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: greenbasket.us-central-1
      database: RETAIL_GROCERY
      schema: ORGANIZATION
      object: DIM_STORE
      format: table
  grain:
    description: One row is one store.
    components:
    - identity_id: store_identity
      dataset_columns:
      - store_id
      description: Identifies one storefront.
  columns:
  - name: store_id
    description: Identifies one storefront.
  - name: district_id
    description: District that supervises the storefront.
  - name: banner_id
    description: Banner the storefront trades under.
  - name: store_format_id
    description: Format used by the storefront.
  - name: price_zone_id
    description: Price zone that prices the storefront.
  - name: manager_employee_id
    description: Employee who manages the storefront.
  - name: primary_warehouse_id
    description: Distribution center that primarily replenishes the storefront.
  - name: store_status
    description: Operating status of the storefront.
    value_description: open, remodel, closed
  entity_definitions:
  - identity_id: store_identity
    dataset_columns:
    - store_id
    is_entity_universe: true
    entity_expression:
    - '[store_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of store.
  - identity_id: district_identity
    dataset_columns:
    - district_id
    is_entity_universe: false
    entity_expression:
    - '[district_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each district contains one or more storefronts, and each storefront belongs to exactly
        one district.
  - identity_id: banner_identity
    dataset_columns:
    - banner_id
    is_entity_universe: false
    entity_expression:
    - '[banner_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each storefront belongs to exactly one banner, and a banner may have no storefront
        on this reference.
  - identity_id: store_format_identity
    dataset_columns:
    - store_format_id
    is_entity_universe: false
    entity_expression:
    - '[store_format_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each storefront uses exactly one store format, and a format may be assigned to no
        storefront.
  - identity_id: price_zone_identity
    dataset_columns:
    - price_zone_id
    is_entity_universe: false
    entity_expression:
    - '[price_zone_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each storefront belongs to exactly one price zone, and a price zone may contain no
        storefront.
  - identity_id: employee_identity
    dataset_columns:
    - manager_employee_id
    is_entity_universe: false
    entity_expression:
    - '[manager_employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: '1:1'
      business_rule: Each storefront has exactly one manager, and an employee manages at most one storefront.
  - identity_id: warehouse_identity
    dataset_columns:
    - primary_warehouse_id
    is_entity_universe: false
    entity_expression:
    - '[primary_warehouse_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each storefront names exactly one primary distribution center, and a distribution
        center may be primary for no storefront.
