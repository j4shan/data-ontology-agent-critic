nodes:
- node_id: sf:manufacturing-discrete.procurement.fact_purchase_requisition
  descriptor:
    qualified_name: manufacturing-discrete.procurement.fact_purchase_requisition
    display_name: Purchase Requisition
    description: Internal request to buy an item revision for a plant.
    synonyms: []
    tags:
    - fact
    - procurement
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: alderford.us-east-1
      database: MANUFACTURING_DISCRETE
      schema: PROCUREMENT
      object: FACT_PURCHASE_REQUISITION
      format: table
  grain:
    description: One row is one purchase requisition.
    components:
    - identity_id: requisition_identity
      dataset_columns:
      - requisition_id
      description: Identifier of one purchase requisition.
  columns:
  - name: requisition_id
    description: Identifier of one purchase requisition.
  - name: item_revision_id
    description: Item revision being requested.
  - name: plant_id
    description: Plant that needs the item.
  - name: requester_employee_id
    description: Employee who raised the requisition.
  - name: calendar_day_id
    description: Day the requisition was raised.
  - name: requisition_status
    description: Approval state of the requisition.
    value_description: draft, submitted, approved, rejected, closed
  entity_definitions:
  - identity_id: requisition_identity
    dataset_columns:
    - requisition_id
    is_entity_universe: true
    entity_expression:
    - '[requisition_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of purchase requisition.
  - identity_id: item_revision_identity
    dataset_columns:
    - item_revision_id
    is_entity_universe: false
    entity_expression:
    - '[item_revision_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many requisitions belong to one item revision, every requisition matches an item
        revision, and an item revision may include no requisition.
  - identity_id: plant_identity
    dataset_columns:
    - plant_id
    is_entity_universe: false
    entity_expression:
    - '[plant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many requisitions belong to one plant, every requisition matches a plant, and a plant
        may include no requisition.
  - identity_id: employee_identity
    dataset_columns:
    - requester_employee_id
    is_entity_universe: false
    entity_expression:
    - '[requester_employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many requisitions belong to one requesting employee, every requisition matches an
        employee, and an employee may include no requisition.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
