    - campaign_id
    is_entity_universe: true
    entity_expression:
    - '[campaign_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Complete authored population of campaign.
  - identity_id: channel_identity
    dataset_columns:
    - channel_id
    is_entity_universe: false
    entity_expression:
    - '[channel_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Many campaigns belong to one channel, every campaign matches a channel, and every
        channel includes at least one campaign.
