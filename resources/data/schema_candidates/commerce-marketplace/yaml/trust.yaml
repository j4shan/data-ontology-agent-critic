schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.trust.dim_fraud_rule
  descriptor:
    qualified_name: commerce-marketplace.trust.dim_fraud_rule
    display_name: Fraud rule
    description: Rule that a fraud decision may cite.
    synonyms: []
    tags:
    - dimension
    - trust
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: TRUST
      object: DIM_FRAUD_RULE
      format: table
  grain:
    description: One row is one fraud rule.
    components:
    - identity_id: fraud_rule_identity
      dataset_columns:
      - fraud_rule_id
      description: Identifies one fraud rule.
  columns:
  - name: fraud_rule_id
    description: Identifies one fraud rule.
  entity_definitions:
  - identity_id: fraud_rule_identity
    dataset_columns:
    - fraud_rule_id
    is_entity_universe: true
    entity_expression:
    - '[fraud_rule_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
- node_id: sf:commerce-marketplace.trust.fact_fraud_decision
  descriptor:
    qualified_name: commerce-marketplace.trust.fact_fraud_decision
    display_name: Fraud decision
    description: Fraud decision on a checkout or an order.
    synonyms: []
    tags:
    - fact
    - trust
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: TRUST
      object: FACT_FRAUD_DECISION
      format: table
  grain:
    description: One row is one fraud decision.
    components:
    - identity_id: fraud_decision_identity
      dataset_columns:
      - fraud_decision_id
      description: Identifies one fraud decision.
  columns:
  - name: fraud_decision_id
    description: Identifies one fraud decision.
  - name: order_id
    description: Order the decision covers.
  - name: checkout_id
    description: Checkout the decision covers.
  - name: fraud_rule_id
    description: Fraud rule cited by the decision.
  - name: calendar_day_id
    description: Calendar day of the fraud decision.
  - name: decision_status
    description: Outcome of the fraud decision.
    value_description: approve, review, reject
  entity_definitions:
  - identity_id: fraud_decision_identity
    dataset_columns:
    - fraud_decision_id
    is_entity_universe: true
    entity_expression:
    - '[fraud_decision_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: order_identity
    dataset_columns:
    - order_id
    is_entity_universe: false
    entity_expression:
    - '[order_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A fraud decision may have no order, and an order may have no fraud decisions.
  - identity_id: checkout_identity
    dataset_columns:
    - checkout_id
    is_entity_universe: false
    entity_expression:
    - '[checkout_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A fraud decision may have no checkout, and a checkout may have no fraud decisions.
  - identity_id: fraud_rule_identity
    dataset_columns:
    - fraud_rule_id
    is_entity_universe: false
    entity_expression:
    - '[fraud_rule_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A fraud decision may have no fraud rule, and a fraud rule may have no decisions.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each fraud decision belongs to exactly one calendar day, and a calendar day may have
        no fraud decisions.
