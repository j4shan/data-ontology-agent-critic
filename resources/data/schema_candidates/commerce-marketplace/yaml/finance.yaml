schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.finance.dim_gl_account
  descriptor:
    qualified_name: commerce-marketplace.finance.dim_gl_account
    display_name: GL account
    description: General-ledger account used on an invoice line.
    synonyms: []
    tags:
    - dimension
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: FINANCE
      object: DIM_GL_ACCOUNT
      format: table
  grain:
    description: One row is one gl account.
    components:
    - identity_id: gl_account_identity
      dataset_columns:
      - gl_account_id
      description: Identifies one general-ledger account.
  columns:
  - name: gl_account_id
    description: Identifies one general-ledger account.
  entity_definitions:
  - identity_id: gl_account_identity
    dataset_columns:
    - gl_account_id
    is_entity_universe: true
    entity_expression:
    - '[gl_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
- node_id: sf:commerce-marketplace.finance.dim_fee_schedule
  descriptor:
    qualified_name: commerce-marketplace.finance.dim_fee_schedule
    display_name: Fee schedule
    description: Fee schedule that applies to one seller tier.
    synonyms: []
    tags:
    - dimension
    - finance
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: FINANCE
      object: DIM_FEE_SCHEDULE
      format: table
  grain:
    description: One row is one fee schedule.
    components:
    - identity_id: fee_schedule_identity
      dataset_columns:
      - fee_schedule_id
      description: Identifies one fee schedule.
  columns:
  - name: fee_schedule_id
    description: Identifies one fee schedule.
  - name: seller_tier_id
    description: Seller tier priced by the fee schedule.
  entity_definitions:
  - identity_id: fee_schedule_identity
    dataset_columns:
    - fee_schedule_id
    is_entity_universe: true
    entity_expression:
    - '[fee_schedule_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: seller_tier_identity
    dataset_columns:
    - seller_tier_id
    is_entity_universe: false
    entity_expression:
    - '[seller_tier_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each fee schedule belongs to exactly one seller tier, and a seller tier may have
        no fee schedules.
