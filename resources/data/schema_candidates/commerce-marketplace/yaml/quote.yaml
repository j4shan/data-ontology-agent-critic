schema_version: '2'
nodes:
- node_id: sf:commerce-marketplace.quote.fact_quote
  descriptor:
    qualified_name: commerce-marketplace.quote.fact_quote
    display_name: Quote
    description: Quote a seller offers to a buyer account.
    synonyms: []
    tags:
    - fact
    - quote
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: QUOTE
      object: FACT_QUOTE
      format: table
  grain:
    description: One row is one quote.
    components:
    - identity_id: quote_identity
      dataset_columns:
      - quote_id
      description: Identifies one quote.
  columns:
  - name: quote_id
    description: Identifies one quote.
  - name: buyer_account_id
    description: Buyer account the quote is offered to.
  - name: seller_id
    description: Seller that issued the quote.
  - name: employee_id
    description: Employee who prepared the quote.
  - name: currency_id
    description: Currency of the quote.
  - name: calendar_day_id
    description: Calendar day of the quote.
  - name: quote_status
    description: Lifecycle standing of the quote.
    value_description: draft, sent, accepted, declined, expired
  entity_definitions:
  - identity_id: quote_identity
    dataset_columns:
    - quote_id
    is_entity_universe: true
    entity_expression:
    - '[quote_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: buyer_account_identity
    dataset_columns:
    - buyer_account_id
    is_entity_universe: false
    entity_expression:
    - '[buyer_account_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each quote belongs to exactly one buyer account, and a buyer account may have no
        quotes.
  - identity_id: seller_identity
    dataset_columns:
    - seller_id
    is_entity_universe: false
    entity_expression:
    - '[seller_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each quote belongs to exactly one seller, and a seller may have no quotes.
  - identity_id: employee_identity
    dataset_columns:
    - employee_id
    is_entity_universe: false
    entity_expression:
    - '[employee_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: A quote may have no employee, and an employee may have no quotes.
  - identity_id: currency_identity
    dataset_columns:
    - currency_id
    is_entity_universe: false
    entity_expression:
    - '[currency_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each quote uses exactly one currency, and a currency may have no quotes.
  - identity_id: calendar_day_identity
    dataset_columns:
    - calendar_day_id
    is_entity_universe: false
    entity_expression:
    - '[calendar_day_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each quote belongs to exactly one calendar day, and a calendar day may have no quotes.
- node_id: sf:commerce-marketplace.quote.fact_quote_line
  descriptor:
    qualified_name: commerce-marketplace.quote.fact_quote_line
    display_name: Quote line
    description: Variant quantity and price offered on a quote.
    synonyms: []
    tags:
    - fact
    - quote
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: meridian.us-west-2
      database: COMMERCE_MARKETPLACE
      schema: QUOTE
      object: FACT_QUOTE_LINE
      format: table
  grain:
    description: One row is one quote line.
    components:
    - identity_id: quote_line_identity
      dataset_columns:
      - quote_line_id
      description: Identifies one quote line.
  columns:
  - name: quote_line_id
    description: Identifies one quote line.
  - name: quote_id
    description: Quote that contains the line.
  - name: variant_id
    description: Variant quoted on the line.
  - name: quoted_quantity
    description: Units offered on the quote line.
  - name: quoted_price
    description: Unit price offered on the quote line.
  entity_definitions:
  - identity_id: quote_line_identity
    dataset_columns:
    - quote_line_id
    is_entity_universe: true
    entity_expression:
    - '[quote_line_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: universe
      business_rule: Authoritative population of this identity.
  - identity_id: quote_identity
    dataset_columns:
    - quote_id
    is_entity_universe: false
    entity_expression:
    - '[quote_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Every quote includes one or more quote lines, and each quote line belongs to exactly
        one quote.
  - identity_id: variant_identity
    dataset_columns:
    - variant_id
    is_entity_universe: false
    entity_expression:
    - '[variant_id]'
    entity_metadata:
      expression_context: SQL column reference
      population_role: reference
      mapping: 1:N
      business_rule: Each quote line belongs to exactly one variant, and a variant may have no quote lines.
