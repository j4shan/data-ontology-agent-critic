nodes:
- node_id: sf:utility.geography.dim_region
  descriptor:
    qualified_name: utility.geography.dim_region
    display_name: Region
    description: Region in which Utility Inc serves load.
    synonyms: []
    tags:
    - dimension
    - demand
    - utility
  accessor:
    schema_id: accessor.snowflake.v1
