    qualified_name: utility.generation.dim_plant
    display_name: Plant
    description: Generation plant, including Cayuga.
    synonyms: []
    tags:
    - dimension
    - supply
    - utility
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: utility.us-east-1
      database: UTILITY
      schema: GENERATION
      object: DIM_PLANT
      format: table
  grain:
    description: One row is one plant.
    components:
    - identity_id: dim_plant_identity
      dataset_columns:
      - plant_id
      description: Identifier of the plant.
  columns:
  - name: plant_id
    description: Identifier of the plant.
  - name: plant_code
    description: Plant code.
    value_description: cayuga, combined_cycle, nuclear, hydro
  - name: plant_name
    description: Plant name.
