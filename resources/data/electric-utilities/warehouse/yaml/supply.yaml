    qualified_name: utility.supply.dim_technology
    display_name: Technology
    description: Generation technology of a generating station.
    synonyms: []
    tags:
    - dimension
    - supply
    - utility
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: utility.us-east-1
      database: UTILITY
      schema: SUPPLY
      object: DIM_TECHNOLOGY
      format: table
