- node_id: sf:surgicalsupply.finance.dim_tariff_program
  descriptor:
    qualified_name: surgicalsupply.finance.dim_tariff_program
    display_name: Tariff program
    description: A tariff program that hits Surgical Supply Inc cost, including China.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: FINANCE
      object: DIM_TARIFF_PROGRAM
      format: table
  grain:
    description: One row is one tariff program.
    components:
    - identity_id: tariff_program_identity
      dataset_columns:
      - tariff_program_id
