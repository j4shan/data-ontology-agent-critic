  descriptor:
    qualified_name: surgicalsupply.finance.fact_tariff_cost
    display_name: Tariff cost
    description: Tariff cost, mitigation, and estimate revisions, tied to where products are made and
      to China.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: FINANCE
      object: FACT_TARIFF_COST
      format: table
  grain:
