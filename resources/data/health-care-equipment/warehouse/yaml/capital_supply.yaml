schema_version: '3'
nodes:
- node_id: sf:surgicalsupply.supply.dim_manufacturing_plant
  descriptor:
    qualified_name: surgicalsupply.supply.dim_manufacturing_plant
    display_name: Manufacturing plant
    description: A Surgical Supply Inc plant whose output, shifts, and country footprint drive supply and tariff exposure.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: SUPPLY
      object: DIM_MANUFACTURING_PLANT
      format: table
  grain:
    description: One row is one manufacturing plant.
    components:
    - identity_id: manufacturing_plant_identity
      dataset_columns:
      - manufacturing_plant_id
  columns:
  - name: manufacturing_plant_id
    description: Identifier of the manufacturing plant. This dataset holds the complete population.
  - name: country_id
    description: Country where the plant operates. The complete population is not re-authored on this
      dataset.
  - name: plant_name
    description: Name of the plant.
  entity_definitions:
  - identity_id: manufacturing_plant_identity
    dataset_columns:
    - manufacturing_plant_id
    entity_universe: complete
  - identity_id: country_identity
    dataset_columns:
    - country_id
    entity_universe: partial
- node_id: sf:surgicalsupply.supply.dim_manufacturing_shift
  descriptor:
    qualified_name: surgicalsupply.supply.dim_manufacturing_shift
    display_name: Manufacturing shift
    description: A staffed shift at a plant. Every plant has at least one shift.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: SUPPLY
      object: DIM_MANUFACTURING_SHIFT
      format: table
  grain:
    description: One row is one manufacturing shift.
    components:
    - identity_id: manufacturing_shift_identity
      dataset_columns:
      - manufacturing_shift_id
  columns:
  - name: manufacturing_shift_id
    description: Identifier of the manufacturing shift. This dataset holds the complete population.
  - name: manufacturing_plant_id
    description: Plant that runs the shift. The complete population is not re-authored on this dataset.
  - name: shift_name
    description: Name of the shift.
  entity_definitions:
  - identity_id: manufacturing_shift_identity
    dataset_columns:
    - manufacturing_shift_id
    entity_universe: complete
  - identity_id: manufacturing_plant_identity
    dataset_columns:
    - manufacturing_plant_id
    entity_universe: partial
- node_id: sf:surgicalsupply.supply.dim_component
  descriptor:
    qualified_name: surgicalsupply.supply.dim_component
    display_name: Component
    description: A component whose shortage can stop a franchise from shipping.
    tags:
    - dimension
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: SUPPLY
      object: DIM_COMPONENT
      format: table
  grain:
    description: One row is one component.
    components:
    - identity_id: component_identity
      dataset_columns:
      - component_id
  columns:
  - name: component_id
    description: Identifier of the component. This dataset holds the complete population.
  - name: component_name
    description: Name of the component.
  entity_definitions:
  - identity_id: component_identity
    dataset_columns:
    - component_id
    entity_universe: complete
- node_id: sf:surgicalsupply.supply.fact_supply_shortage
  descriptor:
    qualified_name: surgicalsupply.supply.fact_supply_shortage
    display_name: Supply shortage
    description: A shortage by franchise and product, including whether it is limited to Inari, other
      vascular products, peripheral vascular, or MedSurg.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: SUPPLY
      object: FACT_SUPPLY_SHORTAGE
      format: table
  grain:
    description: One row is one supply shortage.
    components:
    - identity_id: supply_shortage_identity
      dataset_columns:
      - supply_shortage_id
  columns:
  - name: supply_shortage_id
    description: Identifier of the supply shortage. This dataset holds the complete population.
  - name: product_franchise_id
    description: Franchise that is short. The complete population is not re-authored on this dataset.
  - name: product_id
    description: Product that is short. The complete population is not re-authored on this dataset.
  - name: component_id
    description: Component that is short. The complete population is not re-authored on this dataset.
  - name: manufacturing_plant_id
    description: Plant constrained by the shortage. The complete population is not re-authored on this
      dataset.
  - name: accounting_period_id
    description: Quarter the shortage is recognized. The complete population is not re-authored on this
      dataset.
  - name: expected_clear_accounting_period_id
    description: Quarter the shortage is expected to clear. Same population as the accounting period,
      stored as a second role rather than a second join. The complete population is not re-authored on
      this dataset.
  - name: shortage_scope_code
    description: How widely the shortage spreads.
    value_description: inari_only, other_vascular, peripheral_vascular, medsurg
  - name: lost_sales_amount
    description: Sales lost to the shortage.
  - name: organic_drag_amount
    description: Organic growth drag from the shortage.
  - name: underlying_growth_rate
    description: Growth the franchise would have shown without the shortage.
  - name: shortage_status
    description: Status of the shortage.
    value_description: open, clearing, closed
  - name: procedure_deferral_count
    description: Procedures deferred because product was short.
  - name: procedure_loss_count
    description: Procedures lost rather than deferred.
  - name: procedures_cannot_delay_flag
    description: 1 when the clinical procedure cannot be delayed.
  - name: recovery_expected_flag
    description: 1 when supply recovery is expected to release deferred demand.
  entity_definitions:
  - identity_id: supply_shortage_identity
    dataset_columns:
    - supply_shortage_id
    entity_universe: complete
  - identity_id: product_franchise_identity
    dataset_columns:
    - product_franchise_id
    entity_universe: partial
  - identity_id: product_identity
    dataset_columns:
    - product_id
    entity_universe: partial
  - identity_id: component_identity
    dataset_columns:
    - component_id
    entity_universe: partial
  - identity_id: manufacturing_plant_identity
    dataset_columns:
    - manufacturing_plant_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
- node_id: sf:surgicalsupply.supply.fact_capacity_plan
  descriptor:
    qualified_name: surgicalsupply.supply.fact_capacity_plan
    display_name: Capacity plan
    description: Planned shifts versus the quantity that has to ship for the back-half plan.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: SUPPLY
      object: FACT_CAPACITY_PLAN
      format: table
  grain:
    description: One row is one capacity plan.
    components:
    - identity_id: capacity_plan_identity
      dataset_columns:
      - capacity_plan_id
  columns:
  - name: capacity_plan_id
    description: Identifier of the capacity plan. This dataset holds the complete population.
  - name: manufacturing_plant_id
    description: Plant on the plan. The complete population is not re-authored on this dataset.
  - name: manufacturing_shift_id
    description: Shift on the plan. The complete population is not re-authored on this dataset.
  - name: accounting_period_id
    description: Quarter the plan covers. The complete population is not re-authored on this dataset.
  - name: product_franchise_id
    description: Franchise the plan has to supply. The complete population is not re-authored on this
      dataset.
  - name: planned_shift_count
    description: Shifts planned.
  - name: required_ship_quantity
    description: Quantity that has to ship to meet the plan.
  - name: ramp_constraint_code
    description: What can keep the ramp from the plan.
    value_description: labor, component, quality, none
  - name: meets_back_half_plan_flag
    description: 1 when the planned shifts cover the required shipments.
  entity_definitions:
  - identity_id: capacity_plan_identity
    dataset_columns:
    - capacity_plan_id
    entity_universe: complete
  - identity_id: manufacturing_plant_identity
    dataset_columns:
    - manufacturing_plant_id
    entity_universe: partial
  - identity_id: manufacturing_shift_identity
    dataset_columns:
    - manufacturing_shift_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: product_franchise_identity
    dataset_columns:
    - product_franchise_id
    entity_universe: partial
- node_id: sf:surgicalsupply.supply.fact_product_launch
  descriptor:
    qualified_name: surgicalsupply.supply.fact_product_launch
    display_name: Product launch
    description: Launch timing against plant recovery, the site mix of a new system, and whether the cycle
      is still incremental.
    tags:
    - fact
  accessor:
    schema_id: accessor.snowflake.v1
    properties:
      account: surgicalsupply.us-east-1
      database: SURGICAL_SUPPLY
      schema: SUPPLY
      object: FACT_PRODUCT_LAUNCH
      format: table
  grain:
    description: One row is one product launch.
    components:
    - identity_id: product_launch_identity
      dataset_columns:
      - product_launch_id
  columns:
  - name: product_launch_id
    description: Identifier of the product launch. This dataset holds the complete population.
  - name: product_id
    description: Product being launched. The complete population is not re-authored on this dataset.
  - name: manufacturing_plant_id
    description: Plant the launch depends on. The complete population is not re-authored on this dataset.
  - name: capital_system_id
    description: Capital system, when the launch is a robot. The complete population is not re-authored
      on this dataset.
  - name: site_of_care_id
    description: Site of care the launch is landing in. The complete population is not re-authored on
      this dataset.
  - name: accounting_period_id
    description: Quarter of the launch read. The complete population is not re-authored on this dataset.
  - name: plant_recovery_calendar_day_id
    description: Day the plant is expected to recover. The complete population is not re-authored on this
      dataset.
  - name: launch_delay_flag
    description: 1 when manufacturing is delaying the launch.
  - name: cycle_stage_code
    description: Whether the cycle is incremental this year or already mature.
    value_description: incremental, mature
  - name: growth_contribution_amount
    description: Growth the cycle is contributing.
  - name: launch_metric
    description: Launch metric such as accounts or procedures using the new product.
  - name: investment_amount
    description: Commercial investment behind the launch.
  - name: site_mix_code
    description: Where the new system is landing.
    value_description: ambulatory_surgery_center, hospital, both
  entity_definitions:
  - identity_id: product_launch_identity
    dataset_columns:
    - product_launch_id
    entity_universe: complete
  - identity_id: product_identity
    dataset_columns:
    - product_id
    entity_universe: partial
  - identity_id: manufacturing_plant_identity
    dataset_columns:
    - manufacturing_plant_id
    entity_universe: partial
  - identity_id: capital_system_identity
    dataset_columns:
    - capital_system_id
    entity_universe: partial
  - identity_id: site_of_care_identity
    dataset_columns:
    - site_of_care_id
    entity_universe: partial
  - identity_id: accounting_period_identity
    dataset_columns:
    - accounting_period_id
    entity_universe: partial
  - identity_id: calendar_day_identity
    dataset_columns:
    - plant_recovery_calendar_day_id
    entity_universe: partial
