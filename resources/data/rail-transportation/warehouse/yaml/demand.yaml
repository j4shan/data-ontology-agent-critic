      account: railroad.us-central-1
      database: RAILROAD
      schema: DEMAND
      object: DIM_FISCAL_QUARTER
      format: table
  grain:
    description: One row is one fiscal quarter.
    components:
    - identity_id: dim_fiscal_quarter_identity
      dataset_columns:
      - fiscal_quarter_id
