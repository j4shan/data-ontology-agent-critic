schema_version: '3'
logical_identities:
  region_identity:
    name: Region
    description: A Machinery Inc sales region. North America is the region used when construction users
      and dealer stock are discussed together.
    synonyms:
    - sales region
  country_identity:
    name: Country
    description: A country inside one Machinery Inc sales region.
    synonyms: []
  dealer_identity:
    name: Dealer
    description: An independent Machinery Inc dealer that stocks machines and sells them to end users and
      rental fleets.
    synonyms:
    - dealership
    - Machinery Inc dealer
  dealer_location_identity:
    name: Dealer location
    description: A dealer branch or yard that holds machines. Stock at a location is dealer inventory,
      not factory inventory.
    synonyms: []
  sales_channel_identity:
    name: Sales channel
    description: 'Who takes delivery of a Construction Industries machine: an end user, a rental fleet,
      or dealer stock.'
    synonyms:
    - end user
    - rental fleet
  rental_peer_identity:
    name: Rental peer
    description: 'The rental operator whose fleet mix is being compared: a Cat Rental dealer or a national
      rental company.'
    synonyms:
    - Cat Rental
    - national rental
  equipment_origin_identity:
    name: Equipment origin
    description: Whether a unit in a rental fleet is Cat equipment or an alliance product.
    synonyms:
    - alliance product
    - Cat equipment
  dealer_inventory_identity:
    name: Dealer inventory
    description: Machines on a dealer's books. This is dealer stock, separate from factory production,
      shipments, and unfilled backlog.
    synonyms:
    - dealer stock
    - machine inventory
  retail_demand_identity:
    name: Retail demand
    description: Retail demand at a dealer, measured in units and amount. Retail demand is sales to users
      and rental customers, not dealer inventory and not a factory order.
    synonyms:
    - sales to users
    - retail sales
  production_versus_retail_identity:
    name: Production versus retail
    description: Factory production set next to retail demand for a segment and period, so a build-to-retail
      decision can be read without mixing in dealer stock.
    synonyms: []
  user_sales_outlook_identity:
    name: Sales to users outlook
    description: Sales to end users for a period, including the first-half result and the full-year outlook.
    synonyms: []
  delivery_split_identity:
    name: Delivery split
    description: Construction Industries deliveries split between end users and rental fleets, with major-project
      loading kept as its own unit count.
    synonyms: []
  construction_ex_mega_identity:
    name: Construction demand excluding mega-projects
    description: Construction demand after major projects and rental restocking are set aside, so private
      nonresidential and residential can be read on their own.
    synonyms: []
  rental_fleet_plan_identity:
    name: Rental fleet plan
    description: How a dealer plans the mix of Cat equipment versus alliance products as Cat Rental expands,
      compared with national rental fleets.
    synonyms: []
  north_america_stock_identity:
    name: North America construction stock
    description: North American construction dealer stock set against the expected direction of user sales,
      including whether a further destock is required.
    synonyms: []
  inventory_swing_identity:
    name: Inventory swing
    description: The dealer-inventory swing for a segment and period. A restock or destock is not the
      same thing as end-user volume.
    synonyms:
    - inventory swing
    - restock
  segment_identity:
    name: Segment
    description: 'A Machinery Inc operating segment: Construction Industries, Resource Industries, Power
      & Energy, or the Energy & Transportation name used on earlier calls.'
    synonyms:
    - Construction Industries
    - Power & Energy
    - Resource Industries
  end_market_identity:
    name: End market
    description: An end market Machinery Inc sells into, including data centers, oil and gas, mining, utilities,
      and construction.
    synonyms:
    - data center
    - oil and gas
    - mining
  demand_driver_identity:
    name: Demand driver
    description: 'What is driving construction demand: replacement, data-center activity, private nonresidential,
      residential, a major project, or rental restocking.'
    synonyms: []
  product_family_identity:
    name: Product family
    description: A Cat equipment family inside one operating segment.
    synonyms: []
  machine_model_identity:
    name: Machine model
    description: A Machinery Inc machine model sold through dealers in construction or resource industries.
    synonyms:
    - machine
    - equipment model
  power_product_identity:
    name: Power product
    description: 'A power product: a 10-megawatt reciprocating engine, other gas or large reciprocating
      engines, diesel standby, a gas turbine, a Solar turbine, or battery storage.'
    synonyms:
    - 10-megawatt engine
    - reciprocating engine
    - Solar turbine
    - battery storage
  power_application_identity:
    name: Power application
    description: 'How a power product is used: prime, flexible, or backup.'
    synonyms:
    - prime power
    - backup power
  workload_identity:
    name: Workload
    description: 'A data-center workload that changes standby design: training or inference.'
    synonyms: []
  site_connection_identity:
    name: Site connection
    description: 'How a site takes power: behind the meter or connected to the grid.'
    synonyms:
    - behind the meter
  supplier_identity:
    name: Supplier
    description: A supplier ramping power-generation components with Machinery Inc.
    synonyms: []
  project_identity:
    name: Project
    description: A large power project whose order content can include both engines and battery storage.
    synonyms: []
  customer_identity:
    name: Customer
    description: A customer Machinery Inc is in conversation with, including mining customers and utilities.
    synonyms:
    - mining customer
    - utility
  generation_architecture_identity:
    name: Generation architecture
    description: 'A site energy design: engine waste heat used for cooling, or a combined-cycle turbine.'
    synonyms:
    - waste heat
    - combined cycle
  capacity_horizon_identity:
    name: Capacity horizon
    description: A year in the power-capacity plan, from the near-term ramp through the 2030 gigawatt
      target.
    synonyms:
    - 2030 target
  gigawatt_target_identity:
    name: Gigawatt target
    description: The long-term power gigawatt target, and whether a capacity change revises that figure.
    synonyms: []
  engine_capacity_ramp_identity:
    name: Engine capacity ramp
    description: Gigawatts being added for a power product, and whether those gigawatts sit inside the
      2030 target or are additive.
    synonyms: []
  capacity_timing_identity:
    name: Capacity timing
    description: Whether added large-engine capacity arrives smoothly through the horizon or in a lump,
      and which end market drove the decision.
    synonyms: []
  application_slot_identity:
    name: Application slots
    description: Open order slots for a power product and application in a year, including whether gas
      reciprocating capacity is sold out.
    synonyms: []
  prime_backup_split_identity:
    name: Prime versus backup split
    description: The planned share of large-engine output that is prime versus backup in a horizon year,
      including 2030.
    synonyms: []
  redundancy_design_identity:
    name: Redundancy design
    description: Required diesel-standby redundancy by data-center workload and by how the site is connected.
    synonyms: []
  aftermarket_service_identity:
    name: Aftermarket service
    description: Power & Energy service and aftermarket revenue and its mix of the segment.
    synonyms:
    - aftermarket
    - Power & Energy service
  installed_base_entry_identity:
    name: Installed base entry
    description: Backlog that will enter the installed base when deliveries stretch into later years,
      including 2029 and beyond.
    synonyms: []
  project_content_identity:
    name: Project content
    description: Battery storage and reciprocating-engine content on the same large project order.
    synonyms: []
  utility_conversation_identity:
    name: Utility conversation
    description: A utility conversation about using turbines in plant applications, including whether
      it has become an order.
    synonyms: []
  site_energy_comparison_identity:
    name: Site energy comparison
    description: Engine waste heat used for data-center cooling, compared with combined-cycle efficiency.
    synonyms: []
  construction_driver_mix_identity:
    name: Construction driver mix
    description: Construction Industries demand split by driver, so replacement returning to normal can
      be compared with data-center activity.
    synonyms: []
  supplier_bottleneck_identity:
    name: Supplier bottleneck
    description: Where the tightest constraint sits as suppliers ramp power-generation capacity with Machinery Inc.
    synonyms: []
  data_center_demand_identity:
    name: Data-center demand
    description: The data-center demand outlook, including whether the view has changed as capacity is
      added and whether a slowdown is in view.
    synonyms: []
  overcapacity_risk_identity:
    name: Overcapacity risk
    description: Industry capacity being added against data-center demand, used to judge overcapacity
      if demand slows.
    synonyms: []
  turbine_versus_recip_identity:
    name: Turbine versus reciprocating investment
    description: Capacity investment allocated to large reciprocating engines rather than to more gas-turbine
      investment.
    synonyms: []
  solar_lead_time_identity:
    name: Solar turbine lead time
    description: Solar-turbine lead time and whether more turbine factory capacity is needed.
    synonyms:
    - Solar turbine
    - lead time
  backup_role_evolution_identity:
    name: Backup role evolution
    description: For prime-power designs, how the role of backup diesel versus battery storage changes
      across horizon years.
    synonyms: []
  calendar_day_identity:
    name: Calendar day
    description: A calendar day in the Machinery Inc reporting calendar.
    synonyms:
    - date
  accounting_period_identity:
    name: Accounting period
    description: A Machinery Inc accounting period, with fiscal year, quarter, and half.
    synonyms:
    - quarter
    - fiscal period
  currency_identity:
    name: Currency
    description: A currency used on Machinery Inc price, sales, and margin amounts.
    synonyms: []
  margin_framework_identity:
    name: Margin framework
    description: The operating-margin range Machinery Inc set, including the range from the supply-chain
      disruption period and the analyst-day view.
    synonyms:
    - margin target
    - analyst day
  cost_element_identity:
    name: Cost element
    description: A cost element that can move margin separately from price, including manufacturing cost
      and tariffs.
    synonyms: []
  segment_volume_identity:
    name: Segment volume
    description: Unit volume by operating segment. This fact stores no price.
    synonyms: []
  price_realization_identity:
    name: Price realization
    description: Price realization by segment and period. This fact stores no unit volume.
    synonyms: []
  order_intake_identity:
    name: Order intake
    description: Orders taken in a period, with large power awards distinguished from broad-based orders
      and with power generation able to be excluded.
    synonyms:
    - orders
  backlog_position_identity:
    name: Backlog position
    description: Unfilled orders at the end of a period. Backlog is not dealer inventory and not a shipment.
    synonyms: []
  backlog_bridge_identity:
    name: Backlog bridge
    description: The backlog increase split between large power awards and broad-based orders.
    synonyms: []
  backlog_pullforward_identity:
    name: Backlog pull-forward
    description: Backlog growth that was a one-time pull-forward, kept separate from the project that
      lands the next quarter.
    synonyms: []
  backlog_shipping_window_identity:
    name: Backlog shipping window
    description: Backlog expected to ship within the next twelve months, kept apart from the sales-growth
      outlook.
    synonyms: []
  segment_margin_identity:
    name: Segment margin
    description: Revenue and operating margin for a segment and period, including the sequential path.
    synonyms:
    - Construction Industries margin
    - Resource Industries margin
  incremental_margin_identity:
    name: Incremental margin
    description: Incremental margin for a segment, including whether the Power & Energy rate is sustainable
      while capacity is still being added.
    synonyms: []
  price_cost_bridge_identity:
    name: Price cost bridge
    description: Price realization and manufacturing cost stated as separate effects on margin, so a negative
      price/cost outlook can be compared with a year in which manufacturing cost was a help.
    synonyms: []
  operating_profit_outlook_identity:
    name: Operating profit outlook
    description: The company operating-profit outlook, including where it sits in the range and whether
      the long-term margin view changed after a higher sales outlook.
    synonyms: []
  manufacturing_cost_identity:
    name: Manufacturing cost
    description: Manufacturing cost by segment and period, including whether it was a year-over-year help.
    synonyms: []
  tariff_impact_identity:
    name: Tariff impact
    description: Tariff effect on segment margin, kept apart from price realization and from order strength.
    synonyms: []
  merchandise_program_identity:
    name: Merchandise program
    description: A merchandising program and the price support it provides, including when the program
      rolls off.
    synonyms:
    - merchandising program
  inventory_absorption_identity:
    name: Inventory absorption
    description: Margin effect of inventory absorption when sales and production change. The effect can
      be company-wide rather than only construction.
    synonyms: []
  sales_outlook_identity:
    name: Sales outlook
    description: Company sales outlook, including whether growth is modest relative to backlog and orders.
    synonyms: []
  delayed_shipment_identity:
    name: Delayed shipment
    description: Energy & Transportation shipments that slipped, the period they land, and the capacity
      that supports the following year's growth.
    synonyms: []
  shipment_landing_identity:
    name: Shipment landing
    description: The accounting period when a delayed Energy & Transportation shipment lands. Kept apart
      from the period the delay was recognized so each row joins the calendar once.
    synonyms: []
  mining_order_cycle_identity:
    name: Mining order cycle
    description: Resource Industries orders, including how they compare with 2012 and how early-year conversations
      follow a fourth-quarter improvement.
    synonyms:
    - Resource Industries orders
    - mining orders
  capacity_ramp_cost_identity:
    name: Capacity ramp cost
    description: Extra cost of bringing power capacity online, kept apart from the orders already in hand.
    synonyms: []
  ten_megawatt_order_identity:
    name: Ten-megawatt orders
    description: Orders already in hand for 10-megawatt engine deliveries in a quarter, including the
      fourth quarter.
    synonyms: []
